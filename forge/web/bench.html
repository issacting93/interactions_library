<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/theme-mono.css">
<style>
  html { background: var(--ground); }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-ui); font-size: 13px; display: flex; flex-direction: column; height: 100vh;
  }
  .topbar {
    height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid var(--line-3); background: var(--bar);
  }
  .wordmark { font-family: var(--font-display); font-size: 19px; letter-spacing: .02em; color: var(--ink); text-decoration: none; }
  .crumb { font-size: 10px; letter-spacing: .1em; color: var(--ink-2); text-transform: uppercase; }
  body.embedded .wordmark, body.embedded .crumb { display: none; }
  .spacer { flex: 1 1 auto; }

  .presets { display: flex; border: 1px solid var(--line-4); border-radius: var(--r-btn); overflow: hidden; }
  .presets button {
    font-family: var(--font-ui); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 14px; border: none; background: var(--well); color: var(--ink-2); cursor: pointer;
    border-right: 1px solid var(--line-4);
  }
  .presets button:last-child { border-right: none; }
  .presets button.active { background: var(--loop); color: var(--ground); }

  .savebtn {
    font-family: var(--font-ui); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    padding: 9px 16px; border: 1px solid var(--accent); border-radius: var(--r-btn); background: var(--accent); color: var(--ground); cursor: pointer;
  }

  .toolbtn { font-family: var(--font-ui); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 12px;
    border: 1px solid var(--line-4); border-radius: var(--r-btn); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
  .toolbtn:hover { border-color: var(--ink-2); }
  .editing { font-size: 10px; letter-spacing: .08em; color: var(--ink-2); }
  .editing b { color: var(--ink); font-weight: 500; }

  .body-row { flex: 1 1 auto; min-height: 0; display: flex; }
  .col { min-width: 0; overflow: auto; }
  .col-left { flex: 0 1 280px; min-width: 230px; border-right: 1px solid var(--line-2); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .col-center { flex: 999 1 560px; min-width: 360px; background: var(--well); display: flex; align-items: center; justify-content: center; position: relative; }
  .col-right { flex: 0 1 300px; min-width: 250px; border-left: 1px solid var(--line-2); padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  h2 { font-family: var(--font-display); font-weight: 400; font-size: 15px; margin: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 9px; letter-spacing: .14em; color: var(--ink-2); text-transform: uppercase; display: flex; justify-content: space-between; }
  .field select, .field input[type="text"] {
    background: var(--panel); border: 1px solid var(--line-4); border-radius: var(--r-sm); color: var(--ink);
    font-family: var(--font-ui); font-size: 12px; padding: 7px 8px;
  }
  .field input[type="range"] { width: 100%; }
  .field input[type="checkbox"] { width: auto; }
  .checkrow { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .rowbtns { display: flex; gap: 8px; }
  .rowbtns button {
    flex: 1; font-family: var(--font-ui); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    padding: 8px; border: 1px solid var(--line-4); border-radius: var(--r-sm); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .rowbtns button:hover { border-color: var(--loop); }

  .viewport svg { max-width: 92%; max-height: 92%; display: block; }
  .statline { position: absolute; bottom: 10px; left: 14px; font-size: 10px; letter-spacing: .08em; color: var(--ink-2); text-transform: uppercase; }

  /* typed socket — same 4 states as workbench.html's board-F.3 primitive */
  .socket {
    position: absolute; transform: translate(-50%, -50%); border: 1.5px dashed var(--socket-empty); border-radius: var(--r-sm);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .socket .label { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); font-size: 8px; letter-spacing: .1em; color: var(--ink-2); text-transform: uppercase; white-space: nowrap; }
  .socket.dragover { border-color: var(--socket-hover); background: rgba(95,211,141,.12); }
  .socket.filled { border-style: solid; border-color: var(--socket-filled-bd); background: var(--socket-filled-bg); }
  .socket.filled svg { width: 82%; height: 82%; }

  .insp-empty { font-family: var(--font-body); font-size: 12px; color: var(--ink-2); line-height: 1.5; }
  .insp-accepts { display: flex; gap: 6px; flex-wrap: wrap; }
  .insp-accepts span { font-size: 9px; letter-spacing: .08em; border: 1px solid var(--line-4); border-radius: 3px; padding: 3px 7px; color: var(--ink-2); text-transform: uppercase; }
  .insp-filled { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line-4); border-radius: var(--r-sm); background: var(--lane); }
  .insp-filled .art { width: 44px; height: 44px; flex: none; background: var(--well); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .insp-filled .art svg { width: 100%; height: 100%; }
  .clearbtn {
    font-family: var(--font-ui); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--rec);
    background: none; border: 1px solid var(--line-4); border-radius: var(--r-sm); padding: 6px 10px; cursor: pointer;
  }
  .field input[type="text"].wide { width: 100%; }
  .meta { display: flex; flex-direction: column; gap: 6px; font-size: 11px; }
  .meta .k { font-size: 9px; letter-spacing: .14em; color: var(--ink-2); text-transform: uppercase; }
  .meta .refs { display: flex; flex-wrap: wrap; gap: 4px; }
  .meta .refs span { font-size: 9px; border: 1px solid var(--line-4); border-radius: var(--r-sm); padding: 2px 6px; color: var(--ink-2); }
  .badge3d { position: absolute; top: 10px; right: 14px; font-size: 9px; letter-spacing: .12em; color: var(--loop); border: 1px solid var(--loop); border-radius: var(--r-sm); padding: 3px 7px; text-transform: uppercase; }
  .ghostbtn {
    font-family: var(--font-ui); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: none; border: 1px solid var(--line-4); border-radius: var(--r-sm); padding: 7px 10px; cursor: pointer; text-align: left;
  }
  .ghostbtn:hover { border-color: var(--ink-2); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="./index.html">FORGE</a>
    <div class="crumb">Bench &rsaquo; <a href="./rules.html" style="color:inherit">Rule sets</a></div>
    <div class="presets" id="presetSwitch"></div>
    <span class="spacer"></span>
    <span class="editing" id="editing"></span>
    <a class="toolbtn" id="backBtn" hidden>Back</a>
    <button class="toolbtn" id="openToolBtn" type="button" hidden></button>
    <button class="savebtn" id="saveBtn" type="button">Save as prefab</button>
  </div>

  <div class="body-row">
    <div class="col col-left" id="controls"></div>
    <div class="col col-center" id="viewportCol"></div>
    <div class="col col-right">
      <h2>Inspector</h2>
      <div id="inspector"></div>
    </div>
  </div>

  <script src="./forge-world.js"></script>
  <script src="./forge-shell.js"></script>
  <script src="./forge-prefab.js"></script>
  <script src="../../shared/generators/kit-utils.js"></script>
  <!-- generator modules: Bench shows whichever of these are loaded -->
  <script src="../../shared/generators/spire-generator.js"></script>
  <script src="../../shared/generators/sigil-generator.js"></script>
  <script src="../../shared/generators/rule-sets.js"></script>
  <script src="../../shared/creature-arch.js"></script>
  <script src="../../shared/creature-classical.js"></script>
  <!-- the one contract, then the registrations -->
  <script src="../../shared/generators/forge-registry.js"></script>
  <script src="../../shared/generators/forge-building.js"></script>
  <script src="../../shared/generators/forge-generators.js"></script>
  <script>
    // Bench has no generator-specific code: every preset, control, input picker,
    // socket and save comes from ForgeRegistry (shared/generators/forge-registry.js).
    // Adding a generator = registering it in forge-generators.js; it shows up here.
    (async function () {
      const Reg = ForgeRegistry;
      const params = new URLSearchParams(location.search);
      const requestedWorld = params.get("world");
      if (requestedWorld) ForgeWorld.setActiveWorldId(requestedWorld);
      const worldPromise = ForgeWorld.activeWorld();

      if (window.self === window.top) ForgeShell.mount({ active: "bench", world: worldPromise });
      else document.body.classList.add("embedded");

      const world = await worldPromise;
      const kit = await Reg.loadKit("../../shared/creature-parts.json");
      const gens = Reg.list((d) => d.bench);

      const controlsEl = document.getElementById("controls");
      const viewportCol = document.getElementById("viewportCol");
      const inspector = document.getElementById("inspector");
      const switchEl = document.getElementById("presetSwitch");

      // old ?preset= links keep working
      const ALIAS = { tower: "building.spire", seal: "seal.sigil", alphabet: "script.alphabet" };
      const wanted = ALIAS[params.get("preset")] || params.get("gen");

      // A fresh draft id per "New" click, kept across edits and re-saves of the same
      // design, so world.put() updates one record instead of deriving an id from a
      // default name that every untitled design would share.
      const newDraftId = (type) => type + "_" + Math.random().toString(36).slice(2, 10);

      const state = {
        genId: gens.some((g) => g.id === wanted) ? wanted : gens[0].id,
        drafts: {},        // genId -> { recipe, draftId, sockets, inputChoice }
        session: {},       // type -> { result }  latest unsaved output per type, offered as an input
        inputOptions: {},  // input name -> saved world records of the accepted type
        selectedSocket: null,
        result: null,
      };
      const def = () => Reg.get(state.genId);
      function draft(id) {
        if (!state.drafts[id]) state.drafts[id] = { recipe: null, draftId: newDraftId(Reg.get(id).type), sockets: {}, inputChoice: {} };
        return state.drafts[id];
      }

      /* ---------- small form helpers ---------- */
      function field(labelText, valueText, inputEl) {
        const wrap = document.createElement("div"); wrap.className = "field";
        const label = document.createElement("label"); label.innerHTML = `<span>${labelText}</span><span>${valueText ?? ""}</span>`;
        wrap.appendChild(label); wrap.appendChild(inputEl); return wrap;
      }
      const fmt = (v, step) => (step >= 1 ? Math.round(v) : (+v).toFixed(2));
      function slider(p, value, onInput) {
        const input = document.createElement("input"); input.type = "range"; input.min = p.min; input.max = p.max; input.step = p.step; input.value = value;
        const wrap = field(p.label, fmt(value, p.step), input);
        input.oninput = () => { wrap.querySelector("label span:last-child").textContent = fmt(input.value, p.step); onInput(+input.value); };
        return wrap;
      }
      function selectField(labelText, value, opts, onChange) {
        const sel = document.createElement("select");
        opts.forEach((o) => { const op = document.createElement("option"); op.value = o.value ?? o; op.textContent = o.label ?? o; if ((o.value ?? o) === value) op.selected = true; sel.appendChild(op); });
        sel.onchange = () => onChange(sel.value);
        return field(labelText, "", sel);
      }
      function checkField(labelText, checked, onChange) {
        const wrap = document.createElement("label"); wrap.className = "checkrow";
        const input = document.createElement("input"); input.type = "checkbox"; input.checked = checked;
        input.onchange = () => onChange(input.checked);
        wrap.appendChild(input); wrap.appendChild(document.createTextNode(labelText));
        return wrap;
      }
      function textField(labelText, value, onInput) {
        const input = document.createElement("input"); input.type = "text"; input.value = value; input.maxLength = 40; input.className = "wide";
        input.oninput = () => onInput(input.value);
        return field(labelText, "", input);
      }
      const h2 = (t) => { const h = document.createElement("h2"); h.textContent = t; return h; };
      const btn = (t, fn, cls) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; if (cls) b.className = cls; b.onclick = fn; return b; };

      /* ---------- inputs: another generator's output, from this session or the world ---------- */
      async function refreshInputOptions() {
        state.inputOptions = {};
        for (const i of def().inputs) state.inputOptions[i.name] = (await world.list(i.accepts)).sort((a, b) => b.updatedAt - a.updatedAt);
      }
      function inputChoice(i, d) {
        if (d.inputChoice[i.name]) return d.inputChoice[i.name];
        if (state.session[i.accepts]) return "session";
        if (i.optional) return "none";
        return state.inputOptions[i.name]?.[0]?.id || "none";
      }
      function resolveInputs(gdef, d) {
        const out = {};
        for (const i of gdef.inputs) {
          const choice = inputChoice(i, d);
          if (choice === "session" && state.session[i.accepts]) out[i.name] = Reg.inputFromResult(state.session[i.accepts].result, "this session");
          else {
            const rec = (state.inputOptions[i.name] || []).find((r) => r.id === choice);
            if (rec) out[i.name] = Reg.inputFromRecord(rec);
          }
        }
        return out;
      }

      /* ---------- controls, built from the generator's params ---------- */
      function renderControls() {
        const g = def(), d = draft(g.id);
        controlsEl.innerHTML = "";
        controlsEl.appendChild(h2(g.label + " recipe"));
        for (const p of g.params) {
          const v = Reg.readParam(p, d.recipe);
          const apply = (nv) => { d.recipe = Reg.writeParam(g, p, d.recipe, nv, kit); if (p.regen) renderControls(); renderAll(); };
          if (p.type === "range") controlsEl.appendChild(slider(p, v ?? p.v, apply));
          else if (p.type === "select") controlsEl.appendChild(selectField(p.label, v, p.opts, apply));
          else if (p.type === "check") controlsEl.appendChild(checkField(p.label, !!v, apply));
          else controlsEl.appendChild(textField(p.label, v ?? "", apply));
        }
        for (const i of g.inputs) {
          const opts = [{ value: "none", label: "None" }];
          if (state.session[i.accepts]) opts.push({ value: "session", label: "This session's (unsaved)" });
          (state.inputOptions[i.name] || []).forEach((r) => opts.push({ value: r.id, label: `${r.name} · v${r.version}` }));
          controlsEl.appendChild(selectField(i.label || i.name, inputChoice(i, d), opts, (v) => { d.inputChoice[i.name] = v; renderAll(); }));
        }
        const row = document.createElement("div"); row.className = "rowbtns";
        row.append(
          btn(g.newLabel || "New", () => { d.recipe = Reg.create(g.id, kit); d.draftId = newDraftId(g.type); d.sockets = {}; d.saved = null; renderEditing(); renderControls(); renderAll(); }),
          btn("Variation", () => { d.recipe = Reg.vary(g.id, d.recipe, kit); renderControls(); renderAll(); }),
        );
        controlsEl.appendChild(row);
      }

      /* ---------- sockets (any generator that declares them) ---------- */
      const socketsFor = (res, d) => (res.sockets || []).map((s) => ({ ...s, ...(d.sockets[s.id] || {}) }));

      function renderViewport(res) {
        const g = def(), d = draft(g.id);
        viewportCol.innerHTML = "";
        const wrap = document.createElement("div"); wrap.className = "viewport";
        Object.assign(wrap.style, { position: "relative", width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center" });
        const host = document.createElement("div"); host.style.position = "relative"; host.innerHTML = res.svg || "";
        const svgEl = host.firstElementChild;
        if (svgEl) { svgEl.style.maxWidth = "92%"; svgEl.style.maxHeight = "86vh"; svgEl.style.display = "block"; svgEl.style.margin = "0 auto"; }
        for (const socket of socketsFor(res, d)) {
          const el = document.createElement("div");
          el.className = "socket" + (socket.filled ? " filled" : "");
          Object.assign(el.style, { top: socket.top, left: socket.left, width: socket.w + "px", height: socket.h + "px" });
          el.innerHTML = `<span class="label">${socket.label}</span>` + (socket.filledObj?.svg || "");
          el.addEventListener("click", () => { state.selectedSocket = socket.id; renderInspector(res); });
          el.addEventListener("dragover", (e) => {
            if (!socket.accepts.some((a) => e.dataTransfer.types.includes(ForgeShell.DRAG_MIME + "-type-" + a))) return;
            e.preventDefault(); e.dataTransfer.dropEffect = "copy"; el.classList.add("dragover");
          });
          el.addEventListener("dragleave", () => el.classList.remove("dragover"));
          el.addEventListener("drop", (e) => {
            e.preventDefault(); el.classList.remove("dragover");
            const raw = e.dataTransfer.getData(ForgeShell.DRAG_MIME); if (!raw) return;
            const dragged = JSON.parse(raw); if (!socket.accepts.includes(dragged.type)) return;
            d.sockets[socket.id] = { filled: `${dragged.type}:${dragged.id}`, filledObj: { name: dragged.name, svg: dragged.svg } };
            state.selectedSocket = socket.id;
            renderViewport(res); renderInspector(res);
          });
          host.appendChild(el);
        }
        wrap.appendChild(host);
        if (res.lines) { const b = document.createElement("div"); b.className = "badge3d"; b.textContent = "3D preview"; wrap.appendChild(b); }
        viewportCol.appendChild(wrap);
        const stat = document.createElement("div"); stat.className = "statline";
        const filled = socketsFor(res, d).filter((s) => s.filled).length, total = (res.sockets || []).length;
        stat.textContent = (g.summary ? g.summary(res) : "") + (total ? ` · ${filled} of ${total} sockets filled` : "");
        viewportCol.appendChild(stat);
      }

      function renderInspector(res) {
        const g = def(), d = draft(g.id);
        inspector.innerHTML = "";
        const socket = socketsFor(res, d).find((s) => s.id === state.selectedSocket);
        if (socket) {
          const acc = document.createElement("div"); acc.className = "insp-accepts";
          acc.innerHTML = `<span>${socket.label}</span>` + socket.accepts.map((a) => `<span>${a}</span>`).join("");
          inspector.appendChild(acc);
          if (socket.filledObj) {
            const box = document.createElement("div"); box.className = "insp-filled";
            box.innerHTML = `<div class="art">${socket.filledObj.svg || ""}</div><div>${socket.filledObj.name}</div>`;
            inspector.appendChild(box);
            const clear = btn("Clear socket", () => { delete d.sockets[socket.id]; renderViewport(res); renderInspector(res); }, "clearbtn");
            inspector.appendChild(clear);
          }
          inspector.appendChild(btn("Back to details", () => { state.selectedSocket = null; renderInspector(res); }, "ghostbtn"));
          return;
        }
        const meta = document.createElement("div"); meta.className = "meta";
        const parts = res.usedRefs.filter((r) => r.startsWith("part:")).map((r) => r.slice(5));
        const others = res.usedRefs.filter((r) => !r.startsWith("part:"));
        meta.innerHTML =
          `<span class="k">Generator</span><span>${g.label} · ${g.id}</span>` +
          `<span class="k">Seed</span><span>${d.recipe.seed}</span>` +
          (others.length ? `<span class="k">Reads</span><div class="refs">${others.map((r) => `<span>${r}</span>`).join("")}</div>` : "") +
          `<span class="k">Parts used · ${parts.length}</span><div class="refs">${parts.slice(0, 24).map((p) => `<span>${p}</span>`).join("")}${parts.length > 24 ? `<span>+${parts.length - 24}</span>` : ""}</div>`;
        inspector.appendChild(meta);
        if ((res.sockets || []).length) {
          const p = document.createElement("p"); p.className = "insp-empty";
          p.textContent = "Click a socket to inspect it, or drag a saved item from the Shelf onto one.";
          inspector.appendChild(p);
        }
        if (res.lines) inspector.appendChild(btn("Download 3D lines (.json)", () => {
          const blob = new Blob([JSON.stringify({ generator: g.id, seed: d.recipe.seed, positions: Array.from(res.lines.positions), colors: Array.from(res.lines.colors) })], { type: "application/json" });
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${g.id}-${d.recipe.seed}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }, "ghostbtn"));
        inspector.appendChild(btn("Copy recipe", () => navigator.clipboard?.writeText(JSON.stringify(d.recipe, null, 2)), "ghostbtn"));
      }

      function renderAll() {
        const g = def(), d = draft(g.id);
        let res;
        try { res = Reg.run(g.id, d.recipe, kit, resolveInputs(g, d)); }
        catch (e) { console.error(e); viewportCol.innerHTML = `<p class="insp-empty" style="margin:auto">${g.label} failed: ${e.message}</p>`; return; }
        state.result = res;
        state.session[g.type] = { result: res };
        renderViewport(res);
        renderInspector(res);
      }

      async function select(id) {
        state.genId = id; state.selectedSocket = null;
        switchEl.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.gen === id));
        const d = draft(id);
        if (!d.recipe) {
          viewportCol.innerHTML = `<p class="insp-empty" style="margin:auto">Preparing ${Reg.get(id).label}…</p>`;
          await Reg.prepare(id, kit);
          d.recipe = Reg.create(id, kit);
        }
        await refreshInputOptions();
        renderControls();
        renderAll();
        if (typeof renderEditing === "function") renderEditing();
        const u = new URL(location.href); u.searchParams.set("gen", id); u.searchParams.delete("preset"); history.replaceState(null, "", u);
      }

      gens.forEach((g) => { const b = btn(g.label, () => select(g.id)); b.dataset.gen = g.id; switchEl.appendChild(b); });

      /* ---------- round trip with the full tools (forge-bridge.js on their side) ---------- */
      // the full editor for this generator, if one is wired: Bench's Tower -> Spire Forge
      const FULL_TOOL = { "building.spire": "spire-forge" };
      const editingEl = document.getElementById("editing"), openToolBtn = document.getElementById("openToolBtn");
      function benchUrl(d) { const u = new URL(location.href); u.searchParams.set("gen", state.genId); u.searchParams.set("object", d.draftId); u.searchParams.delete("return"); return u.href; }
      function renderEditing() {
        const g = def(), d = draft(g.id);
        editingEl.innerHTML = d.saved ? `editing <b>${d.saved.name}</b> · v${d.saved.version}` : "";
        const tool = FULL_TOOL[g.id];
        openToolBtn.hidden = !tool;
        if (tool) openToolBtn.textContent = "Open in " + ({ "spire-forge": "Spire Forge" }[tool]);
      }
      openToolBtn.addEventListener("click", async () => {
        const g = def(), d = draft(g.id);
        if (!state.result) return;
        // the tool edits world objects, so the draft goes into the world first (no prefab dialog)
        const rec = await world.put(Reg.toRecord(g.id, d.recipe, state.result, { id: d.draftId, name: d.saved ? d.saved.name : undefined }, kit));
        d.saved = rec;
        const ed = ForgeWorld.editorsFor(rec, { returnTo: benchUrl(d) }).find((e) => e.id === FULL_TOOL[g.id]);
        if (ed) location.href = ed.url;
      });
      if (params.get("return")) { const b = document.getElementById("backBtn"); b.hidden = false; b.href = params.get("return"); }

      // open a saved object: ?object=<id> (from the Shelf, City or a tool's "Back to Forge")
      async function openObject(id, genId) {
        const rec = await world.get(id);
        if (!rec) return false;
        const gid = genId || state.genId;
        const recipe = Reg.fromRecord(gid, rec);
        if (!recipe) return false;
        const d = draft(gid);
        await Reg.prepare(gid, kit);
        d.recipe = recipe; d.draftId = rec.id; d.saved = rec;
        return true;
      }
      // a save from another tab (Spire Forge editing this same object) reloads the draft here
      ForgeWorld.onChange(async (m) => {
        if (!m || m.worldId !== world.worldId) return;
        const g = def(), d = draft(g.id);
        if (m.id === d.draftId && (!d.saved || m.version > d.saved.version)) { if (await openObject(m.id, g.id)) { renderControls(); renderAll(); renderEditing(); } }
        await refreshInputOptions(); renderControls();
      });

      document.getElementById("saveBtn").addEventListener("click", async () => {
        if (!window.ForgePrefab || !state.result) return;
        const g = def(), d = draft(g.id);
        const sockets = socketsFor(state.result, d).filter((s) => s.filled).map((s) => ({ id: s.id, accepts: s.accepts, filled: s.filled, filledObj: s.filledObj }));
        const record = await world.put(Reg.toRecord(g.id, d.recipe, state.result, { id: d.draftId, sockets, name: d.saved ? d.saved.name : undefined }, kit));
        d.saved = record;
        const speciesList = [...new Set(kit.parts.map((p) => p.species))].map((id) => id.replace(/^sheet-/, "").split("-").map((w) => w[0].toUpperCase() + w.slice(1)).join(" "));
        const tagged = await ForgePrefab.open({ world, object: record, speciesList });
        if (tagged) d.saved = tagged;
        renderEditing();
        // Bench never navigates away on save, so the Shelf needs telling explicitly
        ForgeShell.refreshShelf();
        await refreshInputOptions();
        renderControls();
      });

      if (params.get("object")) await openObject(params.get("object"), state.genId);
      await select(state.genId);
      renderEditing();
    })();
  </script>
</body>
