<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/theme-forge.css">
<style>
  html, body { background: var(--ground); }
</style>
</head>
<body>
  <script src="./forge-world.js"></script>
  <script src="./forge-shell.js"></script>
  <script>
    (function () {
      // One shell: every stage page mounts the same rail, selection bar and Shelf itself, so
      // the workspace just opens the stage page directly (old links keep working).
      const params = new URLSearchParams(location.search);
      const stage = ForgeShell.STAGES.find((x) => x.id === params.get("stage")) || ForgeShell.STAGES[0];
      if (params.get("world")) ForgeWorld.setActiveWorldId(params.get("world"));
      const u = new URL(stage.href, location.href);
      if (params.get("world")) u.searchParams.set("world", params.get("world"));
      location.replace(u.href);
    })();
  </script>
</body>
</html>
