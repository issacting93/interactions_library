<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="../../shared/theme-mono.css">
<style>
  html, body { background: var(--ground); }
</style>
</head>
<body>
  <script src="./forge-world.js"></script>
  <script src="./forge-shell.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      ForgeShell.mountWorkspace({
        worldId: params.get("world") || undefined,
        initialStage: params.get("stage") || "kit",
      });
    })();
  </script>
</body>
</html>
