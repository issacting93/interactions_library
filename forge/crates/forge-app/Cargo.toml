[package]
name = "forge-app"
description = "Tower Forge desktop app (Bevy + egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tower-forge"
path = "src/main.rs"

[dependencies]
forge-core.workspace = true
forge-search.workspace = true
forge-gltf.workspace = true
serde_json.workspace = true
# A lean feature set: 3D rendering, windowing and fonts. No audio or gamepads, so Linux needs no
# ALSA or udev headers. On Linux, add "wayland" here if you run Wayland without XWayland.
bevy = { version = "0.20", default-features = false, features = ["default_app", "3d_bevy_render", "std", "bevy_winit", "bevy_window", "default_font", "multi_threaded", "x11", "hdr"] }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }
