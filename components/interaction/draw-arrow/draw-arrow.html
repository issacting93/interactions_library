<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Arrow</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #06eb61; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: var(--font-mono);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: var(--sp-6);
      user-select: none;
      -webkit-user-select: none;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: var(--sp-8);
    }

    .arrow-btn {
      width: 72px;
      height: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s var(--ease-spring);
    }
    .arrow-btn.prev svg { transform: scaleX(-1); }
    .arrow-btn:active { transform: scale(0.9); }

    .arrow-btn svg { width: 100%; height: 100%; overflow: visible; }

    .arrow-btn path.stroke {
      stroke: var(--ink-mid);
      stroke-miterlimit: 10;
      fill: none;
      stroke-dasharray: 174 176;
      stroke-dashoffset: 0;
      transition: stroke 0.3s var(--ease-out);
      animation: arrow-erase 600ms ease-in forwards;
    }
    .arrow-btn:hover path.stroke {
      stroke: var(--accent);
      animation: arrow-draw 600ms ease-in forwards;
    }

    @keyframes arrow-erase { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 175; } }
    @keyframes arrow-draw  { 0% { stroke-dashoffset: 175; } 100% { stroke-dashoffset: 0; } }

    .label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
  </style>
</head>

      </svg>
    </div>
  </div>
  <div class="label" id="label">hover to trace</div>

<script>
const label = document.getElementById('label');
document.querySelectorAll('.arrow-btn').forEach(btn => {
  btn.addEventListener('mouseenter', () => label.textContent = btn.dataset.dir);
  btn.addEventListener('mouseleave', () => label.textContent = 'hover to trace');
});
</script>
