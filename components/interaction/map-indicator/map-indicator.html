<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Indicator</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #06eb61; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 60px;
      user-select: none;
      -webkit-user-select: none;
    }

    .button-ripple {
      background-color: var(--ink);
      width: 1em;
      height: 1em;
      border-radius: 50%;
      animation: button-ripple 4.5s linear infinite;
      transition: all 0.3s;
      border: 4px solid var(--bg);
      font-size: 24px;
      cursor: pointer;
    }

    .button-ripple:hover {
      transform: scale(0.7);
      border: 4px solid white;
      animation: ripple-large 3.5s linear infinite;
    }

    .button-ripple:active {
      transform: scale(1.2);
      border: 4px solid white;
      animation: ripple-clicked 1.5s linear infinite;
    }

    @keyframes button-ripple {
      0% {
        box-shadow:
          0 0 0 0    rgba(255,255,255,0.5),
          0 0 0 0.1em rgba(255,255,255,0.3),
          0 0 0 0.3em rgba(255,255,255,0.3),
          0 0 0 0.5em rgba(255,255,255,0.3);
      }
      90% {
        box-shadow:
          0 0 0 0.1em rgba(255,255,255,0),
          0 0 0 0.3em rgba(255,255,255,0),
          0 0 0 0.5em rgba(255,255,255,0),
          0 0 0 2em  rgba(255,255,255,0);
      }
    }

    @keyframes ripple-large {
      0% {
        box-shadow:
          0 0 0 0    rgba(255,255,255,0.3),
          0 0 0 1em  rgba(255,255,255,0.3),
          0 0 0 1.5em rgba(255,255,255,0.3),
          0 0 0 2.5em rgba(255,255,255,0.3);
      }
      100% {
        box-shadow:
          0 0 0 1em  rgba(255,255,255,0.3),
          0 0 0 1.5em rgba(255,255,255,0.3),
          0 0 0 2.5em rgba(255,255,255,0.3),
          0 0 0 8em  rgba(255,255,255,0);
      }
    }

    @keyframes ripple-clicked {
      0% {
        transform: scale(0.9);
        box-shadow:
          0 0 0 0    rgba(255,255,255,0.5),
          0 0 0 0.1em rgba(255,255,255,0.3),
          0 0 0 0.3em rgba(255,255,255,0.3),
          0 0 0 0.5em rgba(255,255,255,0.3);
      }
      100% {
        transform: scale(1.2);
        box-shadow:
          0 0 0 0.1em rgba(255,255,255,0),
          0 0 0 0.3em rgba(255,255,255,0),
          0 0 0 0.5em rgba(255,255,255,0),
          0 0 0 2em  rgba(255,255,255,0);
      }
    }
  </style>
</head>
<body>
  <div class="button-ripple"></div>
  <div class="button-ripple" style="animation-delay: 1.5s"></div>
  <div class="button-ripple" style="animation-delay: 3s"></div>
</body>
</html>
