<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine Slug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@200;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ece8de;
    --ink: #161618;
    --ink-60: rgba(22,22,24,0.6);
    --ink-32: rgba(22,22,24,0.32);
    --ink-25: rgba(22,22,24,0.25);
    --ink-20: rgba(22,22,24,0.2);
    --accent: #5fd38d;
    --mono-head: "Martian Mono", ui-monospace, monospace;
    --mono-body: "IBM Plex Mono", ui-monospace, monospace;
  }
  .cls-1{fill:none;stroke:#61e56a;stroke-linejoin:round}
  .cls-2{fill:#5fd38d;stroke:#61e56a}
  .cls-3{fill:none;stroke:#5fd38d}
  .cls-4{fill:#5fd38d}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono-body);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 760px;
    border: 1.5px solid var(--ink-60);
    border-radius: 22px;
    padding: 28px 32px 24px;
    position: relative;
  }

  /* ── header ── */
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--ink-25);
  }
  .card-head .right { color: var(--ink-60); }

  /* ── headline ── */
  .headline {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 22px 0 18px;
  }
  .headline h1 {
    font-family: var(--mono-head);
    font-weight: 400;
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .headline .tagline {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-60);
  }
  .headline .count {
    text-align: right;
    flex-shrink: 0;
    padding-left: 16px;
  }
  .headline .count .num {
    font-family: var(--mono-head);
    font-weight: 200;
    font-size: clamp(40px, 9vw, 72px);
    line-height: 1;
  }
  .headline .count .label {
    margin-top: 6px;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-60);
  }

  /* ── diagram stage ── */
  .stage-frame {
    position: relative;
    border-top: 1.5px solid var(--ink-20);
    border-bottom: 1.5px solid var(--ink-20);
    padding: 8px 0 4px;
  }
  .spine-slug-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 612 / 560;
    overflow: hidden;
  }
  .stage-frame::before,
  .stage-frame::after {
    content: '';
    position: absolute;
    pointer-events: none;
    background: repeating-linear-gradient(to right, var(--ink-20) 0 1.2px, transparent 1.2px 6px);
  }
  .crosshair {
    position: absolute; inset: 0; pointer-events: none;
  }
  .crosshair::before, .crosshair::after {
    content: ''; position: absolute; background: var(--ink-20);
  }
  .crosshair::before { left: 50%; top: 4%; bottom: 4%; width: 1.2px; }
  .crosshair::after  { top: 50%; left: 2%; right: 2%; height: 1.2px; }

  .spine-slug-stage svg {
    position: absolute; inset: 0; margin: auto;
    width: min(62%, 320px); height: auto; display: block;
  }

  /* vertebra 01 (fused to the head) never moves -- each plate below it cascades
     to a non-overlapping position along the spine, sized to its own height */
  .vertebra, .tendrils {
    transform: translate(0, 0);
    transition: transform .45s cubic-bezier(.16,1,.3,1);
  }
  .spine-slug-stage:hover .vertebra,
  .spine-slug-stage:hover .tendrils {
    transform: translate(0, var(--dy));
  }
  .spine-slug-stage:not(:hover) .vertebra,
  .spine-slug-stage:not(:hover) .tendrils { transition: transform .6s cubic-bezier(.65,0,.35,1); }

  .vertebra-badge { opacity: 0; transition: opacity .25s; }
  .spine-slug-stage:hover .vertebra-badge { opacity: 1; transition: opacity .25s .15s; }
  .vertebra-badge circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
  .vertebra-badge text {
    fill: var(--ink); font-family: var(--mono-body); font-size: 10px;
    font-weight: 500; text-anchor: middle;
  }

  .stage-tag {
    position: absolute; font-size: 9px; letter-spacing: 0.2em;
    color: var(--ink-60); text-transform: uppercase; pointer-events: none;
  }
  .stage-tag.tl { top: 10px; left: 4px; }
  .stage-tag.br { bottom: 10px; right: 4px; }

  /* ── stat table ── */
  .stats { padding-top: 4px; }
  .stat-row {
    display: flex; gap: 20px; align-items: baseline;
    padding: 14px 0; border-bottom: 1.5px solid var(--ink-20);
  }
  .stat-row .k {
    width: 72px; flex-shrink: 0; font-size: 11px; letter-spacing: 0.24em;
    color: var(--ink-60); text-transform: uppercase;
  }
  .stat-row .v {
    font-size: 13px; letter-spacing: 0.06em; font-weight: 500;
    text-transform: uppercase;
    transition: color .3s;
  }
  .spine-slug-stage.is-open ~ .stats #stateVal { color: var(--accent); }

  /* ── footer ── */
  .card-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 14px; font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--ink-60);
  }
  .card-foot .live { color: var(--ink); }
  .card-foot .ticks { display: flex; gap: 10px; align-items: flex-end; height: 10px; }
  .card-foot .ticks span { width: 1.2px; height: 6px; background: var(--ink-60); }
  .card-foot .ticks span:nth-child(3n) { height: 10px; background: var(--ink); }
</style>
</head>

    <span>Field Specimen · 06</span>
    <span class="right">Interactions Logbook · Rev A</span>
  </div>

  <div class="headline">
    <div>
      <h1>Spine Slug</h1>

      <div class="label">Vertebrae · hover</div>
    </div>
  </div>

    <div class="spine-slug-stage" id="stage">
