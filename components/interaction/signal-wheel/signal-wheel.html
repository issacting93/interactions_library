<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SIGNAL WHEEL</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<style>
  :root { --accent: #06eb61; }
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  #wheel-svg {
    display: block;
    width: min(440px, 100vmin - 60px);
    height: min(440px, 100vmin - 60px);
    overflow: visible;
    cursor: default;
  }
  #wheel-svg.dragging { cursor: grabbing !important; }

  /* HUD — bottom-left, spine_polar pattern */
  .hud {
    position: fixed;
    font-size: 9px; letter-spacing: .14em; line-height: 1.9;
    text-transform: uppercase; pointer-events: none; z-index: 10;
  }
  #note {
    left: 24px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    color: var(--dim);
  }
  #note b { color: var(--ink); font-weight: 500; }

  /* readout — right side, like polar_dial */
  #readout {
    position: fixed;
    right: 24px; top: 50%;
    transform: translateY(-50%);
    font-size: 9px; letter-spacing: .14em; line-height: 1.9;
    text-transform: uppercase; pointer-events: none;
    display: flex; flex-direction: column; align-items: flex-end;
    color: var(--dim);
  }
  #readout b   { color: var(--ink); font-weight: 500; }
  #readout .ac { color: var(--accent); }
</style>
</head>
<body>

<svg id="wheel-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 1 · static chrome (tick ring, zone marks) — populated by JS -->
  <g id="chrome"></g>

  <!-- 2 · polarity arc segments (36) — populated by JS -->
  <g id="seg-group"></g>

  <!-- 3 · signal trace / needle — rotated each frame -->
  <g id="needle-group" filter="url(#glowPulse)">
    <!-- shaft: from r≈18 (inner end) to r≈155 (tip) pointing up -->
    <line id="needle-shaft"
      x1="200" y1="182" x2="200" y2="45"
      stroke="#06eb61" stroke-width="1" opacity="0.85"/>
    <!-- tip: small diamond -->
    <polygon id="needle-tip"
      points="200,38  203.5,48  200,52  196.5,48"
      fill="#06eb61" opacity="0.9"/>
    <!-- elbow: tiny perpendicular mark where shaft meets the center zone -->
    <line id="needle-elbow"
      x1="196" y1="182" x2="204" y2="182"
      stroke="#06eb61" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- 4 · zone likelihood nodes (3 chamfer boxes) — populated by JS, rotate as group -->
  <g id="dial-group"></g>

  <!-- 5 · polarity side labels -->
  <text id="lbl-pos" x="366" y="200"
    text-anchor="middle" dominant-baseline="middle"
    font-family="monospace" font-size="8" letter-spacing="1.5"
    fill="#4a4a4a" pointer-events="none">POS</text>
  <text id="lbl-neg" x="34" y="200"
    text-anchor="middle" dominant-baseline="middle"
    font-family="monospace" font-size="8" letter-spacing="1.5"
    fill="#4a4a4a" pointer-events="none">NEG</text>

  <!-- 6 · center readout box (static, always on top of needle-group) -->
  <!-- chamfer: 46w × 24h, corner=6 -->
  <path id="center-box"
    d="M 177 188 L 223 188 L 229 194 L 229 206 L 223 212 L 177 212 L 171 206 L 171 194 Z"
    fill="#0d0d0d" stroke="#2a2a2a" stroke-width="0.8"/>
  <!-- value text inside box -->
  <text id="center-val" x="200" y="201"
    text-anchor="middle" dominant-baseline="middle"
    font-family="monospace" font-size="10" letter-spacing="2"
    fill="#06eb61" pointer-events="none">50%</text>
</svg>

<!-- HUD note bottom-left -->
<div class="hud" id="note">
  <b>SIGNAL WHEEL</b><br>
  drag ring · click arc → polarity<br>
  click node → zone · ←/→ step zone
</div>

<!-- readout panel right side -->
<div id="readout">
  <span>POLARITY <b id="r-pol">POSITIVE</b></span>
  <span>ZONE <span class="ac" id="r-zon">PROBABLE</span></span>
  <span>VALUE <span class="ac" id="r-val">50%</span></span>
</div>

<script type="module">
import { NS, mk, p2c } from '../../../shared/svg-utils.js';

/* ── geometry ── */
const CX = 200, CY = 200;

const TICK_R  = 184;   // outer tick ring
const SEG_R   = 172;   // polarity arc segments
const DRAG_IN = 148;   // drag zone inner radius
const DRAG_OUT= 180;   // drag zone outer radius
const NODE_R  = 94;    // zone-node chamfer-box centres

const SEG_COUNT = 36;

/* zone definitions (clock degrees: 0 = top, clockwise) */
const ZONE_START = { probable: 330, plausible: 90, possible: 210 };
const ZONES      = ['probable', 'plausible', 'possible'];
const ZONE_ABBR  = { probable: 'PRB', plausible: 'PLS', possible: 'PSB' };
const ZONE_BOUNDS = [90, 210, 330]; // separators between zones
const NODE_ANGS   = [0, 120, 240];  // math convention (0=right) for node positions

/* ── state ── */
let polarity   = 'positive';
let likelihood = 'probable';
let likValue   = 50;
let isDragging = false;
let dialCurrent = 0, dialTarget = 0;

/* ── helpers ── */
function likToDeg(zone, val) { return (val / 100) * 120 + ZONE_START[zone]; }

/* clock-convention arc path (0=top, cw) */
function arcPath(cx, cy, r, a0, a1) {
  const toRad = d => (d - 90) * Math.PI / 180;
  const x0 = cx + r * Math.cos(toRad(a0)), y0 = cy + r * Math.sin(toRad(a0));
  const x1 = cx + r * Math.cos(toRad(a1)), y1 = cy + r * Math.sin(toRad(a1));
  const large = (a1 - a0 + 360) % 360 > 180 ? 1 : 0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
}

/* centered chamfer-box path */
function chamferBox(cx, cy, w, h, c) {
  const x = cx - w / 2, y = cy - h / 2;
  return `M ${x+c} ${y} L ${x+w-c} ${y} L ${x+w} ${y+c}`
       + ` L ${x+w} ${y+h-c} L ${x+w-c} ${y+h}`
       + ` L ${x+c} ${y+h} L ${x} ${y+h-c} L ${x} ${y+c} Z`;
}

/* ── static chrome ── */
(function buildChrome() {
  const g = document.getElementById('chrome');

  /* outer containment ring */
  g.appendChild(mk('circle', {
    cx: CX, cy: CY, r: TICK_R + 3,
    fill: 'none', stroke: '#1a1a1a', 'stroke-width': '0.6',
  }));

  /* 72 tick marks (every 5°) */
  for (let i = 0; i < 72; i++) {
    const deg     = i * 5;
    const isBound = ZONE_BOUNDS.includes(deg);
    const isLong  = i % 6 === 0 && !isBound;   // every 30°

    const r1 = TICK_R;
    const r2 = isBound ? TICK_R - 24 : isLong ? TICK_R - 12 : TICK_R - 5;
    const s = p2c(CX, CY, r1, deg);
    const e = p2c(CX, CY, r2, deg);

    g.appendChild(mk('line', {
      x1: s.x, y1: s.y, x2: e.x, y2: e.y,
      stroke: isBound ? '#4a4a4a' : isLong ? '#282828' : '#1e1e1e',
      'stroke-width': isBound ? 1.4 : isLong ? 0.7 : 0.45,
    }));
  }

  /* zone boundary accent mark at rim + perpendicular cross-tick */
  ZONE_BOUNDS.forEach(deg => {
    const outer = p2c(CX, CY, TICK_R + 1, deg);
    g.appendChild(mk('circle', {
      cx: outer.x, cy: outer.y, r: 2.2,
      fill: 'none', stroke: '#4a4a4a', 'stroke-width': '0.8',
    }));
    /* short cross-tick perpendicular to radius at boundary inner end */
    const inner = p2c(CX, CY, TICK_R - 24, deg);
    const t1    = p2c(CX, CY, TICK_R - 22, deg + 3);
    const t2    = p2c(CX, CY, TICK_R - 22, deg - 3);
    g.appendChild(mk('line', {
      x1: t1.x, y1: t1.y, x2: t2.x, y2: t2.y,
      stroke: '#3a3a3a', 'stroke-width': '0.8',
    }));
    void inner; // used above for context
  });

  /* inner dashed reference ring (centre pocket) */
  g.appendChild(mk('circle', {
    cx: CX, cy: CY, r: 52,
    fill: 'none', stroke: '#1a1a1a', 'stroke-width': '0.5',
    'stroke-dasharray': '1.5 4',
  }));

  /* micro data-block marks at 45° diagonals — chrome texture, not info */
  [45, 135, 225, 315].forEach(deg => {
    const p = p2c(CX, CY, TICK_R - 38, deg);
    /* chamfer micro-box 12×6 */
    const bx = p.x - 6, by = p.y - 3;
    const rows = 2;
    for (let r = 0; r < rows; r++) {
      let cx2 = 0;
      while (cx2 < 10) {
        const len = 1.5 + Math.random() * 3;
        if (cx2 + len > 10) break;
        g.appendChild(mk('rect', {
          x: bx + cx2, y: by + r * 3.5, width: len, height: 1.2,
          fill: '#2a2a2a',
        }));
        cx2 += len + 1.5;
      }
    }
  });
})();

/* ── polarity arc segments ── */
const segG = document.getElementById('seg-group');
const segs = [];
for (let i = 0; i < SEG_COUNT; i++) {
  const a0 = i * (360 / SEG_COUNT) + 0.8;
  const a1 = (i + 1) * (360 / SEG_COUNT) - 0.8;
  const el = mk('path', {
    d: arcPath(CX, CY, SEG_R, a0, a1),
    fill: 'none', 'stroke-width': '7', 'stroke-linecap': 'round',
  });
  el.style.cursor = 'pointer';
  el.style.transition = 'opacity .18s';
  const ii = i;
  el.addEventListener('click', () => {
    const pos = ii < SEG_COUNT / 4 || ii >= SEG_COUNT * 3 / 4;
    polarity = pos ? 'positive' : 'negative';
    render();
  });
  segG.appendChild(el);
  segs.push(el);
}

/* ── zone likelihood nodes ── */
const dialG = document.getElementById('dial-group');
const nodeBoxes = [], nodeLabels = [], nodeDots = [];

ZONES.forEach((zone, i) => {
  const a  = NODE_ANGS[i] * Math.PI / 180;  // math convention
  const nx = CX + NODE_R * Math.cos(a);
  const ny = CY + NODE_R * Math.sin(a);

  /* chamfer box 42×22, corner=5 */
  const box = mk('path', { d: chamferBox(nx, ny, 42, 22, 5), 'stroke-width': '1' });
  box.style.cursor = 'pointer';
  box.addEventListener('click', () => { likelihood = zone; likValue = 50; render(); });

  /* accent dot: small circle at top-right corner of box */
  const dot = mk('circle', {
    cx: nx + 17, cy: ny - 7, r: 2,
    fill: 'none', 'stroke-width': '0.8',
  });

  /* label inside box */
  const lbl = mk('text', {
    x: nx, y: ny,
    'text-anchor': 'middle', 'dominant-baseline': 'middle',
    'font-family': 'monospace', 'font-size': '8', 'letter-spacing': '2',
    'pointer-events': 'none',
  });
  lbl.textContent = ZONE_ABBR[zone];

  dialG.appendChild(box);
  dialG.appendChild(dot);
  dialG.appendChild(lbl);
  nodeBoxes.push(box);
  nodeDots.push(dot);
  nodeLabels.push(lbl);
});

/* ── pointer-down drag on the SVG (annular zone DRAG_IN–DRAG_OUT) ── */
const svg      = document.getElementById('wheel-svg');
const needleG  = document.getElementById('needle-group');

function toSVG(e) {
  const rect = svg.getBoundingClientRect();
  const cl = e.touches ? e.touches[0].clientX : e.clientX;
  const ct = e.touches ? e.touches[0].clientY : e.clientY;
  return [
    (cl - rect.left) / rect.width  * 400,
    (ct - rect.top)  / rect.height * 400,
  ];
}

function clockAngle(sx, sy) {
  /* clock convention: 0 = top, cw */
  let a = Math.atan2(sy - CY, sx - CX) * 180 / Math.PI + 90;
  if (a < 0) a += 360;
  return a;
}

svg.addEventListener('pointerdown', e => {
  const [sx, sy] = toSVG(e);
  const r = Math.hypot(sx - CX, sy - CY);
  if (r >= DRAG_IN && r <= DRAG_OUT) {
    isDragging = true;
    svg.classList.add('dragging');
    e.preventDefault();
  }
});

function onMove(e) {
  if (!isDragging) return;
  const [sx, sy] = toSVG(e);
  const a = clockAngle(sx, sy);

  /* assign to zone by angle */
  let lik;
  if (a >= 330 || a < 90)      lik = 'probable';
  else if (a >= 90 && a < 210) lik = 'plausible';
  else                          lik = 'possible';

  /* value within zone */
  const start = ZONE_START[lik];
  let rel = a - start;
  if (rel < 0) rel += 360;
  if (rel > 360) rel -= 360;
  likValue = Math.min(100, Math.max(0, (rel / 120) * 100));
  likelihood = lik;
  render();
}

document.addEventListener('pointermove', onMove);
document.addEventListener('pointerup', () => {
  isDragging = false;
  svg.classList.remove('dragging');
});
document.addEventListener('touchmove', e => {
  if (isDragging) { e.preventDefault(); onMove(e); }
}, { passive: false });

/* ── keyboard: step through zones ── */
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    likelihood = ZONES[(ZONES.indexOf(likelihood) + 1) % ZONES.length];
    likValue = 50;
    render();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    likelihood = ZONES[(ZONES.indexOf(likelihood) - 1 + ZONES.length) % ZONES.length];
    likValue = 50;
    render();
  }
});

/* ── render ── */
const ACC = '#06eb61';

function render() {
  /* 1 · polarity segments — monochrome: active = line, inactive = very dim */
  segs.forEach((el, i) => {
    const pos    = i < SEG_COUNT / 4 || i >= SEG_COUNT * 3 / 4;
    const active = (polarity === 'positive') === pos;
    el.setAttribute('stroke', active ? '#6f6f6f' : '#202020');
    el.style.opacity = active ? '1' : '0.45';
  });

  /* 2 · polarity labels */
  document.getElementById('lbl-pos').setAttribute('fill',
    polarity === 'positive' ? ACC : '#3a3a3a');
  document.getElementById('lbl-neg').setAttribute('fill',
    polarity === 'negative' ? ACC : '#3a3a3a');

  /* 3 · needle rotation — points to current angle */
  const angle = likToDeg(likelihood, likValue);
  needleG.setAttribute('transform', `rotate(${angle} ${CX} ${CY})`);

  /* 4 · dial rotation target (lerped in frame loop) */
  dialTarget = -NODE_ANGS[ZONES.indexOf(likelihood)];

  /* 5 · zone nodes */
  nodeBoxes.forEach((box, i) => {
    const sel = ZONES[i] === likelihood;
    box.setAttribute('fill',   sel ? '#0c0c0c' : '#111111');
    box.setAttribute('stroke', sel ? ACC        : '#282828');
    nodeDots[i].setAttribute('stroke', sel ? ACC : '#282828');
    nodeDots[i].setAttribute('fill',   sel ? ACC : 'none');
    nodeLabels[i].setAttribute('fill', sel ? ACC : '#3a3a3a');
  });

  /* 6 · center value */
  document.getElementById('center-val').textContent = Math.round(likValue) + '%';

  /* 7 · readout HUD */
  const rPol = document.getElementById('r-pol');
  rPol.textContent  = polarity.toUpperCase();
  rPol.style.color  = polarity === 'positive' ? ACC : '#8a8a8a';
  document.getElementById('r-zon').textContent = likelihood.toUpperCase();
  document.getElementById('r-val').textContent = Math.round(likValue) + '%';
}

/* ── frame loop — lerp dial group rotation ── */
function frame() {
  let d = ((dialTarget - dialCurrent + 180) % 360) - 180;
  if (Math.abs(d) > 0.05) dialCurrent += d * 0.11;
  else dialCurrent = dialTarget;
  dialG.setAttribute('transform', `rotate(${dialCurrent} ${CX} ${CY})`);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
render();
</script>
</body>
</html>
