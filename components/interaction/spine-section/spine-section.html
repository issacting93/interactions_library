<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine Section</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@100;500;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #06eb61; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; background: var(--bg); font-family: "Barlow", sans-serif; font-size: 16px; font-weight: 100; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    a { color: white; text-decoration: none; }

    /* ── Section ── */
    section {
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ── Title ── */
    .title {
      font-size: 36px;
      color: white;
      margin: auto;
      position: absolute;
      top: 40px;
      left: 0; right: 0;
      width: fit-content;
      font-weight: 600;
      z-index: 10;
      letter-spacing: 0.2em;
      font-size: 13px;
    }

    /* ── Sci-fi frame (shown on hover) ── */
    .frame-container {
      height: 100%;
      position: absolute;
      left: 0; right: 0; top: 0; bottom: 0;
      opacity: 0.6;
      display: none;
      pointer-events: none;
      z-index: 1;
    }
    .section-03:hover .frame-container { display: block; }
    .frame-container:hover { opacity: 0.1; }

    /* ── Slideshow (full-viewport layer behind spine) ── */
    .slideshow-container {
      max-width: 100%;
      position: absolute;
      margin: auto;
      width: 100vw;
      height: 100vh;
      z-index: 2;
    }
    .mySlides { height: 100%; }
    .mySlides img {
      max-width: 1200px;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: auto;
      min-width: 55%;
      min-height: 50%;
      opacity: 0.5;
      object-fit: cover;
      height: 650px;
      transition: opacity 0.4s;
    }
    .mySlides img:hover { opacity: 1; }
    .numbertext {
      color: #f2f2f2;
      font-size: 12px;
      padding: 8px 12px;
      position: absolute;
      top: 50%;
      vertical-align: middle;
      letter-spacing: 0.1em;
    }
    .text {
      color: white;
      font-family: "Barlow";
      right: 20px;
      position: absolute;
      top: 50%;
      bottom: 0;
      vertical-align: middle;
      z-index: 3;
    }
    .text a {
      background: rgba(1,1,1,0.5);
      display: inline-block;
      padding: 10px;
      border: 1px solid white;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: capitalize;
    }
    .text a:hover { background: white; color: black; font-weight: 600; }

    /* ── Spine container ── */
    .spine-container {
      height: 100%;
      position: absolute;
      left: 0; right: 0;
      transition: all 0.3s ease-in;
      z-index: 5;
    }

    /* ── Spine (two SVG columns, centered) ── */
    .spine {
      margin: auto;
      width: fit-content;
      height: fit-content;
      padding: 20px;
      left: 0;
      position: absolute;
      right: 0;
      top: 0; bottom: 0;
      display: flex;
    }
    .spine-left,
    .spine-right {
      transition: all 1.2s ease-in;
      display: flex;
      flex-direction: column;
    }
    .spine-left li,
    .spine-right li {
      height: 100px;
      margin-top: -80px;
    }
    .spine-container:hover .spine-left li,
    .spine-container:hover .spine-right li {
      margin-top: 0;
      opacity: 0.2;
    }

    /* ── Dot nav ── */
    .spine-controller-ul {
      left: 0; right: 0;
      bottom: -140px;
      top: 0;
      position: absolute;
      display: flex;
      align-content: center;
      justify-content: space-around;
      width: fit-content;
      align-items: center;
      transform: translateY(-50%);
      margin: auto;
      height: fit-content;
      flex-direction: column;
      transition: all 0.3s ease-out;
    }
    .spine-container:hover .spine-controller-ul {
      top: 670px;
      bottom: 0;
    }
    .spine-container:hover .spine-controller-ul li {
      margin-top: 75px;
    }

    /* ── Spine unit (dot) ── */
    .spine-unit {
      border: 1px solid white;
      width: 25px;
      background: black;
      color: white;
      cursor: pointer;
      text-align: center;
      transition: all 1s;
    }
    .spine-unit span { transform: scale(0); display: block; }
    .spine-unit:hover span { color: rgb(223,223,223); transform: scale(1); }
    .spine-unit:hover {
      color: black;
      animation: neon2 1.5s ease-in-out infinite alternate;
      background: #052612;
      mix-blend-mode: color-dodge;
      box-shadow: inset 0px -10px 10px rgb(39 252 86 / 25%), inset 0px 4px 10px 5px #1b9e40;
    }
    .spine-unit.active {
      color: white;
      background: #06eb61;
      box-shadow: inset 0px -10px 10px rgba(0,41,9,0.25), inset 0px 10px 10px 5px #011f09;
    }
    @keyframes neon2 {
      from { box-shadow: inset 0 0 10px #00ff41, 0 0 5px #00ff41; }
      to   { box-shadow: inset 0 0 20px #00ff41, 0 0 15px #00ff41; }
    }

    @media (max-width: 800px) {
      #spine-controller { transform: scale(0.5) translate(0, -100px); }
      .spine-container:hover .spine-controller-ul li { margin-top: 75px; }
    }
  </style>
</head>
