<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Constellation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #090613; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cvs = document.getElementById('c');
const ctx  = cvs.getContext('2d');

const COLORS = [
  'rgba(0,170,255,0.8)',
  'rgba(255,0,128,0.8)',
  'rgba(128,0,255,0.8)',
  'rgba(0,255,170,0.8)',
];
const MAX_DIST = 150;

let pts = [];

function resize() {
  cvs.width  = window.innerWidth;
  cvs.height = window.innerHeight;
  seed();
}

function seed() {
  const n = Math.max(60, Math.floor(cvs.width * cvs.height / 13000));
  pts = Array.from({ length: n }, () => ({
    x  : Math.random() * cvs.width,
    y  : Math.random() * cvs.height,
    r  : Math.random() * 1.8 + 0.4,
    c  : COLORS[Math.floor(Math.random() * COLORS.length)],
    vx : (Math.random() - 0.5) * 0.18,
    vy : (Math.random() - 0.5) * 0.18,
    a  : Math.random() * 0.5 + 0.2,
  }));
}

function frame() {
  const W = cvs.width, H = cvs.height;

  // dark radial background
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.85);
  g.addColorStop(0, 'rgba(20,12,28,0.88)');
  g.addColorStop(1, 'rgba(6,4,10,0.96)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // subtle grid
  ctx.strokeStyle = 'rgba(0,160,255,0.065)';
  ctx.lineWidth = 0.3;
  const GS = 42;
  for (let x = 0; x < W; x += GS) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += GS) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // particles + connections
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];

    // move
    p.x += p.vx; p.y += p.vy;
    if (p.x <= 0 || p.x >= W) { p.vx *= -0.92; p.vy += (Math.random() - 0.5) * 0.06; }
    if (p.y <= 0 || p.y >= H) { p.vy *= -0.92; p.vx += (Math.random() - 0.5) * 0.06; }

    // draw point
    ctx.globalAlpha = p.a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c;
    ctx.fill();
    ctx.globalAlpha = 1;

    // draw connections to nearby particles
    for (let j = i + 1; j < pts.length; j++) {
      const q   = pts[j];
      const dx  = p.x - q.x, dy = p.y - q.y;
      const d   = Math.sqrt(dx * dx + dy * dy);
      if (d < MAX_DIST) {
        const a = 0.14 * (1 - d / MAX_DIST);
        ctx.beginPath();
        ctx.strokeStyle = p.c.replace('0.8', a.toFixed(3));
        ctx.lineWidth   = 0.5;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(q.x, q.y);
        ctx.stroke();
      }
    }
  }

  // occasional glitch bar
  if (Math.random() < 0.004) {
    ctx.globalAlpha = 0.45;
    ctx.fillStyle   = Math.random() > 0.5 ? 'rgba(0,255,240,0.6)' : 'rgba(255,0,120,0.6)';
    ctx.fillRect(
      Math.random() * W,
      Math.random() * H,
      Math.random() * 130 + 40,
      Math.random() * 4  + 1
    );
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
frame();
</script>
</body>
</html>
