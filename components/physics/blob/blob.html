<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blob</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #6f6f6f; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
  class Blob {
    constructor() { this.points = []; }

    init() {
      for (let i = 0; i < this.numPoints; i++) {
        this.push(new Point(this.divisional * (i + 1), this));
      }
    }

    render() {
      const ctx = this.ctx;
      const points = this.numPoints;
      const center = this.center;

      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

      this.points[0].solveWith(this.points[points - 1], this.points[1]);

      let p0 = this.points[points - 1].position;
      let p1 = this.points[0].position;
      const _p2 = p1;

      ctx.beginPath();
      ctx.moveTo((p0.x + p1.x) / 2, (p0.y + p1.y) / 2);

      for (let i = 1; i < points; i++) {
        this.points[i].solveWith(this.points[i - 1], this.points[i + 1] || this.points[0]);
        const p2 = this.points[i].position;
        ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
        p1 = p2;
      }

      ctx.quadraticCurveTo(p1.x, p1.y, (p1.x + _p2.x) / 2, (p1.y + _p2.y) / 2);
      ctx.fillStyle = this.color;
      ctx.fill();

      requestAnimationFrame(this.render.bind(this));
    }

    push(item) { if (item instanceof Point) this.points.push(item); }

    set color(v) { this._color = v; }
    get color() { return this._color || '#ffffff'; }

    set canvas(v) {
      if (v instanceof HTMLElement && v.tagName.toLowerCase() === 'canvas') {
        this._canvas = v;
        this.ctx = v.getContext('2d');
      }
    }
    get canvas() { return this._canvas; }

    get numPoints() { return this._points || 32; }
    set numPoints(v) { if (v > 2) this._points = v; }

    get radius() { return this._radius || 160; }
    set radius(v) { if (v > 0) this._radius = v; }

    get position() { return this._position || { x: 0.5, y: 0.5 }; }
    set position(v) { if (typeof v === 'object' && v.x && v.y) this._position = v; }

    get divisional() { return (Math.PI * 2) / this.numPoints; }
    get center() {
      return {
        x: this.canvas.width * this.position.x,
        y: this.canvas.height * this.position.y,
      };
    }
  }

  class Point {
    constructor(azimuth, parent) {
      this.parent = parent;
      this.azimuth = Math.PI - azimuth;
      this._components = { x: Math.cos(this.azimuth), y: Math.sin(this.azimuth) };
      this.acceleration = -0.3 + Math.random() * 0.6;
    }

    solveWith(left, right) {
      this.acceleration =
        (-0.3 * this.radialEffect +
          (left.radialEffect - this.radialEffect) +
          (right.radialEffect - this.radialEffect)) *
          this.elasticity -
        this.speed * this.friction;
    }

    set acceleration(v) { if (typeof v === 'number') { this._acceleration = v; this.speed += v * 2; } }
    get acceleration() { return this._acceleration || 0; }

    set speed(v) { if (typeof v === 'number') { this._speed = v; this.radialEffect += v * 5; } }
    get speed() { return this._speed || 0; }

    set radialEffect(v) { if (typeof v === 'number') this._radialEffect = v; }
    get radialEffect() { return this._radialEffect || 0; }

    get position() {
      return {
        x: this.parent.center.x + this.components.x * (this.parent.radius + this.radialEffect),
        y: this.parent.center.y + this.components.y * (this.parent.radius + this.radialEffect),
      };
    }
    get components() { return this._components; }

    get elasticity() { return this._elasticity || 0.001; }
    set elasticity(v) { if (typeof v === 'number') this._elasticity = v; }

    get friction() { return this._friction || 0.0085; }
    set friction(v) { if (typeof v === 'number') this._friction = v; }
  }

  const blob = new Blob();
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let oldMousePoint = { x: 0, y: 0 };
  let hover = false;

  window.addEventListener('pointermove', (e) => {
    const pos = blob.center;
    const diff = { x: e.clientX - pos.x, y: e.clientY - pos.y };
    const dist = Math.sqrt(diff.x * diff.x + diff.y * diff.y);
    let angle = null;

    blob.mousePos = { x: pos.x - e.clientX, y: pos.y - e.clientY };

    if (dist < blob.radius && !hover) {
      angle = Math.atan2(e.clientY - pos.y, e.clientX - pos.x);
      hover = true;
    } else if (dist > blob.radius && hover) {
      angle = Math.atan2(e.clientY - pos.y, e.clientX - pos.x);
      hover = false;
      blob.color = null;
    }

    if (typeof angle === 'number') {
      let nearestPoint = null;
      let distanceFromPoint = 200;

      blob.points.forEach((point) => {
        if (Math.abs(angle - point.azimuth) < distanceFromPoint) {
          nearestPoint = point;
          distanceFromPoint = Math.abs(angle - point.azimuth);
        }
      });

      if (nearestPoint) {
        let strength = { x: oldMousePoint.x - e.clientX, y: oldMousePoint.y - e.clientY };
        strength = Math.min(Math.sqrt(strength.x ** 2 + strength.y ** 2) * 10, 100);
        nearestPoint.acceleration = (strength / 100) * (hover ? -1 : 1);
      }
    }

    oldMousePoint = { x: e.clientX, y: e.clientY };
  });

  blob.canvas = canvas;
  blob.init();
  blob.render();
</script>
</body>
</html>
