<script>(function(){

var evalRig=function evalRig(R, u, poseIn) {
  const P = {}; R.pieces.forEach(p => P[p.id] = p);
  const ks = (R.keys || []).slice().sort((a, b) => a.t - b.t);
  const t = ((u % 1) + 1) % 1;
  function fromKeys(id) {
    if (ks.length === 1) return ks[0].pose[id] || 0;
    let i = ks.findIndex(k => k.t > t), k0, k1, span, f;
    if (i <= 0) { k0 = ks[ks.length - 1]; k1 = ks[0]; span = 1 - k0.t + k1.t; f = ((t - k0.t) % 1 + 1) % 1; }
    else { k0 = ks[i - 1]; k1 = ks[i]; span = k1.t - k0.t; f = t - k0.t; }
    f = span > 0 ? Math.min(1, Math.max(0, f / span)) : 0;
    const e = .5 - .5 * Math.cos(Math.PI * f);
    const a0 = k0.pose[id] || 0, a1 = k1.pose[id] || 0;
    return a0 + (a1 - a0) * e;
  }
  const ang = {}, M = {};
  R.pieces.forEach(p => {
    let a = poseIn ? (poseIn[p.id] || 0) : ks.length ? fromKeys(p.id) : ((R.pose && R.pose[p.id]) || 0);
    if (R.waveOn && p.amp) a += p.amp * Math.sin(2 * Math.PI * (t - (p.lag || 0)));
    ang[p.id] = a;
  });
  const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
  const rot = (a, x, y) => { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, x - c*x + s*y, y - s*x - c*y]; };
  const world = (id, d) => {
    if (M[id]) return M[id];
    const p = P[id], own = rot(ang[id], p.px, p.py);
    const par = p.parent && P[p.parent] && d < 64 ? world(p.parent, d + 1) : [1, 0, 0, 1, 0, 0];
    return (M[id] = mul(par, own));
  };
  R.pieces.forEach(p => world(p.id, 0));
  return { M, ang };
};
var root=document.currentScript.previousElementSibling,els={};
root.querySelectorAll('[data-id]').forEach(function(g){els[g.getAttribute('data-id')]=g;});
function draw(u){var M=evalRig(R,u,null).M;for(var id in M){if(els[id])els[id].setAttribute('transform','matrix('+M[id].join(' ')+')');}}

var t0=performance.now();
(function f(now){draw(((now-t0)/1000/R.duration)%1);requestAnimationFrame(f);})(t0);
})();</script>
