<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Rings</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #06eb61; --ring-size: 50vw; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      color: var(--ink);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .parallax {
      width: 100%;
      height: 100%;
      opacity: 0.5;
      display: grid;
      place-items: center;
      transition: all 1s;
      color: white;
    }

    .container { margin-bottom: 140px; }

    .parallax img {
      width: var(--ring-size);
      max-width: var(--ring-size);
      animation: hero-ring-appear 30s linear infinite;
      animation-delay: 5s;
      animation-direction: reverse;
    }

    .rotating-ring0 { max-width: var(--ring-size); animation: ring-appear 20s linear infinite; animation-delay: 5s; transform: scale(0.75); }
    .rotating-ring1 { max-width: var(--ring-size); padding: 50px; animation: ring-appear 20s linear infinite; animation-delay: 5s; transform: scale(0.75); }
    .rotating-ring2 { padding: 10px; animation: ring-appear 20s linear infinite; animation-direction: reverse; max-width: var(--ring-size); }
    .rotating-ring3 { max-width: var(--ring-size); padding: 170px; animation: hero-ring-appear 15s linear infinite; }
    .rotating-ring4 { max-width: var(--ring-size); padding: 350px; animation: hero-ring-appear 15s linear infinite; animation-direction: reverse; }
    .rotating-ring5 { width: var(--ring-size); animation: hero-ring-appear 25s linear infinite; animation-direction: reverse; }

    @keyframes hero-ring-appear {
      from   { transform: rotate(0deg)    scale(0.75); opacity: 0.5; }
      20%    { transform: rotate(-160deg) scale(0.55); }
      30%    { transform: rotate(260deg)  scale(0.4); }
      70%    { transform: rotate(60deg)   scale(0.6); }
      75%    { transform: rotate(160deg)  scale(0.45); opacity: 1; }
      95%    { transform: rotate(-160deg) scale(0.85); opacity: 0.6; }
      to     { transform: rotate(360deg)  scale(0.75); opacity: 0.5; }
    }

    @keyframes ring-appear {
      from { transform: rotate(0deg)    scale(0.5); opacity: 0.3; }
      20%  { transform: rotate(-160deg) scale(0.55); opacity: 0.3; }
      30%  { transform: rotate(-260deg) scale(0.2); }
      70%  { transform: rotate(60deg)   scale(0.1); opacity: 1; }
      to   { transform: rotate(360deg)  scale(0.5); opacity: 0.3; }
    }

    @media (max-width: 800px) {
      :root { --ring-size: 100vh; }
      .parallax { margin-top: 50%; transform: scale(2); }
    }

    @media (min-width: 1600px) {
      :root { --ring-size: 100vh; }
      .parallax { margin-top: -10vw; opacity: 0.6; transform: scale(0.6); }
    }
  </style>
</head>
<body>
  <section class="parallax">
    <div class="container" id="scene">
      <div data-depth="0.6"> <img src="images/RING-hero.svg"        class="rotating-ring0" alt=""> </div>
      <div data-depth="1.6"> <img src="images/radial-inner-ring.svg" class="rotating-ring1" alt=""> </div>
      <div data-depth="2.6"> <img src="images/dotted-ring.svg"       class="rotating-ring2" alt=""> </div>
      <div data-depth="3.6"> <img src="images/radial-circle.svg"     class="rotating-ring3" alt=""> </div>
      <div data-depth="4.6"> <img src="images/Frame.svg"             class="rotating-ring4" alt=""> </div>
      <div data-depth="5.6"> <img src="images/Reticle.svg"           class="rotating-ring5" alt=""> </div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/parallax/3.1.0/parallax.min.js"></script>
  <script>
    const scene = document.getElementById('scene');
    const parallaxInstance = new Parallax(scene);
    parallaxInstance.scalar(5.0, 5.0);
    parallaxInstance.invert(false, false);
  </script>
</body>
</html>
