<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-fi Badge</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #FD8235; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: var(--font-mono);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: var(--sp-4);
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .stage {
      position: relative;
      width: 320px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge, .exploded {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
    }

    .badge svg { width: 260px; height: auto; opacity: 0.9; }
    .exploded svg { width: 180px; height: auto; }

    .exploded { opacity: 0; transform: scale(0.92); pointer-events: none; }
    .badge    { opacity: 1; transform: scale(1); }

    .stage.open .badge    { opacity: 0; transform: scale(1.06); }
    .stage.open .exploded { opacity: 1; transform: scale(1); }

    .label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
  </style>
</head>

<script>
const stage = document.getElementById('stage');
const label = document.getElementById('label');

stage.addEventListener('click', () => {
  const open = stage.classList.toggle('open');
  label.textContent = open ? 'schematic · exploded' : 'badge · idle pulse';
});
</script>
