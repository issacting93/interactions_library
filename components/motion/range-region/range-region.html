<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Range Region Area UI</title>
  <link rel="stylesheet" href="../../../shared/tokens.css">
  <style>
    :root { --accent: #c23b3b; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      text-align: center;
      color: var(--ink);
    }

    .region-info {
      background: var(--fill);
      padding: 1rem 2rem;
      border-top: 4px solid var(--accent);
      border-bottom: 4px solid var(--accent);
      display: inline-block;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }

    .region-info span {
      font-weight: bold;
      font-size: 1.2rem;
    }

    .loading-circle {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(#ff3b3b 0% 100%, #000 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(194,59,59,0.27);
    }

    .loading-circle::before {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: var(--bg);
      z-index: 1;
    }

    .loading-text {
      position: absolute;
      z-index: 2;
      font-size: 2rem;
      color: var(--accent);
    }

    .subtext {
      margin-bottom: 1rem;
      color: var(--ink);
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .details {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      font-size: 0.7rem;
      color: var(--dim);
    }

    .details span {
      margin: 0 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="subtext">RANGE REGION AREA</div>
    <div class="region-info">
      0147 - <span>XCZ</span> . 0215
    </div>

    <div class="subtext">LOADING.SQ</div>
    <div class="loading-circle">
      <div class="loading-text">100</div>
    </div>

    <div class="details">
      <span>22.42</span>
      <span>47.35</span>
      <span>71</span>
      <span>31</span>
    </div>
  </div>
</body>
</html>
