<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR DISPLAY</title>
<link rel="stylesheet" href="../../../shared/tokens.css">
<style>
  :root { --accent: #3b82f6; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: var(--accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .hud {
    position: fixed;
    font-size: 10px;
    letter-spacing: .1em;
    line-height: 1.7;
    text-transform: uppercase;
    pointer-events: none;
    color: var(--dim);
    display: flex;
    gap: 28px;
  }

  .blink { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  canvas { display: block; }

  .track-row { display: flex; gap: 20px; }
  .trk {
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--dim);
    transition: color .2s;
  }
  .trk.lock { color: #ef4444; animation: blink .7s step-end infinite; }
</style>
</head>
<body>

<div class="hud">
  <span>SCAN MODE: ACTIVE</span>
  <span class="blink">● TRACKING</span>
  <span id="angle-hud">000°</span>
</div>

<canvas id="radar"></canvas>

<div class="track-row">
  <span class="trk" id="tA">TRK-A: HOLD</span>
  <span class="trk" id="tB">TRK-B: HOLD</span>
  <span class="trk" id="tC">TRK-C: HOLD</span>
</div>

<script>
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');

// ── sizing ──
const SIZE = Math.min(360, window.innerWidth - 32, window.innerHeight - 120);
canvas.width  = SIZE;
canvas.height = SIZE;

const CX = SIZE / 2, CY = SIZE / 2;
const R  = SIZE / 2 - 6;

// ── tracks (angle from top, distance fraction) ──
const TRACKS = [
  { id: 'A', angle: 42,  dist: 0.54 },
  { id: 'B', angle: 131, dist: 0.60 },
  { id: 'C', angle: 204, dist: 0.68 },
];
let selected = 'A';

function toXY(angleDeg, distFrac) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return {
    x: CX + distFrac * R * Math.cos(rad),
    y: CY + distFrac * R * Math.sin(rad),
  };
}

function draw(ts) {
  const sweep = (ts * 0.04) % 360;

  ctx.clearRect(0, 0, SIZE, SIZE);

  // background
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, SIZE, SIZE);

  // ── concentric rings ──
  [R, R * 0.72, R * 0.46, R * 0.24].forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = i === 0 ? 'rgba(59,130,246,0.35)' : 'rgba(59,130,246,0.10)';
    ctx.lineWidth = i === 0 ? 1.2 : 0.6;
    ctx.stroke();
  });

  // ── crosshairs ──
  ctx.strokeStyle = 'rgba(59,130,246,0.12)';
  ctx.lineWidth = 0.6;
  const drawLine = (x1,y1,x2,y2) => { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  drawLine(CX-R, CY, CX+R, CY);
  drawLine(CX, CY-R, CX, CY+R);
  ctx.strokeStyle = 'rgba(59,130,246,0.06)';
  const d = R * 0.707;
  drawLine(CX-d, CY-d, CX+d, CY+d);
  drawLine(CX-d, CY+d, CX+d, CY-d);

  // ── sweep trail ──
  const TRAIL_DEG = 48;
  const STEPS = 28;
  for (let i = 0; i < STEPS; i++) {
    const a0 = ((sweep - TRAIL_DEG + (i / STEPS) * TRAIL_DEG) - 90) * Math.PI / 180;
    const a1 = ((sweep - TRAIL_DEG + ((i+1) / STEPS) * TRAIL_DEG) - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = `rgba(34,197,94,${(i / STEPS) * 0.22})`;
    ctx.fill();
  }

  // ── sweep line ──
  const sweepRad = (sweep - 90) * Math.PI / 180;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + R * Math.cos(sweepRad), CY + R * Math.sin(sweepRad));
  ctx.strokeStyle = 'rgba(74,222,128,0.85)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // ── tracking blips ──
  TRACKS.forEach(t => {
    const pos = toXY(t.angle, t.dist);
    const diff = ((sweep - t.angle) % 360 + 360) % 360;
    const fade = diff < 55 ? 1 - diff / 55 : 0;

    if (fade > 0) {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 9 * fade, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(239,68,68,${fade * 0.35})`;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, t.id === selected ? 4 : 2.5, 0, Math.PI * 2);
    ctx.fillStyle = t.id === selected ? '#ef4444' : 'rgba(239,68,68,0.45)';
    ctx.fill();

    ctx.font = `${t.id === selected ? 'bold ' : ''}9px ui-monospace,monospace`;
    ctx.fillStyle = t.id === selected ? '#ef4444' : '#7f1d1d';
    ctx.fillText(t.id, pos.x + 6, pos.y - 3);
  });

  // ── center dot ──
  ctx.beginPath();
  ctx.arc(CX, CY, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(74,222,128,0.75)';
  ctx.fill();

  // ── vehicle icon ──
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 0.7;
  roundRect(CX-9, CY-13, 18, 26, 1.5); ctx.stroke();
  [[CX-7,CY-11,5,6],[CX+2,CY-11,5,6],[CX-7,CY+1,5,6],[CX+2,CY+1,5,6]].forEach(([x,y,w,h]) => {
    roundRect(x,y,w,h,0.5); ctx.stroke();
  });
  [[CX-13,CY-10,4,8],[CX+9,CY-10,4,8],[CX-13,CY+2,4,8],[CX+9,CY+2,4,8]].forEach(([x,y,w,h]) => {
    roundRect(x,y,w,h,0.5); ctx.stroke();
  });

  // ── direction labels ──
  ctx.font = '9px ui-monospace,monospace';
  ctx.textAlign = 'center';
  [['0°',-90],['90°',0],['180°',90],['270°',180]].forEach(([label, a]) => {
    const rad = a * Math.PI / 180;
    const x = CX + (R + 12) * Math.cos(rad);
    const y = CY + (R + 12) * Math.sin(rad);
    ctx.fillStyle = 'rgba(147,197,253,0.65)';
    ctx.fillText(label, x, y + 3);
  });
  ctx.font = '8px ui-monospace,monospace';
  ctx.fillStyle = 'rgba(96,165,250,0.35)';
  [['45°',-45],['135°',45],['225°',135],['315°',-135]].forEach(([label, a]) => {
    const rad = a * Math.PI / 180;
    ctx.fillText(label, CX + R*0.80*Math.cos(rad), CY + R*0.80*Math.sin(rad) + 3);
  });

  document.getElementById('angle-hud').textContent = Math.round(sweep).toString().padStart(3,'0') + '°';
  requestAnimationFrame(draw);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w,y, x+w,y+r, r);
  ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w,y+h, x+w-r,y+h, r);
  ctx.lineTo(x+r, y+h);
  ctx.arcTo(x,y+h, x,y+h-r, r);
  ctx.lineTo(x, y+r);
  ctx.arcTo(x,y, x+r,y, r);
  ctx.closePath();
}

// ── track selection cycle ──
setInterval(() => {
  const keys = TRACKS.map(t => t.id);
  selected = keys[(keys.indexOf(selected) + 1) % keys.length];
  TRACKS.forEach(t => {
    const el = document.getElementById('t' + t.id);
    el.classList.toggle('lock', t.id === selected);
    el.textContent = `TRK-${t.id}: ${t.id === selected ? 'LOCK' : 'HOLD'}`;
  });
}, 2600);

requestAnimationFrame(draw);
</script>
</body>
</html>
