<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sci-fi Gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../shared/forge-ds/tokens.css">
<link rel="stylesheet" href="../shared/forge-ds/components.css">
<link rel="stylesheet" href="./gallery.css">
<style>
  /* Gallery: the picked design in the head unit · designs (or parts) as track rows */
  main { flex: 1 1 auto; overflow: auto; padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 26px; }
  .f-unit__art.wide { flex: 0 1 460px; height: auto; background: none; display: block; }
  .f-unit__art.wide .sg-comp { cursor: zoom-in; }
  .f-unit .f-unit__who { flex-basis: 260px; }
  .f-unit .f-body { max-width: 60ch; }
  .f-track { grid-template-columns: minmax(170px, 230px) minmax(0, 1fr) auto; cursor: pointer; }
  .f-track__lane .sg-comp { flex: none; width: 176px; }
  .f-track__lane .f-thumb { width: 64px; height: 40px; padding: 0; }
  .f-track__lane .f-thumb img { object-fit: cover; }
  .f-track__lane .sep { flex: none; width: 1px; align-self: stretch; margin: 6px 6px; background: var(--line-2); }
  .tag { padding: 1px 6px; border: 1px solid var(--line-3); border-radius: var(--radius-xs); }
  .f-track .f-micro + .f-micro { margin-top: 2px; }
  .studies a { color: var(--ink-body); text-decoration: none; } .studies a:hover { color: var(--pick); }
  .filter { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .filter .f-input { min-height: 34px; width: min(300px, 60vw); }
  @media (max-width: 720px) { main { padding: 16px; } }
</style>
</head>
<body>
  <header class="f-strip">
    <a class="sg-brand" href="./index.html">Sci-fi <b>Gallery</b></a>
    <nav class="f-tabs" role="tablist">
      <button class="f-tab is-on" id="tabDesigns" role="tab" aria-selected="true">Designs</button>
      <button class="f-tab" id="tabParts" role="tab" aria-selected="false">Parts</button>
    </nav>
    <span class="f-spacer"></span>
    <div class="f-btns">
      <a class="f-btn is-dense is-quiet" href="../index.html">Library ↗</a>
      <label class="f-btn is-dense">Import<input class="sg-hidden-input" type="file" id="import" accept="application/json,.json"></label>
      <a class="f-btn is-dense" href="./bench.html?compose=1">Compose one</a>
      <a class="f-btn is-dense is-go" href="./bench.html">+ New design</a>
    </div>
  </header>
  <main>
    <section class="f-unit" id="unit" aria-label="Picked"></section>
    <section aria-label="List">
      <div class="f-head">
        <span class="f-label" id="listLab"></span>
        <div class="filter"><input class="f-input" id="q" type="search" placeholder="Search" aria-label="Search"><span class="f-micro"><span class="f-kbd">/</span> search · <span class="f-kbd">↑</span><span class="f-kbd">↓</span> pick<span id="keysDesign"> · <span class="f-kbd">↵</span> view · <span class="f-kbd">E</span> edit</span></span></div>
      </div>
      <div id="list"></div>
    </section>
  </main>

<script src="../components/catalog.js"></script>
<script src="./designs.js"></script>
<script src="../shared/rng.js"></script>
<script src="./gallery-core.js"></script>
<script>
(function () {
  const G = window.SciFiGallery, { el, pad } = G;
  const $ = (id) => document.getElementById(id);
  const mem = (() => { try { return JSON.parse(localStorage.getItem("scifi-gallery:ui")) || {}; } catch (e) { return {}; } })();
  const remember = () => { try { localStorage.setItem("scifi-gallery:ui", JSON.stringify(mem)); } catch (e) {} };
  let tab = new URLSearchParams(location.search).get("tab") || mem.tab || "designs";
  let pickDesign = new URLSearchParams(location.search).get("design") || mem.design || null;
  let pickPart = new URLSearchParams(location.search).get("part") || mem.part || null;

  const view = (id) => "./view.html?design=" + encodeURIComponent(id);
  const edit = (id) => "./bench.html?design=" + encodeURIComponent(id);
  const readout = (k, n, sm) => `<div class="f-readout${sm ? " is-sm" : ""}${n ? "" : " is-zero"}"><span class="f-micro">${k}</span><span class="f-readout__v">${typeof n === "number" ? pad(n) : n}</span></div>`;
  const textOf = (d) => [d.name, d.about || "", ...d.slots.map((s) => (G.part(s.part) || {}).name || s.part), ...G.studiesBehind(d).map((s) => s.name)].join(" ").toLowerCase();
  const matches = (text) => { const q = $("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean); return q.every((w) => text.includes(w)); };

  // ── designs ─────────────────────────────────────────────────────────
  function designUnit(d) {
    const u = $("unit");
    const parts = G.partIds(d), studies = G.studiesBehind(d), miss = G.missing(d);
    u.innerHTML = `<div class="f-unit__art wide"></div>
      <div class="f-unit__who"><span class="f-micro">${d.starter ? "Starter" : "Yours · saved " + G.ago(d.updatedAt)} · v${d.version || 1} · ${d.cols}×${d.rows}</span>
        <span class="f-title"></span><span class="f-body about"></span>
        <div class="f-micro studies"></div>
        <div class="f-btns" style="margin-top:8px"></div></div>
      <div class="f-unit__reads">${readout("Slots", d.slots.length)}${readout("Parts", parts.length)}${readout("Studies", studies.length)}${readout("Used by", G.all().filter((x) => (x.from || []).some((f) => f.id === d.id)).length)}</div>`;
    const art = G.composite(d); art.title = "View it running"; art.addEventListener("click", () => { location.href = view(d.id); });
    u.querySelector(".wide").appendChild(art);
    u.querySelector(".f-title").textContent = d.name;
    u.querySelector(".about").textContent = d.about || "No description yet.";
    const st = u.querySelector(".studies");
    if (studies.length) { st.append("Parts cut from "); studies.forEach((s, i) => { const a = el("a", "", pad(s.n) + " " + s.name); a.href = "../" + s.file; st.append(a); if (i < studies.length - 1) st.append(" · "); }); }
    const btns = u.querySelector(".f-btns");
    const a1 = el("a", "f-btn is-go", "View →"); a1.href = view(d.id);
    const a2 = el("a", "f-btn", d.starter ? "Edit a copy" : "Edit in Bench"); a2.href = edit(d.id);
    const b3 = el("button", "f-btn", "Duplicate"); b3.addEventListener("click", () => { const c = G.save(G.copyOf(d, "duplicate")); pickDesign = c.id; render(); });
    const b4 = el("button", "f-btn", "Export"); b4.addEventListener("click", () => G.exportJSON([d]));
    btns.append(a1, a2, b3, b4);
    if (!d.starter) { const b5 = el("button", "f-btn is-quiet", "Delete"); b5.addEventListener("click", () => { if (confirmDelete(b5)) { G.remove(d.id); pickDesign = null; render(); } }); btns.appendChild(b5); }
    const from = G.designFrom(d);
    if (from.length || miss.length) {
      const fl = el("div", "f-flag" + (miss.length ? " is-stale" : " is-pick")); fl.style.flexBasis = "100%";
      if (miss.length) fl.textContent = `${pad(miss.length)} missing part${miss.length > 1 ? "s" : ""} · ${miss.map((s) => s.part).join(", ")} · swap in Bench`;
      else from.forEach((f) => { fl.append(f.note + " "); if (f.design) { const a = el("a", "", f.design.name); a.href = "?design=" + encodeURIComponent(f.id); a.addEventListener("click", (e) => { e.preventDefault(); pickDesign = f.id; render(); }); fl.appendChild(a); } else fl.append("a deleted design"); });
      u.appendChild(fl);
    }
  }
  // two clicks to delete: the first arms the button, no browser dialog
  function confirmDelete(b) { if (b.dataset.armed) return true; b.dataset.armed = "1"; b.textContent = "Delete · sure?"; b.classList.remove("is-quiet"); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Delete"; b.classList.add("is-quiet"); } }, 3000); return false; }

  function designRows() {
    const host = $("list"); host.innerHTML = "";
    const all = G.all(), list = all.filter((d) => matches(textOf(d)));
    const yours = all.filter((d) => !d.starter).length;
    $("listLab").textContent = `Designs · ${pad(all.length)} · ${pad(yours)} yours`;
    if (!list.length) { const e = el("div", "f-empty"); e.appendChild(el("span", "", all.length ? "No design matches" : "Empty · make one in the Bench")); host.appendChild(e); return []; }
    list.forEach((d, i) => {
      const row = el("div", "f-track" + (d.id === pickDesign ? " is-cur" : "")); row.tabIndex = 0; row.dataset.id = d.id;
      row.style.setProperty("--c", d.starter ? "var(--trk-3)" : "var(--pick)");
      const hd = el("div", "f-track__hd"), t = el("div");
      t.append(el("div", "f-name", d.name), el("div", "f-micro", (d.starter ? "Starter" : "Yours · " + G.ago(d.updatedAt)) + " · v" + (d.version || 1)));
      if (G.missing(d).length) t.appendChild(el("div", "f-status is-stale", "Missing parts"));
      hd.append(el("span", "f-track__num", pad(i + 1)), t);
      const lane = el("div", "f-track__lane");
      lane.append(G.composite(d), el("span", "sep"));
      G.partIds(d).forEach((id) => { const th = el("span", "f-thumb"); th.title = (G.part(id) || { name: id }).name; const im = el("img"); im.src = G.thumb(id); im.alt = ""; im.loading = "lazy"; th.appendChild(im); lane.appendChild(th); });
      const ctl = el("div", "f-track__ctl");
      const v = el("a", "f-btn is-dense", "View"); v.href = view(d.id);
      const e = el("a", "f-btn is-dense", "Edit"); e.href = edit(d.id);
      ctl.append(v, e, el("span", "f-track__count", pad(d.slots.length)));
      row.append(hd, lane, ctl);
      row.addEventListener("click", (ev) => { if (!ev.target.closest("a,button")) { pickDesign = d.id; render(); } });
      row.addEventListener("dblclick", () => { location.href = view(d.id); });
      host.appendChild(row);
    });
    return list;
  }

  // ── parts ───────────────────────────────────────────────────────────
  function partUnit(c) {
    const u = $("unit"), used = G.usedIn(c.id);
    u.innerHTML = `<div class="f-unit__art" style="flex-basis:260px;height:162px"><img alt="" src="${G.thumb(c.id)}" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="f-unit__who"><span class="f-micro">Part · ${c.category}</span><span class="f-title"></span><span class="f-body about"></span>
        <div class="lin f-micro"></div><div class="f-btns" style="margin-top:8px"></div></div>
      <div class="f-unit__reads">${readout("Used in", used.length)}${readout("Tags", c.tags.length)}</div>`;
    u.querySelector(".f-title").textContent = c.name;
    u.querySelector(".about").textContent = c.description;
    const lin = u.querySelector(".lin"); G.lineage(c).forEach((l) => lin.appendChild(el("div", "", "↳ " + l)));
    const btns = u.querySelector(".f-btns");
    const a = el("a", "f-btn is-go", "Start a design with it →"); a.href = "./bench.html?part=" + encodeURIComponent(c.id);
    const b = el("a", "f-btn", "Open in library ↗"); b.href = "../index.html#" + c.id;
    btns.append(a, b);
  }
  function partRows() {
    const host = $("list"); host.innerHTML = "";
    const all = G.CAT.components, list = all.filter((c) => matches([c.name, c.category, ...c.tags, ...G.lineage(c)].join(" ").toLowerCase()));
    $("listLab").textContent = `Parts · ${pad(all.length)} · ${pad(all.filter((c) => G.usedIn(c.id).length).length)} in a design`;
    let n = 0;
    for (const cat of G.CAT.categories) {
      const rows = list.filter((c) => c.category === cat); if (!rows.length) continue;
      const fam = el("div", "f-catfam", cat + " · " + pad(rows.length)); fam.style.setProperty("--c", G.HUE[cat]); host.appendChild(fam);
      rows.forEach((c) => {
        n++;
        const used = G.usedIn(c.id);
        const row = el("div", "f-track" + (c.id === pickPart ? " is-cur" : "")); row.tabIndex = 0; row.dataset.id = c.id;
        row.style.setProperty("--c", G.HUE[cat]);
        const hd = el("div", "f-track__hd"), t = el("div");
        t.append(el("div", "f-name", c.name), el("div", "f-micro", G.lineage(c)[0] || c.tags.slice(0, 3).join(" · ")));
        const th = el("span", "f-thumb"); th.style.cssText = "width:50px;height:32px;padding:0"; const im = el("img"); im.src = G.thumb(c.id); im.alt = ""; im.loading = "lazy"; im.style.objectFit = "cover"; th.appendChild(im);
        hd.append(th, t);
        const lane = el("div", "f-track__lane");
        if (used.length) used.forEach((d) => { const cm = G.composite(d); cm.title = d.name; cm.style.width = "120px"; cm.style.cursor = "pointer"; cm.addEventListener("click", (e) => { e.stopPropagation(); setTab("designs", d.id); }); lane.appendChild(cm); });
        else { const e = el("div", "f-empty"); e.appendChild(el("span", "", "In no design yet")); lane.appendChild(e); }
        const ctl = el("div", "f-track__ctl");
        const a = el("a", "f-btn is-dense", "Use"); a.href = "./bench.html?part=" + encodeURIComponent(c.id);
        ctl.append(a, el("span", "f-track__count" + (used.length ? "" : " is-zero"), pad(used.length)));
        row.append(hd, lane, ctl);
        row.addEventListener("click", (ev) => { if (!ev.target.closest("a,button")) { pickPart = c.id; render(); } });
        host.appendChild(row);
      });
    }
    if (!n) { const e = el("div", "f-empty"); e.appendChild(el("span", "", "No part matches")); host.appendChild(e); }
    return list;
  }

  // ── page ────────────────────────────────────────────────────────────
  let shown = [];
  function render() {
    $("tabDesigns").classList.toggle("is-on", tab === "designs"); $("tabDesigns").setAttribute("aria-selected", tab === "designs");
    $("tabParts").classList.toggle("is-on", tab === "parts"); $("tabParts").setAttribute("aria-selected", tab === "parts");
    $("keysDesign").hidden = tab !== "designs";
    if (tab === "designs") {
      shown = designRows();
      const d = G.get(pickDesign) || shown[0] || G.all()[0];
      if (d) { pickDesign = d.id; designUnit(d); $("list").querySelector(`[data-id="${CSS.escape(d.id)}"]`)?.classList.add("is-cur"); }
      else $("unit").innerHTML = `<div class="f-unit__who"><span class="f-micro">No designs</span><span class="f-title">Make the first one</span></div>`;
    } else {
      shown = partRows();
      const c = G.part(pickPart) || shown[0] || G.CAT.components[0];
      pickPart = c.id; partUnit(c); $("list").querySelector(`[data-id="${CSS.escape(c.id)}"]`)?.classList.add("is-cur");
    }
    Object.assign(mem, { tab, design: pickDesign, part: pickPart }); remember();
  }
  function setTab(t, designId) { tab = t; if (designId) pickDesign = designId; $("q").value = ""; render(); window.scrollTo(0, 0); $("unit").scrollIntoView({ block: "nearest" }); }
  $("tabDesigns").addEventListener("click", () => setTab("designs"));
  $("tabParts").addEventListener("click", () => setTab("parts"));
  $("q").addEventListener("input", render);
  $("import").addEventListener("change", async (e) => { const f = e.target.files[0]; if (!f) return; try { const n = await G.importJSON(f); setTab("designs"); $("listLab").textContent += ` · imported ${pad(n)}`; } catch (err) { $("listLab").textContent = "Import failed · not a designs file"; } e.target.value = ""; });
  document.addEventListener("keydown", (e) => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { if (e.key === "Escape") document.activeElement.blur(); return; }
    if (e.key === "/") { e.preventDefault(); $("q").focus(); return; }
    const ids = shown.map((x) => x.id), cur = tab === "designs" ? pickDesign : pickPart, i = ids.indexOf(cur);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!ids.length) return;
      const next = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
      if (tab === "designs") pickDesign = next; else pickPart = next;
      render(); $("list").querySelector(".is-cur")?.scrollIntoView({ block: "nearest" });
    }
    if (e.key === "Enter" && tab === "designs" && pickDesign) location.href = view(pickDesign);
    if ((e.key === "e" || e.key === "E") && tab === "designs" && pickDesign) location.href = edit(pickDesign);
  });
  G.onChange(render);
  render();
})();
</script>
</body>
</html>
