<style>
/* Combat patterns: six attack patterns, each given to a creature of the tank whose own behaviour already leans that way, against the Maw.
   The tank's own sim, 3D solids and looks (the Specimen build); the patterns are a layer on top that places its creatures each tick.
   TAPE 08: hairlines on warm charcoal, mono readouts, colour only as a signal (amber: a tell; red: it hurts). */
/* colours, type and hairlines come from packages/ui/tape08-tokens.css; these are this page's short names. --g is the water behind the scene, not a panel */
:root { --g: #0d0a14; --pn: color-mix(in srgb, var(--t8-panel) 92%, transparent); --sel: var(--t8-lane-sel); --ink: var(--t8-ink); --ink2: var(--t8-ink-2); --off: var(--t8-ink-3);
  --l1: var(--t8-line-1); --l2: var(--t8-line-2); --l3: var(--t8-line-3); --l4: var(--t8-line-4);
  --acc: var(--t8-accent); --rec: var(--t8-rec); --loop: var(--t8-loop); --disp: var(--t8-display); --ui: var(--t8-ui);
  --gut: max(16px, env(safe-area-inset-left, 0px)); --gutr: max(16px, env(safe-area-inset-right, 0px)); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--g); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
.micro { font: 400 9px var(--ui); letter-spacing: .26em; text-transform: uppercase; color: var(--ink2); }
.plate { position: fixed; left: var(--gut); top: calc(14px + var(--st)); width: min(330px, calc(100vw - 150px)); display: grid; gap: 7px; pointer-events: none; }
.plate .ix { display: flex; align-items: baseline; gap: 10px; }
.plate .ix b { font: 200 30px/1 var(--disp); color: var(--acc); padding-bottom: 3px; border-bottom: 2px solid var(--acc); font-variant-numeric: tabular-nums; }
.plate .ix i { font: 300 12px var(--disp); font-style: normal; color: var(--ink2); }
.plate h1 { margin: 0; font: 400 15px/1.25 var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.plate p { margin: 0; font: 400 11px/1.55 var(--ui); color: var(--ink2); }
.plate p b { font-weight: 500; color: var(--ink); }
.ro { position: fixed; right: var(--gutr); top: calc(14px + var(--st)); display: grid; grid-template-columns: repeat(2, auto); gap: 4px 18px; text-align: right; pointer-events: none; }
.ro div { display: grid; gap: 4px; } .ro b { font: 300 20px/1 var(--disp); font-variant-numeric: tabular-nums; } .ro b small { font-size: 10px; color: var(--ink2); margin-left: 3px; }
.ro .sys { grid-column: 1 / -1; margin-top: 6px; } .ro .sys b { font: 500 11px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); }
.ro .sys b.tell { color: var(--acc); } .ro .sys b.hurt { color: var(--rec); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
#cv.imp1 { filter: invert(1) grayscale(1) contrast(5); } #cv.imp2 { filter: grayscale(1) contrast(2.6) brightness(1.25); }
#hit { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 3px var(--rec), inset 0 0 90px rgba(255,77,94,.35); opacity: 0; transition: opacity .35s; }
#hit.on { opacity: 1; transition: none; }
.rack { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px var(--gutr) calc(10px + var(--sb)) var(--gut); background: var(--pn); border-top: 1px solid var(--l2); display: grid; gap: 8px; }
/* buttons, the segmented choices (.seg) and focus rings are the shared ones: packages/ui/t8-ui.css, opted into by body.t8-controls.
   What stays here is this page's own: the chips, the round lunge, the corner buttons over the scene, the log panel. */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
.chips button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-color: var(--l2); color: var(--ink2); letter-spacing: .12em; font-weight: 500; }
.chips button i { font: 300 10px var(--disp); font-style: normal; color: var(--off); letter-spacing: 0; }
.chips button[aria-pressed="true"] { background: var(--sel); border-color: var(--acc); color: var(--ink); } .chips button[aria-pressed="true"] i { color: var(--acc); }
.row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.grp { display: inline-flex; align-items: center; gap: 8px; }
#lunge { position: fixed; right: var(--gutr); width: 84px; height: 84px; border-radius: 50%; border-color: var(--l4); background: rgba(29,29,32,.6); padding: 0; letter-spacing: .16em; }
#lunge.down { border-color: var(--acc); color: var(--acc); }
#bare { position: fixed; left: var(--gut); min-height: 44px; padding: 0 12px; background: rgba(29,29,32,.6); color: var(--ink2); border-color: var(--l2); }
body.bare .rack, body.bare .plate { display: none; }
#follow { position: fixed; left: var(--gut); min-height: 44px; padding: 0 12px; background: rgba(29,29,32,.6); color: var(--acc); border-color: var(--acc); display: none; }
body.free #follow { display: block; }
body.free #cv { cursor: grab; } body.free #cv:active { cursor: grabbing; }
#map { position: fixed; inset: auto; right: var(--gutr); top: calc(124px + var(--st)); width: 132px; height: 132px; border: 1px solid var(--l2); border-radius: 12px; background: rgba(13,10,20,.6); pointer-events: auto; cursor: crosshair; touch-action: none; }
#sess { position: fixed; inset: auto var(--gut) auto var(--gut); top: 12px; bottom: 120px; z-index: 30; background: rgba(13,10,20,.94); border: 1px solid var(--l2); display: flex; flex-direction: column; }
#sess[hidden] { display: none; }
#sess .sh, #sess .sf { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--l2); flex-wrap: wrap; }
#sess .sh .micro { flex: none; } #s-sum { flex: 1; font: 400 10px/1.4 var(--ui); color: var(--ink2); } #sess button { min-height: 36px; padding: 0 10px; }
#s-list { flex: 1; overflow: auto; padding: 6px 10px; font: 400 10px/1.6 var(--ui); color: var(--ink2); font-variant-numeric: tabular-nums; }
#s-list div b { color: var(--ink); font-weight: 500; } #s-list div i { font-style: normal; color: var(--off); display: inline-block; width: 46px; } #s-list div.m b.v { color: var(--rec); }
#log { position: fixed; left: var(--gut); bottom: 120px; display: grid; gap: 3px; pointer-events: none; max-width: min(330px, 66vw); }
#log div { font: 400 10px/1.45 var(--ui); color: var(--ink2); } #log div b { color: var(--ink); font-weight: 500; } #log div.me b.v { color: var(--rec); }
#stick { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border: 1px solid var(--l3); border-radius: 50%; pointer-events: auto; cursor: crosshair; touch-action: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; border: 1px solid var(--acc); }
#msg { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
@media (max-width: 760px) { .rack .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .rack .row::-webkit-scrollbar { display: none; } .rack .grp { flex: none; } }   /* a phone: the controls are one strip to swipe along */
body.edit #lunge, body.edit #follow, body.edit #bare, body.edit #log, body.edit .ro, body.edit #stick, body.edit .rack, body.edit .plate { display: none !important; }   /* the level editor's scene: the field itself, with none of the game's own controls */

<script>
"use strict";
const $ = (id) => document.getElementById(id), ES = window.EcologySpecies, DEG = Math.PI / 180, TAU = Math.PI * 2, K = EcologySim.K, FLOOR = 0.97;
const hash = new URLSearchParams(location.hash.slice(1));
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a)), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// ---- the six patterns: who carries each, and why that creature ----
// u is the unit every distance and speed below is written in: one "pixel" of the reference clip, set from the Maw's own walking speed
// (so "320 px/s" is as fast against this Maw as it was against that player)
const PATTERNS = [
  { id: 'charge', name: 'Charge', key: 'strike-lance', size: 50, rule: (T) => `Locks on for <b>${T(0.6)} s</b>, then charges <b>${T(0.4)} s</b> in a straight line.`, counter: 'Step off the line once it stops turning. It cannot steer in the charge, and it drifts for a second after.', from: 'Strike Lance already dashes at prey' },
  { id: 'sweep', name: 'Spin Sweep', key: 'glass-star', size: 46, rule: (T) => `Rolls at you slowly. Its dotted ring is a trigger: step inside and it winds up for <b>${T(0.6)} s</b>, then one ray sweeps the whole ring in <b>${T(0.7)} s</b>.`, counter: 'Stepping in is safe; staying is not. Leave the ring during the wind-up. It is spent for a moment after the sweep.', from: 'Glass Star is a wheel: a ring with rays' },
  { id: 'adds', name: 'Summon Adds', key: 'jelly', size: 70, rule: (T) => `Drifts round the arena and buds a Studded Leech from its tendrils every <b>${T(2)} s</b>. Each one chases you for ${T(8)} s.`, counter: 'The adds are food: hold Lunge and let go to eat one. Up to five at once.', from: 'Bell Jelly: a drifting mother' },
  { id: 'blink', name: 'Teleport Strike', key: 'rogue', size: 60, rule: (T) => `Every <b>${T(2)} s</b> it cloaks, comes back behind you and bites forward.`, counter: 'Keep moving: the mark shows where it lands. Turn or sidestep before the bite.', from: 'Cloak Rogue already cloaks to stalk' },
  { id: 'rage', name: 'Rage Speed-Up', key: 'hunter', size: 55, rule: () => 'Chases without rest and gains speed every second it has not fed. Its colour is its hunger: steel, then amber, then red. A bite cools it.', counter: 'It turns no faster as it speeds up. Cut inside its circle and it overshoots.', from: 'Blade Hunter is the tank\'s pursuit hunter' },
  { id: 'pack', name: 'Pack Cut-Off', key: 'swift', size: 18, n: 5, rule: () => 'One swift rushes you. The other four run to the spot you are heading for, then turn in.', counter: 'The cross is where they are going. Change direction before they get there and the trap is empty.' },
  { id: 'under', name: 'Under the Floor', key: 'pearl-clawed-hundred-worm', size: 70, rule: (T) => `Travels under the ground as a ripple for <b>${T(2.4)} s</b>, then the ground swells and cracks for <b>${T(0.9)} s</b> and it breaches in a curve toward you.`, counter: 'The furrow shows where it is and the cracks where it comes up. Stop or turn back, and stay off the line it leaps along.' },
  { id: 'spit', name: 'Orbit and Spit', key: 'eel', size: 75, rule: (T) => `Holds its range, circles you, and spits a glob every <b>${T(1.6)} s</b> at where you will be.`, counter: 'The globs lead your walk, so change pace or direction. It backs off when you close in: corner it at the arena edge.' },
  { id: 'plant', name: 'False Plant', key: 'chain-colony', size: 58, rule: (T) => `A Bramble Wyrm stands on its tail among the plants and sways with them. Walk near and it leans back for <b>${T(0.45)} s</b>, then falls on you the length of its body. It lies there a moment, then slips off to stand somewhere else.`, counter: 'The amber lane is where it falls: step off it. While it lies flat it is open, and slow to get up.' },
  { id: 'drop', name: 'Hanging Drop', key: 'drape-vampire', size: 45, rule: (T) => `Hangs by its head from the rim of the tower, body let down the wall. Walk near and it swings back, lets go, and dives on the spot ahead of you after <b>${T(0.54)} s</b>.`, counter: 'The amber ring is where it will land. Step out of it. It has to cross the floor and climb the wall again.' },
  { id: 'dead', name: 'Playing Dead', key: 'fin-puffer', size: 30, rule: (T) => `Lies dim and still like a carcass. Come close and it snaps after <b>${T(0.35)} s</b>, then drifts off to lie down again.`, counter: 'A real carcass does not breathe: watch it swell and sink. Stay outside the amber ring when it wakes.' },
  { id: 'gaze', name: 'Gaze', key: 'halo-eyed-seraph', size: 60, rule: (T) => `Its eye opens for <b>${T(2.4)} s</b>, shuts for <b>${T(2.2)} s</b>. Anything inside the ring that moves while it is open is struck.`, counter: 'Dashed amber ring: it is about to open, stop. Red ring: hold still. Auto shows the crossing.' },
  { id: 'bait', name: 'False Prey', key: 'puffer-plated-angler-25d9', size: 88, rule: (T) => `A cloaked Halo Angler holds a Lantern Wisp in front of its mouth. Touch or eat the wisp and it snaps after <b>${T(0.3)} s</b>.`, counter: 'The wisp is real food. Take it at full neck stretch from the far side, outside the snap ring, or leave it.' },
  { id: 'alarm', name: 'Alarm Chain', key: 'hunter', size: 55, rule: () => 'Wisps that see you move blink. The blink passes wisp to wisp until it reaches the sleeping Blade Hunter, which comes to where you were seen.', counter: 'Stand still near a wisp and it does not see you. Or eat a wisp to break the chain.' },
  { id: 'shell', name: 'Shell', key: 'plated-scavenger', size: 52, rule: (T) => `A Ring Scavenger in plates. Each blow knocks one plate off instead of hurting it (<b>4</b> plates), and while it has any it cannot be swallowed. It tucks for <b>${T(0.55)} s</b> and rolls at you. Bare, it is quick, tucks in <b>${T(0.3)} s</b>, and one blow kills it.`, counter: 'Strip it: four blows, or let others do it. Sidestep the roll: it cannot turn once it goes. Its plates grow back if you leave it.' },
  { id: 'territory', name: 'Territory', key: 'dragon', size: 120, rule: (T) => `A Spine Dragon owns this grove. Cross its ring and it rears for <b>${T(0.6)} s</b>, then drives you out, biting. It never goes past its edge.`, counter: 'Stay outside the ring, or cross where it is not and keep moving. Once you are out, it goes back.' },
  { id: 'ink', name: 'Ink Cloud', key: 'siphon', size: 85, rule: () => 'A Rosary Eel. Come within its ring and it blows a cloud of ink and darts off inside it. Anything hunting it loses it in the cloud, and the cloud hides whatever is in it for <b>4 s</b>.', counter: 'Come at it fast from outside its ring, or wait out the cloud and look for where it went.' },
  { id: 'manta', name: 'Escorts', key: 'manta', size: 130, rule: () => 'A Glass Manta, the field’s whale. It never fights. Sickle Swifts ride with it: they eat the leeches off its back and the food in its wake, and mob anything that hunts it or them inside its ring.', counter: 'Thin out the swifts first, or come in slowly and keep still near it without lunging for <b>6 s</b>: they accept you, and its wake is yours to feed in.' },
  { id: 'thief', name: 'Thief', key: 'plated-scavenger', size: 34, rule: () => 'A Ring Scavenger tails you. The moment your jaw shuts on a catch it rushes in (red line) and takes it before you can swallow.', counter: 'Walk straight at it and it backs right off for a few seconds. Lunge in that window and the catch is yours.' },
  { id: 'cloak', name: 'Cloak Stalk', key: 'rogue', size: 60, rule: (T) => `Circles in plain sight, then melts away tail first and stalks you unseen. Only the grass and ferns it brushes give it away. It shows itself <b>${T(0.4)} s</b> before it bites.`, counter: 'A shake that travels from plant to plant is the Rogue. Keep plants between you, and step off its line when it shows.' },
  { id: 'slam', name: 'Shockwave Slam', key: 'puffer', size: 30, rule: (T) => `Every <b>${T(2)} s</b> it stops, swells for <b>${T(0.5)} s</b> and bursts a ring.`, counter: 'The ring has three gaps, ticked in amber while it swells. Stand in one.', from: 'Blade Puffer already puffs when pressed' },
];
// the clip's player crosses its arena at about 110 px/s; this Maw walks 51 of the same units a second (measured). MAW_PACE runs every
// pattern's clock at that ratio, so each attack is as fast against the Maw as it was against the clip's player
const MAW_PACE = 0.47, T = (x) => (x * Math.sqrt(UI.size) / UI.pace).toFixed(1);
{ const i = PATTERNS.findIndex((p) => p.id === 'slam'); PATTERNS.splice(5, 0, PATTERNS.splice(i, 1)[0]); }
const UI = { bal: 'new', grow: 'on', drive: 'auto', pace: MAW_PACE, view: 'near', move: 'own', size: 1, war: 'all' };
// ---- the tank: the game's own sim, emptied; only what a pattern puts in it lives here ----
// A level (packages/level, docs/LEVELS.md) lays the field out in place of the page's own layout: #level=draft is the editor's draft, kept on this
// device; #level=<name> is games/the-maw/levels/<name>.json. With none the field is as it always was. A level that cannot be read or has errors is
// refused, and the page says why.
let LEVEL_WHY = '';
// ---- a world (2026-11-25): #world=<name> plays the levels of games/the-maw/worlds/<name>.json, one after another. The save (packages/world) is kept
// on this device under forge-save:<name>. Walking into an exit saves and loads the page again at the next level (a quick reload, not a seamless step).
// A level you come back to is made again from its file and seed; a living one is played forward for the time you were away (at most 20 s of it).
const WORLD = (() => { const name = new URLSearchParams(location.hash.slice(1)).get('world'); if (!name || !/^[a-z0-9-]+$/.test(name)) return null;
  try { let text; if (name === 'draft') { text = localStorage.getItem('forge-world-draft'); if (!text) throw new Error('no world draft on this device: make one in the editor\'s World tab'); }   // the editor's World tab
    else { const x = new XMLHttpRequest(); x.open('GET', '../worlds/' + name + '.json', false); x.send(); if (!(x.status === 200 || (x.status === 0 && x.responseText))) throw new Error('no world called ' + name); text = x.responseText; }
    const w = ForgeWorld.parse(text), v = ForgeWorld.validateWorld(w); if (v.errors.length) throw new Error(v.errors[0].message);
    const key = 'forge-save:' + name; let save = null; try { const t = localStorage.getItem(key); if (t) { save = ForgeWorld.parse(t); if (ForgeWorld.validateSave(save, w).errors.length) save = null; } } catch (e) { save = null; }
    if (!save) save = ForgeWorld.newSave(w);
