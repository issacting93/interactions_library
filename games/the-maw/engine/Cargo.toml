[package]
name = "eco-engine"
version = "0.1.0"
edition = "2021"
description = "The Maw's simulation engine in Rust, built to WebAssembly for the tank (window.EcoEngine)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
