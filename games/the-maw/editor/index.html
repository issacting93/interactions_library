<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Maw: level editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<style>
/* The level editor. Laid out as an engine's editor is: a list of what the level holds (the outliner), the level seen from above (the scene), the
   selected thing's properties (the inspector), a palette to add from, and Play, which runs the level in the game itself (games/the-maw/field) and
   comes back to the edit. Everything it knows about levels comes from packages/level (ForgeLevel): the inspector is made from its TYPES, every
   change is one of its commands, and the checks are its validate().
   TAPE 08: hairlines on warm charcoal, mono readouts; amber is the selection and Play, red is an error, and nothing else is coloured. */
:root { --ground:#161618; --panel:#1D1D20; --bar:#1B1B1E; --sel:#232327; --ink:#ECE8DE; --ink2:#8C8981; --off:#2E2D2A;
  --l1:rgba(236,232,222,.07); --l2:rgba(236,232,222,.10); --l3:rgba(236,232,222,.14); --l4:rgba(236,232,222,.16); --l5:rgba(236,232,222,.22);
  --acc:#E8B04A; --rec:#FF4D5E; --on:#161618; --disp:'Martian Mono', ui-monospace, monospace; --ui:'IBM Plex Mono', ui-monospace, monospace;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink); font: 400 12px/1.5 var(--ui); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.micro { font: 400 9px var(--ui); letter-spacing: .24em; text-transform: uppercase; color: var(--ink2); }
button, select, input, textarea { font: inherit; color: inherit; }
button { font: 600 11px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; background: none; border: 1px solid var(--l4); border-radius: 10px; min-height: 44px; padding: 0 14px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
button:disabled { color: var(--ink2); border-color: var(--l1); cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, canvas:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--on); }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
/* top strip: the level's name, its state, the file and history buttons, Play */
.top { display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap; padding: calc(8px + var(--st)) 16px 8px; border-bottom: 1px solid var(--l2); }
.top .id { display: grid; gap: 2px; margin-right: auto; min-width: 0; }
.top h1 { margin: 0; font: 400 15px/1.2 var(--disp); letter-spacing: .1em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp { display: inline-flex; gap: 6px; align-items: center; }
#status { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border-color: var(--l2); color: var(--ink2); letter-spacing: .16em; }
#status i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink2); } #status.err { color: var(--rec); } #status.err i { background: var(--rec); }
#play { border-color: var(--acc); color: var(--acc); min-width: 96px; } #play[aria-pressed="true"] { color: var(--on); }
/* the three columns: outliner, scene, inspector */
.main { display: grid; grid-template-columns: 232px minmax(0, 1fr) 304px; min-height: 0; }
.col { min-height: 0; overflow: auto; border-right: 1px solid var(--l2); } .col.right { border-right: 0; border-left: 1px solid var(--l2); }
.col h2 { margin: 0; padding: 14px 16px 8px; }
.scene { position: relative; min-height: 0; min-width: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0d0a14; }
.read { position: absolute; left: 12px; top: 10px; display: grid; gap: 2px; pointer-events: none; }
.read b { font: 300 13px var(--disp); font-variant-numeric: tabular-nums; } .read b small { font-size: 9px; color: var(--ink2); margin-left: 3px; }
#hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 8px 12px; background: var(--panel); border: 1px solid var(--acc); border-radius: 10px; color: var(--acc); pointer-events: none; white-space: nowrap; }
/* outliner rows */
.rows { display: grid; gap: 4px; padding: 0 8px 12px; }
.row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 10px; text-align: left; border: 1px solid transparent; border-radius: 12px; letter-spacing: .1em; font-weight: 500; }
.row .mk { font: 300 12px var(--disp); color: var(--ink2); } .row .nm { overflow: hidden; text-overflow: ellipsis; } .row .xy { font: 400 9px var(--ui); letter-spacing: .06em; color: var(--ink2); font-variant-numeric: tabular-nums; }
.row[aria-pressed="true"] { background: var(--sel); border-color: var(--acc); color: var(--ink); } .row[aria-pressed="true"] .mk { color: var(--acc); }
.row.bad .mk { color: var(--rec); }
.sect { padding: 4px 18px 2px; }
/* inspector */
.tabs { display: flex; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--l2); }
.tabs button { border: 0; border-bottom: 1px solid transparent; border-radius: 0; padding: 0 2px; color: var(--ink2); min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }
.pane { padding: 14px 16px 20px; display: grid; gap: 12px; align-content: start; }
.pane h3 { margin: 0; font: 400 13px/1.3 var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.f { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; }
.f label { font: 400 10px var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); }
.f .v { display: flex; align-items: center; gap: 6px; min-width: 0; } .f .v > input, .f .v > select { flex: 1 1 0; min-width: 0; } .f .v small { flex: none; font-size: 9px; color: var(--ink2); letter-spacing: .1em; white-space: nowrap; text-transform: uppercase; }
input[type=number], input[type=text], select, textarea { width: 100%; min-height: 44px; padding: 0 10px; background: var(--ground); border: 1px solid var(--l3); border-radius: 10px; font: 300 14px var(--disp); font-variant-numeric: tabular-nums; }
select { font: 500 11px var(--ui); letter-spacing: .1em; text-transform: uppercase; } textarea { padding: 10px; min-height: 88px; font: 400 12px/1.5 var(--ui); resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--l3); border-radius: 12px; padding: 2px; gap: 2px; } .seg button { border-color: transparent; min-height: 38px; padding: 0 12px; color: var(--ink2); border-radius: 9px; }
.hr { height: 1px; background: var(--l1); margin: 4px 0; }
.note { color: var(--ink2); margin: 0; }
.chk { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; width: 100%; min-height: 44px; padding: 10px; text-align: left; border-color: var(--l1); border-radius: 12px; font: 400 12px/1.45 var(--ui); letter-spacing: 0; text-transform: none; white-space: normal; }
.chk i { width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: var(--ink2); } .chk.err i { background: var(--rec); }
/* bottom bar: what can be added */
.bar { display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap; padding: 8px 16px calc(8px + var(--sb)); background: var(--bar); border-top: 1px solid var(--l2); }
.bar select { width: auto; min-width: 170px; }
.menu { position: relative; } .menu .pop { position: absolute; right: 0; top: 50px; z-index: 5; min-width: 220px; max-height: 70vh; overflow: auto; display: grid; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--l3); border-radius: 12px; }
.menu .pop button { text-align: left; border-color: transparent; } .menu .pop button:hover { border-color: var(--l3); }
body[data-kind="stage"] [data-p="inspect"], body[data-kind="field"] [data-p="stage"], body[data-kind="stage"] #ptabs [data-p="list"] { display: none; }
body[data-kind="stage"] .bar > * { visibility: hidden; } body[data-kind="stage"] #cv { cursor: default; } body[data-kind="stage"] #read { display: none; }
.rowf { display: grid; grid-template-columns: minmax(0, 1fr) 76px 44px; gap: 6px; align-items: center; } .rowf button { padding: 0; } .sub { margin: 6px 0 0; }
/* a phone: the scene on top, one panel under it, chosen by tabs */
#ptabs { display: none; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 42vh) auto minmax(0, 1fr); }
  .top { gap: 6px; padding: calc(6px + var(--st)) 12px 6px; } .top .id { flex: 1 1 100%; } .top button { padding: 0 10px; letter-spacing: .14em; } #play { min-width: 72px; margin-left: auto; }
  .bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 12px calc(6px + var(--sb)); } .bar::-webkit-scrollbar { display: none; } .bar > * { flex: none; } .bar select { min-width: 150px; }
  .col { border: 0; } .col.right { border: 0; }
  #ptabs { display: flex; gap: 16px; padding: 0 16px; border-top: 1px solid var(--l2); border-bottom: 1px solid var(--l2); overflow-x: auto; }
  #ptabs button { border: 0; border-bottom: 1px solid transparent; border-radius: 0; padding: 0 2px; color: var(--ink2); }
  #ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }
  .col.right .tabs { display: none; } body:not([data-p="list"]) #outliner { display: none; } body[data-p="list"] .col.right { display: none; }
  .top h1 { font-size: 13px; }
  body.playing .main { grid-template-rows: minmax(0, 1fr); } body.playing .col, body.playing #ptabs, body.playing .bar { display: none; }   /* playing: the game takes the screen */
}
</style></head><body data-p="inspect">
<div id="app">
  <header class="top">
    <div class="id"><span class="micro">Level editor · <span id="dirty">saved on this device</span></span><h1 id="title">Untitled</h1></div>
    <button type="button" id="status" aria-label="Checks"><i></i><span id="status-t">OK</span></button>
    <span class="grp files">
      <span class="menu"><button type="button" id="new" aria-haspopup="true">New</button><div class="pop" id="new-pop" hidden></div></span>
      <span class="menu"><button type="button" id="open" aria-haspopup="true">Open</button><div class="pop" id="open-pop" hidden></div></span>
      <button type="button" id="save">Save</button><button type="button" id="copy">Copy</button>
    </span>
    <span class="grp"><button type="button" id="undo" aria-label="Undo">Undo</button><button type="button" id="redo" aria-label="Redo">Redo</button></span>
    <button type="button" id="play" aria-pressed="false">Play</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </header>
  <div class="main">
    <nav class="col" id="outliner" aria-label="What the level holds"><h2 class="micro">Outliner · <span id="count">0</span></h2><div class="rows" id="rows"></div></nav>
    <section class="scene" aria-label="The level from above">
      <canvas id="cv" tabindex="0" aria-label="Scene: tap to select, drag to move, drag empty ground to pan, pinch or scroll to zoom"></canvas>
      <iframe id="game" title="The level, playing" hidden></iframe>
      <div class="read" id="read"><span class="micro">Cursor</span><b><span id="r-xy">0.0, 0.0</span><small>U</small></b></div>
      <div id="hint" class="micro" hidden></div>
    </section>
    <div id="ptabs" role="tablist" aria-label="Panels"><button type="button" role="tab" data-p="list">List</button><button type="button" role="tab" data-p="inspect">Inspect</button><button type="button" role="tab" data-p="stage">Stage</button><button type="button" role="tab" data-p="level">Level</button><button type="button" role="tab" data-p="checks">Checks</button></div>
    <aside class="col right" aria-label="Properties">
      <div class="tabs" role="tablist" id="tabs"><button type="button" role="tab" data-p="inspect">Inspect</button><button type="button" role="tab" data-p="stage">Stage</button><button type="button" role="tab" data-p="level">Level</button><button type="button" role="tab" data-p="checks">Checks</button></div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
  <footer class="bar" id="bar">
    <span class="micro">Add</span>
    <span class="grp"><button type="button" data-add="tower">+ Tower</button><button type="button" data-add="grove">+ Grove</button></span>
    <span class="grp"><select id="pat" aria-label="Encounter pattern"></select><button type="button" data-add="encounter">+ Encounter</button></span>
    <span class="grp" style="margin-left:auto"><span class="micro">Snap</span><span class="seg" id="snap"><button type="button" data-v="0">Off</button><button type="button" data-v="2.5">2.5</button><button type="button" data-v="5">5</button></span><button type="button" id="fit">Fit</button></span>
  </footer>
</div>
<script src="../../../packages/level/level.js"></script>
<script src="../../../packages/level/catalog.js"></script>
<script src="../../../packages/maw/maw-stages.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), L = window.ForgeLevel, TAU = Math.PI * 2, DRAFT = 'forge-level-draft';
const FIELD_URL = '../field/index.html', TANK_URL = '../../../world/forges/fish-tool/Cybernetic%20Ecology.html', LEVELS_URL = '../levels/';   // the game pages Play runs (a field level, a tank stage), and where the kept levels are
const CAT = window.ForgeCatalog || { species: [] }, SPN = Object.fromEntries(CAT.species), STAGES = window.MawStages || null;
const el = (tag, attrs, kids) => { const n = document.createElement(tag); for (const k in attrs || {}) { if (k === 'text') n.textContent = attrs[k]; else if (k === 'on') for (const e in attrs.on) n.addEventListener(e, attrs.on[e]); else if (attrs[k] != null) n.setAttribute(k, attrs[k]); } for (const c of kids || []) if (c) n.append(c); return n; };
const pad2 = (n) => String(n).padStart(2, '0'), f1 = (v) => (Math.round(v * 10) / 10).toFixed(1);

// ---- the document: the level, its history, what is selected ----
let D = L.doc(L.template('field')), sel = null, checks = L.validate(D.level), pane = 'inspect', placing = null, playing = false, snapStep = 2.5, savedAt = 0;
{ const text = (() => { try { return localStorage.getItem(DRAFT); } catch (e) { return null; } })(); if (text) { try { D = L.doc(L.parse(text)); } catch (e) { console.warn('draft not read:', e.message); } } }
const level = () => D.level, species = L.AMBIENT.map((a) => a[0]), isStage = () => level().kind === 'stage';
const nameOf = (e) => { if (e.type === 'start') return 'Maw start'; if (e.type === 'encounter') return (L.ENC[e.pattern] || { name: e.pattern }).name; const same = L.ofType(level(), e.type); return L.TYPES[e.type].label + ' ' + pad2(same.indexOf(e) + 1); };
// every change goes through here: a command, then everything that shows the level is brought up to date
function edit(cmd, opts) { if (!L.apply(D, cmd, opts)) return false; changed(); return true; }
function changed() { checks = L.validate(level(), { species, speciesAll: CAT.species.length ? CAT.species.map((x) => x[0]) : null }); if (isStage() && (pane === 'inspect' || pane === 'list')) pane = 'stage'; if (!isStage() && pane === 'stage') pane = 'inspect'; document.body.dataset.kind = level().kind; try { localStorage.setItem(DRAFT, L.stringify(level())); savedAt = Date.now(); } catch (e) {} if (sel && !L.byId(level(), sel)) sel = null; refresh(); }
function select(id, show) { sel = id && L.byId(level(), id) ? id : null; if (show !== false && sel) setPane('inspect'); refresh(); }
function refresh() { drawRows(); drawPane(); drawTop(); dirty = true; }
function load(lv, keep) { D = L.doc(lv); sel = null; pane = lv.kind === 'stage' ? 'stage' : 'inspect'; if (!keep) fit(); changed(); }

// ---- the scene: the level from above ----
const cv = $('cv'), g = cv.getContext('2d'), view = { x: 0, y: 0, k: 3 }; let dirty = true, W = 1, H = 1, dpr = 1, cursor = null;
const sx = (x) => W / 2 + (x - view.x) * view.k, sy = (y) => H / 2 + (y - view.y) * view.k, wx = (px) => (px - W / 2) / view.k + view.x, wy = (py) => (py - H / 2) / view.k + view.y;
function fit() { const R = level().field.radius; view.x = 0; view.y = 0; view.k = Math.max(0.5, Math.min(W, H) / (R * 2.2)); dirty = true; }
function resize() { const r = cv.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = Math.max(1, r.width); H = Math.max(1, r.height); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); dirty = true; }
const CSSV = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim(), C = { ink: CSSV('--ink'), ink2: CSSV('--ink2'), acc: CSSV('--acc'), rec: CSSV('--rec'), l1: CSSV('--l1'), l3: CSSV('--l3'), l5: CSSV('--l5'), panel: CSSV('--panel'), ground: CSSV('--ground') };
// a stage has no layout of its own (the tank lays the place out): the scene shows who lives there, a bar each
function drawStage() { const st = level().stage || {}, rows = Object.entries(st.roster || {}).sort((a, b) => b[1] - a[1]), crew = Object.entries(st.crew || {}).filter((c) => c[1] > 0), max = Math.max(1, ...rows.map((r) => r[1])), x0 = 24, wBar = Math.max(60, W - 48 - 190); let y = 56;
  g.textBaseline = 'middle'; g.fillStyle = C.ink2; g.font = "400 9px 'IBM Plex Mono', monospace"; g.fillText('TANK STAGE · THE TANK LAYS THE PLACE OUT · ' + rows.reduce((a, r) => a + r[1], 0) + ' CREATURES', x0, 28);
  const eat = new Set(((st.goal || {}).eat || []).flatMap((e) => e.keys || []));
  for (const [k, n] of rows) { g.fillStyle = C.ink; g.font = "500 11px 'IBM Plex Mono', monospace"; g.fillText((SPN[k] || k).toUpperCase().slice(0, 22), x0, y); g.strokeStyle = C.l5; g.lineWidth = 1; g.beginPath(); g.moveTo(x0 + 180, y + 0.5); g.lineTo(x0 + 180 + wBar, y + 0.5); g.stroke();
    g.strokeStyle = eat.has(k) ? C.acc : C.ink; g.lineWidth = 3; g.beginPath(); g.moveTo(x0 + 180, y + 0.5); g.lineTo(x0 + 180 + wBar * n / max, y + 0.5); g.stroke(); g.fillStyle = C.ink2; g.font = "300 11px 'Martian Mono', monospace"; g.fillText(String(n), x0 + 186 + wBar * n / max, y - 9); y += 30; if (y > H - 60) break; }
  g.fillStyle = C.ink2; g.font = "400 9px 'IBM Plex Mono', monospace"; if (eat.size) g.fillText('AMBER: THE GOAL ASKS FOR THESE', x0, y + 4); y += eat.size ? 26 : 8;
  if (crew.length && y < H - 20) g.fillText('FLOOR CREW · ' + crew.map(([k, n]) => n + ' ' + ((L.CREW.find((c) => c[0] === k) || [0, k])[1]).toUpperCase()).join(' · '), x0, y + 4); }
function draw() { dirty = false; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); if (isStage()) return drawStage(); const lv = level(), R = lv.field.radius, bad = new Set(checks.errors.map((e) => e.id));
  // the floor's grid (fourteen squares across, as the game draws it), inside the field's circle
  g.save(); g.beginPath(); g.arc(sx(0), sy(0), R * view.k, 0, TAU); g.clip(); g.strokeStyle = C.l1; g.lineWidth = 1; g.beginPath();
  for (let i = -7; i <= 7; i++) { const p = i * R * 2 / 14 / 0.84; g.moveTo(sx(p), sy(-R)); g.lineTo(sx(p), sy(R)); g.moveTo(sx(-R), sy(p)); g.lineTo(sx(R), sy(p)); } g.stroke(); g.restore();
  g.strokeStyle = C.l5; g.lineWidth = 1; g.beginPath(); g.arc(sx(0), sy(0), R * view.k, 0, TAU); g.stroke();
  g.font = "400 9px 'IBM Plex Mono', monospace"; g.textBaseline = 'middle';
  // a Hanging Drop's line to its tower
  g.setLineDash([3, 4]); g.strokeStyle = C.l5; for (const e of lv.entities) if (e.type === 'encounter' && L.ENC[e.pattern] && L.ENC[e.pattern].needs === 'tower') { const t = L.byId(lv, e.tower) || L.nearestTower(lv, e); if (t) { g.beginPath(); g.moveTo(sx(e.x), sy(e.y)); g.lineTo(sx(t.x), sy(t.y)); g.stroke(); } } g.setLineDash([]);
  const order = ['grove', 'tower', 'encounter', 'start'];
  for (const type of order) for (const e of lv.entities) { if (e.type !== type) continue; const x = sx(e.x), y = sy(e.y), r = L.radiusOf(e) * view.k, on = e.id === sel, col = bad.has(e.id) ? C.rec : on ? C.acc : C.ink;
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = on ? 1.5 : 1;
    if (type === 'grove') { g.setLineDash([2, 4]); g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); g.setLineDash([]); for (let i = 0; i < Math.min(12, e.plants); i++) { const a = i * 2.4, d = r * (0.25 + 0.6 * ((i * 37) % 10) / 10); g.beginPath(); g.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d + 3); g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d - 3); g.stroke(); } }
    else if (type === 'tower') { g.fillStyle = C.ground; g.beginPath(); g.arc(x, y, Math.max(3, r), 0, TAU); g.fill(); g.stroke(); g.beginPath(); g.arc(x, y, Math.max(1.5, r * 0.55), 0, TAU); g.stroke(); g.fillStyle = col; }
    else if (type === 'encounter') { const s = 6; g.fillStyle = C.ground; g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x - s, y); g.closePath(); g.fill(); g.stroke(); g.fillStyle = on || bad.has(e.id) ? col : C.ink2;
