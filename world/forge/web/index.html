<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../../../shared/look/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/components.css">
<link rel="stylesheet" href="../../../shared/look/theme-forge.css">
<style>
  /* Home, in Forge Console: strip · worlds list · head unit for the open world · its five stages as
     track rows whose clips are what each stage has saved. Layout only; parts come from components.css. */
  html { background: var(--ground); }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--ground); color: var(--ink); }
  .logo { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
  .logo svg { width: 22px; height: 22px; }
  .layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 0; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line-2); max-height: 220px; } }
  aside { overflow: auto; padding: 22px 0; border-right: 1px solid var(--line-2); }
  aside .f-head { padding: 0 20px 10px; }
  .wrow { gap: 12px; padding: 8px 20px 8px 18px; }
  .wrow .ix { font-family: var(--font-display); font-weight: 200; font-size: 22px; color: var(--ink-2); width: 30px; }
  .wrow.is-sel .ix { color: var(--pick); }
  .wrow .t { flex: 1 1 auto; min-width: 0; }
  .wrow .t .f-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrow .t .f-micro { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .16em; }
  .wrow .f-thumb { width: 44px; height: 44px; padding: 2px; cursor: inherit; }
  main { overflow: auto; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .f-unit { align-items: stretch; }
  .who-top { display: flex; gap: 16px; align-items: center; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 12px 0 4px; }
  .facts .v { margin-top: 4px; font-family: var(--font-display); font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facts .v.pick { color: var(--pick); }
  h1.f-title { margin: 4px 0; outline: none; }
  h1.f-title[contenteditable="true"] { box-shadow: 0 0 0 1px var(--pick); border-radius: 4px; padding: 0 4px; }
  .cover { position: relative; flex: 1 1 360px; min-height: 260px; border-radius: var(--radius-lane); background: var(--well); overflow: hidden; display: block; color: inherit; text-decoration: none; }
  a.cover:hover { box-shadow: 0 0 0 1px var(--line-5); }
  .cover .art { position: absolute; inset: 0; padding: 36px 16px 16px; box-sizing: border-box; }
  .cover .art svg { width: 100%; height: 100%; }
  .cover .cap { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; gap: 12px; }
  .cover .tagbox { font-family: var(--font-ui); font-size: 9px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; background: var(--ink); color: var(--on-signal); border-radius: var(--radius-xs); padding: 3px 7px; }
  .cover .specimen { position: absolute; inset: 44px 16px 16px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-content: center; }
  .cover .specimen .f-thumb { width: auto; height: auto; aspect-ratio: 1; cursor: default; background: var(--ground); }
  .side { flex: 0 1 250px; display: flex; flex-direction: column; gap: 18px; }
  .rows .f-track__ctl { min-width: 140px; }
</style>
</head>
<body>
  <div class="f-strip">
    <a class="logo" href="./index.html" aria-label="Forge home">
      <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="11" cy="11" r="9.5"/><circle cx="11" cy="11" r="3"/><path d="M11 1.5v6M11 14.5v6M1.5 11h6M14.5 11h6"/></svg>
      <span class="wordmark">Forge</span>
      <span class="f-micro">World builder</span>
    </a>
    <span class="f-spacer"></span>
    <span class="f-micro" id="status"></span>
    <label class="f-btn is-quiet" title="Open a world someone exported">Import<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    <button class="f-btn is-go" id="newWorld" type="button">+ New world</button>
  </div>

  <div class="layout">
    <aside>
      <div class="f-head" style="border:0"><span class="f-label" id="worldsLab">Worlds</span></div>
      <div id="worlds" style="border-top:1px solid var(--line-1)"></div>
    </aside>
    <main id="main"></main>
  </div>

  <script src="../../../shared/engine/creature-catalog.js"></script>
  <script src="./forge-world.js"></script>
  <script>
    (async function () {
      const $ = (s, el) => (el || document).querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
      const pad = (n, w) => String(n).padStart(w || 2, "0");

      // the five stages in the rail's order, which saved records belong to each, and their hue
      const STAGES = [
        { id: "kit", label: "Kit", page: "kit.html", c: "var(--stage-kit)", sub: "Sheets by family", act: "Open", has: () => false },
        { id: "bench", label: "Bench", page: "bench.html", c: "var(--stage-bench)", sub: "Buildings · seals · rule sets", act: "Forge", empty: "Empty · forge a building or a seal",
          has: (r) => ["building", "seal", "script", "icon-set", "ruleset"].includes(r.type) },
        { id: "city", label: "City", page: "city.html", c: "var(--stage-city)", sub: "Plots · terrain", act: "Lay out", empty: "Empty · lay out a city for your prefabs",
          has: (r) => r.type === "city" },
        { id: "species", label: "Species", page: "species.html", c: "var(--stage-species)", sub: "Breed · attach · rig", act: "Breed", empty: "Empty · breed a species from the parts",
          has: (r) => (r.type === "species" && !(r.recipe || {}).base) || r.type === "rig" },
        { id: "ecology", label: "Ecology", page: "ecology.html", c: "var(--stage-ecology)", sub: "Drift · capture", act: "Run", empty: "Needs a city and species",
          has: (r) => r.type === "species" && !!(r.recipe || {}).base },
      ];
      const stageOf = (r) => STAGES.find((s) => s.has(r));
      const stageUrl = (stage, worldId, q) => "./" + stage.page + "?" + new URLSearchParams({ world: worldId, ...(q || {}) });
      const visible = (r) => !["settings", "style_overrides"].includes(r.type);

      function ago(t) {
        if (!t) return "never";
        const s = (Date.now() - t) / 1000;
        if (s < 60) return "just now";
        if (s < 3600) return Math.floor(s / 60) + " min ago";
        if (s < 86400) return Math.floor(s / 3600) + " h ago";
        if (s < 86400 * 7) return Math.floor(s / 86400) + " d ago";
        return new Date(t).toLocaleDateString();
      }

      // parts from the shared library, drawn the way Kit draws them
      let partsPromise = null;
      const loadParts = () => (partsPromise = partsPromise || fetch("../../../shared/engine/creature-parts.json").then((r) => r.json()).catch(() => []));
      // one drawing per sheet: each sheet's hero from the catalogue, creatures first
      async function sheetHeroes(n) {
        const [all] = await Promise.all([loadParts(), CreatureCatalog.load("../../../shared/engine/creature-catalog.json")]);
        const byId = new Map(all.map((p) => [p.id, p]));
        const ids = CreatureCatalog.families().filter((f) => f.id !== "marks").flatMap((f) => f.sheets);
        return ids.slice(0, n).map((id) => byId.get(CreatureCatalog.heroOf(id))).filter(Boolean).map((p) => { const m = Math.max(p.w, p.h) / 2 + 6; return { svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-m} ${-m} ${2 * m} ${2 * m}">${p.defs ? `<defs>${p.defs}</defs>` : ""}${p.svg}</svg>`, title: CreatureCatalog.sheetName(p.species) }; });
      }
      async function someParts(n, offset) {
        const all = await loadParts();
        const big = all.filter((p) => Math.max(p.w, p.h) > 50 && p.species !== "sheet-xenoglyph");
        const out = [];
        for (let i = 0; i < n && big.length; i++) out.push(big[((i + (offset || 0)) * 7919 + 13) % big.length]);
        return out.map((p) => { const m = Math.max(p.w, p.h) / 2 + 6; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-m} ${-m} ${2 * m} ${2 * m}">${p.defs ? `<defs>${p.defs}</defs>` : ""}${p.svg}</svg>`; });
      }

      async function recordsOf(worldId) {
        const w = await ForgeWorld.open(worldId);
        const all = await w.list();
        return { all, recs: all.filter(visible).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)) };
      }
      const cover = (recs) => recs.find((r) => r.type === "city" && r.svg) || recs.find((r) => r.svg);
      const worldsInOrder = () => ForgeWorld.listWorlds().slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      loadParts().then((p) => { $("#status").textContent = pad(ForgeWorld.listWorlds().length) + " worlds · " + p.length + " parts in the kit"; });

      // ── worlds list ──
      function renderWorlds() {
        const host = $("#worlds"), active = ForgeWorld.getActiveWorldId(), worlds = worldsInOrder();
        $("#worldsLab").textContent = "Worlds · " + pad(worlds.length);
        host.innerHTML = "";
        worlds.forEach((w, i) => {
          const row = el("div", "f-row wrow" + (w.id === active ? " is-sel" : ""));
          row.tabIndex = 0; row.setAttribute("role", "button");
          const th = el("span", "f-thumb");
          const t = el("div", "t"); t.append(el("div", "f-name", w.name), el("div", "f-micro", "edited " + ago(w.updatedAt)));
          row.append(el("span", "ix", pad(i + 1)), t, th);
          const pick = () => { ForgeWorld.setActiveWorldId(w.id); renderWorlds(); renderMain(); };
          row.addEventListener("click", pick);
          row.addEventListener("keydown", (e) => { if (e.key === "Enter") pick(); });
          row.addEventListener("dblclick", () => { const c = $("#continue"); if (c) location.href = c.href; });
          host.appendChild(row);
          recordsOf(w.id).then(({ recs }) => { const c = cover(recs); if (c) th.innerHTML = c.svg; t.lastChild.textContent = pad(recs.length) + " objects · " + ago(w.updatedAt); });
        });
      }

      // ── the open world ──
      let migrated = 0;
      async function renderMain() {
        const main = $("#main");
        const world = await ForgeWorld.activeWorld();
        const wid = world.worldId, worlds = worldsInOrder();
        const meta = worlds.find((x) => x.id === wid) || { name: wid };
        const { all, recs } = await recordsOf(wid);
        const g = ForgeWorld.graph(all);
        const sel = ForgeWorld.getSelection(wid);
        const picked = sel && recs.find((r) => r.id === sel.id);
        const last = picked || recs[0];
        const cur = (sel && STAGES.find((s) => s.id === sel.from)) || (last && stageOf(last)) || STAGES[recs.length ? 0 : 1];
        const stale = recs.filter((r) => g.stale(r).length);
        const count = (f) => recs.filter(f).length;
        main.innerHTML = "";

        // head unit: who · cover · readouts
        const unit = el("section", "f-unit");
        const who = el("div", "f-unit__who");
        const top = el("div", "who-top");
        const tt = el("div");
        const title = el("h1", "f-title", meta.name);
        tt.append(el("div", "f-micro", "Open world"), title, el("div", "f-micro", "Edited " + ago(meta.updatedAt)));
        top.append(el("div", "f-ixbox", pad(worlds.indexOf(meta) + 1)), tt);
        const facts = el("div", "facts");
        const fact = (k, v, pk) => { const d = el("div"); d.append(el("div", "f-micro", k), el("div", "v" + (pk ? " pick" : ""), v)); return d; };
        facts.append(fact("Picked", picked ? picked.name : "Nothing", !!picked), fact("Last stage", cur.label, true),
          fact("Last saved", recs[0] ? recs[0].name : "—"), fact("Out of date", stale.length ? pad(stale.length) : "None"));
        const acts = el("div", "f-btns");
        const cont = el("a", "f-btn is-go", (recs.length ? "Continue · " : "Start · ") + cur.label + " →"); cont.id = "continue"; cont.href = stageUrl(cur, wid);
        cont.addEventListener("click", () => ForgeWorld.touchWorld(wid));
        const rename = el("button", "f-btn is-dense", "Rename"); rename.type = "button";
        rename.addEventListener("click", () => { title.contentEditable = "true"; title.focus(); document.getSelection().selectAllChildren(title); });
        const finish = () => {
          if (title.contentEditable !== "true") return;
          title.contentEditable = "false";
          const name = title.textContent.trim();
          if (name && name !== meta.name) { ForgeWorld.renameWorld(wid, name); renderWorlds(); } else title.textContent = meta.name;
        };
        title.addEventListener("blur", finish);
        title.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); title.blur(); } if (e.key === "Escape") { title.textContent = meta.name; title.blur(); } });
        const exp = el("button", "f-btn is-dense", "Export"); exp.type = "button"; exp.title = "Download this world as one file";
        exp.addEventListener("click", async () => { const n = await ForgeWorld.downloadWorld(wid); exp.textContent = "Exported · " + n; });
        acts.append(cont, rename, exp);
        who.append(top, facts, acts);
        who.style.flex = "0 1 300px";

        const c = cover(recs);
        let cv;
        if (c) {
          cv = el("a", "cover");
          const where = ForgeWorld.placesFor(c, g, { worldId: wid })[0];
          cv.href = where ? where.url : stageUrl(stageOf(c) || cur, wid);
          cv.addEventListener("click", () => ForgeWorld.select(wid, { id: c.id, type: c.type, from: (stageOf(c) || cur).id }));
          const art = el("div", "art"); art.innerHTML = c.svg;
          const cap = el("div", "cap"); cap.append(el("span", "tagbox", c.type + " · v" + c.version), el("span", "f-micro", c.name + " · " + (where ? where.label : "open") + " →"));
          cv.append(art, cap);
        } else {
          cv = el("div", "cover");
          const cap = el("div", "cap"); cap.append(el("span", "tagbox", "Kit"), el("span", "f-micro", "Nothing made yet · these are the parts you build from"));
          const spec = el("div", "specimen");
          someParts(18).then((svgs) => svgs.forEach((s) => { const t = el("span", "f-thumb"); t.innerHTML = s; spec.appendChild(t); }));
          cv.append(cap, spec);
        }

        const side = el("div", "side");
        const reads = el("div", "f-unit__reads"); reads.style.setProperty("--cols", 2);
        const read = (k, n, u) => { const d = el("div", "f-readout" + (n ? "" : " is-zero")); const v = el("span", "f-readout__v", pad(n)); if (u) v.appendChild(el("small", "", u)); d.append(el("span", "f-micro", k), v); return d; };
        reads.append(read("Buildings", count((r) => r.type === "building"), count((r) => r.prefab) + " prefab"),
          read("Cities", count((r) => r.type === "city")),
          read("Species", count((r) => r.type === "species" && !(r.recipe || {}).base)),
          read("Variants", count((r) => r.type === "species" && (r.recipe || {}).base)));
        const flag = el("div", "f-flag" + (stale.length ? " is-stale" : recs.length ? " is-ok" : ""));
        if (stale.length) { const a = el("a", "", pad(stale.length) + " out of date · recook in lineage →"); a.href = "./lineage.html?" + new URLSearchParams({ world: wid }); flag.appendChild(a); }
        else flag.textContent = migrated ? "Brought in " + pad(migrated) + " settings from the old forges" : recs.length ? "Everything up to date" : "Empty world · start at Bench or Species";
        side.append(reads, flag);
        unit.append(who, cv, side);
        main.appendChild(unit);

        // the stages as track rows
        const head = el("div", "f-head");
        head.append(el("span", "f-label", "Stages · 05"), el("span", "f-micro", "Kit → Bench → City, Species any time, then Ecology"));
        const rows = el("section", "rows"); rows.appendChild(head);
        STAGES.forEach((s, i) => {
          const mine = recs.filter(s.has);
          const row = el("div", "f-track" + (s === cur ? " is-cur" : ""));
          row.style.setProperty("--c", s.c);
          const hd = el("a", "f-track__hd"); hd.href = stageUrl(s, wid);
          const ht = el("div"); ht.append(el("div", "f-name-fixed", s.label), el("div", "f-micro", s.sub));
          hd.append(el("span", "f-track__num", pad(i + 1)), ht);
          const lane = el("div", "f-track__lane");
          if (s.id === "kit") sheetHeroes(16).then((hs) => hs.forEach((x) => { const t = el("a", "f-thumb"); t.innerHTML = x.svg; t.title = x.title; t.href = stageUrl(s, wid); lane.appendChild(t); }));
          else if (!mine.length) { const e = el("div", "f-empty"); e.appendChild(el("span", "", s.id === "ecology" && count((r) => r.type === "city") ? "Ready · run a city to see species drift" : s.empty)); lane.appendChild(e); }
          else for (const r of mine) {
            const st = g.stale(r).length;
            const clip = el("button", "f-clip" + (sel && sel.id === r.id ? " is-sel" : "") + (st ? " is-stale" : "")); clip.type = "button";
            clip.title = r.name + " · open where it was made";
            const art = el("span", "f-clip__art"); if (r.svg) art.innerHTML = r.svg;
            const t = el("span"); t.append(el("span", "f-clip__nm", r.name || r.id), el("span", "f-clip__meta", st ? "Stale · v" + r.version : (r.prefab ? "prefab" : r.type) + " · v" + r.version));
            t.firstChild.style.display = "block"; t.lastChild.style.display = "block"; t.style.minWidth = "0";
            clip.append(art, t);
            clip.addEventListener("click", () => {
              ForgeWorld.select(wid, { id: r.id, type: r.type, from: s.id });
              const where = ForgeWorld.placesFor(r, g, { worldId: wid })[0];
              location.href = where ? where.url : stageUrl(s, wid);
            });
            lane.appendChild(clip);
          }
          const ctl = el("div", "f-track__ctl");
          if (s.id !== "kit") ctl.appendChild(el("span", "f-track__count" + (mine.length ? "" : " is-zero"), pad(mine.length)));
          const go = el("a", "f-btn" + (s === cur ? " is-go" : ""), s.act); go.href = stageUrl(s, wid); go.setAttribute("aria-label", s.act + " in " + s.label);
          ctl.appendChild(go);
          row.append(hd, lane, ctl);
          rows.appendChild(row);
        });
        main.appendChild(rows);
      }

      // ── new / import ──
      $("#newWorld").addEventListener("click", async () => {
        const n = ForgeWorld.listWorlds().length;
        const w = await ForgeWorld.createWorld(n ? "Untitled world " + (n + 1) : "Untitled world");
        ForgeWorld.setActiveWorldId(w.id);
        renderWorlds(); await renderMain();
        const r = [...document.querySelectorAll("#main .f-btns button")].find((b) => b.textContent === "Rename"); if (r) r.click();
      });
      const fi = $("#importFile");
      fi.addEventListener("change", async () => {
        const f = fi.files[0]; if (!f) return;
        try { const rec = await ForgeWorld.readWorldFile(f); ForgeWorld.setActiveWorldId(rec.id); renderWorlds(); await renderMain(); }
        catch (err) { $("#status").textContent = "Could not open that file: " + (err.message || err); }
        fi.value = "";
      });

      // settings from the standalone forges come in once per world, quietly
      const world = await ForgeWorld.activeWorld();
      if (!(await world.list("settings")).length) migrated = (await world.migrateFromLocalStorage()) || 0;
      renderWorlds();
      await renderMain();
      ForgeWorld.onChange((m) => { if (m && m.kind === "put") { renderWorlds(); renderMain(); } });
      ForgeWorld.onSelect(() => renderMain());
    })();
  </script>
</body>
</html>
