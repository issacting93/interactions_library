<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — City</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../../../shared/look/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/components.css">
<link rel="stylesheet" href="../../../shared/look/theme-forge.css">
<link rel="stylesheet" href="./forge-pages.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/bloom-picker.css">
<style>
  .col-left { flex: 0 1 290px; min-width: 240px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .col-center { flex: 999 1 600px; min-width: 380px; position: relative; background: var(--well); }
  .col-right { flex: 0 1 320px; min-width: 260px; }
  #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.drag { cursor: grabbing; }
  #map .cell { stroke: rgba(255,255,255,.06); stroke-width: .02; }
  #map .cell { cursor: pointer; }
  #map .cell:hover { stroke: rgba(255,255,255,.4); stroke-width: .05; }
  #map .cell.plot { stroke: rgba(255,255,255,.28); stroke-width: .04; cursor: pointer; }
  #map .cell.pinned { stroke: var(--pick, #e8b04a); stroke-width: .1; }
  .col-center { position: relative; }
  .tileglyph { width: 100%; height: 100%; display: block; }
  .pinrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  #map .cell.plot:hover, #map .cell.sel { stroke: var(--loop); stroke-width: .08; }
  #map .cell.focus { stroke: #5fd38d; stroke-width: .14; }
  #map .cell.fits { stroke: #5fd38d; stroke-width: .06; stroke-dasharray: .25 .2; }
  .cand.focus { box-shadow: inset 2px 0 0 var(--loop); }
  .focusnote { border-left: 2px solid var(--loop); padding: 6px 10px; font-size: 11px; line-height: 1.5; color: var(--ink-2); }
  #map .contour { fill: none; stroke: rgba(255,255,255,.14); stroke-width: .035; }
  #map .contour.sea { stroke: rgba(120,190,230,.5); stroke-width: .06; }
  #map use { cursor: pointer; }
  .legend { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); pointer-events: none; }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
  .zoomnote { position: absolute; right: 12px; bottom: 10px; font-size: 9px; color: var(--ink-off); letter-spacing: .1em; text-transform: uppercase; }
  .pf { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line-2); }
  .pf .thumb { width: 44px; height: 54px; padding: 2px; cursor: default; }
  .pf .nm { font-size: 11px; color: var(--ink); display: flex; justify-content: space-between; gap: 6px; }
  .pf .nm span { color: var(--ink-off); font-size: 9px; white-space: nowrap; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .chip { font-family: var(--font-ui); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border: 1px solid var(--line-4); border-radius: var(--r-sm); background: transparent; color: var(--ink-off); cursor: pointer; }
  .chip.on { border-color: var(--loop); color: var(--ink); background: var(--lane-sel); }
  .stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 11px; }
  .stat span:nth-child(even) { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .stat span:nth-child(odd) { color: var(--ink-2); }
  .cand { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 6px; border: 1px solid var(--line-2); border-radius: var(--r-sm); cursor: pointer; font-size: 10px; }
  .cand .thumb { width: 34px; height: 40px; padding: 1px; }
  .cand.on { border-color: var(--loop); background: var(--lane-sel); }
  .cand.no { opacity: .5; cursor: not-allowed; }
  .cand small { display: block; color: var(--ink-off); font-size: 9px; margin-top: 2px; }
  .emptylist { display: flex; flex-direction: column; gap: 4px; }
  .emptylist button { text-align: left; font-family: var(--font-ui); font-size: 10px; background: transparent; border: 1px solid var(--line-2); border-radius: var(--r-sm); color: var(--ink-2); padding: 6px 8px; cursor: pointer; }
  .emptylist button:hover { color: var(--ink); border-color: var(--line-4); }
  .seedrow { display: flex; gap: 6px; }
  .seedrow input { flex: 1; min-width: 0; }
  #measure { position: absolute; left: -9999px; top: 0; width: 10px; height: 10px; visibility: hidden; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="./index.html">Forge</a>
    <div class="crumb"><a class="f-strip__world" id="worldName" href="./index.html" title="All worlds">…</a> &rsaquo; City</div>
    <span class="spacer"></span>
    <select id="openCity" aria-label="Open a saved city" style="max-width:220px"><option value="">New city</option></select>
    <span class="status" id="status"></span>
  </div>

  <div class="body-row">
    <div class="col col-left">
      <div class="f-field">
        <label for="seed" class="f-field__label"><span>City seed</span><span class="v" id="solveInfo"></span></label>
        <div class="seedrow"><input type="number" id="seed" value="7"><button type="button" class="f-btn" id="newCity">New city</button></div>
      </div>
      <label class="checkrow"><input type="checkbox" id="houses"> Houses are plots too</label>
      <div class="pinrow"><span class="hint-text" id="pinNote" style="margin:0">Click any cell on the map to change what stands there. The city rebuilds round it.</span><button type="button" class="f-btn is-dense" id="unpinAll" hidden>Unpin all</button></div>

      <div class="group">
        <div class="glabel">Terrain</div>
        <div id="terrainFields"></div>
      </div>
      <div class="group">
        <div class="glabel">Placement</div>
        <div id="placeFields"></div>
      </div>
      <div class="group">
        <div class="glabel">Prefabs · district rules</div>
        <p class="hint-text">Each prefab may stand in the districts lit here. Saved district tags set the start; changes here belong to this city.</p>
        <div id="prefabs"></div>
      </div>
    </div>

    <div class="col col-center">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="City map"></svg>
      <div class="legend" id="legend"></div>
      <div class="zoomnote">scroll to zoom · drag to pan</div>
      <svg id="measure" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="col col-right" id="inspector"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

  <script src="../../../shared/look/forge-anim.js"></script>

  <script src="./forge-world.js"></script>
  <script src="./forge-shell.js"></script>
  <script src="../../../shared/engine/generators/kit-utils.js"></script>
  <script src="../../../shared/engine/generators/spire-generator.js"></script>
  <script src="../../../shared/engine/generators/forge-registry.js"></script>
  <script src="../../../shared/engine/generators/forge-building.js"></script>
  <script src="../../../shared/engine/generators/forge-generators.js"></script>
  <script src="../../../shared/engine/bloom.js"></script>
  <script src="../../../shared/look/forge-ds/bloom-picker.js"></script>
  <script src="../../../shared/engine/city/city-wfc.js"></script>
  <script src="../../../shared/engine/generators/terrain.js"></script>
  <script src="../../../shared/engine/generators/city-placement.js"></script>
  <script src="../../../shared/engine/generators/forge-overrides.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      if (params.get("world")) ForgeWorld.setActiveWorldId(params.get("world"));
      const worldPromise = ForgeWorld.activeWorld();
      if (window.self === window.top) ForgeShell.mount({ active: "city", world: worldPromise });
      else document.body.classList.add("embedded");
      const world = await worldPromise;
      const meta = ForgeWorld.listWorlds().find((w) => w.id === world.worldId);
      document.getElementById("worldName").textContent = meta ? meta.name : world.worldId;
      const $ = (id) => document.getElementById(id);
      const CP = CityPlacement, NS = "http://www.w3.org/2000/svg";
      const SQUASH = 0.62;
      const ZONE_COLOR = { core: "#d9b46a", sanctum: "#c9a25a", bazaar: "#b77f4f", housing: "#8a7a66", garden: "#5f8f62", wall: "#7d7a72" };
      // the city's words come from Forge's own vocabulary (city-placement.js), not the solver's old tile names
      const TILE_NAME = Object.fromEntries(Object.entries(CP.VOCAB).map(([k, v]) => [k, v.name]));
      const ZN = CP.ZONE_NAMES;

      const state = {
        recipe: { ...CP.DEFAULTS, seed: 7, terrain: { ...Terrain.DEFAULTS }, rules: {}, overrides: {}, plotOverrides: {}, pins: {} },
        cityId: null, cityName: "", solved: null, placed: new Map(), prefabs: [], sel: null, view: null, dirty: false,
        // the selection shared across Forge: a building here is outlined wherever it stands
        focus: params.get("focus") || (ForgeWorld.getSelection(world.worldId) || {}).id || null,
      };

      /* ---------- prefabs: world objects with a drawing, measured in the DOM ---------- */
      function innerOf(svg) {
        const m = svg.match(/^<svg[^>]*>([\s\S]*)<\/svg>\s*$/);
        let inner = m ? m[1] : svg;
        const vb = (svg.match(/viewBox="([^"]+)"/) || [])[1];
        if (vb) { const [, , w, h] = vb.split(/\s+/); inner = inner.replace(new RegExp(`<rect width="${w}" height="${h}"[^>]*/>`), ""); }
        return inner;
      }
      async function loadPrefabs() {
        const all = await world.list();
        const objs = all.filter((o) => o.svg && (o.prefab || o.type === "building")).sort((a, b) => (!!b.prefab - !!a.prefab) || b.updatedAt - a.updatedAt);
        const box = $("measure");
        state.prefabs = objs.map((o, i) => {
          const g = document.createElementNS(NS, "g"); g.innerHTML = innerOf(o.svg); box.appendChild(g);
          const bb = g.getBBox(); box.removeChild(g);
          return {
            id: o.id, name: o.name, version: o.version, type: o.type, sym: "pf" + i, inner: innerOf(o.svg),
            bbox: [bb.x, bb.y, Math.max(bb.width, 1), Math.max(bb.height, 1)], span: Math.max(bb.width, 1), height: bb.height,
            districts: (o.prefab && o.prefab.districts) || [], attracts: (o.prefab && o.prefab.attracts) || [], isPrefab: !!o.prefab, record: o,
          };
        });
      }

      // a world with no buildings yet gets a starter set, forged here with the Tower generator
      async function forgeStarters() {
        $("status").textContent = "forging…";
        const Reg = ForgeRegistry, kit = await Reg.loadKit("../../../shared/data/creature-parts.json");
        const specs = [["lighthouse", 61, 110, ["core", "sanctum"]], ["gothic", 62, 110, ["sanctum", "wall"]], ["hall", 63, 120, ["bazaar", "housing"]],
          ["pagoda", 64, 85, ["housing", "garden"]], ["rotunda", 65, 80, ["housing", "garden"]], ["gate", 66, 90, ["wall"]]];
        for (const [tpl, seed, half, districts] of specs) {
          const r = Reg.create("building.spire", kit, seed, { tpl });
          r.base.half = half;
          const res = Reg.run("building.spire", r, kit, {});
          const rec = Reg.toRecord("building.spire", r, res, { name: `${tpl[0].toUpperCase() + tpl.slice(1)} ${seed}`, source: { tool: "Forge City", generator: "building.spire" } }, kit);
          rec.prefab = { footprint: [half * 2, half * 2], height: res.metrics.height, facing: "any", districts, attracts: [], pinned: false };
          await world.put(rec);
        }
        await loadPrefabs(); ForgeShell.refreshShelf && ForgeShell.refreshShelf();
        place(); renderAll(); $("status").textContent = "6 towers forged";
      }

      /* ---------- solve + place ---------- */
      function solve() {
        const t0 = performance.now();
        state.solved = CP.solve(state.recipe);
        $("solveInfo").textContent = state.solved.ok ? `${Math.round(performance.now() - t0)}ms` : "no solution";
        place();
      }
      function place() { state.placed = state.solved && state.solved.ok ? CP.assign(state.solved, state.prefabs, state.recipe) : new Map(); refreshVariants(); }

      /* ---------- per-plot overrides: a placed building's key controls changed on one plot only ----------
         recipe.plotOverrides[cellId] = { "shaft.h": 540, ... } (paths into the building's Spire design).
         The plot draws the base building with those values laid over it; everything it didn't
         change follows the base. "Apply to base" writes them into the building for every plot. */
      let kitP = null;
      const getKit = () => kitP || (kitP = ForgeRegistry.loadKit("../../../shared/data/creature-parts.json"));
      const genomeOf = (pf) => pf && pf.record && window.ForgeBuilding ? ForgeBuilding.read(pf.record.recipe).genome : null;
      const tweakParams = () => ForgeRegistry.promoted("building.spire").shown.filter((p) => !p.regen && p.path && p.type === "range");
      state.variantCache = new Map(); state.variantOf = new Map();
      function plotOv(cellId) { const o = state.recipe.plotOverrides[cellId]; return o && Object.keys(o).length ? o : null; }
      function refreshVariants() {
        state.variantOf = new Map();
        const pending = [];
        for (const [cid, pl] of state.placed) {
          const ov = plotOv(cid), g = ov && genomeOf(pl.prefab);
          if (!g) continue;
          const key = pl.prefab.id + "@" + pl.prefab.version + JSON.stringify(ov);
          if (state.variantCache.has(key)) state.variantOf.set(cid, state.variantCache.get(key));
          else pending.push([cid, pl, ov, g, key]);
        }
        if (!pending.length) return;
        getKit().then((kit) => {
          for (const [cid, pl, ov, g, key] of pending) {
            const svg = SpireGenerator.generate(ForgeOverrides.apply(g, ov), kit.byId, {}).svg, inner = innerOf(svg);
            const gEl = document.createElementNS(NS, "g"); gEl.innerHTML = inner; $("measure").appendChild(gEl); const bb = gEl.getBBox(); $("measure").removeChild(gEl);
            const v = { ...pl.prefab, sym: "pv" + state.variantCache.size, inner, bbox: [bb.x, bb.y, Math.max(bb.width, 1), Math.max(bb.height, 1)], span: Math.max(bb.width, 1), height: bb.height, overridden: Object.keys(ov).length };
            state.variantCache.set(key, v); state.variantOf.set(cid, v);
          }
          renderMap();
        });
      }

      /* ---------- map ---------- */
      function sector(c) {
        const P = (r, a) => `${(r * Math.cos(a)).toFixed(3)} ${(r * Math.sin(a)).toFixed(3)}`;
        if (c.ring === 0) return `M${c.r1} 0A${c.r1} ${c.r1} 0 1 1 ${-c.r1} 0A${c.r1} ${c.r1} 0 1 1 ${c.r1} 0Z`;
        const large = c.a1 - c.a0 > Math.PI ? 1 : 0;
        return `M${P(c.r0, c.a0)}L${P(c.r1, c.a0)}A${c.r1} ${c.r1} 0 ${large} 1 ${P(c.r1, c.a1)}L${P(c.r0, c.a1)}A${c.r0} ${c.r0} 0 ${large} 0 ${P(c.r0, c.a0)}Z`;
      }
      function cellFill(c) {
        const id = c.tile.base || c.tile.id, z = ZONE_COLOR[c.zone];
        const street = c.tile.in === "S" || c.tile.out === "S" || c.tile.cw === "S" || c.tile.ccw === "S" || c.tile.cw === "M";
        if (/qanat|canal|inlet|ab-anbar/.test(id)) return ["#4f8fb0", 0.55];
        if (id === "orchard" || id === "pool-garden") return [z, 0.5];
        if (street) return ["#d8cbb0", 0.16];
        return [z, CP.PLOT_TILES.includes(id) ? 0.62 : 0.34];
      }
      let terrainURL = null, terrainKey = "";
      function terrainImage() {
        const key = JSON.stringify(state.recipe.terrain) + state.recipe.seed;
        if (key === terrainKey) return terrainURL;
        const cv = document.createElement("canvas"); cv.width = cv.height = 320;
        Terrain.shade(state.solved.terrain, cv.getContext("2d"), 320);
        terrainKey = key; terrainURL = cv.toDataURL("image/png");
        return terrainURL;
      }
      function renderMap() {
        const svg = $("map"), S = state.solved;
        if (!S || !S.ok) { svg.innerHTML = `<text x="0" y="0" fill="#888" font-size="1" text-anchor="middle">No connected city on this seed; try another.</text>`; svg.setAttribute("viewBox", "-17 -12 34 24"); return; }
        const E = Terrain.EXTENT;
        let defs = "";
        const used = new Set([...state.placed.values()].map((p) => p.prefab.id));
        for (const p of state.prefabs) if (used.has(p.id)) defs += `<symbol id="${p.sym}" viewBox="${p.bbox.map((v) => v.toFixed(1)).join(" ")}">${p.inner}</symbol>`;
        for (const v of new Set(state.variantOf.values())) defs += `<symbol id="${v.sym}" viewBox="${v.bbox.map((n) => n.toFixed(1)).join(" ")}">${v.inner}</symbol>`;
        const levels = [0.15, 0.3, 0.45, 0.6, 0.75, 0.9].filter((l) => Math.abs(l - S.terrain.sea) > 0.04);
        const cont = Terrain.contours(S.terrain, levels).map((c) => `<path class="contour" d="${c.d}"/>`).join("") +
          Terrain.contours(S.terrain, [S.terrain.sea]).map((c) => `<path class="contour sea" d="${c.d}"/>`).join("");
        let cells = "";
        for (const c of S.cells) {
          const [fill, op] = cellFill(c), plot = S.plots.includes(c);
          // the selected building: plots it stands on, or plots it would fit if it stands nowhere yet
          const pl = state.placed.get(c.id), isFocus = !!(pl && pl.prefab.id === state.focus);
          const fits = !isFocus && plot && !pl && focusPrefab() && !placedAnywhere() && CP.candidates(c, [focusPrefab()], state.recipe)[0].ok;
          cells += `<path class="cell${plot ? " plot" : ""}${state.recipe.pins[c.id] ? " pinned" : ""}${state.sel === c.id ? " sel" : ""}${isFocus ? " focus" : ""}${fits ? " fits" : ""}" data-cell="${c.id}" d="${sector(c)}" fill="${fill}" fill-opacity="${op}"/>`;
        }
        // buildings stand upright at their plot, drawn back to front
        const ppu = state.recipe.pxPerUnit;
        const items = [...state.placed.entries()].map(([cid, pl]) => ({ c: S.cells[cid], pl })).sort((a, b) => a.c.frame.y - b.c.frame.y);
        let b = "";
        for (const { c, pl } of items) {
          const p = state.variantOf.get(c.id) || pl.prefab;
          // the Tower is the city's main tower: whatever stands on the centre plot is drawn up to fill it, so it is the tallest thing in the city
          const boost = c.ring === 0 ? Math.max(1, Math.min(3, Math.min(c.frame.width, c.frame.depth * 1.6) * 0.72 / (p.bbox[2] / ppu))) : 1;
          const w = p.bbox[2] / ppu * boost, h = p.bbox[3] / ppu * boost;
          const x = c.frame.x - w / 2, y = c.frame.y * SQUASH - h;
          b += `<ellipse cx="${c.frame.x.toFixed(2)}" cy="${(c.frame.y * SQUASH).toFixed(2)}" rx="${(w * 0.45).toFixed(2)}" ry="${(w * 0.45 * SQUASH).toFixed(2)}" fill="#000" opacity=".35"/>`;
          b += `<use href="#${p.sym}" data-cell="${c.id}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}"${state.sel === c.id || pl.prefab.id === state.focus ? ' style="filter:drop-shadow(0 0 .15px #9fe)"' : ""}/>`;
        }
        svg.innerHTML = `<defs>${defs}</defs><g transform="scale(1 ${SQUASH})"><image href="${terrainImage()}" x="${-E}" y="${-E}" width="${2 * E}" height="${2 * E}" preserveAspectRatio="none"/>${cont}${cells}</g>${b}`;
        if (!state.view) state.view = [-17.5, -17.5 * SQUASH - 4.5, 35, 35 * SQUASH + 5.5];
        svg.setAttribute("viewBox", state.view.join(" "));
        $("legend").innerHTML = Object.entries(ZONE_COLOR).map(([z, c]) => `<span><i style="background:${c}"></i>${ZN[z]}</span>`).join("") + `<span><i style="background:#4f8fb0"></i>water</span>`;
      }

      // zoom + pan
      (function () {
        const svg = $("map"); let drag = null;
        const toUser = (e) => { const r = svg.getBoundingClientRect(), v = state.view, s = Math.max(v[2] / r.width, v[3] / r.height); return [v[0] + (e.clientX - r.left - (r.width - v[2] / s) / 2) * s, v[1] + (e.clientY - r.top - (r.height - v[3] / s) / 2) * s, s]; };
        svg.addEventListener("wheel", (e) => {
          e.preventDefault(); if (!state.view) return;
          const [ux, uy] = toUser(e), k = Math.exp(e.deltaY * 0.0015), v = state.view;
          state.view = [ux - (ux - v[0]) * k, uy - (uy - v[1]) * k, v[2] * k, v[3] * k]; svg.setAttribute("viewBox", state.view.join(" "));
        }, { passive: false });
        svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, v: state.view.slice(), moved: false }; svg.setPointerCapture(e.pointerId); });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return; const [, , s] = toUser(e), dx = (e.clientX - drag.x) * s, dy = (e.clientY - drag.y) * s;
          if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) { drag.moved = true; svg.classList.add("drag"); }
          state.view = [drag.v[0] - dx, drag.v[1] - dy, drag.v[2], drag.v[3]]; svg.setAttribute("viewBox", state.view.join(" "));
        });
        svg.addEventListener("pointerup", (e) => {
          const was = drag; drag = null; svg.classList.remove("drag");
          if (was && !was.moved) {
            const t = document.elementsFromPoint(e.clientX, e.clientY).find((el) => el.dataset && el.dataset.cell != null && (el.tagName === "use" || el.classList.contains("cell")));
            const plotHit = t && (t.tagName === "use" || t.classList.contains("plot"));
            select(plotHit ? +t.dataset.cell : null);
            if (t) openCellBloom(+t.dataset.cell, e);
          }
        });
      })();

      /* ---------- left: controls ---------- */
      function slider(host, label, get, set, min, max, step, fmt) {
        const f = document.createElement("div"); f.className = "f-field";
        const v = get();
        f.innerHTML = `<label class="f-field__label"><span>${label}</span><span class="v">${fmt ? fmt(v) : v}</span></label>`;
        const s = document.createElement("input"); s.type = "range"; s.className = "f-fader"; s.min = min; s.max = max; s.step = step; s.value = v; s.setAttribute("aria-label", label);

        row.append(sv, eco); g.append(nm, row); return g;
      }

      // A small raster preview, not the live map's own giant inline SVG (full-res terrain
      // image + a <symbol> def per building type used): Shelf and Lineage only ever need
      // something recognizable at thumbnail size, never the real drawing back.
      async function rasterizeThumb(svgEl, w, h) {
        const xml = new XMLSerializer().serializeToString(svgEl);
        const url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml;charset=utf-8" }));
        try {
          const img = await new Promise((resolve, reject) => {
            const im = new Image();
            im.onload = () => resolve(im); im.onerror = () => reject(new Error("thumb render failed"));
            im.src = url;
          });
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          const ctx = cv.getContext("2d");
          ctx.fillStyle = "#15171c"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          return cv.toDataURL("image/jpeg", 0.72);
        } finally { URL.revokeObjectURL(url); }
      }

      async function saveCity() {
        const S = state.solved; if (!S || !S.ok) return;
        const placements = [...state.placed.entries()].map(([cid, pl]) => {
          const c = S.cells[cid];
          return { cell: cid, ring: c.ring, j: c.j, zone: c.zone, tile: c.tile.base || c.tile.id, x: +c.frame.x.toFixed(3), y: +c.frame.y.toFixed(3),
            prefab: pl.prefab.id, span: +(pl.prefab.span / state.recipe.pxPerUnit).toFixed(3), height: +(pl.prefab.height / state.recipe.pxPerUnit).toFixed(3), pinned: pl.pinned,
            ...(plotOv(cid) ? { overrides: plotOv(cid) } : {}) };
        });
        const refs = [...new Set([...state.placed.values()].map((pl) => `${pl.prefab.type}:${pl.prefab.id}@${pl.prefab.version}`))];
        const svg = $("map").cloneNode(true);
        svg.setAttribute("viewBox", "-17.5 -15.4 35 27"); svg.removeAttribute("id"); svg.setAttribute("xmlns", NS);
        svg.setAttribute("width", "350"); svg.setAttribute("height", "270");
        let thumb = null;
        try { thumb = await rasterizeThumb(svg, 220, 170); } catch (e) { console.error(e); }
        const id = state.cityId || "city_" + Math.random().toString(36).slice(2, 9);
        const name = state.cityName.trim() || `City ${state.recipe.seed}`;
        // svg: null sheds any full drawing an older save left on this record; City and Ecology
        // always re-render live from `recipe`, so nothing reads it back. thumb is what the
        // shelf (forge-shell.js) actually renders for this card.
        const rec = await world.put({ id, type: "city", name, recipe: { ...state.recipe, placements, extent: Terrain.EXTENT }, seed: String(state.recipe.seed), refs, svg: null, thumb, source: { tool: "Forge City" } });
        ForgeWorld.select(world.worldId, { id: rec.id, type: "city", from: "city" });
        state.cityId = rec.id; state.cityName = rec.name; state.dirty = false;
        $("status").textContent = "saved v" + rec.version;
        if (window.ForgeAnim) window.ForgeAnim.pulse($("status"));
        ForgeShell.refreshShelf && ForgeShell.refreshShelf();
        await fillOpenList(); renderInspector();
      }
      async function fillOpenList() {
        const cities = (await world.list("city")).sort((a, b) => b.updatedAt - a.updatedAt), sel = $("openCity");
        sel.innerHTML = `<option value="">New city</option>` + cities.map((c) => `<option value="${c.id}"${c.id === state.cityId ? " selected" : ""}>${c.name} · v${c.version}</option>`).join("");
        return cities;
      }
      function loadCity(rec) {
        const { placements, extent, ...r } = rec.recipe;
        state.recipe = { ...CP.DEFAULTS, ...r, terrain: { ...Terrain.DEFAULTS, ...(r.terrain || {}) }, rules: r.rules || {}, overrides: r.overrides || {}, plotOverrides: r.plotOverrides || {}, pins: { ...(r.pins || {}) } };
        state.cityId = rec.id; state.cityName = rec.name; state.sel = null; state.dirty = false;
      }

      function touch() { state.dirty = true; $("status").textContent = "unsaved"; }
      function renderAll() { renderControls(); renderPrefabs(); renderMap(); renderInspector(); renderPins(); }

      function resolveAndRender() {
        const run = () => { solve(); renderAll(); };
        if (window.ForgeAnim) window.ForgeAnim.crossfade($("map"), run); else run();
      }
      $("newCity").onclick = () => { state.recipe.seed = Math.floor(Math.random() * 1e6); state.recipe.overrides = {}; state.sel = null; touch(); resolveAndRender(); };
      $("seed").onchange = () => { state.recipe.seed = +$("seed").value >>> 0; state.recipe.overrides = {}; state.sel = null; touch(); resolveAndRender(); };
      $("houses").onchange = () => { state.recipe.houses = $("houses").checked; touch(); resolveAndRender(); };
      $("openCity").onchange = async () => {
        const id = $("openCity").value;
        if (!id) { state.cityId = null; state.cityName = ""; state.recipe = { ...CP.DEFAULTS, seed: Math.floor(Math.random() * 1e6), terrain: { ...Terrain.DEFAULTS }, rules: {}, overrides: {}, plotOverrides: {}, pins: {} }; }
        else loadCity(await world.get(id));
        solve(); renderAll(); $("status").textContent = id ? "" : "unsaved";
      };

      await loadPrefabs();
      ForgeWorld.onSelect((sel, wid) => { if (wid !== world.worldId) return; state.focus = sel ? sel.id : null; renderMap(); renderInspector(); });
      // a building saved from Spire Forge (or any tab) redraws wherever it stands
      ForgeWorld.onChange(async (m) => {
        if (!m || m.kind !== "put" || m.worldId !== world.worldId || (m.type !== "building" && m.type !== "city")) return;
        if (m.type === "building") { await loadPrefabs(); place(); renderAll(); $("status").textContent = "building updated"; }
      });
      const cities = await fillOpenList();
      const want = params.get("city") ? cities.find((c) => c.id === params.get("city")) : cities[0];
      if (want) { loadCity(want); await fillOpenList(); }
      solve();
      if (params.get("plot") != null && state.solved && state.solved.ok && state.solved.cells[+params.get("plot")]) state.sel = +params.get("plot");
      renderAll();
    })();
  </script>
</body>
</html>
