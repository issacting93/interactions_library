<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — Ecology</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../../../shared/look/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/components.css">
<link rel="stylesheet" href="../../../shared/look/theme-forge.css">
<link rel="stylesheet" href="./forge-pages.css">
<style>
  .col-left { flex: 0 1 300px; min-width: 250px; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .col-left > *, .col-right > * { flex-shrink: 0; }
  .col-center { flex: 999 1 560px; min-width: 360px; position: relative; background: #000; overflow: hidden; }
  .col-right { flex: 0 1 340px; min-width: 280px; overflow-y: auto; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  .scenetools { position: absolute; z-index: 3; top: 10px; right: 12px; display: flex; gap: 6px; align-items: center; }
  .scenetools select { max-width: 150px; }
  .scenenote { position: absolute; z-index: 2; right: 12px; bottom: 10px; font-size: 9px; color: var(--ink-2); letter-spacing: .1em; text-transform: uppercase; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .citynote { position: absolute; z-index: 2; left: 12px; top: 10px; max-width: 360px; font-size: 11px; color: var(--ink-2); background: rgba(0,0,0,.6); border: 1px solid var(--line-4); border-radius: var(--r-sm); padding: 8px 10px; }
  .citynote a { color: var(--ink); }
  .landmark3d { margin-bottom: 10px; padding-left: 8px; border-left: 2px solid transparent; }
  .landmark3d.focus { border-left-color: var(--accent); background: var(--lane-sel); }
  .vr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 11px; padding: 6px 0; border-top: 1px solid var(--line-2); }
  .vr small { display: block; font-size: 9px; color: var(--ink-off); }
  .vr a { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; }
  .vr a:hover { color: var(--ink); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="./index.html">Forge</a>
    <div class="crumb"><a class="f-strip__world" id="worldName" href="./index.html" title="All worlds">…</a> &rsaquo; <a href="./city.html" id="cityLink">City</a> &rsaquo; Ecology</div>
    <span class="spacer"></span>
    <select id="citySel" aria-label="City to run" style="max-width:240px"></select>
    <span class="status" id="status"></span>
  </div>
  <div class="body-row">
    <div class="col col-left" id="life"><p class="hint-text">Opening the world…</p></div>
    <div class="col col-center" id="stage">
      <iframe id="scene" title="The world, in World Scene"></iframe>
      <div class="citynote" id="cityNote" hidden></div>
      <div class="scenetools"><select id="sceneStyle" aria-label="Drawn in"></select><button type="button" class="f-btn is-dense" id="sceneFrame">Whole city</button></div>
      <div class="scenenote">drag to turn and tilt · shift-drag to pan · scroll to zoom · click a tower to see what it attracts</div>
    </div>
    <div class="col col-right" id="side"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="../../../shared/look/forge-anim.js"></script>
  <script src="./forge-world.js"></script>
  <script src="./forge-shell.js"></script>
  <script src="../../../shared/engine/creature-record.js"></script>
  <script src="../../../shared/engine/generators/kit-utils.js"></script>
  <script src="../../../shared/engine/generators/spire-generator.js"></script>
  <script src="../../../shared/engine/generators/forge-registry.js"></script>
  <script src="../../../shared/engine/generators/forge-building.js"></script>
  <script src="../../../shared/engine/generators/forge-overrides.js"></script>
  <script src="./forge-scene.js"></script>
  <script>
    /* Forge Ecology: the life in the world. The same 3D world as City (World Scene in a frame, the same
       floor, camera and look), opened on a saved city: the swimmers, the creatures walking its streets,
       and drift round the Forge buildings standing as its towers. The camera is the scene's own: drag to
       turn and tilt, shift-drag to pan, scroll to zoom. What is tuned here (the scene's settings, which
       building a walker keeps to) is kept on the city record, so City and World Scene open it the same. */
    (async function () {
      const params = new URLSearchParams(location.search);
      if (params.get("world")) ForgeWorld.setActiveWorldId(params.get("world"));
      const worldPromise = ForgeWorld.activeWorld();
      if (window.self === window.top) ForgeShell.mount({ active: "ecology", world: worldPromise });
      else document.body.classList.add("embedded");
      const world = await worldPromise;
      const meta = ForgeWorld.listWorlds().find((w) => w.id === world.worldId);
      const $ = (id) => document.getElementById(id);
      $("worldName").textContent = meta ? meta.name : world.worldId;

      const freshRecipe = (seed) => ({ seed, grammar: { pins: { lots: {}, fronts: {} } } });
      const state = { recipe: freshRecipe(7), cityId: null, cityName: "", cityVersion: null, prefabs: [], buildings3d: [], sceneSum: null, variants: [] };
      const status = (t) => { $("status").textContent = t; };

      /* ---------- the world's buildings: the towers, and what each attracts ---------- */
      let kitP = null;
      const getKit = () => kitP || (kitP = ForgeRegistry.loadKit("../../../shared/data/creature-parts.json"));
      async function loadPrefabs() {
        const all = await world.list();
        state.prefabs = all.filter((o) => o.prefab || o.type === "building").map((o) => ({ id: o.id, name: o.name, version: o.version, type: o.type,
          districts: (o.prefab && o.prefab.districts) || [], attracts: (o.prefab && o.prefab.attracts) || [], record: o }));
        state.buildings3d = await ForgeScene.buildings3d(state.prefabs, getKit);
      }
      // drifted species captured to this world: species of their own, kept as their base plus overrides
      async function loadVariants() {
        state.variants = (await world.list("species")).filter((v) => v.recipe && v.recipe.base && v.recipe.$base).sort((a, b) => a.createdAt - b.createdAt);
      }

      /* ---------- the scene ---------- */
      const sceneEl = $("scene"); let sceneReady = false;
      const sceneHost = () => (sceneReady && sceneEl.contentWindow && sceneEl.contentWindow.ForgeCityHost) || null;
      async function quiet(fn) {
        const h = sceneHost(); if (h) h.sleep(true);
        try { return await fn(); } finally { const h2 = sceneHost(); if (h2) h2.sleep(false); }
      }
      // what is tuned here belongs to the city: kept on its record a moment after the last change
      let keepT = null;
      function touch() {
        if (!state.cityId) { status("not kept: no saved city"); return; }
        status("…"); clearTimeout(keepT); keepT = setTimeout(() => keepOnCity().catch((e) => { console.error(e); status("could not keep it"); }), 700);
      }
      async function keepOnCity() {
        const rec = await world.get(state.cityId); if (!rec) return;
        const g = { ...((rec.recipe || {}).grammar || {}) };
        for (const k of ["scene", "homes", "style"]) { if (state.recipe.grammar[k] !== undefined) g[k] = state.recipe.grammar[k]; }
        const saved = await world.put({ id: rec.id, recipe: { ...rec.recipe, grammar: g } });
        state.cityVersion = saved.version; status("kept on " + saved.name);
      }
      const scene = ForgeScene.create({ world, state, host: sceneHost, touch, render: () => render(), status, quiet, live: () => !document.hidden });

      function syncScene() {
        const h = sceneHost(); if (!h) return;
        const g = state.recipe.grammar;
        state.sceneSum = h.setCity({ seed: state.recipe.seed, pins: g.pins, towers: g.towers ?? 3, buildings: state.buildings3d, sites: g.sites || {} });
        if (g.route) h.setRoute(g.route);
        scene.startDrift().then(render);
      }
      function fillStyles() {
        const h = sceneHost(); if (!h) return;
        const want = state.recipe.grammar.style; if (want && want !== h.style()) h.setStyle(want);
        $("sceneStyle").innerHTML = h.styles().map((r) => `<option value="${r.id}"${r.id === h.style() ? " selected" : ""}>${r.name}</option>`).join("");
      }
      $("sceneStyle").onchange = () => { const h = sceneHost(); if (!h) return; h.setStyle($("sceneStyle").value); state.recipe.grammar.style = $("sceneStyle").value; touch(); };
      $("sceneFrame").onclick = () => { const h = sceneHost(); if (h) h.frame(); };
      window.addEventListener("message", (e) => {
        if (e.source !== sceneEl.contentWindow || !e.data || !e.data.forgeCity) return;
        const h = sceneHost(), m = e.data;
        if (m.forgeCity === "ready") { sceneReady = true; syncScene(); fillStyles(); scene.applyScene(); scene.loadGround(); render(); }
        // a click on a tower shows what that building attracts; a block is City's business, so it is let go
        else if (m.forgeCity === "tower") { state.focusLandmark = m.key || null; render(); const row = document.querySelector(`.landmark3d[data-id="${m.key}"]`); if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
        else if (m.forgeCity === "pick" && h) h.highlight(null);
      });

      /* ---------- the panels: the life on the left; drift, captures and the camera on the right ---------- */
      function render() {
        const h = sceneHost(), life = $("life"), side = $("side");
        if (!h) return;
        const lt = life.scrollTop, st = side.scrollTop;
        life.innerHTML = ""; side.innerHTML = "";
        for (const g of scene.lifeGroups(h)) life.appendChild(g);
        life.firstChild.style.borderTop = "0"; life.firstChild.style.paddingTop = "0";
        side.appendChild(scene.driftGroup(h));
        side.appendChild(variantsGroup());
        for (const g of scene.cameraGroups(h, state.cityId ? { world: world.worldId, city: state.cityId } : {})) side.appendChild(g);
        side.firstChild.style.borderTop = "0"; side.firstChild.style.paddingTop = "0";
        life.scrollTop = lt; side.scrollTop = st;
      }
      function variantsGroup() {
        const g = document.createElement("div"); g.className = "group"; g.id = "variants";
        g.innerHTML = `<div class="glabel">Captured variants</div>`;
        if (!state.variants.length) { g.insertAdjacentHTML("beforeend", `<p class="hint-text">Capture a drifted species above and it is saved to this world as a species of its own.</p>`); return g; }
        for (const v of state.variants) {
          const row = document.createElement("div"); row.className = "vr";
          const tx = document.createElement("div"); tx.textContent = v.name;
          tx.insertAdjacentHTML("beforeend", `<small>gen ${v.recipe.generation || 1} · from ${v.recipe.base}${v.recipe.$overrides ? ` · ${ForgeOverrides.count(v.recipe.$overrides)} changed` : ""}</small>`);
          const a = document.createElement("a"); a.href = "./rig.html?variant=" + encodeURIComponent(v.id); a.textContent = "Rig";
          row.append(tx, a); g.appendChild(row);
        }
        g.insertAdjacentHTML("beforeend", `<p class="hint-text">The 3D world's swimmers are its own species; a captured variant does not swim in it yet.</p>`);
        return g;
      }

      /* ---------- which city ---------- */
      function cityNote() {
        const n = $("cityNote");
        n.hidden = !!state.cityId;
        if (!state.cityId) n.innerHTML = `No saved city yet, so this is the scene's own. Nothing tuned here is kept. <a href="./city.html">Build and save a city</a> to give the life a home.`;
        $("cityLink").href = state.cityId ? "./city.html?city=" + encodeURIComponent(state.cityId) : "./city.html";
      }
      function openCity(rec) {
        if (rec) {
          const r = rec.recipe || {}, g = r.grammar || {};
          state.recipe = { seed: r.seed ?? 7, grammar: { pins: { lots: {}, fronts: {}, ...(g.pins || {}) }, ...JSON.parse(JSON.stringify({ ...g, pins: undefined })) } };
          state.cityId = rec.id; state.cityName = rec.name; state.cityVersion = rec.version;
        } else { state.recipe = freshRecipe(7); state.cityId = null; state.cityName = ""; state.cityVersion = null; }
        state.attracts = {}; state.driftSuggested = false; state.focusLandmark = null;
        cityNote();
      }
      async function fillCities() {
        const cities = (await world.list("city")).sort((a, b) => b.updatedAt - a.updatedAt);
        $("citySel").innerHTML = cities.length ? cities.map((c) => `<option value="${c.id}"${c.id === state.cityId ? " selected" : ""}>${c.name}</option>`).join("") : `<option value="">No saved cities</option>`;
        $("citySel").disabled = !cities.length;
        return cities;
      }
      $("citySel").onchange = async () => {
        const rec = await world.get($("citySel").value); openCity(rec);
        if (sceneReady) { syncScene(); fillStyles(); scene.applyScene(); scene.applyGround(); render(); }
        status(rec ? rec.name : "");
      };

      // the world changing elsewhere: a building saved, a city saved in City, a creature saved in the Bestiary
      ForgeWorld.onChange(async (m) => {
        if (!m || m.kind !== "put" || m.worldId !== world.worldId) return;
        if (m.type === "building") { clearTimeout(state.bT); state.bT = setTimeout(async () => { await loadPrefabs(); syncScene(); status("building updated"); }, 400); }
        else if (m.type === "species") { await loadVariants(); if (!scene.loadingGround()) scene.loadGround(); else render(); }
        else if (m.type === "city") {
          await fillCities();
          if (m.id === state.cityId && m.version !== state.cityVersion) { openCity(await world.get(m.id)); if (sceneReady) { syncScene(); fillStyles(); scene.applyScene(); scene.applyGround(); render(); } status("city updated"); }
        }
      });

      await Promise.all([loadPrefabs(), loadVariants()]);
      const cities = await fillCities();
      const want = (params.get("city") && cities.find((c) => c.id === params.get("city"))) || cities[0] || null;
      openCity(want); await fillCities();
      ForgeScene.boot(sceneEl, state.recipe.seed);
    })();
  </script>
</body>
</html>
