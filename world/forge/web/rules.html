<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge — Rule sets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../../../shared/look/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/tokens.css">
<link rel="stylesheet" href="../../../shared/look/forge-ds/components.css">
<link rel="stylesheet" href="../../../shared/look/theme-forge.css">
<link rel="stylesheet" href="./forge-pages.css">
<style>
  .col-left { flex: 0 1 220px; min-width: 180px; padding: 14px 0; }
  .col-center { flex: 999 1 560px; min-width: 380px; }
  .col-right { flex: 0 1 340px; min-width: 280px; }
  .newrow { display: flex; gap: 6px; padding: 10px 16px; }
  .newrow input { flex: 1; min-width: 0; }
  .namebar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .namebar input { font-size: 14px; flex: 1 1 220px; }
  .fam { display: flex; flex-direction: column; gap: 6px; }
  .fam h3 { margin: 0; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
  .rule { display: grid; grid-template-columns: 96px 92px minmax(0, 1fr) 110px 40px; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line-2); border-radius: var(--r-sm); }
  .rule.pinned { border-color: var(--line-4); background: var(--lane-sel); }
  .rule .pos { font-size: 11px; }
  .rule .pv { width: 40px; height: 40px; border: 1px solid var(--line-3); border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; padding: 3px; box-sizing: border-box; }
  .rule .pv svg { width: 100%; height: 100%; }
  .rule .sc { display: flex; flex-direction: column; gap: 2px; font-size: 9px; color: var(--ink-2); }
  .module { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .seeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .seeds .cell { aspect-ratio: 2 / 3; border: 1px solid var(--line-3); border-radius: var(--r-sm); overflow: hidden; background: var(--ground); position: relative; }
  .seeds .cell svg { width: 100%; height: 100%; display: block; }
  .seeds .cell span { position: absolute; left: 4px; bottom: 3px; font-size: 8px; color: var(--ink-2); letter-spacing: .08em; }
  .checks { display: flex; flex-direction: column; gap: 6px; }
  .checks .c { font-size: 11px; line-height: 1.45; padding: 6px 8px; border-left: 2px solid var(--line-4); color: var(--ink-2); }
  .checks .c.error { border-left-color: var(--rec); color: var(--ink); }
  .checks .c.warn { border-left-color: var(--accent); }
  .checks .c.info { border-left-color: var(--loop); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="./index.html">Forge</a>
    <div class="crumb"><a class="f-strip__world" id="worldName" href="./index.html" title="All worlds">…</a> &rsaquo; <a href="./bench.html?gen=building.spire">Bench</a> &rsaquo; Rule sets</div>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
  </div>

  <div class="body-row">
    <div class="col col-left">
      <div class="rail-label">Rule sets</div>
      <div id="setList"></div>
      <div class="newrow">
        <input type="text" id="newName" placeholder="Name a new set" aria-label="New rule set name">
        <button type="button" class="f-btn" id="newBtn">New</button>
      </div>
      <p class="hint-text" style="padding:0 16px">A rule set pins some of a tower's bay rules. Unpinned rules stay random per seed. Pick one as the Tower's "Rule set" input in Bench.</p>
    </div>

    <div class="col col-center col-pad" id="editor"></div>

    <div class="col col-right">
      <div class="f-field">
        <label for="tpl" class="f-field__label"><span>Test on</span><span class="v" id="seedLabel"></span></label>
        <select id="tpl"><option>lighthouse</option><option>spire</option><option>hive</option><option>shrine</option><option>rotunda</option></select>
      </div>
      <div class="seeds" id="seeds"></div>
      <div class="rowbtns"><button type="button" id="reseed">New seeds</button></div>
      <div class="group"><div class="glabel">Checks</div><div class="checks" id="checks"></div></div>
      <div class="group"><div class="glabel">Reached by template</div><div id="usage" class="hint-text"></div></div>
      <div class="rowbtns">
        <button type="button" id="saveBtn" class="f-btn is-go">Save rule set</button>
        <a class="f-btn" id="benchLink" href="./bench.html?gen=building.spire" style="text-decoration:none;text-align:center;flex:1">Use in Bench</a>
      </div>
    </div>
  </div>

  <script src="../../../shared/engine/creature-catalog.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="../../../shared/look/forge-anim.js"></script>
  <script src="./forge-world.js"></script>
  <script src="./forge-shell.js"></script>
  <script src="../../../shared/engine/generators/kit-utils.js"></script>
  <script src="../../../shared/engine/generators/spire-generator.js"></script>
  <script src="../../../shared/engine/generators/rule-sets.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      if (params.get("world")) ForgeWorld.setActiveWorldId(params.get("world"));
      const worldPromise = ForgeWorld.activeWorld();
      if (window.self === window.top) ForgeShell.mount({ active: "bench", world: worldPromise });
      else document.body.classList.add("embedded");
      const world = await worldPromise;
      const meta = ForgeWorld.listWorlds().find((w) => w.id === world.worldId);
      document.getElementById("worldName").textContent = meta ? meta.name : world.worldId;
      const $ = (id) => document.getElementById(id);

      const parts = ForgeKit.tagRoles(await (await fetch("../../../shared/data/creature-parts.json")).json());
      const kit = { parts, byId: Object.fromEntries(parts.map((p) => [p.id, p])), pool: ForgeKit.pools(parts, null) };
      const KEYS = RuleSets.KEYS();
      const FAMILIES = [...new Set(KEYS.map((k) => k.family))];
      await CreatureCatalog.load("../../../shared/data/creature-catalog.json");
      const speciesName = (id) => CreatureCatalog.sheetName(id);

      const state = { sets: [], cur: null, seeds: [11, 23, 37, 41, 53, 67], dirty: false };
      const newId = () => "ruleset_" + Math.random().toString(36).slice(2, 9);

      async function loadSets() {
        state.sets = (await world.list("ruleset")).sort((a, b) => b.updatedAt - a.updatedAt);
        if (!state.sets.length) {
          // a starting set so the page isn't empty: lamps in every centre bay, segments as pilasters
          const r = RuleSets.blank();
          for (const k of KEYS) if (k.position === "centre bay") r.rules[k.key] = { mode: "role", role: "lamp", scale: 1.15 };
          r.rules["base.pilaster"] = { mode: "role", role: "segment" };
          state.cur = { id: newId(), name: "Lamps at the centre", recipe: r, version: 0 };
          state.dirty = true;
        } else if (!state.cur) {
          // ?set=<id> (from the selection bar or Lineage) opens that set
          const want = params.get("set") && state.sets.find((x) => x.id === params.get("set"));
          state.cur = JSON.parse(JSON.stringify(want || state.sets[0]));
        }
      }

      function renderList() {
        const list = $("setList"); list.innerHTML = "";
        const rows = state.sets.slice();
        if (state.cur && !rows.some((s) => s.id === state.cur.id)) rows.unshift(state.cur);
        for (const s of rows) {
          const row = document.createElement("div");
          const n = Object.values(s.recipe.rules || {}).filter((r) => r.mode && r.mode !== "random").length;
          row.className = "species-row" + (state.cur && s.id === state.cur.id ? " sel" : "");
          row.innerHTML = `<span>${s.name}</span><span class="n">${n} pinned${s.version ? "" : " · new"}</span>`;
          row.onclick = () => { state.cur = JSON.parse(JSON.stringify(s)); state.dirty = false; renderAll(); };
          list.appendChild(row);
        }
      }

      function partPreview(p) {
        if (!p) return "";
        const m = Math.max(p.w, p.h) / 2 + 4;
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-m} ${-m} ${2 * m} ${2 * m}">${p.defs ? `<defs>${p.defs}</defs>` : ""}${p.svg}</svg>`;
      }
      function touch() { state.dirty = true; $("status").textContent = "unsaved"; renderTests(); renderChecks(); renderList(); }

      function renderEditor() {
        const ed = $("editor"), rs = state.cur.recipe;
        ed.innerHTML = "";
        const bar = document.createElement("div"); bar.className = "namebar";
        const nm = document.createElement("input"); nm.type = "text"; nm.value = state.cur.name; nm.setAttribute("aria-label", "Rule set name");
        nm.oninput = () => { state.cur.name = nm.value; touch(); };
        const clear = document.createElement("button"); clear.type = "button"; clear.className = "f-btn"; clear.textContent = "Unpin all";
        clear.onclick = () => { rs.rules = {}; touch(); renderEditor(); };
        bar.append(nm, clear); ed.appendChild(bar);

        // bay module
        const mod = document.createElement("div"); mod.className = "module";
        for (const [k, label, min, max, step] of [["width", "Bay width", 16, 90, 1], ["size", "Opening", 0.4, 1.2, 0.02]]) {
          const f = document.createElement("div"); f.className = "f-field";
          const on = rs[k] != null;
          f.innerHTML = `<label class="f-field__label"><span>${label}</span><span class="v">${on ? rs[k] : "per building"}</span></label>`;
          const row = document.createElement("div"); row.style.display = "flex"; row.style.gap = "8px"; row.style.alignItems = "center";
          const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = on; cb.setAttribute("aria-label", "Pin " + label);
          const sl = document.createElement("input"); sl.type = "range"; sl.className = "f-fader"; sl.min = min; sl.max = max; sl.step = step; sl.value = on ? rs[k] : (k === "width" ? 34 : 0.8); sl.disabled = !on; sl.setAttribute("aria-label", label);
          cb.onchange = () => { rs[k] = cb.checked ? +sl.value : null; sl.disabled = !cb.checked; f.querySelector("label span:last-child").textContent = cb.checked ? sl.value : "per building"; touch(); };
          sl.oninput = () => { rs[k] = +sl.value; f.querySelector("label span:last-child").textContent = sl.value; };
          sl.onchange = touch;
          row.append(cb, sl); f.appendChild(row); mod.appendChild(f);
        }
        ed.appendChild(mod);

        for (const fam of FAMILIES) {
          const box = document.createElement("div"); box.className = "fam";
          box.innerHTML = `<h3>${fam}</h3>`;
          for (const k of KEYS.filter((x) => x.family === fam)) box.appendChild(ruleRow(k, rs));
          ed.appendChild(box);
        }
      }

      function ruleRow(k, rs) {
        const r = rs.rules[k.key] || { mode: "random" };
        const row = document.createElement("div"); row.className = "rule" + (r.mode !== "random" ? " pinned" : "");
        const pos = document.createElement("span"); pos.className = "pos"; pos.textContent = k.position;
        const mode = document.createElement("select"); mode.setAttribute("aria-label", `${k.family} ${k.position} mode`);
        for (const [v, l] of [["random", "Random"], ["role", "Role"], ["part", "Part"], ["off", "Off"]]) { const o = document.createElement("option"); o.value = v; o.textContent = l; o.selected = r.mode === v; mode.appendChild(o); }
        mode.onchange = () => {
          if (mode.value === "random") delete rs.rules[k.key];
          else rs.rules[k.key] = { mode: mode.value, role: r.role || (k.pilaster ? "segment" : "lamp"), part: r.part || null, scale: r.scale ?? 1 };
          if (mode.value === "part" && !rs.rules[k.key].part) rs.rules[k.key].part = (RuleSets.eligible(kit.pool, k.pilaster ? "segment" : "lamp", k.pilaster)[0] || {}).id || null;
          touch(); renderEditor();
        };
        const detail = document.createElement("div");
        const pv = document.createElement("div"); pv.className = "pv";
        if (r.mode === "role") {
          const sel = document.createElement("select"); sel.setAttribute("aria-label", "Role"); sel.style.width = "100%";
          for (const role of k.pilaster ? RuleSets.PIL_ROLES : RuleSets.BAY_ROLES) { const n = RuleSets.eligible(kit.pool, role, k.pilaster).length; const o = document.createElement("option"); o.value = role; o.textContent = `${role} · ${n}`; o.selected = r.role === role; sel.appendChild(o); }
          sel.onchange = () => { rs.rules[k.key].role = sel.value; touch(); renderEditor(); };
          detail.appendChild(sel);
          const ex = RuleSets.eligible(kit.pool, r.role, k.pilaster)[0]; pv.innerHTML = partPreview(ex);
        } else if (r.mode === "part") {
          const sel = document.createElement("select"); sel.setAttribute("aria-label", "Part"); sel.style.width = "100%";
          const roles = k.pilaster ? RuleSets.PIL_ROLES : RuleSets.BAY_ROLES, seen = new Set();
          for (const role of roles) {
            const og = document.createElement("optgroup"); og.label = role;
            for (const p of RuleSets.eligible(kit.pool, role, k.pilaster)) { if (seen.has(p.id)) continue; seen.add(p.id); const o = document.createElement("option"); o.value = p.id; o.textContent = `${CreatureCatalog.partName(p.id)} · ${p.id}`; o.selected = r.part === p.id; og.appendChild(o); }
            if (og.children.length) sel.appendChild(og);
          }
          sel.onchange = () => { rs.rules[k.key].part = sel.value; touch(); renderEditor(); };
          detail.appendChild(sel); pv.innerHTML = partPreview(kit.byId[r.part]);
        } else {
          detail.innerHTML = `<span class="hint-text">${r.mode === "off" ? "left empty" : "rolled per building"}</span>`;
        }
        const sc = document.createElement("div"); sc.className = "sc";
        if (!k.pilaster && (r.mode === "role" || r.mode === "part")) {
          sc.innerHTML = `<span>scale ${(+r.scale || 1).toFixed(2)}</span>`;
          const s = document.createElement("input"); s.type = "range"; s.min = 0.5; s.max = 1.6; s.step = 0.05; s.value = r.scale || 1; s.setAttribute("aria-label", "Scale");
          s.oninput = () => { rs.rules[k.key].scale = +s.value; sc.firstChild.textContent = "scale " + (+s.value).toFixed(2); };
          s.onchange = touch; sc.appendChild(s);
        }
        row.append(pos, mode, detail, sc, pv);
        return row;
      }

      function renderTests() {
        const tpl = $("tpl").value, rs = state.cur.recipe, box = $("seeds");
        box.innerHTML = "";
        for (const seed of state.seeds) {
          const g = RuleSets.apply(SpireGenerator.newGenome(tpl, seed, kit.pool), rs, kit.pool, seed);
          const res = SpireGenerator.generate(g, kit.byId, {});
          const c = document.createElement("div"); c.className = "cell"; c.innerHTML = res.svg + `<span>${seed}</span>`;
          box.appendChild(c);
        }
        $("seedLabel").textContent = `${state.seeds.length} seeds`;
      }
      function renderChecks() {
        const rs = state.cur.recipe, list = RuleSets.check(rs, kit);
        const used = RuleSets.usage(rs, kit, ["lighthouse", "spire", "hive", "shrine", "rotunda"], state.seeds.slice(0, 3));
        const pinned = Object.entries(rs.rules).filter(([, r]) => r.mode === "role" || r.mode === "part").map(([k]) => k);
        for (const key of pinned) {
          const never = Object.entries(used).filter(([, set]) => !set.has(key)).map(([t]) => t);
          if (never.length === 5) {
            const k = KEYS.find((x) => x.key === key);
            list.push({ level: "warn", key, text: `${k.family} · ${k.position} never appears in any template on these seeds.` });
          }
        }
        $("checks").innerHTML = list.length ? list.map((c) => `<div class="c ${c.level}">${c.text}</div>`).join("") : `<div class="c info">No problems on ${state.seeds.length} seeds.</div>`;
        $("usage").innerHTML = pinned.length ? Object.entries(used).map(([t, set]) => `${t}: ${pinned.filter((k) => set.has(k)).length} of ${pinned.length} pinned rules${set.has("__bays_off") ? " (bays off on some seeds)" : ""}`).join("<br>") : "Nothing pinned yet.";
      }

      $("tpl").onchange = renderTests;
      $("reseed").onclick = () => { state.seeds = state.seeds.map(() => Math.floor(Math.random() * 1e9)); renderTests(); renderChecks(); };
      $("newBtn").onclick = () => {
        const name = $("newName").value.trim() || "Untitled rules";
        state.cur = { id: newId(), name, recipe: RuleSets.blank(), version: 0 }; $("newName").value = "";
        touch(); renderAll();
      };
      $("saveBtn").onclick = async () => {
        const rs = state.cur.recipe;
        const refs = Object.values(rs.rules).filter((r) => r.mode === "part" && r.part).map((r) => "part:" + r.part);
        const rec = await world.put({ id: state.cur.id, type: "ruleset", name: state.cur.name, recipe: rs, refs, source: { tool: "Forge Rules" } });
        state.cur = JSON.parse(JSON.stringify(rec)); state.dirty = false; $("status").textContent = "saved v" + rec.version;
        ForgeWorld.select(world.worldId, { id: rec.id, type: "ruleset", from: "rules" });
        await loadSets(); renderList();
        ForgeShell.refreshShelf && ForgeShell.refreshShelf();
      };

      function renderAll() { renderList(); renderEditor(); renderTests(); renderChecks(); $("status").textContent = state.dirty ? "unsaved" : ""; }
      await loadSets();
      renderAll();
    })();
  </script>
</body>
</html>
