<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<style>
/* Specimen: one creature of the tank at a time, swimming in place under a camera that rides with it. The tank's own creatures,
   sim and WebGL look (ecology-species / ecology-sim / ecology-render), run on the entity world (eco-core): the creature is an
   entity, the page is three systems and a view. TAPE 08: hairlines on warm charcoal, mono readouts, colour only as a signal. */
:root { --g: #0d0a14; --pn: rgba(29,29,32,.92); --sel: #232327; --ink: #ECE8DE; --ink2: #8C8981; --off: #4a4844;
  --l1: rgba(236,232,222,.07); --l2: rgba(236,232,222,.10); --l3: rgba(236,232,222,.14); --l4: rgba(236,232,222,.16);
  --acc: #E8B04A; --rec: #FF4D5E; --loop: #5BE39A; --disp: 'Martian Mono', 'IBM Plex Mono', monospace; --ui: 'IBM Plex Mono', ui-monospace, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px)); --gutr: max(16px, env(safe-area-inset-right, 0px)); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--g); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
[hidden] { display: none !important; }
.micro { font: 400 9px var(--ui); letter-spacing: .26em; text-transform: uppercase; color: var(--ink2); }
/* the plate: which one, what it is */
.plate { position: fixed; left: var(--gut); top: calc(16px + var(--st)); width: min(380px, calc(100vw - 32px)); display: grid; gap: 10px; pointer-events: none; }
.plate .ix { display: flex; align-items: baseline; gap: 12px; }
.plate .ix b { font: 200 34px/1 var(--disp); color: var(--acc); padding-bottom: 3px; border-bottom: 2px solid var(--acc); font-variant-numeric: tabular-nums; }
.plate .ix i { font: 300 13px var(--disp); font-style: normal; color: var(--ink2); }
.plate h1 { margin: 0; font: 400 16px/1.25 var(--disp); letter-spacing: .1em; text-transform: uppercase; }
.plate .mood { color: var(--ink); }
.plate p { margin: 0; font: 400 11px/1.65 var(--ui); color: var(--ink2); max-width: 44ch; }
.plate dl { display: grid; grid-template-columns: 84px 1fr; gap: 3px 12px; margin: 2px 0 0; font: 400 10px/1.6 var(--ui); }
.plate dt { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink2); padding-top: 1px; } .plate dd { margin: 0; } .plate dd.thr { color: var(--rec); } .plate dd.none { color: var(--off); }
/* live readouts, top right */
.ro { position: fixed; right: var(--gutr); top: calc(16px + var(--st)); display: grid; grid-template-columns: repeat(3, auto); gap: 4px 22px; text-align: right; pointer-events: none; }
.ro div { display: grid; gap: 4px; } .ro b { font: 300 20px/1 var(--disp); font-variant-numeric: tabular-nums; } .ro b small { font-size: 10px; color: var(--ink2); margin-left: 3px; }
.ro .sys { grid-column: 1 / -1; margin-top: 6px; }
/* hide the controls: everything but the creature (and this button) goes; the creature is framed in the whole screen */
#bare { position: fixed; right: var(--gutr); top: calc(98px + var(--st)); width: 44px; min-height: 44px; padding: 0; display: grid; place-items: center; color: var(--ink2); border-color: var(--l3); z-index: 5; }
#bare svg { width: 16px; height: 16px; } #bare .off { display: none; }
body.bare .plate, body.bare .ro, body.bare .rack, body.bare #des { display: none !important; }
body.bare #bare { top: calc(16px + var(--st)); opacity: .5; } body.bare #bare:hover, body.bare #bare:focus-visible { opacity: 1; }
body.bare #bare .on { display: none; } body.bare #bare .off { display: block; }
/* the rack */
.rack { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px var(--gutr) calc(12px + var(--sb)) var(--gut); background: var(--pn); border-top: 1px solid var(--l2); display: grid; gap: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; } .chips::-webkit-scrollbar { display: none; }
button { font: 600 10px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink); background: none; border: 1px solid var(--l4); border-radius: 10px; min-height: 44px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
button:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }
.chips button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-color: var(--l2); color: var(--ink2); letter-spacing: .12em; font-weight: 500; }
.chips button i { font: 300 10px var(--disp); font-style: normal; color: var(--off); letter-spacing: 0; }
.chips button[aria-pressed="true"] { background: var(--sel); border-color: var(--acc); color: var(--ink); } .chips button[aria-pressed="true"] i { color: var(--acc); }
.row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.grp { display: inline-flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--l3); border-radius: 12px; padding: 2px; gap: 2px; }
.seg button { border: 1px solid transparent; min-height: 38px; padding: 0 12px; color: var(--ink2); border-radius: 9px; }
.seg button[aria-pressed="true"] { background: var(--acc); color: #161618; }
.step { width: 44px; padding: 0; display: inline-grid; place-items: center; } .step svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.3; }
.des { display: grid; gap: 8px; padding-top: 8px; border-top: 1px solid var(--l1); }
.des textarea { width: 100%; min-height: 76px; background: transparent; color: var(--ink); border: 1px solid var(--l3); border-radius: 10px; padding: 8px 10px; font: 400 11px/1.5 'IBM Plex Mono', ui-monospace, monospace; resize: vertical; }
.des textarea:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }
#des-say.bad { color: var(--rec); }
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--l1); }
.tabs button { border: 0; border-bottom: 1px solid transparent; border-radius: 0; padding: 0 2px; min-height: 36px; color: var(--ink2); letter-spacing: .22em; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }
.row[hidden] { display: none; }
@media (max-width: 720px) { .row[data-tab] { max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; } }   /* on a phone the Look tab's controls scroll, so the creature stays in view */
.pal { display: inline-flex; gap: 6px; } .pal label { display: grid; gap: 4px; justify-items: center; font: 400 8px/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); }
.pal input { appearance: none; -webkit-appearance: none; width: 44px; height: 38px; padding: 0; border: 1px solid var(--l4); border-radius: 10px; background: none; cursor: pointer; }
.pal input::-webkit-color-swatch-wrapper { padding: 3px; } .pal input::-webkit-color-swatch { border: 0; border-radius: 6px; } .pal input::-moz-color-swatch { border: 0; border-radius: 6px; }
.sl { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; } .sl b { font: 300 13px var(--disp); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; } .sl small { font-size: 9px; color: var(--ink2); margin-left: -5px; }
.sl input { appearance: none; -webkit-appearance: none; width: 132px; height: 44px; background: linear-gradient(rgba(236,232,222,.22), rgba(236,232,222,.22)) center / 100% 1px no-repeat; cursor: pointer; }
.sl input::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 16px; border-radius: 3px; background: var(--ink); } .sl input::-moz-range-thumb { width: 6px; height: 16px; border: 0; border-radius: 3px; background: var(--ink); }
.sl input:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; } .row.off .sl { opacity: .3; pointer-events: none; }
.pal input:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }
#look-say { color: var(--ink2); } .row.off .grp:not(.keep), .row.off .pal { opacity: .3; pointer-events: none; }
#orbit[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
#auto[aria-pressed="true"] { border-color: var(--loop); color: var(--loop); }
.sp { flex: 1; }
/* the Shape tab: the creature's drawing laid flat, to pick a part on; and its controls */
.pmap { position: fixed; right: var(--gutr); top: calc(154px + var(--st)); width: min(230px, 34vw); display: grid; gap: 8px; padding: 10px; background: var(--pn); border: 1px solid var(--l2); border-radius: 12px; z-index: 4; }
.pmap canvas { position: static; inset: auto; width: 100%; height: auto; aspect-ratio: 1; max-height: 42vh; cursor: crosshair; touch-action: manipulation; }
.pmap [data-cap] { letter-spacing: .1em; line-height: 1.6; text-transform: none; }
body.bare .pmap { display: none !important; }
.sl.dim { opacity: .3; pointer-events: none; }
#sh-whole { min-width: 15em; letter-spacing: .08em; text-transform: none; } #sh-whole[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); letter-spacing: .2em; text-transform: uppercase; }
#sh-say { color: var(--ink2); letter-spacing: .1em; text-transform: none; } #shape-row .seg button { letter-spacing: .14em; }
@media (max-width: 720px) { .ro { grid-template-columns: repeat(3, auto); top: auto; bottom: calc(100% ); position: absolute; right: var(--gutr); padding-bottom: 12px; } .ro b { font-size: 15px; } .ro .sys { display: none; }
  .pmap { width: 124px; padding: 6px; } .pmap [data-cap] { display: none; }
  .plate p { display: none; } .plate h1 { font-size: 14px; } .plate .ix b { font-size: 26px; } .grp .micro { display: none; } .seg button { padding: 0 9px; letter-spacing: .12em; } }
</style></head>
<body>
<canvas id="cv"></canvas>
<section class="plate" aria-live="polite">
  <div class="ix"><b id="ix">01</b><i id="of">/ 41</i><span class="micro" id="tier">Grazer</span></div>
  <h1 id="name">—</h1>
  <div class="micro mood" id="mood"></div>
  <p id="text"></p>
  <dl><dt>Eats</dt><dd id="eats"></dd><dt>Hunted by</dt><dd id="by" class="thr"></dd><dt id="solid-k" hidden>Solid</dt><dd id="solid" hidden></dd></dl>
</section>
<button type="button" id="bare" aria-label="Hide controls (H)" aria-pressed="false" title="Hide controls (H)"><svg class="on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><svg class="off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/><path d="M2.5 13.5l11-11"/></svg></button>
<aside class="pmap" id="pmap" aria-label="Parts" hidden><span class="micro">Parts</span><canvas></canvas><span class="micro" data-cap></span></aside>
<div class="rack">
  <div class="ro" aria-hidden="true">
    <div><b><span id="r-len">0</span><small>u</small></b><span class="micro">Length</span></div>
    <div><b><span id="r-spd">0.0</span><small>len/s</small></b><span class="micro">Speed</span></div>
    <div><b><span id="r-dep">0</span><small>%</small></b><span class="micro">Depth</span></div>
    <div class="sys micro" id="r-sys"></div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Creatures"></div>
  <div class="tabs" role="tablist" aria-label="Controls"><button role="tab" data-t="creature" aria-selected="true">Creature</button><button role="tab" data-t="look" aria-selected="false">Look</button><button role="tab" data-t="shape" aria-selected="false">Shape</button><button role="tab" data-t="view" aria-selected="false">View</button></div>
  <div class="row" data-tab="creature">
    <button class="step" id="prev" aria-label="Previous creature"><svg viewBox="0 0 12 12"><path d="M8 1 L3 6 L8 11"/></svg></button>
    <button class="step" id="next" aria-label="Next creature"><svg viewBox="0 0 12 12"><path d="M4 1 L9 6 L4 11"/></svg></button>
    <span class="grp"><span class="micro">Company</span><span class="seg" id="company"><button data-v="alone">Alone</button><button data-v="school">School</button></span></span>
    <span id="made-switches" style="display: contents"></span>
    <span class="grp" id="legs-grp" hidden><span class="micro">Legs from</span><span class="seg" id="legs"><button data-v="pincer">Pincer</button><button data-v="strider">Strider</button><button data-v="puffer">Puffer</button><button data-v="centiwyrm">Centiwyrm</button><button data-v="qilin">Qilin</button><button data-v="stalker">Stalker</button><button data-v="raptor">Raptor</button><button data-v="reaper">Reaper</button><button data-v="sickle">Sickle</button><button data-v="stilt">Stilt</button><button data-v="grasper">Grasper</button></span></span>
    <span class="grp" id="body-grp" hidden><span class="micro">Body</span><span class="seg" id="body"><button data-v="serpent">Serpent</button><button data-v="wraith">Wraith</button></span></span>
    <span class="grp" id="des-grp" hidden><button id="des-open" aria-expanded="false">Design</button></span>
    <span class="sp"></span>
    <button id="auto" aria-pressed="false">Auto</button>
  </div>
  <div class="row" data-tab="look" id="look-row" hidden>
    <span class="grp keep"><span class="micro">Core</span><span class="seg" id="core"><button data-v="0">Lines</button><button data-v="1">Solid</button></span></span>
    <span class="grp keep"><span class="micro">Detail</span><span class="seg" id="detail"><button data-v="full">Full</button><button data-v="light">Light</button></span></span>
    <span class="grp"><span class="micro">Material</span><span class="seg" id="mat"><button data-v="own">Own</button><button data-v="plain">Plain</button><button data-v="skin">Skin</button><button data-v="glass">Glass</button><button data-v="ember">Ember</button><button data-v="shell">Shell</button><button data-v="golem">Golem</button></span></span>
    <label class="sl"><span class="micro" id="vein-l">Veins</span><input type="range" id="vein" min="0" max="1" step="0.05" aria-label="How much vein"><b id="vein-v">60</b><small>%</small></label>
    <label class="sl"><span class="micro">Vein size</span><input type="range" id="vsize" min="0.25" max="3" step="0.05" aria-label="How big the veins are"><b id="vsize-v">100</b><small>%</small></label><button id="vshuffle">Shuffle veins</button>
    <label class="sl"><span class="micro">Opacity</span><input type="range" id="opac" min="0.05" max="1" step="0.05" aria-label="How solid"><b id="opac-v">100</b><small>%</small></label>
    <label class="sl"><span class="micro" id="emis-l">Emissive</span><input type="range" id="emis" min="0" max="1" step="0.05" aria-label="How much it glows of itself"><b id="emis-v">0</b><small>%</small></label>
    <label class="sl"><span class="micro">Fresnel</span><input type="range" id="fres" min="0" max="1" step="0.05" aria-label="How much rim light"><b id="fres-v">50</b><small>%</small></label>

      <label class="sl"><span class="micro">Stone size</span><input type="range" id="grain" min="0.3" max="3" step="0.05" aria-label="How big the stones are, as a share of the design"><b id="grain-v">100</b><small>%</small></label>
      <label class="sl"><span class="micro">Roughness</span><input type="range" id="rough" min="0" max="1" step="0.05" aria-label="How rough the rock is"><b id="rough-v">60</b><small>%</small></label>
      <label class="sl"><span class="micro">Lumps</span><input type="range" id="lumps" min="0" max="2" step="0.05" aria-label="How far the stones stand out of the outline"><b id="lumps-v">60</b><small>%</small></label>
    </span>
    <span class="grp" id="grow-grp"><span class="micro">Overgrowth</span><span class="seg" id="grow"><button data-v="none">None</button><button data-v="moss">Moss</button><button data-v="frost">Frost</button><button data-v="rust">Rust</button><button data-v="fungus">Fungus</button></span>
      <label class="sl"><span class="micro">Amount</span><input type="range" id="growa" min="0" max="1" step="0.05" aria-label="How much grows"><b id="growa-v">50</b><small>%</small></label>
      <label class="sl"><span class="micro">Clumping</span><input type="range" id="growp" min="0" max="1" step="0.05" aria-label="How clumped the growth is"><b id="growp-v">50</b><small>%</small></label>
      <span class="pal" id="gpal" role="group" aria-label="Growth colours"></span>
      <span class="micro">Grows</span><span class="seg" id="gmode"><button data-v="set">As set</button><button data-v="tank">By the tank</button></span><span class="micro" id="grow-life"></span>
    </span>
    <span class="grp" id="paint-grp"><span class="micro">Painted</span>

      <label class="sl"><span class="micro">Warmth</span><input type="range" id="ptemp" min="0" max="1" step="0.05" aria-label="How warm the light and how cool the shade"><b id="ptemp-v">60</b><small>%</small></label>
      <label class="sl"><span class="micro">Detail</span><input type="range" id="pdet" min="0" max="1" step="0.05" aria-label="How many dabs and scratches"><b id="pdet-v">50</b><small>%</small></label>
      <label class="sl"><span class="micro">Outline</span><input type="range" id="pout" min="0" max="1" step="0.05" aria-label="How heavy the ink line is"><b id="pout-v">50</b><small>%</small></label>
    </span>
    <span class="pal" id="pal" role="group" aria-label="Five colours"></span>
    <span class="grp"><button class="step" id="pal-prev" aria-label="Previous family's colours"><svg viewBox="0 0 12 12"><path d="M8 1 L3 6 L8 11"/></svg></button><button class="step" id="pal-next" aria-label="Next family's colours"><svg viewBox="0 0 12 12"><path d="M4 1 L9 6 L4 11"/></svg></button><button id="pal-reset">Reset</button><button id="pal-copy">Copy all</button></span>
    <span class="micro" id="look-say" role="status"></span>
  </div>
  <div class="row" data-tab="shape" id="shape-row" hidden></div>

    <span class="grp"><span class="micro">Pace</span><span class="seg" id="pace"><button data-v="0.25">Slow</button><button data-v="1">1×</button><button data-v="2">Fast</button></span></span>

  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id), ES = window.EcologySpecies, DEG = Math.PI / 180;   // SPECIES is the species file's own global
const hash = new URLSearchParams(location.hash.slice(1));
// four of the tank's kinds are walkers: on its floor they are walking bodies with legs (EcologyWalkers), and that is how they are shown here
// (the floor crew's lancer is drawn from the Crowned Lancer's sheet, so that is whose walker it is; the Strike Lance has no kit sheet and swims in its own drawing)
