<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Maw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#161618; --well:#121214; --panel:#1D1D20; --ink:#ECE8DE; --ink2:#8C8981; --off:#2E2D2A;
  --l2:rgba(236,232,222,.10); --l4:rgba(236,232,222,.16);
  --accent:#E8B04A; --rec:#FF4D5E; --puffer:#5BE39A; --scav:#FF8A3D; --swift:#5CC8E0;
  --ui:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace; --display:'Martian Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--well);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;pointer-events:none;user-select:none;-webkit-user-select:none}
.title{top:16px;left:18px}
.title b{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.22em;display:block}
.title span{font-size:11px;color:var(--ink2);letter-spacing:.04em}
.hint{top:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);background:rgba(18,18,20,.78);border:1px solid var(--l2);border-radius:10px;padding:9px 14px;white-space:nowrap;transition:opacity .6s}
.hint i{font-style:normal;color:var(--accent)}
.hint.gone{opacity:0}
.chips{left:18px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 36px)}
.chip{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;border:1px solid var(--l2);border-radius:10px;background:rgba(18,18,20,.78);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.chip em{font-style:normal;color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.pips{display:flex;gap:3px}
.pips u{width:9px;height:9px;border-radius:2px;border:1px solid var(--l4);text-decoration:none;display:block}
.pips u.on{border-color:transparent}
.bench{right:18px;bottom:18px;pointer-events:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);align-self:center;margin-right:4px}
button{font:500 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:rgba(29,29,32,.9);border:1px solid var(--l4);border-radius:10px;height:40px;padding:0 13px;cursor:pointer;display:flex;align-items:center;gap:8px}
button:hover{border-color:rgba(236,232,222,.34)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.tog{color:var(--ink2)}
button.tog::before{content:"";width:8px;height:8px;border-radius:2px;border:1px solid var(--ink2)}
button.tog[aria-pressed=true]{color:var(--ink)}
button.tog[aria-pressed=true]::before{background:var(--ink);border-color:var(--ink)}
button .dot{width:7px;height:7px;border-radius:50%}
@media (max-width:720px){
  .hint{top:auto;bottom:226px;font-size:11px;white-space:normal;text-align:center;width:calc(100vw - 36px)}
  .chips{bottom:auto;top:58px}
  .bench{left:18px;align-items:stretch}
  .row{justify-content:flex-start}
  .row label{display:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="The Maw: a creature with an oversized mouth that lunges at prey and grows their parts"></canvas>
<div class="hud title"><b>THE MAW</b><span>Forge prototype · a qilin plan on the hex lattice, 2.5D</span></div>
<div class="hud hint" id="hint">Move to stalk · <i>hold</i> to coil · <i>release</i> to lunge</div>
<div class="hud chips" id="chips"></div>
<div class="hud bench">
  <div class="row"><label>Feed it</label>
    <button data-feed="puffer"><span class="dot" style="background:var(--puffer)"></span>Puffer</button>
    <button data-feed="scav"><span class="dot" style="background:var(--scav)"></span>Scavenger</button>
    <button data-feed="swift"><span class="dot" style="background:var(--swift)"></span>Swift</button>
  </div>
  <div class="row"><label>Look</label>
    <button class="tog" id="tLat" aria-pressed="true">Lattice</button>
    <button class="tog" id="tRoot" aria-pressed="true">Root to tip</button>
    <button class="tog" id="tSkin" aria-pressed="false">Skin</button>
    <button class="tog" id="tBones" aria-pressed="false">Bones</button>
    <button id="reset">Reset</button>
  </div>
</div>

function hgt(x,y){let h=0;for(const t of TER){const d=hexD(t,x,y);if(d<t.R+RW){const k=d<=t.R?1:1-(d-t.R)/RW;h=Math.max(h,t.h*k*k*(3-2*k));}}return h;}
function steep(x,y){const e=6;return Math.min(1,Math.hypot(hgt(x+e,y)-hgt(x-e,y),hgt(x,y+e)-hgt(x,y-e))/(2*e)/2.2);}
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>x<a?a:x>b?b:x,ease=t=>t*t*(3-2*t);
const backOut=t=>{const c=1.9;t=clamp(t,0,1)-1;return 1+(c+1)*t*t*t+c*t*t;};
function angTo(a,b,maxStep){let d=((b-a+PI)%TAU+TAU)%TAU-PI;return a+clamp(d,-maxStep,maxStep);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}

/* ---------- the kit ---------- */
const SP={
  puffer:{name:'Blade puffer',col:'#5BE39A',S:.21,v:26,vf:88,sight:210,react:.5,turn:1.3,rad:27,n:4,gift:'wide',label:'Wider maw'},
  scav:{name:'Ring scavenger',col:'#FF8A3D',S:.21,v:52,vf:165,sight:250,react:.3,turn:2.3,rad:20,n:3,gift:'bulk',label:'Bulk'},
  swift:{name:'Lance swift',col:'#5CC8E0',S:.23,v:95,vf:300,sight:330,react:.14,turn:3.3,rad:24,n:3,gift:'reach',label:'Reach'}
};
const GIFT={wide:'puffer',bulk:'scav',reach:'swift'};
const PART={};
for(const id in KIT.parts){const p=KIT.parts[id],path=new Path2D();for(const d of p.d)path.addPath(new Path2D(d));
  // ax: the part's long axis, thick end (root) first, worked out from its outline
  PART[id]={...p,path,rx:p.ax[0],ry:p.ax[1],tx:p.ax[2],ty:p.ax[3]};}
const SPRITE={};
function buildSprites(){
  const Q=2.6;
  for(const k in SP){const s=SP[k],c=document.createElement('canvas'),px=ceil(400*s.S*Q);c.width=c.height=px;
    const g=c.getContext('2d');g.scale(s.S*Q,s.S*Q);g.strokeStyle=s.col;g.lineWidth=1.15/s.S;g.lineJoin='round';
    for(const p of KIT.species[k]){for(const d of p.d){const path=new Path2D(d);g.stroke(path);
      if(p.l){g.save();g.translate(400,0);g.scale(-1,1);g.stroke(path);g.restore();}}}
    SPRITE[k]={c,size:400*s.S};}
}
buildSprites();

/* ---------- options and input ---------- */
const opt={lattice:true,root:true,skin:false,bones:false};
const ptr={x:WW/2+260,y:WH/2,down:false,downT:0,seen:false};
const keys={};
const cam={x:WW/2,y:WH/2,kick:0};   // y is on the tilted plane, after height
function toWorldXY(sx,sy){const x=(sx-W/2)/zoom+cam.x,yp=(sy-H/2)/(zoom*TILT)+cam.y;let y=yp;for(let i=0;i<4;i++)y=yp+hgt(x,y)*HK;return [x,y];}
function toWorld(e){return toWorldXY(e.clientX,e.clientY);}
function aimAt(e){ptr.type=e.pointerType;ptr.sx=e.clientX;ptr.sy=e.clientY;[ptr.x,ptr.y]=toWorld(e);ptr.seen=true;}
cv.addEventListener('pointerdown',e=>{aimAt(e);ptr.down=true;ptr.downT=0;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||ptr.down)aimAt(e);});
const up=()=>{ptr.down=false;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* ---------- the Maw ---------- */
// The body is a column of hex cells, as in Compose: one spine cell per row, side cells mirrored.
// The base is the qilin's plan: a head on a neck, shoulders and haunch with a leg pair each, a tail.
const S=13,STEP=Math.sqrt(3)*S,SIDE=1.5*S;           // flat-top hex: cell size, row step, column step
const LEG={front:['P396','P183',42,52,22],hind:['P245','P187',40,54,-22],extra:['P245','P187',38,50,0]};
let maw,prey,fx,eaten;
const row=(id,o)=>Object.assign({id,long:0,wide:0,r:10,up:16,own:INK,g:1,sides:[],legs:null},o);
function newMaw(){
  const rows=[row('P277',{long:36,r:15,up:27,head:true}),row('P280',{long:27,r:8,up:24,neck:true}),row('P280',{long:27,r:8,up:20,neck:true}),
    row('P246',{wide:64,r:16,legs:'front'}),row('P253',{wide:46,r:13}),row('P251',{wide:52,r:13,legs:'hind'}),row('P276',{long:46,r:7,up:9,tail:true})];
  maw={ch:rows.map((r,i)=>chunk(r,WW/2-i*STEP,WH/2)),heading:0,m:.08,state:'walk',t:0,charge:0,dur:0,
    lv:{wide:0,bulk:0,reach:0},teeth:[],legs:[],bolus:[],Rmax:50,RmaxT:50};
  // twelve teeth, one on every 30 degree ray of the lattice
  for(let i=0;i<12;i++){const big=i%2===0;maw.teeth.push({a:i/12*TAU+PI/12,id:big?(i%4===0?'P258':'P032'):'P244',len:big?(i%4===0?32:28):16,own:INK,grow:1,flip:i>=6});}
  for(const c of maw.ch)if(c.row.legs)addLegs(c,true);
}
function chunk(r,x,y){return {row:r,x,y,vx:0,vy:0,pulse:0,sw:0};}
function rad(c){return c.row.r*c.row.g*(1+.07*c.pulse)+(c.sw||0);}
function cellFrame(i){const c=maw.ch,q=c[i];let fx_,fy_;
  if(i===0){fx_=cos(maw.heading);fy_=sin(maw.heading);}
  else{fx_=c[i-1].x-q.x;fy_=c[i-1].y-q.y;const d=hypot(fx_,fy_)||1;fx_/=d;fy_/=d;}
  return {x:q.x,y:q.y,fx:fx_,fy:fy_,rx:-fy_,ry:fx_,a:atan2(fy_,fx_),g:q.row.g};}
function addLegs(c,full){for(const s of[-1,1])maw.legs.push({ch:c,s,kind:c.row.legs,fx:0,fy:0,step:-1,fromx:0,fromy:0,tox:0,toy:0,init:false,grow:full?1:0});
  maw.legs.sort((a,b)=>maw.ch.indexOf(a.ch)-maw.ch.indexOf(b.ch));maw.legs.forEach((l,k)=>l.j=k>>1);}
function legRest(l){const f=cellFrame(maw.ch.indexOf(l.ch)),K=LEG[l.kind],reach=60;
  return {hx:f.x+f.rx*l.s*SIDE*.8-f.fx*STEP*.2,hy:f.y+f.ry*l.s*SIDE*.8-f.fy*STEP*.2,x:f.x+f.rx*l.s*(SIDE+reach)+f.fx*K[4],y:f.y+f.ry*l.s*(SIDE+reach)+f.fy*K[4],f};}
function insertRow(at,r){const c=maw.ch,a=c[at-1],b=c[at]||a;r.g=.05;const q=chunk(r,(a.x+b.x)/2,(a.y+b.y)/2);c.splice(at,0,q);if(r.legs)addLegs(q,false);return q;}

function mouthGeo(){
  const h=maw.ch[0],e=ease(clamp(maw.m,0,1)),R=lerp(rad(h)*.8,maw.Rmax,e),Ra=R*lerp(.1,.66,e);
  const fx_=cos(maw.heading),fy_=sin(maw.heading);
  const d=rad(h)*1.05+Ra*.9;
  return {x:h.x+fx_*d,y:h.y+fy_*d,R,Ra,fx:fx_,fy:fy_,rx:-fy_,ry:fx_,e};
}

// A meal becomes cells: a new row on the lattice, or new cells on a row that is there.
function giveGraft(kind){
  const lv=maw.lv,s=SP[GIFT[kind]],c=maw.ch,side=(id,len,ang)=>({id,len,ang,own:s.col,g:0});
  tag('+ '+s.label.toUpperCase(),s.col);
  if(lv[kind]>=3){c.forEach(q=>q.pulse=1);return;}
  const n=++lv[kind];
  if(kind==='reach'){            // a longer neck, with the swift's sickles on the new row
    const at=c.findIndex(q=>q.row.legs==='front');
    insertRow(at,row('P594',{wide:38,r:9,up:21,own:s.col,neck:true,sides:[side(n===2?'P582':'P578',[88,62,72][n-1],[2.3,1.9,2.55][n-1])]}));
    if(n===3)insertRow(c.length,row('P587',{long:48,r:5,up:6,own:s.col,tail:true}));
  }else if(kind==='bulk'){       // one more body row: the scavenger's plate, its blades, and a leg pair
    const at=c.findIndex(q=>q.row.legs==='hind');
    insertRow(at,row(['P259','P262','P263'][n-1],{long:40,r:15,own:s.col,legs:'extra',sides:[side('P261',[66,58,62][n-1],[2.5,2.3,2.65][n-1])]}));
  }else{                         // tusks on the odd rays of the mouth, horns on the head
    for(let i=0;i<4;i++)maw.teeth.push({a:i/4*TAU+n*PI/6+PI/4,id:'P026',len:38+4*n,own:s.col,grow:0,flip:i>=2});
    maw.RmaxT=50+9*n;
    if(n!==2)c[0].row.sides.push(side('P028',n===1?58:48,n===1?1.1:1.7));
    else c[0].row.sides.push(side('P024',20,PI/2));
  }
  hud();
}
function tag(text,col){const h=maw.ch[0];fx.push({k:'tag',x:h.x,y:h.y-48,t:0,d:1.6,text,col});}

/* ---------- prey ---------- */
function spawn(k,far){const s=SP[k];let x,y,tries=0;
  do{x=90+random()*(WW-180);y=90+random()*(WH-180);tries++;}while(tries<40&&hypot(x-maw.ch[0].x,y-maw.ch[0].y)<(far?520:300));
  return {k,x,y,h:random()*TAU,wh:random()*TAU,v:s.v,scared:0,notice:0,puff:0,ph:random()*TAU,alive:true,gone:0,pause:0};}
function reset(){fx=[];eaten=0;newMaw();prey=[];for(const k in SP)for(let i=0;i<SP[k].n;i++)prey.push(spawn(k,false));hud();}

/* ---------- update ---------- */
function update(dt){
  const c=maw.ch,h=c[0],lv=maw.lv;maw.t+=dt;
  // where it wants to go
  let tx=ptr.x,ty=ptr.y,kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const kb=kx||ky;if(kb){tx=h.x+kx*260;ty=h.y+ky*260;ptr.seen=true;}
  else if(ptr.sx!=null&&(ptr.type==='mouse'||ptr.down)){[tx,ty]=toWorldXY(ptr.sx,ptr.sy);ptr.x=tx;ptr.y=ty;}
  const hold=ptr.down||keys[' '];
  if(hold)ptr.downT+=dt;else ptr.downT=0;
  const dx=tx-h.x,dy=ty-h.y,dist=hypot(dx,dy),aim=atan2(dy,dx);
  let fxh=cos(maw.heading),fyh=sin(maw.heading),damp=6,follow=.5;
  if(maw.state==='walk'){
    if(dist>26&&ptr.seen)maw.heading=angTo(maw.heading,aim,4.2*dt);
    let sp=ptr.seen?clamp((dist-34)/210,0,1)*172:0;
    const turnOff=abs(((aim-maw.heading+PI)%TAU+TAU)%TAU-PI);sp*=clamp(1.25-turnOff/1.6,.25,1)*(1-.6*steep(h.x,h.y));
    fxh=cos(maw.heading);fyh=sin(maw.heading);
    h.vx+=(fxh*sp-h.vx)*min(1,7*dt);h.vy+=(fyh*sp-h.vy)*min(1,7*dt);
    // mouth: breathes, and gapes a little when food is close
    let near=1e9;for(const p of prey)if(p.alive)near=min(near,hypot(p.x-h.x,p.y-h.y));
    const want=.07+.03*sin(maw.t*1.7)+(near<190?.16*(1-near/190):0);
    maw.m+=(want-maw.m)*min(1,5*dt);
    if(hold&&ptr.downT>.13){maw.state='coil';maw.charge=0;hideHint();}
  }else if(maw.state==='coil'){
    maw.charge=min(1,maw.charge+dt/.85);
    maw.heading=angTo(maw.heading,aim,6*dt);fxh=cos(maw.heading);fyh=sin(maw.heading);
    const back=-46*(1-maw.charge)*(maw.charge<.9?1:0);
    h.vx+=(fxh*back-h.vx)*min(1,10*dt);h.vy+=(fyh*back-h.vy)*min(1,10*dt);
    maw.m+=((.22+.5*maw.charge)-maw.m)*min(1,9*dt);
    if(maw.charge>=1){h.x+=(random()-.5)*.9;h.y+=(random()-.5)*.9;}
    if(!hold){
      if(maw.charge<.16)maw.state='walk';
      else{const v0=lungeSpeed(maw.charge);h.vx=fxh*v0;h.vy=fyh*v0;maw.state='lunge';maw.st=0;maw.dur=.3+.12*maw.charge;
        for(let i=1;i<c.length;i++){c[i].vx=fxh*v0*.25;c[i].vy=fyh*v0*.25;}}
    }
  }else if(maw.state==='lunge'){
    maw.st+=dt;damp=3.1;follow=.16;maw.m+=(1-maw.m)*min(1,26*dt);
    const g=mouthGeo();let got=null;
    for(const p of prey){if(!p.alive||p.caught)continue;const s=SP[p.k],px=p.x-g.x,py=p.y-g.y,a=(px*g.rx+py*g.ry)/(g.R+s.rad*.45),b=(px*g.fx+py*g.fy)/(g.Ra+s.rad*.6);
      if(a*a+b*b<1){got=p;break;}}
    if(got){got.caught=1e-6;got.cx=got.x;got.cy=got.y;maw.state='chew';maw.st=0;cam.kick=7;h.vx*=.35;h.vy*=.35;eaten++;
      for(let i=0;i<7;i++)fx.push({k:'spark',x:g.x,y:g.y,a:random()*TAU,t:0,d:.35+random()*.2,col:SP[got.k].col});}
    else if(maw.st>maw.dur){maw.state='miss';maw.st=0;cam.kick=3;}
  }else if(maw.state==='chew'){
    maw.st+=dt;damp=5;
    const t=maw.st;maw.m=t<.07?lerp(maw.m,0,.6):.02+.16*max(0,sin((t-.1)*17))*max(0,1-t/.75);
    if(t>.8)maw.state='walk';
  }else if(maw.state==='miss'){
    maw.st+=dt;damp=5;maw.m+=(0-maw.m)*min(1,30*dt);
    if(maw.st>.75)maw.state='walk';
  }
  const coiling=maw.state==='coil';
  // integrate the head, then the body follows it
  const dmp=exp(-damp*dt);
  h.x+=h.vx*dt;h.y+=h.vy*dt;if(maw.state!=='walk'&&maw.state!=='coil'){h.vx*=dmp;h.vy*=dmp;}
  h.x=clamp(h.x,50,WW-50);h.y=clamp(h.y,50,WH-50);
  const comp=coiling?1-.42*maw.charge:1;
  for(let i=1;i<c.length;i++){const a=c[i-1],b=c[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;const bd=exp(-7*dt);b.vx*=bd;b.vy*=bd;
    const L=STEP*max(.12,b.row.g)*(b.row.neck&&maw.state==='lunge'?1.25:1)*comp;let ex=b.x-a.x,ey=b.y-a.y,d=hypot(ex,ey)||1;
    const k=1-Math.pow(1-follow,dt*60),corr=(d-L)*k;
    b.x-=ex/d*corr;b.y-=ey/d*corr;
    if(d>L*2.4){b.x=a.x+ex/d*L*2.4;b.y=a.y+ey/d*L*2.4;}
    // straighten gently behind the one in front
    let px,py;if(i===1){px=-fxh;py=-fyh;}else{const z=c[i-2];px=a.x-z.x;py=a.y-z.y;const e=hypot(px,py)||1;px/=e;py/=e;}
    const s=min(1,(coiling?.5:.1)*dt*60*.5);b.x+=(a.x+px*L-b.x)*s*.35;b.y+=(a.y+py*L-b.y)*s*.35;}
  for(const q of c){q.row.g=min(1,q.row.g+dt/1.1);q.pulse=max(0,q.pulse-dt*5);q.sw=0;for(const sd of q.row.sides)sd.g=min(1,sd.g+dt/1.15);}
  maw.Rmax+=(maw.RmaxT-maw.Rmax)*min(1,2.2*dt);
  // the meal travelling down the body
  for(const b of maw.bolus){b.t+=dt;const s=b.t/.85*(c.length-1);
    c.forEach((q,i)=>{const z=i-s;q.sw+=7*exp(-z*z*1.6)*(1-b.t/1.1);});
    if(!b.done&&b.t>.5){b.done=true;giveGraft(b.kind);}}
  maw.bolus=maw.bolus.filter(b=>b.t<1.1);
  for(const t of maw.teeth)t.grow=min(1,t.grow+dt/1.0);
  // legs: plant, hold, step
  const sp=hypot(h.vx,h.vy);
  for(const l of maw.legs){const r=legRest(l),LMAX=LEG[l.kind][2]+LEG[l.kind][3]-1;
    if(!l.init){l.fx=r.x;l.fy=r.y;l.init=true;}
    l.grow=min(1,l.grow+dt/1.2);
    if(l.step>=0){l.step+=dt/.105;const t=min(1,l.step);l.fx=lerp(l.fromx,l.tox,ease(t));l.fy=lerp(l.fromy,l.toy,ease(t));
      if(t>=1){l.step=-1;fx.push({k:'dust',x:l.fx,y:l.fy,t:0,d:.4});const q=l.ch;q.pulse=1;
        const jx=q.x-l.fx,jy=q.y-l.fy,jd=hypot(jx,jy)||1;q.x+=jx/jd*.7;q.y+=jy/jd*.7;}}
    else{const d=hypot(l.fx-r.x,l.fy-r.y),thr=coiling?999:(maw.state==='lunge'?64:26+l.j*3);
      const opp=maw.legs.find(o=>o.j===l.j&&o.s===-l.s),nb=maw.legs.find(o=>o.s===l.s&&o.j===l.j-1);
      if(d>thr&&!(opp&&opp.step>=0)&&!(nb&&nb.step>=0&&nb.step<.5)){l.step=0;l.fromx=l.fx;l.fromy=l.fy;const lead=clamp(sp*.13,0,26);l.tox=r.x+h.vx/(sp||1)*lead;l.toy=r.y+h.vy/(sp||1)*lead;}}
    const ex=l.fx-r.hx,ey=l.fy-r.hy,ed=hypot(ex,ey);
    if(ed>LMAX){l.fx=r.hx+ex/ed*LMAX;l.fy=r.hy+ey/ed*LMAX;if(l.step>=0){l.fromx=l.fx;l.fromy=l.fy;}}
  }
  // prey
  for(const p of prey){const s=SP[p.k];
    if(p.caught){p.caught+=dt;if(p.caught>.3){p.alive=false;p.caught=0;p.gone=3.5+random()*2;maw.bolus.push({t:0,kind:s.gift});}continue;}
    if(!p.alive){p.gone-=dt;if(p.gone<=0)Object.assign(p,spawn(p.k,true));continue;}
    const ddx=p.x-h.x,ddy=p.y-h.y,d=hypot(ddx,ddy);
    const loud=coiling?.8:.34+.66*min(1,sp/150);
    if(d<s.sight*loud||d<60){p.notice+=dt;if(p.notice>s.react)p.scared=1.5;}else p.notice=max(0,p.notice-dt);
    p.scared=max(0,p.scared-dt);
    let want=p.wh,spd=s.v;
    if(p.scared>0){want=atan2(ddy,ddx);spd=s.vf;}
    else{p.wh+=(random()-.5)*s.turn*dt*2.2;if(p.k==='scav'){p.pause-=dt;if(p.pause<-1.4)p.pause=.5+random()*.8;if(p.pause>0)spd=0;}}
    // keep off the walls
    const mg=130;let wx=0,wy=0;if(p.x<mg)wx=1;else if(p.x>WW-mg)wx=-1;if(p.y<mg)wy=1;else if(p.y>WH-mg)wy=-1;
    if(wx||wy){const wa=atan2(wy||sin(want)*.6,wx||cos(want)*.6);want=p.scared>0?angTo(want,wa,1.1):wa;p.wh=wa;}
    p.h=angTo(p.h,want,s.turn*(p.scared>0?2.4:1)*dt);
    p.v+=(spd-p.v)*min(1,3*dt);
    p.x=clamp(p.x+cos(p.h)*p.v*dt,40,WW-40);p.y=clamp(p.y+sin(p.h)*p.v*dt,40,WH-40);
    p.puff+=(((p.k==='puffer'&&p.scared>0)?1:0)-p.puff)*min(1,5*dt);p.ph+=dt*(1.5+p.v*.03);}
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<f.d);
  // camera: it keeps its point of view and trails the Maw, as in INSIDE; climbing carries it up
  {const hh=hgt(h.x,h.y),vx=clamp(h.vx,-260,260),vy=clamp(h.vy,-260,260),hw=W/2/zoom,hv=H/2/(zoom*TILT);
    const txc=clamp(h.x+vx*.22,hw-80,WW-hw+80),tyc=clamp(h.y-hh*HK+vy*.22-hh*.12,hv-200,WH-hv+80);
    const still=maw.state==='coil'?.35:1;                 // it holds almost still while the Maw coils
    cam.x+=(txc-cam.x)*(1-exp(-dt/.5*still));cam.y+=(tyc-cam.y)*(1-exp(-dt/.62*still));
    if(WW*zoom<W)cam.x=WW/2;}
  cam.kick*=exp(-14*dt);
}
function lungeSpeed(ch){return (400+640*ch)*(1+.1*maw.lv.reach);}

/* ---------- the skin: one field over every chunk and every graft root ---------- */
const CELL=4;let G=new Float32Array(4096),gw=0,gh=0,gx0=0,gy0=0;
function field(blobs){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const b of blobs){const R=b.r*2;x0=min(x0,b.x-R);y0=min(y0,b.y-R);x1=max(x1,b.x+R);y1=max(y1,b.y+R);}
  gx0=floor(x0/CELL)*CELL-CELL;gy0=floor(y0/CELL)*CELL-CELL;gw=ceil((x1-gx0)/CELL)+3;gh=ceil((y1-gy0)/CELL)+3;
  if(G.length<gw*gh)G=new Float32Array(gw*gh*2);G.fill(0,0,gw*gh);
  for(const b of blobs){const R=b.r*2,R2=R*R;if(R<1)continue;
    const i0=max(0,floor((b.x-R-gx0)/CELL)),i1=min(gw-1,ceil((b.x+R-gx0)/CELL)),j0=max(0,floor((b.y-R-gy0)/CELL)),j1=min(gh-1,ceil((b.y+R-gy0)/CELL));
    for(let j=j0;j<=j1;j++){const y=gy0+j*CELL-b.y;for(let i=i0;i<=i1;i++){const x=gx0+i*CELL-b.x,d2=x*x+y*y;if(d2<R2){const f=1-d2/R2;G[j*gw+i]+=f*f;}}}}
}
function iso(T,wantFill){
  const seg=new Path2D(),fp=wantFill?new Path2D():null,C=CELL;
  for(let j=0;j<gh-1;j++){let run=-1;const y=gy0+j*C;
    for(let i=0;i<gw-1;i++){const k=j*gw+i,a=G[k]-T,b=G[k+1]-T,c=G[k+gw+1]-T,d=G[k+gw]-T;
      const A=a>0,B=b>0,Cc=c>0,D=d>0;
      if(A&&B&&Cc&&D){if(run<0)run=i;continue;}
      if(run>=0){if(fp)fp.rect(gx0+run*C,y,(i-run)*C,C);run=-1;}
      if(!A&&!B&&!Cc&&!D)continue;
      const x=gx0+i*C,pts=[],cr=[];
      if(A)pts.push(x,y);
      if(A!==B){const px=x+a/(a-b)*C;pts.push(px,y);cr.push(px,y);}
      if(B)pts.push(x+C,y);
      if(B!==Cc){const py=y+b/(b-c)*C;pts.push(x+C,py);cr.push(x+C,py);}
      if(Cc)pts.push(x+C,y+C);
      if(Cc!==D){const px=x+C-c/(c-d)*C;pts.push(px,y+C);cr.push(px,y+C);}
      if(D)pts.push(x,y+C);
      if(D!==A){const py=y+C-d/(d-a)*C;pts.push(x,py);cr.push(x,py);}
      if(fp){fp.moveTo(pts[0],pts[1]);for(let q=2;q<pts.length;q+=2)fp.lineTo(pts[q],pts[q+1]);fp.closePath();}
      for(let q=0;q+3<cr.length;q+=4){seg.moveTo(cr[q],cr[q+1]);seg.lineTo(cr[q+2],cr[q+3]);}
    }
    if(run>=0&&fp)fp.rect(gx0+run*C,y,(gw-1-run)*C,C);
  }
  return {seg,fp};
}

/* ---------- drawing ---------- */
// One kit part, placed by its root, pointed along ang, len long from root to tip.
function drawPart(id,x,y,ang,len,flip,own,alpha,fat=1){
  const p=PART[id];if(len<1)return;
  const vx=(p.tx-p.rx)*(flip?-1:1),vy=p.ty-p.ry,pl=hypot(vx,vy),s=len/pl;
  cx.save();cx.translate(x,y);cx.rotate(ang-atan2(vy,vx));cx.scale(flip?-s:s,s);cx.translate(-p.rx-p.ox,-p.ry-p.oy);
  const x0=p.ox+p.rx,y0=p.oy+p.ry,x1=p.ox+p.tx,y1=p.oy+p.ty;cx.lineJoin='round';cx.lineCap='round';
  if(opt.root){
    let g=cx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,rgba(INK,.85*alpha*fat));g.addColorStop(.5,rgba(INK,0));
    cx.strokeStyle=g;cx.lineWidth=3.4/s;cx.stroke(p.path);
    g=cx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,rgba(INK,alpha));g.addColorStop(.3,rgba(INK,alpha));g.addColorStop(.75,rgba(own,alpha));g.addColorStop(1,rgba(own,alpha));
    cx.strokeStyle=g;
  }else cx.strokeStyle=rgba(own,alpha);
  cx.lineWidth=1.3/s;cx.stroke(p.path);cx.restore();
}
function hex(x,y,a,r){cx.beginPath();for(let k=0;k<6;k++){const t=a+k*PI/3;k?cx.lineTo(x+cos(t)*r,y+sin(t)*r):cx.moveTo(x+cos(t)*r,y+sin(t)*r);}cx.closePath();}
// A spine cell: the part sits on its chunk, drawn as on its sheet with the head forward.
function drawCell(r,f){const p=PART[r.id],s=(r.long?r.long/p.h:r.wide/p.w)*backOut(r.g);if(s<.03)return;
  cx.save();cx.translate(f.x,f.y);cx.rotate(f.a+PI/2);cx.scale(s,s);cx.translate(-p.ox,-p.oy);
  cx.strokeStyle=r.own;cx.lineWidth=1.25/s;cx.lineJoin='round';cx.stroke(p.path);cx.restore();}

function draw(){
  const kx=(random()-.5)*cam.kick,ky=(random()-.5)*cam.kick;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#121214';cx.fillRect(0,0,W,H);
  cx.setTransform(DPR*zoom,0,0,DPR*zoom*TILT,DPR*(W/2-(cam.x+kx)*zoom),DPR*(H/2-(cam.y+ky)*zoom*TILT));
  // floor
  cx.fillStyle=GROUND;rr(0,0,WW,WH,40);cx.fill();
  cx.save();rr(0,0,WW,WH,40);cx.clip();cx.strokeStyle='rgba(236,232,222,.045)';cx.lineWidth=1;
  for(let r=140;r<1400;r+=140){cx.beginPath();cx.arc(WW/2,WH/2,r,0,TAU);cx.stroke();}cx.restore();
  cx.strokeStyle='rgba(236,232,222,.16)';cx.lineWidth=1.5;rr(0,0,WW,WH,40);cx.stroke();
  drawTerraces();
  // lift the body off the ground for drawing: each cell rides at its own height, feet stay down
  const c=maw.ch,h=c[0],coil=maw.state==='coil'?maw.charge:0,low=maw.state==='lunge'?.55:1;
  for(const q of c){q.wx=q.x;q.wy=q.y;q.gy=q.y-hgt(q.x,q.y)*HK;const up=(q.row.up*low+(q.row.head?12*coil:q.row.neck?6*coil:-3*coil))*q.row.g;
    shadow(q.x+4,q.gy+6,rad(q)*2.2+up*.3,.5);q.y=q.gy-up*HK;}
  const g=mouthGeo(),F=c.map((q,i)=>cellFrame(i));
  for(const p of prey)if(p.alive&&!p.caught)shadow(p.x+4,p.y-hgt(p.x,p.y)*HK+6,SP[p.k].rad*1.5,.34);
  if(g.e>.2)shadow(g.x+4,h.gy+6,g.R*1.3,.35*g.e);
  // prey
  for(const p of prey){if(!p.alive)continue;const s=SP[p.k],sp=SPRITE[p.k];const py=p.y-(hgt(p.x,p.y)+12)*HK;let sc=1+.3*p.puff+(p.k==='puffer'?.03*sin(p.ph):0),al=1,x=p.x,y=py;
    if(p.caught){const t=min(1,p.caught/.3);x=lerp(p.x,g.x,ease(t));y=lerp(py,g.y,ease(t));sc*=1-.75*t;al=1-t*t;}
    cx.save();cx.translate(x,y);cx.rotate(p.h+PI/2+sin(p.ph*1.3)*.07*(p.k==='puffer'?.4:1));cx.globalAlpha=al;
    const z=sp.size*sc;cx.drawImage(sp.c,-z/2,-z/2,z,z);cx.restore();
    if(p.scared>0&&!p.caught&&p.notice>0){cx.strokeStyle=rgba(s.col,.5*min(1,p.scared));cx.lineWidth=1;cx.beginPath();cx.arc(p.x,py,s.rad*1.55+4*sin(maw.t*18),0,TAU);cx.stroke();}}
  // an optional soft skin under everything
  if(opt.skin){const blobs=[];c.forEach((q,i)=>{blobs.push({x:q.x,y:q.y,r:rad(q)*1.15});if(i){const z=c[i-1];blobs.push({x:(q.x+z.x)/2,y:(q.y+z.y)/2,r:min(rad(q),rad(z))*.9});}});
    field(blobs);const out=iso(.5,true);cx.fillStyle='rgba(15,15,17,.9)';cx.fill(out.fp);cx.strokeStyle=rgba(INK,.4);cx.lineWidth=1.2;cx.lineCap='round';cx.stroke(out.seg);}
  // legs: a kit part along each bone, a small hex at each joint
  cx.lineCap='round';cx.lineJoin='round';
  for(const l of maw.legs){const r=legRest(l),K=LEG[l.kind],l1=K[2],l2=K[3],gfy=l.fy-hgt(l.fx,l.fy)*HK;let ex=l.fx-r.hx,ey=gfy-r.hy,d=min(hypot(ex,ey)||1,l1+l2-.5);const e0=hypot(ex,ey)||1;ex/=e0;ey/=e0;
    const a=(l1*l1-l2*l2+d*d)/(2*d),hh=sqrt(max(0,l1*l1-a*a));
    const kx1=r.hx+ex*a-ey*hh,ky1=r.hy+ey*a+ex*hh,kx2=r.hx+ex*a+ey*hh,ky2=r.hy+ey*a-ex*hh;
    const f1=(kx1-r.hx)*r.f.fx+(ky1-r.hy)*r.f.fy,f2=(kx2-r.hx)*r.f.fx+(ky2-r.hy)*r.f.fy,kxx=f1>f2?kx1:kx2,kyy=f1>f2?ky1:ky2;
    const fx_=r.hx+ex*d,fy_=r.hy+ey*d,al=l.grow,gk=backOut(l.grow),ta=atan2(fy_-kyy,fx_-kxx);
    shadow(fx_+3,fy_+5,7,.4*al);
    drawPart(K[0],r.hx,r.hy,atan2(kyy-r.hy,kxx-r.hx),l1*1.04*gk,l.s>0,INK,al,0);
    drawPart(K[1],kxx,kyy,ta,l2*1.04*gk,l.s>0,INK,al,0);
    drawPart('P244',fx_,fy_,ta+l.s*.5,11*gk,l.s>0,INK,al,0);
    cx.fillStyle=GROUND;cx.strokeStyle=rgba(INK,al);cx.lineWidth=1;hex(kxx,kyy,ta,3.2*gk);cx.fill();cx.stroke();}
  // the lattice: one hex per cell, riding the body
  if(opt.lattice){cx.lineWidth=1;
    c.forEach((q,i)=>{const f=F[i],r=q.row,k=min(1,r.g*1.4),donor=r.own!==INK;
      cx.fillStyle='rgba(13,16,16,.84)';cx.strokeStyle=rgba(donor?r.own:INK,donor?.6:.3);
      if(r.sides.length||r.legs)for(const sd of[-1,1]){hex(f.x+f.rx*sd*SIDE*k-f.fx*STEP*.5*k,f.y+f.ry*sd*SIDE*k-f.fy*STEP*.5*k,f.a+PI/2,S*1.0*k);cx.fill();
        const ds=r.sides.length&&r.sides[0].own!==INK;cx.strokeStyle=rgba(ds?r.sides[0].own:INK,ds?.6:.3);cx.stroke();cx.strokeStyle=rgba(donor?r.own:INK,donor?.6:.3);}
      hex(f.x,f.y,f.a+PI/2,S*1.0*k);cx.fill();cx.stroke();});}
  // the cord the cells hang on
  cx.strokeStyle=rgba(INK,.4);cx.lineWidth=1;cx.beginPath();c.forEach((q,i)=>i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y));cx.stroke();
  // side cells: parts taken from prey, mirrored across the spine
  c.forEach((q,i)=>{const f=F[i];for(const sd of q.row.sides)for(const side of[-1,1]){const len=sd.len*backOut(sd.g);
    drawPart(sd.id,f.x+f.rx*side*SIDE*.5-f.fx*STEP*.2,f.y+f.ry*side*SIDE*.5-f.fy*STEP*.2,f.a+side*sd.ang,len,side>0,sd.own,min(1,sd.g*3));}});
  // spine cells, tail first so the head sits on top
  for(let i=c.length-1;i>=0;i--)drawCell(c[i].row,F[i]);
  // the mouth
  {cx.save();cx.translate(g.x,g.y);cx.rotate(maw.heading);
    cx.fillStyle='#070708';cx.beginPath();cx.ellipse(0,0,g.Ra,g.R,0,0,TAU);cx.fill();
    cx.strokeStyle=rgba(REC,.34*g.e);cx.lineWidth=1;cx.beginPath();cx.ellipse(-g.Ra*.12,0,g.Ra*.6,g.R*.6,0,0,TAU);cx.stroke();
    cx.strokeStyle=rgba(REC,.2*g.e);cx.beginPath();cx.ellipse(-g.Ra*.22,0,g.Ra*.3,g.R*.3,0,0,TAU);cx.stroke();
    cx.strokeStyle=INK;cx.lineWidth=1.5;cx.beginPath();cx.ellipse(0,0,g.Ra,g.R,0,0,TAU);cx.stroke();cx.restore();}
  const chat=maw.state==='coil'&&maw.charge>=1?.05:0;
  const order=maw.teeth.map(t=>({t,s:sin(t.a)})).sort((a,b)=>a.s-b.s);
  for(const {t} of order){const ca=cos(t.a),sa=sin(t.a),x=g.x+g.rx*ca*g.R+g.fx*sa*g.Ra,y=g.y+g.ry*ca*g.R+g.fy*sa*g.Ra;
    const ang=atan2(g.y-y,g.x-x)+(random()-.5)*chat+(1-g.e)*sa*.5;
    const len=min(t.len*backOut(t.grow)*lerp(.38,1,g.e),g.R*.98);
    drawPart(t.id,x,y,ang,len,t.flip,t.own,min(1,t.grow*3)*lerp(.6,1,g.e),g.e*.6);}
  // aim, while coiled
  if(maw.state==='coil'&&maw.charge>.16){const v0=lungeSpeed(maw.charge),dur=.3+.12*maw.charge,reach=v0*(1-exp(-3.1*dur))/3.1+g.Ra*2;
    const ex=h.x+g.fx*reach,ey=h.y+g.fy*reach;
    cx.strokeStyle=rgba(GOLD,.55);cx.lineWidth=1.2;cx.setLineDash([2,7]);cx.beginPath();cx.moveTo(g.x+g.fx*g.Ra,g.y+g.fy*g.Ra);cx.lineTo(ex,ey);cx.stroke();cx.setLineDash([]);
    cx.strokeStyle=GOLD;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(ex-g.rx*maw.Rmax*.7,ey-g.ry*maw.Rmax*.7);cx.lineTo(ex+g.rx*maw.Rmax*.7,ey+g.ry*maw.Rmax*.7);cx.stroke();}
  // effects
  for(const f of fx){const t=f.t/f.d;
    const fy=f.y-(hgt(f.x,f.y)+(f.k==='dust'?0:24))*HK;
    if(f.k==='dust'){cx.strokeStyle=rgba(INK,.28*(1-t));cx.lineWidth=1;hex(f.x,fy,0,2+8*t);cx.stroke();}
    else if(f.k==='spark'){const r0=10+60*t,r1=r0+10*(1-t);cx.strokeStyle=rgba(f.col,1-t);cx.lineWidth=1.4;cx.beginPath();cx.moveTo(f.x+cos(f.a)*r0,fy+sin(f.a)*r0);cx.lineTo(f.x+cos(f.a)*r1,fy+sin(f.a)*r1);cx.stroke();}
    else if(f.k==='tag'){cx.font='500 12px "IBM Plex Mono",monospace';cx.textAlign='center';cx.fillStyle=rgba(f.col,t<.15?t/.15:1-max(0,(t-.6)/.4));cx.save();cx.translate(f.x,fy-26*ease(t));cx.scale(1,1/TILT);cx.fillText(f.text,0,0);cx.restore();}}
  if(opt.bones){cx.lineWidth=1;for(const q of c){cx.strokeStyle=rgba(GOLD,.5);cx.beginPath();cx.arc(q.x,q.y,rad(q),0,TAU);cx.stroke();}
    for(const l of maw.legs){const gy=l.fy-hgt(l.fx,l.fy)*HK;cx.fillStyle=l.step>=0?REC:GOLD;cx.fillRect(l.fx-2,gy-2,4,4);}}
  for(const q of c){q.x=q.wx;q.y=q.wy;}
}
// A terrace: a hex frustum. Back banks, then front banks with a hatch, then the top.
function drawTerraces(){
  for(const t of [...TER].sort((a,b)=>a.y-b.y)){const P=[],Q=[],k=1/.8660254;
    for(let i=0;i<6;i++){const a=i*PI/3+PI/6;P.push([t.x+cos(a)*(t.R+RW)*k,t.y+sin(a)*(t.R+RW)*k]);Q.push([t.x+cos(a)*t.R*k,t.y+sin(a)*t.R*k-t.h*HK]);}
    for(const front of[false,true])for(let i=0;i<6;i++){const j=(i+1)%6,isFront=(P[i][1]+P[j][1])/2>t.y+1;if(isFront!==front)continue;
      cx.beginPath();cx.moveTo(P[i][0],P[i][1]);cx.lineTo(P[j][0],P[j][1]);cx.lineTo(Q[j][0],Q[j][1]);cx.lineTo(Q[i][0],Q[i][1]);cx.closePath();
      cx.fillStyle=front?'#101012':'#141416';cx.fill();cx.strokeStyle='rgba(236,232,222,.2)';cx.lineWidth=1;cx.stroke();
      if(front){cx.strokeStyle='rgba(236,232,222,.07)';cx.beginPath();for(let u=1;u<9;u++){const f=u/9;cx.moveTo(lerp(P[i][0],P[j][0],f),lerp(P[i][1],P[j][1],f));cx.lineTo(lerp(Q[i][0],Q[j][0],f),lerp(Q[i][1],Q[j][1],f));}cx.stroke();}}
    cx.beginPath();Q.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.closePath();cx.fillStyle='#1b1b1e';cx.fill();cx.strokeStyle='rgba(236,232,222,.3)';cx.lineWidth=1.2;cx.stroke();
    cx.strokeStyle='rgba(236,232,222,.06)';cx.beginPath();for(let i=0;i<6;i++){cx.moveTo(t.x,t.y-t.h*HK);cx.lineTo(Q[i][0],Q[i][1]);}cx.stroke();}
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function shadow(x,y,r,a){const g=cx.createRadialGradient(x,y,r*.2,x,y,r);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,TAU);cx.fill();}

/* ---------- HUD ---------- */
const chips=document.getElementById('chips'),hint=document.getElementById('hint');
function hud(){let s='';for(const k of['wide','bulk','reach']){const sp=SP[GIFT[k]];let pips='';for(let i=0;i<3;i++)pips+=`<u class="${i<maw.lv[k]?'on':''}" style="${i<maw.lv[k]?'background:'+sp.col:''}"></u>`;
  s+=`<div class="chip"><span class="dot" style="background:${sp.col}"></span><em>${sp.label}</em><span class="pips">${pips}</span></div>`;}
  s+=`<div class="chip">Eaten <em>${eaten}</em></div>`;chips.innerHTML=s;}
function hideHint(){hint.classList.add('gone');}
for(const b of document.querySelectorAll('[data-feed]'))b.addEventListener('click',()=>{maw.bolus.push({t:0,kind:SP[b.dataset.feed].gift});eaten++;hud();});
function tog(id,key){const b=document.getElementById(id);b.addEventListener('click',()=>{opt[key]=!opt[key];b.setAttribute('aria-pressed',opt[key]);});}
tog('tLat','lattice');tog('tSkin','skin');tog('tRoot','root');tog('tBones','bones');
document.getElementById('reset').addEventListener('click',reset);

/* ---------- loop ---------- */
reset();
let last=performance.now(),lastEaten=0;
function frame(now){const dt=min(.033,(now-last)/1000);last=now;update(dt);if(eaten!==lastEaten){lastEaten=eaten;hud();}draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__maw=()=>({maw,prey,ptr,opt,cam,zoom,giveGraft,update,draw});
</script>
