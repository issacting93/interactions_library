<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flora Specimens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap" rel="stylesheet">
<style>
:root{--ground:#161618;--panel:#1D1D20;--lane:#1C1C1F;--sel:#232327;--ink:#ECE8DE;--ink2:#8C8981;--off:#2E2D2A;
--l1:rgba(236,232,222,.07);--l2:rgba(236,232,222,.10);--l3:rgba(236,232,222,.14);--l5:rgba(236,232,222,.22);
--food:#5BE39A;--trapper:#FF4D5E;--chain:#E8B04A;--k:var(--food);
--disp:'Martian Mono',ui-monospace,monospace;--ui:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:1px solid var(--chain);outline-offset:2px}
.art *{fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.cap{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
header{padding:20px 28px 16px;border-bottom:1px solid var(--l1);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
h1{font-family:var(--disp);font-weight:300;font-size:20px;letter-spacing:.08em;margin:0;text-transform:uppercase}
header p{margin:0;color:var(--ink2);max-width:74ch}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding:24px 28px 40px}
nav h2{margin:16px 0 6px;font-weight:400}
nav h2:first-child{margin-top:0}
.pl{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:4px 10px 4px 4px;border:1px solid transparent;border-radius:12px}
.pl svg{width:40px;height:44px;flex:none;color:var(--ink2)}
.pl span{font-family:var(--disp);font-weight:400;font-size:12px;letter-spacing:.06em}
.pl:hover{background:var(--lane)}
.pl[aria-current=true]{background:var(--sel);border-color:var(--k)}
.pl[aria-current=true] svg{color:var(--ink)}
main{min-width:0}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.kind{color:var(--k)}
h2.name{font-family:var(--disp);font-weight:200;font-size:36px;letter-spacing:.02em;margin:0;line-height:1.15}
.role{color:var(--ink2);max-width:70ch;margin:6px 0 16px}
.stage{background:var(--panel);border:1px solid var(--l2);border-radius:22px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage text{font-family:var(--ui);font-size:11px;fill:var(--ink2);letter-spacing:.12em}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 16px;border-top:1px solid var(--l1)}
.play{min-height:44px;padding:0 18px;border:1px solid var(--k);border-radius:10px;color:var(--k);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;text-align:center}
.play[aria-pressed=true]{background:var(--k);color:var(--ground)}
.status{font-family:var(--disp);font-weight:300;font-size:13px;letter-spacing:.06em;min-width:0;flex:1 1 240px}
.status b{font-weight:400;color:var(--k)}
.prog{flex:1 1 160px;height:1px;background:var(--l5);position:relative}
.prog i{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--k)}
.facts{display:flex;flex-wrap:wrap;gap:1px;background:var(--l1);border:1px solid var(--l2);border-radius:18px;overflow:hidden;margin:16px 0}
.fact{background:var(--ground);padding:12px 14px;flex:1 1 124px}
.fact b{display:block;font-family:var(--disp);font-weight:300;font-size:20px;font-variant-numeric:tabular-nums}
.fact b small{font-size:11px;color:var(--ink2);margin-left:4px;font-family:var(--ui)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.tag{border:1px solid var(--l3);border-radius:5px;padding:2px 8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.grp{margin:0 0 20px}
.grp h3{font-weight:400;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.cr{display:flex;gap:10px;align-items:center;min-height:76px;padding:6px 10px 6px 6px;background:var(--lane);border:1px solid var(--l1);border-radius:12px;width:100%}
.cr svg{width:44px;height:64px;flex:none}
.cr b{display:block;font-family:var(--disp);font-weight:400;font-size:12px;letter-spacing:.04em}
.cr i{display:block;font-style:italic;color:var(--ink2);font-size:11px}
.cr em{display:block;font-style:normal;color:var(--ink2);font-size:11px}
.cr:hover{border-color:var(--l5)}
.cr[aria-current=true]{background:var(--sel);border-color:var(--k)}
.foot{color:var(--ink2);border-top:1px solid var(--l1);padding-top:14px;max-width:90ch}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:16px}header{padding:16px}
 nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}nav h2{display:none}.pl{width:auto;flex:none}h2.name{font-size:28px}}
</style>
</head>
<body>
<header>
  <h1>Flora specimens</h1>
  <p>Fifteen plants put together from kit parts, each beside the creatures it would meet. Drawings and proposed numbers: none of this runs in the tank yet. Lengths are in tank units, where a plain creature is 1 long.</p>
</header>
<div class="wrap">
  <nav id="nav" aria-label="Plants"></nav>
  <main id="main"><p class="cap">Loading specimens</p></main>
</div>
<script>
(async function(){
"use strict";
const $=(t,a,h)=>{const e=document.createElement(t);for(const k in a||{})e.setAttribute(k,a[k]);if(h!=null)e.innerHTML=h;return e};
const NS="http://www.w3.org/2000/svg",S=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a||{})e.setAttribute(k,a[k]);return e};
let D;try{D=await (await fetch("flora.json")).json()}catch(e){document.getElementById("main").innerHTML='<p class="cap">The specimen data did not load</p>';return}
const P=D.plants,C=D.creatures,KIND={food:"Food",trapper:"Trappers",chain:"Chain"},KIND1={food:"Food plant",trapper:"Trapper",chain:"Chain plant"};
const thumb=(o,cls)=>'<svg class="art '+(cls||"")+'" viewBox="'+o.vb+'" aria-hidden="true">'+o.g+'</svg>';
const nav=document.getElementById("nav"),main=document.getElementById("main");
for(const k of ["food","trapper","chain"]){nav.append($("h2",{class:"cap"},KIND[k]));
  for(const p of P.filter(p=>p.kind===k)){const b=$("button",{class:"pl","data-key":p.key,style:"--k:var(--"+k+")"},thumb(p)+"<span>"+p.name+"</span>");b.onclick=()=>{location.hash=p.key};nav.append(b)}}
const fmt=n=>(Math.round(n*10)/10).toFixed(n%1?1:0);
const FACT={height:["Height","long"],size:["Body","long"],reach:["Reach","long"],hold:["Holds for","s"],digest:["Digests in","s"],jaw:["Jaw","×"],bites:["Bites",""],regrow:["Regrows in","s"],meal:["Each bite","weight"],near:["Within","long"],count:["After","meals"],bloom:["Blooms for","s"]};
const TRIG={carcass:"A carcass",meal:"A meal eaten",meals:"Meals eaten",walker:"A walker",trapper:"A fed trapper"};
const TAG={air:"Takes what rides high",ground:"On the floor",flat:"Seen from above",cover:"Gives cover",tree:"Tree"};
let run=0,cur=null,pick=null;
function show(key){
  const p=P.find(x=>x.key===key)||P[0];cur=p;run++;
  document.documentElement.style.setProperty("--k","var(--"+p.kind+")");
  for(const b of nav.children)if(b.dataset.key)b.setAttribute("aria-current",b.dataset.key===p.key);
  main.innerHTML="";
  main.append($("div",{class:"head"},'<span class="cap kind">'+KIND1[p.kind]+'</span><span class="cap">'+p.segs.toLocaleString()+' line segments · kit parts '+p.kit.join(" ")+'</span>'));
  main.append($("h2",{class:"name"},p.name),$("p",{class:"role"},p.role));
  const st=$("div",{class:"stage"});st.append(S("svg",{viewBox:"0 0 1000 560",role:"img","aria-label":p.name+" drawn to scale beside a creature",id:"sv"}));
  st.append($("div",{class:"bar"},'<button class="play" id="play" aria-pressed="false">Play</button><div class="status" id="status" aria-live="polite"></div><div class="prog"><i id="prog"></i></div>'));
  main.append(st);
  const e=p.eco,facts=$("div",{class:"facts"});
  if(e.trigger)facts.append($("div",{class:"fact"},'<span class="cap">Set off by</span><b style="font-size:14px;line-height:1.9">'+TRIG[e.trigger]+'</b>'));
  for(const k in FACT)if(typeof e[k]==="number"&&!(k==="size"&&e.size===e.height))facts.append($("div",{class:"fact"},'<span class="cap">'+FACT[k][0]+'</span><b>'+(k==="jaw"?e[k].toFixed(2):fmt(e[k]))+'<small>'+FACT[k][1]+'</small></b>'));
  if(p.weight)facts.append($("div",{class:"fact"},'<span class="cap">Weight</span><b>'+fmt(p.weight)+'</b>'),$("div",{class:"fact"},'<span class="cap">Holds weights</span><b>'+(p.weight/(D.band[1]*e.jaw)).toFixed(1)+"–"+(p.weight/(D.band[0]*e.jaw)).toFixed(1)+'</b>'));
  if(e.gives)facts.append($("div",{class:"fact"},'<span class="cap">Gives</span><b style="font-size:14px;line-height:1.9">'+e.gives[0].toUpperCase()+e.gives.slice(1)+'</b>'));
  main.append(facts);
  const tags=$("div",{class:"tags"});for(const k in TAG)if(e[k])tags.append($("span",{class:"tag"},TAG[k]));if(tags.children.length)main.append(tags);
  pick=null;
  for(const g of p.groups){const sec=$("section",{class:"grp"});sec.append($("h3",{class:"cap"},g.title));const cs=$("div",{class:"cards"});
    for(const it of g.items){const c=C[it.key],b=$("button",{class:"cr"},thumb(c)+'<span><b>'+c.name+'</b><i>'+c.sci+'</i><em>'+it.note+'</em></span>');
      b.onclick=()=>{pick={key:it.key,act:g.act};for(const x of main.querySelectorAll(".cr"))x.setAttribute("aria-current",x===b);run++;stage();play()};
      if(!pick){pick={key:it.key,act:g.act};b.setAttribute("aria-current","true")}cs.append(b)}
    sec.append(cs);main.append(sec)}
  main.append($("p",{class:"foot"},p.kind==="trapper"?"A trap holds what the tank's weight rule lets a hunter take: prey between a "+D.band[1]+"th and half its own weight, widened by its jaw. Anything heavier breaks free; anything lighter is not worth closing for. A creature's weight is its length cubed.":p.kind==="food"?"Grazers are the tank species that already graze on wisps. Each bite is a meal; the plant grows its bites back one at a time.":"A chain plant does nothing until its trigger happens within range. The creatures here are examples of what sets it off and what gains from it."));
  document.getElementById("play").onclick=play;stage();
}
let G=null;
function stage(){
  const p=cur,e=p.eco,sv=document.getElementById("sv");sv.innerHTML="";
  const c=C[pick.key],gy=500,span=Math.max(e.flat?e.size:e.height,c.len*0.5,1.2),U=Math.min(170,430/span,e.near?330/e.near:1e9,e.reach?300/e.reach:1e9,430/c.len);
  sv.append(S("line",{x1:0,y1:gy,x2:1000,y2:gy,stroke:"var(--l5)"}));
  const top=Math.ceil(span*2)/2;
  for(let v=0;v<=top+1e-6;v+=0.5){const y=gy-v*U;if(y<24)break;sv.append(S("line",{x1:44,y1:y,x2:v%1?52:60,y2:y,stroke:"var(--l5)"}));if(!(v%1)){const t=S("text",{x:16,y:y+4});t.textContent=v.toFixed(0);sv.append(t)}}
  sv.append(S("line",{x1:44,y1:gy,x2:44,y2:Math.max(24,gy-top*U),stroke:"var(--l5)"}));
  const px=650,po=S("g",{}),pg=S("g",{class:"art"});pg.innerHTML=p.g;pg.style.color="var(--ink)";po.append(pg);sv.append(po);
  let b=pg.getBBox();const ps=e.flat?e.size*U/b.width:e.height*U/b.height,py=e.flat?gy-12-b.height*ps:gy-b.height*ps;
  po.setAttribute("transform","translate("+(px-(b.x+b.width/2)*ps)+" "+(py-b.y*ps)+") scale("+ps+")");
  const hy=e.flat?gy-12-b.height*ps/2:e.ground?gy-0.25*e.height*U:gy-(e.tree?0.6:0.85)*e.height*U;
  const ring=S("circle",{cx:px,cy:e.near?gy:hy,r:(e.reach||e.near||0)*U,fill:"none",stroke:"var(--k)","stroke-dasharray":"2 6",opacity:(e.reach||e.near)?0.7:0});sv.append(ring);
  if(e.reach||e.near){const t=S("text",{x:px+(e.reach||e.near)*U*0.72+6,y:(e.near?gy:hy)-(e.reach||e.near)*U*0.72-4});t.textContent=e.reach?"REACH":"RANGE";sv.append(t)}
  const dots=S("g",{});for(let i=0;i<7;i++){const a=i*0.9+0.4,r=(0.25+0.09*i)*U;dots.append(S("circle",{cx:px+Math.cos(a)*r*1.6,cy:Math.min(gy-6,hy+Math.sin(a)*r),r:3,fill:"var(--k)",opacity:0}))}sv.append(dots);
  const cg=S("g",{class:"art"});cg.innerHTML=c.g;cg.style.color="var(--ink)";sv.append(cg);b=cg.getBBox();
  const cs=c.len*U/b.height,half=b.width*cs/2,cy=e.near&&pick.act==="trigger"?gy-half-4:Math.min(gy-half-4,hy);
  const place=(x,y,o,jit)=>{cg.setAttribute("transform","translate("+x+" "+(y+(jit||0))+") rotate(90) scale("+cs+") translate("+(-(b.x+b.width/2))+" "+(-(b.y+b.height/2))+")");cg.style.opacity=o==null?1:o};
  const lab=S("text",{x:70,y:28});lab.textContent=c.name.toUpperCase()+" · "+c.len+" LONG";sv.append(lab);
  G={pg,cg,ring,dots,place,x0:70+c.len*U/2,cy,hx:px-(e.flat?0:Math.min(60,half)),hy:cy,px,U,c};
  place(G.x0,cy);pg.style.opacity=1;say("<b>READY</b> · "+c.name+" approaches");bar(0);
  document.getElementById("play").setAttribute("aria-pressed","false");
}
const say=h=>{document.getElementById("status").innerHTML=h},bar=v=>{document.getElementById("prog").style.width=(v*100)+"%"};
const shown=s=>Math.max(0.9,Math.min(4,s/5));
function play(){
  const id=++run,p=cur,e=p.eco,g=G,act=pick.act,name=g.c.name,btn=document.getElementById("play");btn.setAttribute("aria-pressed","true");
  const steps=[],lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
  const step=(dur,text,tick,secs)=>steps.push({dur,text,tick,secs});
  const tint=on=>{g.pg.style.color=on?"var(--k)":"var(--ink)"},shut=v=>{g.pg.style.transformBox="fill-box";g.pg.style.transformOrigin="50% 100%";g.pg.style.transform="scale("+(1-0.1*v)+","+(1-0.04*v)+")"};
  const exit=1040;
  g.place(g.x0,g.cy);tint(false);shut(0);g.pg.style.opacity=1;for(const d of g.dots.children)d.setAttribute("opacity",0);
  step(1.6,"<b>APPROACH</b> · "+name,t=>g.place(lerp(g.x0,g.hx,ease(t)),g.cy));
  if(act==="hold"){step(0.25,"<b>SHUT</b>",t=>{shut(t);tint(true)});
    step(shown(e.hold),"<b>HOLD</b>",t=>g.place(g.hx,g.cy,1,Math.sin(t*60)*3*(1-t)),e.hold);
    step(shown(e.digest),"<b>DIGEST</b>",t=>g.place(g.hx,g.cy,1-t),e.digest);
    step(0.6,"<b>OPEN</b> · ready again",t=>{shut(1-t);if(t>0.9)tint(false)});}
  else if(act==="break"){step(0.25,"<b>SHUT</b>",t=>{shut(t);tint(true)});
    step(0.9,"<b>STRUGGLE</b> · too heavy to hold",t=>g.place(g.hx,g.cy,1,Math.sin(t*50)*7));
    step(1.2,"<b>BROKE FREE</b> · "+name+" gets away",t=>{shut(1-Math.min(1,t*3));if(t>0.3)tint(false);g.place(lerp(g.hx,exit,ease(t)),g.cy)});}
  else if(act==="pass"){step(1.6,p.kind==="food"?"<b>PASSES BY</b> · eats no plants":"<b>STAYS OPEN</b> · too small to close for",t=>g.place(lerp(g.hx,exit,ease(t)),g.cy));}
  else if(act==="graze"){const n=Math.min(e.bites,3);
    for(let i=1;i<=n;i++)step(0.6,"<b>BITE "+i+"</b> · "+(e.bites-i)+" of "+e.bites+" left",t=>{g.pg.style.opacity=1-0.7*(i-1+t)/e.bites;g.place(g.hx+Math.sin(t*6.28)*6,g.cy)});
    step(1.2,"<b>FED</b> · "+name+" moves on",t=>g.place(lerp(g.hx,exit,ease(t)),g.cy));
    step(shown(e.regrow*n),"<b>REGROW</b>",t=>{g.pg.style.opacity=1-0.7*n/e.bites*(1-t)},e.regrow*n);}
  else if(act==="trigger"){step(0.5,"<b>SET OFF</b> · "+TRIG[e.trigger].toLowerCase()+" in range",t=>{g.ring.setAttribute("opacity",0.7+0.3*Math.sin(t*12));tint(true)});
    step(1.2,"<b>"+name.toUpperCase()+"</b> moves on",t=>g.place(lerp(g.hx,exit,ease(t)),g.cy));
    step(shown(e.bloom),"<b>BLOOM</b> · gives "+e.gives,t=>{[...g.dots.children].forEach((d,i)=>d.setAttribute("opacity",t*7>i?1:0))},e.bloom);
    step(0.6,"<b>SPENT</b> · waits for the next",t=>{if(t>0.5)tint(false)});}
  else{const sh=p.key==="thorn-nurse";tint(true);for(const d of g.dots.children)d.setAttribute("opacity",sh?0:1);
    if(sh)step(2.4,"<b>SHELTER</b> · hunters cannot follow it in",t=>g.place(g.px-10,g.cy,1,Math.sin(t*20)*2));
    else{step(2.1,"<b>FEEDS</b> · on the "+e.gives,t=>{[...g.dots.children].forEach((d,i)=>d.setAttribute("opacity",t*7>i?0:1));g.place(g.hx+Math.sin(t*12)*8,g.cy)});
      step(1.2,"<b>FED</b> · "+name+" moves on",t=>g.place(lerp(g.hx,exit,ease(t)),g.cy));}
    step(0.4,"<b>DONE</b>",t=>{if(t>0.5)tint(false)});}
  let i=0,t0=performance.now();
  (function frame(now){if(id!==run)return;const s=steps[i];let t=Math.min(1,(now-t0)/1000/s.dur);s.tick(t);
    say(s.text+(s.secs?' · <span style="font-variant-numeric:tabular-nums">'+(s.secs*t).toFixed(1)+" / "+s.secs.toFixed(1)+" s</span>":""));bar(s.secs?t:0);
    if(t>=1){i++;t0=now;if(i>=steps.length){btn.setAttribute("aria-pressed","false");bar(0);return}}
    requestAnimationFrame(frame)})(t0);
}
const route=()=>show(location.hash.slice(1));window.addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
