/* Forge Scenes: the world generator's place, the tank's creatures and the grown plants, made to be looked at. No game: a scene is a

#stage { position: fixed; inset: var(--top, 0px) 0 0 0; display: grid; place-items: center; }
#frame { position: relative; width: 100%; height: 100%; }
body.cine #frame { width: var(--cw); height: var(--ch); box-shadow: 0 0 0 1px var(--l2); }

#scenes::-webkit-scrollbar { display: none; }

  cursor: pointer; white-space: nowrap; letter-spacing: .04em; }
button:hover { color: var(--ink); border-color: var(--l3); }
button[aria-pressed="true"] { color: #111; background: var(--ink); border-color: var(--ink); }
button.rec[aria-pressed="true"] { background: #ff4d5e; border-color: #ff4d5e; color: #fff; }

#tools { display: flex; gap: 6px; }
#sub { position: fixed; left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: center; z-index: 3; flex-wrap: wrap; max-width: calc(100% - 28px); }

#show { position: fixed; right: 12px; top: 12px; z-index: 4; display: none; opacity: .5; }
body.bare #bar, body.bare #sub { display: none; }
body.bare #show { display: block; }
#load[hidden] { display: none; }
#load { position: fixed; inset: 0; display: grid; place-items: center; font: 400 12px var(--mono); letter-spacing: .2em; color: var(--ink2); z-index: 5; background: #0b0b0c; }
@media (max-width: 720px) { #bar { flex-wrap: wrap; } #bar b { font-size: 11px; } #scenes { order: 3; flex-basis: 100%; } }
