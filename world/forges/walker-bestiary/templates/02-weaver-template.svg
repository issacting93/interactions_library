<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 1480 990" width="1480" height="990" data-sheet-transform="translate(40 64) scale(2)"><title>Weaver creature template</title><g id="guides" inkscape:groupmode="layer" inkscape:label="Guides (locked)" sodipodi:insensitive="true"><rect width="1480" height="990" fill="#161618"/><g transform="translate(40 64) scale(2)"><rect x="0" y="0" width="400" height="400" fill="none" stroke="#2e2d2a" stroke-width="0.6"/><path d="M25 0V400M0 25H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M50 0V400M0 50H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M75 0V400M0 75H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M100 0V400M0 100H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M125 0V400M0 125H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M150 0V400M0 150H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M175 0V400M0 175H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M200 0V400M0 200H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M225 0V400M0 225H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M250 0V400M0 250H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M275 0V400M0 275H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M300 0V400M0 300H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M325 0V400M0 325H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M350 0V400M0 350H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M375 0V400M0 375H400" stroke="#1f1f22" stroke-width="0.5"/><path d="M200 0V400" stroke="#3a3935" stroke-width="0.6" stroke-dasharray="4 3"/><path d="M200 6l-4 7h8z" fill="#8a867d"/><text x="206" y="13" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="6.5" text-anchor="start">front</text><text x="100" y="389" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="6.5" text-anchor="middle">left side: draw here</text><text x="300" y="389" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="6.5" text-anchor="middle">right side: mirrored</text><g fill="none" stroke="#5be39a" stroke-width="0.7" stroke-dasharray="2 2.5" opacity="0.28"><path d="M 214.7 139.4 L 227.5 126.7 L 231.0 124.4 L 235.1 124.2 L 238.8 126.1 L 241.1 129.6 L 241.3 133.7 L 239.4 137.4 L 228.1 151.4 Z"/><path d="M 229.9 124.8 L 277.3 103.4 L 280.6 102.8 L 283.8 103.9 L 286.0 106.4 L 286.7 109.7 L 285.6 112.9 L 283.0 115.1 L 237.0 139.2 Z"/><path d="M 274.8 105.6 L 305.1 63.3 L 307.1 61.6 L 309.6 61.1 L 312.1 62.0 L 313.8 63.9 L 314.3 66.5 L 313.4 68.9 L 285.6 112.9 Z"/><path d="M 304.3 65.4 L 313.9 22.3 L 314.2 21.6 L 314.8 21.2 L 315.6 21.1 L 316.3 21.4 L 316.8 22.0 L 316.9 22.8 L 314.2 66.8 Z"/><path d="M 227.5 272.2 L 237.0 285.1 L 238.7 288.8 L 238.4 293.0 L 236.0 296.3 L 232.2 298.1 L 228.1 297.7 L 224.7 295.4 L 213.7 283.7 Z"/><path d="M 238.3 287.2 L 253.4 328.6 L 253.8 331.9 L 252.5 335.0 L 249.8 337.0 L 246.4 337.5 L 243.3 336.1 L 241.3 333.5 L 223.4 293.2 Z"/><path d="M 251.9 326.3 L 282.5 358.0 L 283.8 360.2 L 283.8 362.8 L 282.6 365.1 L 280.4 366.4 L 277.8 366.4 L 275.5 365.2 L 242.8 335.7 Z"/><path d="M 280.7 356.9 L 315.2 373.2 L 315.8 373.6 L 316.2 374.3 L 316.1 375.1 L 315.7 375.7 L 315.0 376.1 L 314.2 376.0 L 277.3 366.3 Z"/></g></g><text x="880" y="74" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" text-anchor="start">Creature template</text><text x="880" y="108" fill="#ece8de" font-family="Martian Mono, IBM Plex Mono, Menlo, monospace" font-size="28" text-anchor="start">Weaver</text><text x="880" y="136" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" text-anchor="start">4 long legs, two reaching forward and two back</text><text x="880" y="158" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">4 bones per leg (FABRIK)</text><text x="880" y="175" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">alternate gait (diagonal pairs)</text><text x="880" y="192" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">weaver: lays a silk dragline</text><text x="880" y="225" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">1  Top view, front up. Draw the body on the centre line and the</text><text x="880" y="246" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    left limbs only. I mirror the right side.</text><text x="880" y="267" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">2  Each bone has a group between two joint dots: draw that stretch</text><text x="880" y="288" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    as one closed shape. Or draw the whole limb as one shape in the</text><text x="880" y="309" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    limb group and I'll cut it at the joints.</text><text x="880" y="330" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">3  The amber line through each limb is its spine; the bones follow</text><text x="880" y="351" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    it. Unlock Skeleton to move the joints.</text><text x="880" y="372" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">4  Body parts can overlap. Keep each one a closed shape.</text><text x="880" y="393" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">5  Optional pieces wait in the tray under the sheet. Drag each one</text><text x="880" y="414" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    onto the creature, or delete it.</text><text x="880" y="435" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">6  Fill in the Notes, save as SVG, and send it back.</text><text x="880" y="462" fill="#e8b04a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">Like the Hook Weaver: hip knot, arm, elbow, blade. The blade is the</text><text x="880" y="481" fill="#e8b04a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">last bone.</text><text x="880" y="517" fill="#ece8de" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" text-anchor="start">Groups</text><text x="880" y="541" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">head</text><text x="1010" y="541" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">body part</text><text x="880" y="561" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">body</text><text x="1010" y="561" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">body part</text><text x="880" y="581" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">leg-1</text><text x="1010" y="581" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">coxa · femur · tibia · tarsus</text><text x="880" y="601" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">leg-2</text><text x="1010" y="601" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">coxa · femur · tibia · tarsus</text><text x="880" y="621" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">optional:  ornaments · accent · veil · halo · eyes · silk (spinneret)</text></g><g id="tray" inkscape:groupmode="layer" inkscape:label="Optional tray labels (locked)" sodipodi:insensitive="true"><g transform="translate(40 64) scale(2)"><rect x="4" y="404" width="334" height="30" fill="none" stroke="#2e2d2a" stroke-width="0.5"/><text x="4" y="401" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="start">optional pieces: drag each onto the creature, or delete it</text><text x="22" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">ornaments</text><text x="76" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">accent</text><text x="130" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">veil</text><text x="184" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">halo</text><text x="238" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">eyes</text><text x="292" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">silk</text></g></g><g id="drawing" inkscape:groupmode="layer" inkscape:label="Drawing" stroke-linejoin="round" stroke-linecap="round"><g transform="translate(40 64) scale(2)"><g id="body" inkscape:label="body (centre line)"><g id="weaver--head" inkscape:label="head"><path fill="none" stroke="#5be39a" stroke-width="0.9" stroke-dasharray="3.5 2.5" d="M224.0 116.0L223.6 120.2L222.6 124.2L220.8 128.0L218.4 131.4L215.4 134.4L212.0 136.8L208.2 138.6L204.2 139.6L200.0 140.0L195.8 139.6L191.8 138.6L188.0 136.8L184.6 134.4L181.6 131.4L179.2 128.0L177.4 124.2L176.4 120.2L176.0 116.0L176.4 111.8L177.4 107.8L179.2 104.0L181.6 100.6L184.6 97.6L188.0 95.2L191.8 93.4L195.8 92.4L200.0 92.0L204.2 92.4L208.2 93.4L212.0 95.2L215.4 97.6L218.4 100.6L220.8 104.0L222.6 107.8L223.6 111.8Z"/><