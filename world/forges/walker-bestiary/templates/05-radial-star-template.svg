e</text><text x="300" y="389" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="6.5" text-anchor="middle">right side: mirrored</text><g fill="none" stroke="#5be39a" stroke-width="0.7" stroke-dasharray="2 2.5" opacity="0.28"><path d="M 232.5 165.7 L 246.8 137.0 L 248.0 132.5 L 246.8 128.0 L 243.5 124.7 L 239.0 123.5 L 234.5 124.7 L 231.2 128.0 L 213.5 154.7 Z"/><path d="M 246.8 137.0 L 261.1 108.3 L 262.0 104.7 L 261.1 101.2 L 258.5 98.7 L 255.0 97.7 L 251.5 98.7 L 249.0 101.2 L 231.2 128.0 Z"/><path d="M 261.1 108.3 L 273.3 83.0 L 274.0 80.5 L 273.3 78.0 L 271.5 76.2 L 269.0 75.5 L 266.5 76.2 L 264.7 78.0 L 249.0 101.2 Z"/><path d="M 273.3 83.0 L 282.3 60.5 L 282.5 59.7 L 282.3 59.0 L 281.7 58.4 L 281.0 58.2 L 280.3 58.4 L 279.7 59.0 L 264.7 78.0 Z"/><path d="M 246.0 211.0 L 278.0 209.0 L 282.5 207.8 L 285.8 204.5 L 287.0 200.0 L 285.8 195.5 L 282.5 192.2 L 278.0 191.0 L 246.0 189.0 Z"/><path d="M 278.0 209.0 L 310.0 207.1 L 313.5 206.0 L 316.1 203.5 L 317.0 200.0 L 316.1 196.5 L 313.5 194.0 L 310.1 193.0 L 278.0 191.0 Z"/><path d="M 310.0 207.1 L 338.0 205.0 L 340.5 204.3 L 342.3 202.5 L 343.0 200.0 L 342.3 197.5 L 340.5 195.7 L 338.0 195.0 L 310.1 193.0 Z"/><path d="M 338.0 205.0 L 362.0 201.5 L 362.7 201.3 L 363.3 200.8 L 363.5 200.0 L 363.3 199.2 L 362.8 198.7 L 362.0 198.5 L 338.0 195.0 Z"/><path d="M 213.5 245.3 L 231.2 272.0 L 234.5 275.3 L 239.0 276.5 L 243.5 275.3 L 246.8 272.0 L 248.0 267.5 L 246.8 263.0 L 232.5 234.3 Z"/><path d="M 231.2 272.0 L 248.9 298.8 L 251.5 301.3 L 255.0 302.3 L 258.5 301.3 L 261.1 298.8 L 262.0 295.3 L 261.1 291.8 L 246.8 263.0 Z"/><path d="M 248.9 298.8 L 264.7 322.0 L 266.5 323.8 L 269.0 324.5 L 271.5 323.8 L 273.3 322.0 L 274.0 319.5 L 273.3 317.0 L 261.1 291.8 Z"/><path d="M 264.7 322.0 L 279.7 341.0 L 280.2 341.6 L 281.0 341.8 L 281.8 341.6 L 282.3 341.0 L 282.5 340.3 L 282.3 339.5 L 273.3 317.0 Z"/><path d="M 167.5 234.3 L 153.2 263.0 L 152.0 267.5 L 153.2 272.0 L 156.5 275.3 L 161.0 276.5 L 165.5 275.3 L 168.8 272.0 L 186.5 245.3 Z"/><path d="M 153.2 263.0 L 138.9 291.7 L 138.0 295.3 L 138.9 298.8 L 141.5 301.3 L 145.0 302.3 L 148.5 301.3 L 151.0 298.8 L 168.8 272.0 Z"/><path d="M 138.9 291.7 L 126.7 317.0 L 126.0 319.5 L 126.7 322.0 L 128.5 323.8 L 131.0 324.5 L 133.5 323.8 L 135.3 322.0 L 151.0 298.8 Z"/><path d="M 126.7 317.0 L 117.7 339.5 L 117.5 340.3 L 117.7 341.0 L 118.3 341.6 L 119.0 341.8 L 119.7 341.6 L 120.3 341.0 L 135.3 322.0 Z"/><path d="M 154.0 189.0 L 122.0 191.0 L 117.5 192.2 L 114.2 195.5 L 113.0 200.0 L 114.2 204.5 L 117.5 207.8 L 122.0 209.0 L 154.0 211.0 Z"/><path d="M 122.0 191.0 L 90.0 192.9 L 86.5 194.0 L 83.9 196.5 L 83.0 200.0 L 83.9 203.5 L 86.5 206.0 L 89.9 207.0 L 122.0 209.0 Z"/><path d="M 90.0 192.9 L 62.0 195.0 L 59.5 195.7 L 57.7 197.5 L 57.0 200.0 L 57.7 202.5 L 59.5 204.3 L 62.0 205.0 L 89.9 207.0 Z"/><path d="M 62.0 195.0 L 38.0 198.5 L 37.3 198.7 L 36.7 199.2 L 36.5 200.0 L 36.7 200.8 L 37.2 201.3 L 38.0 201.5 L 62.0 205.0 Z"/></g></g><text x="880" y="74" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" text-anchor="start">Creature template</text><text x="880" y="108" fill="#ece8de" font-family="Martian Mono, IBM Plex Mono, Menlo, monospace" font-size="28" text-anchor="start">Radial star</text><text x="880" y="136" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" text-anchor="start">6 rays around a round body, no front or back</text><text x="880" y="158" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">4 bones per ray (FABRIK)</text><text x="880" y="175" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">alternate gait (every other ray)</text><text x="880" y="192" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">slides any direction while it spins</text><text x="880" y="225" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">1  Top view, front up. Draw the body on the centre line and the</text><text x="880" y="246" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    left limbs only. I mirror the right side.</text><text x="880" y="267" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">2  Each bone has a group between two joint dots: draw that stretch</text><text x="880" y="288" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    as one closed shape. Or draw the whole limb as one shape in the</text><text x="880" y="309" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    limb group and I'll cut it at the joints.</text><text x="880" y="330" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">3  The amber line through each limb is its spine; the bones follow</text><text x="880" y="351" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    it. Unlock Skeleton to move the joints.</text><text x="880" y="372" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">4  Body parts can overlap. Keep each one a closed shape.</text><text x="880" y="393" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">5  Optional pieces wait in the tray under the sheet. Drag each one</text><text x="880" y="414" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">    onto the creature, or delete it.</text><text x="880" y="435" fill="#cfcac0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">6  Fill in the Notes, save as SVG, and send it back.</text><text x="880" y="462" fill="#e8b04a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">Draw one ray. It repeats six times around the body; the faint rays</text><text x="880" y="481" fill="#e8b04a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">show where.</text><text x="880" y="517" fill="#ece8de" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" text-anchor="start">Groups</text><text x="880" y="541" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">body</text><text x="1010" y="541" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">body part</text><text x="880" y="561" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">core</text><text x="1010" y="561" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">body part</text><text x="880" y="581" fill="#5be39a" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" text-anchor="start">ray</text><text x="1010" y="581" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">coxa · femur · tibia · tarsus</text><text x="880" y="601" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" text-anchor="start">optional:  ornaments · accent · veil · halo · eyes</text></g><g id="tray" inkscape:groupmode="layer" inkscape:label="Optional tray labels (locked)" sodipodi:insensitive="true"><g transform="translate(40 64) scale(2)"><rect x="4" y="404" width="280" height="30" fill="none" stroke="#2e2d2a" stroke-width="0.5"/><text x="4" y="401" fill="#8a867d" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="start">optional pieces: drag each onto the creature, or delete it</text><text x="22" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">ornaments</text><text x="76" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">accent</text><text x="130" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">veil</text><text x="184" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">halo</text><text x="238" y="432" fill="#5cc8e0" font-family="IBM Plex Mono, Menlo, monospace" font-size="5.5" text-anchor="middle">eyes</text></g></g><g id="drawing" inkscape:groupmode="layer" inkscape:label="Drawing" stroke-linejoin="round" stroke-linecap="round"><g transform="translate(40 64) scale(2)"><g id="body" inkscape:label="body (centre line)"><g id="radial-star--body" inkscape:label="body"><path fill="none" stroke="#5be39a" stroke-width="0.9" stroke-dasharray="3.5 2.5" d="M248.0 200.0L247.3 208.3L245.1 216.4L241.6 224.0L236.8 230.9L230.9 236.8L224.0 241.6L216.4 245.1L208.3 247.3L200.0 248.0L191.7 247.3L183.6 245.1L176.0 241.6L169.1 236.8L163.2 230.9L158.4 224.0L154.9 216.4L152.7 208.3L152.0 200.0L152.7 191.7L154.9 183.6L158.4 176.0L163.2 169.1L169.1 163.2L176.0 158.4L183.6 154.9L191.7 152.7L200.0 152.0L208.3 152.7L216.4 154.9L224.0 158.4L230.9 163.2L236.8 169.1L241.6 176.0L245.1 183.6L247.3 191.7Z"/></g><g id="radial-star--core" inkscape:label="core"><path fill="none" stroke="#5be39a" stroke-width="0.9" stroke-dasharray="3.5 2.5" d="M226.0 200.0L225.6 204.5L224.4 208.9L222.5 213.0L219.9 216.7L216.7 219.9L213.0 222.5L208.9 224.4L204.5 225.6L200.0 226.0L195.5 225.6L191.1 224.4L187.0 222.5L183.3 219.9L180.1 216.7L177.5 213.0L175.6 208.9L174.4 204.5L174.0 200.0L174.4 195.5L175.6 191.1L177.5 187.0L180.1 183.3L183.3 180.1L187.0 177.5L191.1 175.6L195.5 174.4L200.0 174.0L204.5 174.4L208.9 175.6L213.0 177.5L216.7 180.1L219.9 183.3L222.5 187.0L224.4 191.1L225.6 195.5Z"/></g></g><g id="limbs" inkscape:label="left limbs"><g id="radial-star--ray" inkscape:label="ray"><g id="radial-star--ray--coxa" inkscape:label="ray--coxa"><path fill="none" stroke="#5be39a" stroke-wi