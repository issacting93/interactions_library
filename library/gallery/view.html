<!doctype html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sci-fi Gallery — View</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap">
<link rel="stylesheet" href="../../shared/look/forge-ds/tokens.css">
<link rel="stylesheet" href="../../shared/look/forge-ds/components.css">
<link rel="stylesheet" href="./gallery.css">
<style>
  /* View: the design running, filling the window. The strip hides with F. */
  body { background: var(--well); }
  .f-strip { transition: none; }
  body.is-bare .f-strip { display: none; }
  .stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  body.is-bare .stage { padding: 0; }
  #live { position: relative; }
  .nm { font-family: var(--font-display); font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .missing { padding: 40px; }
</style>
</head>
<body>
  <header class="f-strip">
    <a class="sg-brand" href="./index.html">Sci-fi <b>Gallery</b></a>
    <span class="f-strip__where" id="ix">View</span>
    <span class="nm" id="nm"></span>
    <span class="f-spacer"></span>
    <span class="f-micro"><span class="f-kbd">←</span><span class="f-kbd">→</span> designs · <span class="f-kbd">F</span> full frame · <span class="f-kbd">E</span> edit</span>
    <div class="f-btns">
      <a class="f-btn is-dense" id="prev" aria-label="Previous design">←</a>
      <a class="f-btn is-dense" id="next" aria-label="Next design">→</a>
      <a class="f-btn is-dense" id="edit">Edit</a>
      <a class="f-btn is-dense" id="back" href="./index.html">Gallery</a>
    </div>
  </header>
  <div class="stage" id="stage"><div id="live"></div></div>

<script src="../components/catalog.js"></script>
<script src="./designs.js"></script>
<script src="../../shared/engine/rng.js"></script>
<script src="./gallery-core.js"></script>
<script>
(function () {
  const G = window.SciFiGallery, $ = (id) => document.getElementById(id);
  const all = G.all();
  const d = G.get(new URLSearchParams(location.search).get("design")) || all[0];
  if (!d) { $("stage").innerHTML = '<div class="f-empty missing"><span>No design to show · make one in the Bench</span></div>'; return; }
  const i = all.indexOf(all.find((x) => x.id === d.id)), n = all.length;
  const at = (k) => "./view.html?design=" + encodeURIComponent(all[(i + k + n) % n].id) + (document.body.classList.contains("is-bare") ? "&bare=1" : "");
  document.title = "Sci-fi Gallery — " + d.name;
  $("nm").textContent = d.name; $("ix").textContent = `View · ${G.pad(i + 1)}/${G.pad(n)}`;
  $("edit").href = "./bench.html?design=" + encodeURIComponent(d.id);
  $("back").href = "./index.html?design=" + encodeURIComponent(d.id);
  if (new URLSearchParams(location.search).get("bare")) document.body.classList.add("is-bare");
  const ar = d.cols / d.rows;
  function fit() {
    const s = $("stage"), pad = document.body.classList.contains("is-bare") ? 0 : 24;
    const W = s.clientWidth - pad, H = s.clientHeight - pad, w = Math.min(W, H * ar);
    $("live").style.width = w + "px"; $("live").style.height = (w / ar) + "px";
  }
  fit(); new ResizeObserver(fit).observe($("stage"));
  G.live($("live"), d);
  $("prev").addEventListener("click", () => { location.href = at(-1); });
  $("next").addEventListener("click", () => { location.href = at(1); });
  // keys reach this page only when focus is not inside a part; click the strip to get them back
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") location.href = at(1);
    else if (e.key === "ArrowLeft") location.href = at(-1);
    else if (e.key === "f" || e.key === "F") { document.body.classList.toggle("is-bare"); fit(); }
    else if (e.key === "e" || e.key === "E") location.href = $("edit").href;
    else if (e.key === "Escape") { if (document.body.classList.contains("is-bare")) { document.body.classList.remove("is-bare"); fit(); } else location.href = $("back").href; }
  });
})();
</script>
</body>
</html>
