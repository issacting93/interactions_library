<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Ophanim</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one full-bleed instrument stage, HUD in the corners, a witness strip along the bottom. */
  :root {
    --bg: #0b0d12; --panel: #10131a; --ink: #e9ddc4; --dim: rgba(233,221,196,.46);
    --fire: #e3a948; --eye: #63c1ff;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --display: 'UnifrakturMaguntia', 'Old English Text MT', serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    display: flex; flex-direction: column;
    font: 500 11px/1.4 var(--mono); color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }
  .stage {
    flex: 1; min-height: 0; position: relative; touch-action: none;
    background-image: radial-gradient(rgba(233,221,196,.06) 1px, transparent 1px);
    background-size: 22px 22px; background-position: center;
  }
  svg#art { display: block; width: 100%; height: 100%; }
  #mech { transition: opacity 1.2s ease; }
  #mech.released { opacity: .3; }

  .hud {
    position: absolute; top: 14px; z-index: 2; display: flex; align-items: center; gap: 12px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  }
  #hudL { left: max(18px, env(safe-area-inset-left, 0px)); }
  #hudR { right: max(18px, env(safe-area-inset-right, 0px)); }
  .hud b { color: var(--ink); font-weight: 600; transition: color .6s; font-variant-numeric: tabular-nums; }
  .title { font: 400 22px/1 var(--display); letter-spacing: .02em; text-transform: none; color: var(--ink); }
  .title small { font: 500 10px/1 var(--mono); letter-spacing: .14em; color: var(--dim); margin-left: 8px; }
  body.released #hudState { color: var(--fire); }
  .cells { display: flex; gap: 3px; }
  .cell { width: 14px; height: 6px; border: 1px solid rgba(233,221,196,.35); border-radius: 1px; transition: background-color .3s, border-color .3s; }
  .cell.on { background: var(--ink); border-color: var(--ink); }
  .cell.hit { animation: hit .8s ease-out; }
  @keyframes hit { 0%, 40% { background: var(--fire); border-color: var(--fire); } }
  body.released .cell.on { background: var(--fire); border-color: var(--fire); }
  #gaze.met { color: var(--eye); }

  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
    letter-spacing: .14em; text-transform: uppercase; color: var(--dim); text-align: center;
    transition: opacity 1s; max-width: calc(100% - 32px);
  }
  .hint.gone { opacity: 0; }

  .feed {
    position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 14px; z-index: 2;
    width: 168px; aspect-ratio: 4 / 3; max-width: 40%;
    border: 1px solid rgba(233,221,196,.3); background: #000; overflow: hidden;
  }
  .feed video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: grayscale(1) contrast(1.1) brightness(.85); }
  .feed .box { position: absolute; border: 1px solid var(--eye); }
  .feed .box span { position: absolute; top: -13px; left: -1px; font-size: 9px; letter-spacing: .1em; color: var(--eye); white-space: nowrap; }
  .feed .cap { position: absolute; left: 6px; bottom: 4px; font-size: 9px; letter-spacing: .14em; color: var(--eye); }

  .strip {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding-block: 12px;
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    border-top: 1px solid rgba(233,221,196,.12); background: var(--panel);
    letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  }
  .strip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; min-height: 30px; align-items: center; }
  .chip {
    flex: none; min-width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(233,221,196,.5); border-radius: 50%; color: var(--ink);
    font-weight: 600; font-size: 11px; letter-spacing: 0; background: rgba(233,221,196,.06);
    animation: stamp .7s ease-out;
  }
  @keyframes stamp {
    0%   { transform: scale(.4); opacity: 0; border-color: var(--fire); color: var(--fire); }
    35%  { transform: scale(1);  opacity: 1; border-color: var(--fire); color: var(--fire); }
    100% { border-color: rgba(233,221,196,.5); color: var(--ink); }
  }
  #wstate { display: inline-block; min-width: 8ch; }
  #wstate.hidden { color: var(--eye); }
  button#camBtn {
    font: inherit; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    background: transparent; border: 1px solid rgba(233,221,196,.4); border-radius: 3px;
    padding: 7px 10px; cursor: pointer;
  }
  button#camBtn:hover { border-color: var(--eye); color: var(--eye); }
  button#camBtn:focus-visible { outline: 2px solid var(--eye); outline-offset: 2px; }
  button#camBtn[disabled] { opacity: .5; cursor: default; }
  .note { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 14px; z-index: 3; max-width: min(360px, calc(100% - 36px));
    background: var(--panel); border: 1px solid rgba(233,221,196,.25); padding: 10px 12px; line-height: 1.5;
    letter-spacing: .04em; color: var(--ink); }

  @media (max-width: 640px) {
    .hud { font-size: 10px; gap: 8px; top: 10px; }
    .title small, .cells, #trackWrap, .opt { display: none; }
    .strip { gap: 10px; font-size: 10px; }
    .feed { width: 112px; }
  }
  @media (prefers-reduced-motion: reduce) { .chip, .cell.hit { animation: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=UnifrakturMaguntia&display=swap">

<div class="stage" id="stage">
  <div class="hud" id="hudL">
    <span class="title">Ophanim<small>Do not fear</small></span>
    <span class="cells" id="cells"></span>
    <b id="hudState">STANDBY</b>
  </div>
  <div class="hud" id="hudR">
    <span>Gaze <b id="gaze">NONE</b></span>
    <span id="trackWrap">Track <b id="track">+0.00 +0.00</b></span>
  </div>
  <div class="hint" id="hint">Hover over the wheels to look at them</div>
  <div class="feed" id="feed" hidden>
    <video id="video" playsinline muted></video>
    <div id="boxes"></div>
    <span class="cap">● REC · WITNESS FEED</span>
  </div>
  <div class="note" id="note" hidden></div>

<svg id="art" viewBox="-300 -290 600 600" xmlns="http://www.w3.org/2000/svg" aria-label="Wheels within wheels, rims full of eyes">
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="field">
    <g id="plxHero"></g>
    <g id="plxBezel"></g>
    <g id="plxDotted"></g>
    <g id="plxAccent"></g>
    <g id="plxFrame"></g>
    <g id="plxReticleField"></g>
  </g>
  <g id="fx"></g>
  <g id="mech">
    <circle r="240" fill="none" stroke="rgba(233,221,196,.32)" stroke-width="2"/>
    <g id="ticks"></g>
    <g id="targets"></g>
    <circle id="gearB" r="200" fill="none" stroke="rgba(233,221,196,.2)" stroke-width="1.2" stroke-dasharray="2 10"/>
    <g id="gearA"><circle r="172" fill="none" stroke="rgba(233,221,196,.45)" stroke-width="1.4"/></g>
    <g id="aim">
      <circle r="29" fill="none" stroke="rgba(233,221,196,.4)" stroke-width="1.4"/>
      <circle r="17" fill="none" stroke="rgba(233,221,196,.75)" stroke-width="1.6"/>
      <circle r="9"  fill="none" stroke="rgba(233,221,196,.9)" stroke-width="1.8"/>
      <circle r="4.2" id="nucleusFill" fill="rgba(233,221,196,.3)"/>
    </g>
  </g>
  <g id="pad">
    <circle r="24" fill="#0e1117" stroke="rgba(233,221,196,.6)" stroke-width="1.2"/>
  </g>
  <!-- the hidden surveillance: a faint reticle that keeps tracking even when every eye is shut -->
  <g id="subject" opacity="0">
    <circle r="16" fill="none" stroke="#63c1ff" stroke-width=".8" stroke-dasharray="3 3"/>
    <path d="M-24 0H-19M19 0H24M0 -24V-19M0 19V24" stroke="#63c1ff" stroke-width=".8"/>
    <text id="subjLabel" x="20" y="-20" font-size="8" letter-spacing=".1em" fill="#63c1ff" font-family="IBM Plex Mono, ui-monospace, monospace">SUBJ 01</text>
  </g>
</svg>
</div>
<div class="strip">
  <span class="opt">Seals</span>
  <div class="chips" id="chips"></div>
  <span>Witness <b id="wstate">IDLE</b></span>
  <span class="opt">Subjects <b id="subjects">00</b></span>
  <button id="camBtn" type="button">Use camera</button>
  <span class="opt">Cycle <b id="cycle">01</b></span>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const art = $('art'), stage = $('stage');
const mech = $('mech'), fx = $('fx'), gearA = $('gearA'), gearB = $('gearB'), aim = $('aim');
const nucleusFill = $('nucleusFill'), targetsG = $('targets'), ticksG = $('ticks');
const hudState = $('hudState'), cellsEl = $('cells'), chipsEl = $('chips'), cycleEl = $('cycle');
const gazeEl = $('gaze'), trackEl = $('track'), wstateEl = $('wstate'), subjectsEl = $('subjects');
const subjectG = $('subject'), subjLabel = $('subjLabel'), hintEl = $('hint'), noteEl = $('note');

const N = 6, RADIUS = 174, TOLERANCE = 14;
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad2 = n => String(n).padStart(2, '0');
const EYE = '#63c1ff', FIRE = '#e3a948';

const SPEED = 1, DWELL = 440, AFTER_LOCK = 520, RELEASE_HOLD = 16000, UNWIND_STEP = 240, BETWEEN = 1600;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function inkify(markup) {
  return markup.replace(/(stroke|fill)="rgba\(236,232,222,([\d.]+)\)"/g, '$1="currentColor" $1-opacity="$2"');
}
function mount(id, cx, cy, nativeR, targetR, markup) {
  const ratio = targetR / nativeR;
  const g = el('g', { transform: `scale(${ratio.toFixed(5)}) translate(${(-cx).toFixed(3)} ${(-cy).toFixed(3)})` }, $(id));
  g.innerHTML = inkify(markup);
}

mount('plxHero', 264, 264, 260, 280, `
  <circle cx="264" cy="264" r="260"    fill="none" stroke="rgba(236,232,222,.5)" stroke-width="8"  stroke-dasharray="2 2"   opacity=".4"/>
  <circle cx="264" cy="264" r="235.47" fill="none" stroke="rgba(236,232,222,.5)" stroke-width="2"  stroke-dasharray="5 5"   opacity=".4"/>
  <circle cx="264" cy="264" r="221.98" fill="none" stroke="rgba(236,232,222,.5)" stroke-width="20" stroke-dasharray="10 10" opacity=".3"/>
  <circle cx="264" cy="264" r="188.87" fill="none" stroke="rgba(236,232,222,.5)" stroke-width="20" stroke-dasharray="1 1"   opacity=".3"/>
  <circle cx="264" cy="264" r="134.91" fill="none" stroke="rgba(236,232,222,.5)" stroke-width="1"  stroke-dasharray="5 10"  stroke-linecap="round" opacity=".4"/>
  <circle cx="264" cy="264" r="111.6"  fill="none" stroke="rgba(236,232,222,.9)" stroke-width="2"  opacity=".4"/>
  <circle cx="264" cy="264" r="77.26"  fill="none" stroke="rgba(236,232,222,.9)" stroke-width="2"  opacity=".4"/>
`);
mount('plxBezel', 404, 405, 404, 225, `
  <path d="M50.4702 405C50.5177 355.652 60.8853 306.86 80.9071 261.757C100.929 216.653 130.162 176.236 166.73 143.1L177.86 155.44C143.012 187.014 115.151 225.526 96.0658 268.504C76.981 311.482 67.0942 357.975 67.0402 405C67.0402 590.5 217.99 741.5 403.54 741.5H404.33V758.12H403.54C208.85 758.08 50.4702 599.65 50.4702 405ZM314.85 63.14C343.679 55.676 373.34 51.9058 403.12 51.92V68.5C374.743 68.5072 346.482 72.1092 319.01 79.22L314.85 63.14ZM488.39 730.66C540.869 716.931 589.258 690.739 629.45 654.31L640.63 666.61C598.45 704.819 547.684 732.301 492.63 746.73L488.39 730.66Z" fill="none" stroke="rgba(236,232,222,.5)" stroke-width="2"/>
  <path d="M0.540039 439.6L3.66004 439.35C5.75225 463.741 10.0634 487.891 16.54 511.5L13.54 512.33C6.99244 488.535 2.64089 464.19 0.540039 439.6H0.540039ZM73.44 638.86L75.97 637.07C89.0881 655.507 103.719 672.821 119.71 688.83C156.898 726.217 201.131 755.858 249.851 776.037C298.57 796.217 350.807 806.533 403.54 806.39C510.75 806.39 611.54 764.64 687.32 688.83L689.65 690.91L689.530 691.03C613.09 767.42 511.54 809.5 403.45 809.5C295.36 809.5 193.85 767.42 117.45 691.03C101.389 674.863 86.6704 657.415 73.44 638.86V638.86ZM117.26 119.22L117.55 118.93C193.9 42.58 295.54 0.5 403.54 0.5C511.54 0.5 613.14 42.58 689.54 118.97C705.703 135.137 720.484 152.628 733.73 171.26L731.2 173.05C718.064 154.555 703.392 137.2 687.34 121.17C611.54 45.36 510.74 3.62 403.54 3.62C296.34 3.62 195.54 45.36 119.75 121.17L117.26 119.22ZM790.62 298.7L793.62 297.87C800.125 321.661 804.45 345.995 806.54 370.57L803.42 370.81C801.347 346.435 797.063 322.299 790.62 298.7Z" fill="none" stroke="rgba(236,232,222,.9)" stroke-width="3"/>
`);
mount('plxDotted', 177.5, 177.5, 174.5, 170, `
  <circle cx="177.5" cy="177.5" r="174.5" fill="none" stroke="rgba(236,232,222,.9)" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 168"/>
`);
mount('plxAccent', 200, 200, 199, 120, `
  <circle cx="200" cy="200" r="195"   fill="none" stroke="rgba(236,232,222,.26)" stroke-width="10" opacity=".4"/>
  <circle cx="200" cy="200" r="184.5" fill="none" stroke="rgba(236,232,222,.5)"  stroke-width="5"  stroke-dasharray="70 100" opacity=".4"/>
  <circle cx="200" cy="200" r="199"   fill="none" stroke="rgba(236,232,222,.9)"  stroke-width="2"/>
  <circle cx="200" cy="200" r="33.31" fill="none" stroke="rgba(236,232,222,.5)"  stroke-width="5"  opacity=".6"/>
`);
mount('plxFrame', 200, 200, 194.5, 85, `
  <circle cx="200" cy="200" r="194.5" fill="none" stroke="rgba(236,232,222,.9)" stroke-width="11"/>
`);
mount('plxReticleField', 224.5, 223.17, 16.37, 45, `
  <circle cx="224.5" cy="223.17" r="29.19" fill="none" stroke="rgba(236,232,222,.26)" stroke-width="1"/>
  <circle cx="224.5" cy="223.17" r="16.37" fill="none" stroke="rgba(236,232,222,.9)"  stroke-width="1"/>
  <circle cx="224.5" cy="223.17" r="9.09"  fill="none" stroke="rgba(236,232,222,.5)"  stroke-width="1"/>
`);

// ── eyes ────────────────────────────────────────────────────────────────────────────────────────
let clock = 0, realClock = 0;
const eyes = [];
function makeEye(parent, w, transform, stroke = 'currentColor') {
  const g = el('g', { transform }, parent);
  const lid = el('path', { fill: 'none', stroke, 'stroke-width': Math.max(.9, w * .14).toFixed(2), 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  const iris = el('circle', { r: (w * .44).toFixed(2), fill: EYE }, g);
  const pupil = el('circle', { r: (w * .18).toFixed(2), fill: '#05070b' }, g);
  const e = { g, lid, iris, pupil, w, next: 1500 + Math.random() * 8000 };
  eyes.push(e);
  return e;
}
function blinkOf(e) {
  if (realClock > e.next + 170) e.next = realClock + 2500 + Math.random() * 9000;
  if (realClock < e.next) return 1;
  return 1 - Math.sin(Math.PI * (realClock - e.next) / 170);
}
function drawEye(e, open, lx, ly) {
  open = Math.max(0, Math.min(1, open * blinkOf(e)));
  const w = e.w, h = w * .6 * open;
  e.lid.setAttribute('d', `M${-w} 0Q0 ${(-2 * h).toFixed(2)} ${w} 0Q0 ${(2 * h).toFixed(2)} ${-w} 0`);
  const sy = Math.min(1, h / (w * .44));
  const show = sy > .05;
  const t = show ? `translate(${(lx * w * .36).toFixed(2)} ${(ly * h * .4).toFixed(2)}) scale(1 ${sy.toFixed(3)})` : 'scale(0)';
  e.iris.setAttribute('transform', t);
  e.pupil.setAttribute('transform', t);
}
// screen-space look vector → an eye's local frame (eye rotated by `angle` degrees)
function localLook(tx, ty, angle) {
  const a = rad(-angle), c = Math.cos(a), s = Math.sin(a);
  let x = tx * c - ty * s, y = tx * s + ty * c;
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  return [x, y];
}

// ── ticks, stations ─────────────────────────────────────────────────────────────────────────────
for (let i = 0; i < 60; i++) {
  const major = i % 10 === 0;
  const g = el('g', { transform: `rotate(${i * 6})` }, ticksG);
  el('line', { x1: 0, y1: -240, x2: 0, y2: -(240 + (major ? 9 : 4)), stroke: `rgba(233,221,196,${major ? .5 : .2})`, 'stroke-width': major ? 1.4 : 1 }, g);
}
const targets = Array.from({ length: N }, (_, i) => {
  const a = i * 360 / N;
  const g = el('g', { transform: `rotate(${a})` }, targetsG);
  const arc = el('path', {
    d: `M${-16} ${-(RADIUS - 18)} A${RADIUS - 18} ${RADIUS - 18} 0 0 1 ${16} ${-(RADIUS - 18)}`,
    fill: 'none', stroke: 'rgba(233,221,196,.25)', 'stroke-width': 3, 'stroke-linecap': 'round',
  }, g);
  const eye = makeEye(g, 7, `translate(0 ${-(RADIUS + 16)})`, 'rgba(233,221,196,.3)');
  const label = el('text', {
    x: (Math.sin(rad(a)) * 263).toFixed(2), y: (-Math.cos(rad(a)) * 263 + 3.5).toFixed(2),
    'text-anchor': 'middle', 'font-size': 10, 'font-weight': 600, 'letter-spacing': '.08em',
    'font-family': "IBM Plex Mono, ui-monospace, monospace", fill: 'rgba(233,221,196,.3)',
  }, targetsG);
  label.textContent = ['I', 'II', 'III', 'IV', 'V', 'VI'][i];
  return { angle: a, arc, eye, label, locked: false, glow: -1e9 };
});
const cells = targets.map(() => { const c = document.createElement('span'); c.className = 'cell'; cellsEl.appendChild(c); return c; });

// the central eye: The Witness's blue OLED eye
const coreEye = makeEye($('pad'), 15, '', 'rgba(233,221,196,.85)');
coreEye.iris.setAttribute('filter', 'url(#glow)');

// ── parallax keyframes ──────────────────────────────────────────────────────────────────────────
const HERO_KF = {
  rest: .75,
  r: [[0, 0], [.2, -160], [.3, 260], [.7, 60], [.75, 160], [.95, -160], [1, 360]],
  s: [[0, .75], [.2, .55], [.3, .4], [.7, .6], [.75, .45], [.95, .85], [1, .75]],
  o: [[0, .5], [.75, 1], [.95, .6], [1, .5]],
};
const RING_KF = {
  rest: .5,
  r: [[0, 0], [.2, -160], [.3, -260], [.7, 60], [1, 360]],
  s: [[0, .5], [.2, .55], [.3, .2], [.7, .1], [1, .5]],
  o: [[0, .3], [.2, .3], [.7, 1], [1, .3]],
};
function sample(track, t) {
  for (let i = 1; i < track.length; i++) {
    const [t1, v1] = track[i];
    if (t <= t1) { const [t0, v0] = track[i - 1]; return v0 + (v1 - v0) * (t - t0) / (t1 - t0); }
  }
  return track[track.length - 1][1];
}

// each wheel: its own tilt axis and precession, and a rim of eyes
const RINGS = [
  { id: 'plxHero',         radius: 280, depth: .6,  turns:  1, period: 42000, kf: RING_KF, dur: 20000, rev: false, eyes: 16, eyeR: 258, eyeW: 8,   tiltK: .95, axis: 10,  prec:  52000 },
  { id: 'plxBezel',        radius: 225, depth: 1.6, turns: -2, period: 34000, kf: RING_KF, dur: 20000, rev: false, eyes: 12, eyeR: 216, eyeW: 7.5, tiltK: 1.1, axis: 70,  prec: -44000 },
  { id: 'plxDotted',       radius: 170, depth: 2.6, turns:  3, period: 28000, kf: RING_KF, dur: 20000, rev: true,  eyes: 6,  eyeR: 170, eyeW: 7,   tiltK: .8,  axis: 130, prec:  38000 },
  { id: 'plxAccent',       radius: 120, depth: 3.6, turns: -3, period: 24000, kf: HERO_KF, dur: 15000, rev: false, eyes: 8,  eyeR: 120, eyeW: 6,   tiltK: 1.15,axis: 25,  prec: -32000 },
  { id: 'plxFrame',        radius: 85,  depth: 4.6, turns:  2, period: 20000, kf: HERO_KF, dur: 15000, rev: true,  eyes: 4,  eyeR: 85,  eyeW: 5.5, tiltK: .7,  axis: 95,  prec:  28000 },
  { id: 'plxReticleField', radius: 45,  depth: 5.6, turns: -4, period: 16000, kf: HERO_KF, dur: 25000, rev: true,  eyes: 0,  eyeR: 0,   eyeW: 0,   tiltK: 1.0, axis: 160, prec: -24000 },
].map(r => ({ ...r, el: $(r.id), life: 0, flash: -1e9, revNow: r.rev, rot: 0, rimEyes: [] }));
RINGS.forEach(r => {
  for (let k = 0; k < r.eyes; k++) {
    const a = k * 360 / r.eyes + (r.eyes === 4 ? 45 : 0);
    r.rimEyes.push({ a, e: makeEye(r.el, r.eyeW, `rotate(${a}) translate(0 ${-r.eyeR})`) });
  }
});

const AMP = 4.2, GEAR = .35;
const GHOST_O = .06, GHOST_S = .55, PREVIEW = .28;
const BUILD_O = .42, RELEASE_O = .9, RELEASE_S = 1.04;
const INK = [233, 221, 196], ACCENT = [227, 169, 72];
const mixInk = f => `rgb(${INK.map((c, k) => Math.round(c + (ACCENT[k] - c) * f)).join(',')})`;
const mixCol = (a, f) => `rgba(${INK.map((c, k) => Math.round(c + (ACCENT[k] - c) * f)).join(',')},${(a + (1 - a) * f).toFixed(3)})`;
const GLOW_MS = 520;

// ── state ───────────────────────────────────────────────────────────────────────────────────────
let angle = 0, lockedCount = 0, rel = 0, releaseStart = 0;
const order = [], chipEls = [];
// witness state
let watched = false, present = false, shut = 0, everWatched = false;
let tx = 0, ty = 0, rawTx = 0, rawTy = 0;   // where the subject is, -1..1 screen space
let subjects = 0, mode = 'cursor', wState = 'IDLE', gazeLabel = 'NONE';

function angleDiff(a, b) { return ((((a - b + 180) % 360) + 360) % 360) - 180; }
function nearestTarget(a) {
  let best = null, bestD = Infinity;
  for (const t of targets) { const d = Math.abs(angleDiff(a, t.angle)); if (d < bestD) { bestD = d; best = t; } }
  return { target: best, dist: bestD };
}
function paintTargets(openK) {
  const { target: near, dist } = nearestTarget(angle);
  const inRange = dist <= TOLERANCE;
  targets.forEach(t => {
    const on = t === near && inRange;
    const g = Math.exp(-(clock - t.glow) / GLOW_MS);
    const a = t.locked ? .95 : on ? .65 : .25;
    const col = mixCol(a, g);
    t.arc.setAttribute('stroke', col);
    t.arc.setAttribute('stroke-width', (t.locked || on ? 4.5 : 3) + g * 1.5);
    t.eye.lid.setAttribute('stroke', col);
    t.label.setAttribute('fill', mixCol(t.locked ? .95 : on ? .7 : .3, g));
    const lit = g > .04;
    for (const n of [t.arc, t.label]) { if (lit) n.setAttribute('filter', 'url(#glow)'); else n.removeAttribute('filter'); }
    const [lx, ly] = localLook(tx, ty, t.angle);
    drawEye(t.eye, (t.locked ? 1 : on ? .55 : .12) * openK, lx, ly);
  });
  return inRange && !near.locked ? targets.indexOf(near) : -1;
}

// ── timeline on our own clock (the clock slows to a stop while the wheels are watched) ──────────
const tweens = [], waiters = [];
const wait = ms => new Promise(res => waiters.push({ t: clock + ms * SPEED, res }));
const tween = (ms, fn, ease) => new Promise(res => tweens.push({ start: clock, ms: ms * SPEED, fn, ease, res }));
const easeInOutSine = p => -(Math.cos(Math.PI * p) - 1) / 2;
const easeInOutBack = (s = .9) => p => {
  const c2 = s * 1.525;
  return p < .5 ? (Math.pow(2 * p, 2) * ((c2 + 1) * 2 * p - c2)) / 2 : (Math.pow(2 * p - 2, 2) * ((c2 + 1) * (p * 2 - 2) + c2) + 2) / 2;
};

// ── frame ───────────────────────────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const rawDt = Math.min(64, now - last); last = now;
  realClock += rawDt;

  if (mode === 'camera') detect(now);

  // shut closes fast when met, reopens slowly when the gaze withdraws
  shut += ((watched ? 1 : 0) - shut) * (1 - Math.exp(-rawDt / (watched ? 240 : 1500)));
  const dt = rawDt * (1 - .985 * shut);
  clock += dt;

  const kT = 1 - Math.exp(-rawDt / 140);
  tx += (rawTx - tx) * kT; ty += (rawTy - ty) * kT;

  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    const p = tw.ms > 0 ? Math.min(1, (clock - tw.start) / tw.ms) : 1;
    tw.fn(tw.ease(p));
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (let i = waiters.length - 1; i >= 0; i--) if (clock >= waiters[i].t) waiters.splice(i, 1)[0].res();

  const openK = 1 - shut;
  gearA.setAttribute('transform', `rotate(${angle.toFixed(2)})`);
  gearB.setAttribute('transform', `rotate(${(-angle * 1.3).toFixed(2)})`);
  const ax = Math.sin(rad(angle)) * RADIUS, ay = -Math.cos(rad(angle)) * RADIUS;
  aim.setAttribute('transform', `translate(${ax.toFixed(2)} ${ay.toFixed(2)})`);
  const preview = paintTargets(openK);
  mech.style.opacity = (1 - .45 * shut).toFixed(3);

  const kLife = 1 - Math.exp(-dt / 420), kRel = 1 - Math.exp(-dt / 900);
  rel += ((lockedCount === N ? 1 : 0) - rel) * kRel;
  const px = Math.sin(rad(angle)), py = -Math.cos(rad(angle));
  const motion = reduceMotion ? 0 : 1;

  RINGS.forEach((r, i) => {
    const want = targets[i].locked ? 1 : i === preview ? PREVIEW : 0;
    r.life += (want - r.life) * kLife;
    const life = r.life;

    const idle = motion * (clock / r.period) * r.turns * 360;
    const gear = angle * r.turns * GEAR;
    let phase = (((clock - releaseStart) / r.dur) % 1 + 1) % 1;
    if (r.revNow) phase = 1 - phase;
    const kRot = motion * sample(r.kf.r, phase);
    const kS = (motion ? sample(r.kf.s, phase) / r.kf.rest : 1) * RELEASE_S;
    const kO = (motion ? sample(r.kf.o, phase) : .6) * RELEASE_O;

    const bS = GHOST_S + (1 - GHOST_S) * life;
    const bO = GHOST_O + (BUILD_O - GHOST_O) * life;
    const s = (bS + (kS - bS) * rel) * (1 - .3 * shut);            // wings fold inward
    const o = (bO + (kO - bO) * rel) * (1 - .5 * shut);
    const rot = idle + gear + kRot * rel;
    r.rot = rot;
    const push = r.depth * AMP * (.3 + .7 * life);

    // wheel within a wheel: each ring tips about its own precessing axis
    const tilt = motion * (.2 + .3 * life + .85 * rel * r.tiltK) * openK;
    const k = Math.cos(Math.min(1.35, tilt));
    const phi = rad(r.axis + clock / r.prec * 360), c = Math.cos(phi), sn = Math.sin(phi);
    const ma = c * c + k * sn * sn, mb = (1 - k) * c * sn, md = sn * sn + k * c * c;

    r.el.setAttribute('transform',
      `translate(${(px * push).toFixed(2)} ${(py * push).toFixed(2)}) matrix(${ma.toFixed(4)} ${mb.toFixed(4)} ${mb.toFixed(4)} ${md.toFixed(4)} 0 0) rotate(${rot.toFixed(2)}) scale(${s.toFixed(4)})`);
    r.el.setAttribute('opacity', o.toFixed(3));
    const f = Math.exp(-(clock - r.flash) / 380);
    r.el.style.color = f > .003 ? mixInk(f) : `rgb(${INK.join(',')})`;

    const eyeOpen = Math.min(1, .12 + .88 * life + rel) * openK;
    for (const { a, e } of r.rimEyes) {
      const [lx, ly] = localLook(tx, ty, rot + a);
      drawEye(e, eyeOpen, lx, ly);
    }
  });

  drawEye(coreEye, (.35 + .65 * Math.max(rel, lockedCount / N)) * openK, tx, ty);

  // the reticle never stops: it sees everything, it just refuses to be seen seeing
  subjectG.setAttribute('opacity', present ? (.25 + .35 * shut).toFixed(3) : '0');
  subjectG.setAttribute('transform', `translate(${(tx * 250).toFixed(1)} ${(ty * 250).toFixed(1)})`);

  // HUD
  const next = watched ? (shut > .98 ? 'HIDDEN' : 'CLOSING') : (shut > .02 ? 'OPENING' : 'IDLE');
  if (next !== wState) { wState = next; wstateEl.textContent = next; wstateEl.classList.toggle('hidden', next === 'HIDDEN'); }
  gazeEl.textContent = gazeLabel; gazeEl.classList.toggle('met', watched);
  const sg = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  trackEl.textContent = present ? `${sg(tx)} ${sg(-ty)}` : '—';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── events ──────────────────────────────────────────────────────────────────────────────────────
function setReleased() {
  const on = lockedCount === N;
  mech.classList.toggle('released', on);
  document.body.classList.toggle('released', on);
}
const SPOKE_OUTER = RADIUS + 16, SPOKE_INNER = 24, SPOKE_DRAW = .4;
function spoke(i) {
  const r0 = SPOKE_OUTER, r1 = SPOKE_INNER, len = r0 - r1;
  const ringR = Math.min(RINGS[i].radius, r0);
  const g = el('g', { transform: `rotate(${targets[i].angle})`, filter: 'url(#glow)' }, fx);
  const line = el('line', { x1: 0, y1: -r0, x2: 0, y2: -r1, stroke: FIRE, 'stroke-width': 1.8, 'stroke-linecap': 'round', 'stroke-dasharray': len, 'stroke-dashoffset': len }, g);
  const halo = el('circle', { cx: 0, cy: -r0, r: 6, fill: 'none', stroke: FIRE, 'stroke-width': 1.4, opacity: 0 }, g);
  halo.style.transformBox = 'fill-box'; halo.style.transformOrigin = 'center';
  const dot = el('circle', { cx: 0, cy: -ringR, r: 3, fill: FIRE, opacity: 0 }, g);
  dot.style.transformBox = 'fill-box'; dot.style.transformOrigin = 'center';
  const duration = 1000 * SPEED;
  halo.animate([{ opacity: 1, transform: 'scale(.6)' }, { opacity: 0, transform: 'scale(3.2)' }], { duration: 520, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
  line.animate([
    { strokeDashoffset: len, opacity: 1, easing: 'linear' },
    { strokeDashoffset: 0, opacity: 1, offset: SPOKE_DRAW, easing: 'ease-out' },
    { strokeDashoffset: 0, opacity: 0 },
  ], { duration, fill: 'forwards' });
  const hit = Math.min(.9, Math.max(.02, SPOKE_DRAW * (r0 - ringR) / len));
  dot.animate([
    { opacity: 0, transform: 'scale(.4)' },
    { opacity: 0, transform: 'scale(.4)', offset: Math.max(0, hit - .02) },
    { opacity: 1, transform: 'scale(1.8)', offset: hit },
    { opacity: 0, transform: 'scale(1)' },
  ], { duration, fill: 'forwards', easing: 'ease-out' }).finished.then(() => g.remove());
}
function lock(i) {
  const t = targets[i];
  t.locked = true; lockedCount++; order.push(i);
  RINGS[i].flash = clock; t.glow = clock;
  spoke(i);
  nucleusFill.setAttribute('fill', 'rgba(233,221,196,.95)');
  nucleusFill.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
  setTimeout(() => nucleusFill.setAttribute('fill', 'rgba(233,221,196,.3)'), 320);
  const cell = cells[lockedCount - 1];
  cell.classList.add('on', 'hit');
  setTimeout(() => cell.classList.remove('hit'), 820);
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = ['I', 'II', 'III', 'IV', 'V', 'VI'][i];
  chipsEl.appendChild(chip); chipEls.push(chip);
  if (lockedCount === N) {
    if (rel < .02) releaseStart = clock;
    RINGS.forEach((r, k) => { r.revNow = r.rev !== (order.indexOf(k) % 2 === 1); });
  }
  setReleased();
  hudState.textContent = lockedCount === N ? 'RIMS FULL OF EYES' : `SEAL ${['I', 'II', 'III', 'IV', 'V', 'VI'][i]}`;
}
function unlock(i) {
  targets[i].locked = false; lockedCount--; order.pop();
  cells[lockedCount].classList.remove('on', 'hit');
  const chip = chipEls.pop();
  if (chip) chip.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.6)' }], { duration: 200, fill: 'forwards' }).finished.then(() => chip.remove());
  setReleased();
}

// ── choreography ────────────────────────────────────────────────────────────────────────────────
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function aimTo(target) {
  const from = angle, d = angleDiff(target, angle);
  await tween(700 + Math.abs(d) * 7, p => { angle = from + d * p; }, easeInOutBack(.9));
}
async function cycle(n) {
  cycleEl.textContent = pad2(n);
  hudState.textContent = 'STANDBY';
  await wait(900);
  for (const i of shuffle([0, 1, 2, 3, 4, 5])) {
    hudState.textContent = 'ACQUIRING';
    await aimTo(targets[i].angle);
    await wait(DWELL);
    lock(i);
    await wait(AFTER_LOCK);
  }
  await wait(600);
  const from = angle, sweep = (Math.random() < .5 ? -1 : 1) * 240;
  await tween(RELEASE_HOLD, p => { angle = from + sweep * p; }, easeInOutSine);
  hudState.textContent = 'UNWINDING';
  for (const i of [...order].reverse()) { unlock(i); await wait(UNWIND_STEP); }
  await wait(BETWEEN);
}
(async () => { for (let n = 1; ; n++) await cycle(n); })();

// ── the witness: who is here, and are they looking ──────────────────────────────────────────────
function logSubject() {
  subjects++;
  subjectsEl.textContent = pad2(subjects);
  subjLabel.textContent = 'SUBJ ' + pad2(subjects);
}
function setWatched(v) {
  watched = v;
  if (v && !everWatched) { everWatched = true; hintEl.classList.add('gone'); }
}

// cursor stands in for gaze: over the wheels = looking at them
function svgPoint(e) {
  const m = art.getScreenCTM(); if (!m) return null;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  return p;
}
let touchTimer = 0;
stage.addEventListener('pointermove', e => {
  if (mode !== 'cursor') return;
  const p = svgPoint(e); if (!p) return;
  if (!present) { present = true; logSubject(); }
  rawTx = Math.max(-1.2, Math.min(1.2, p.x / 250));
  rawTy = Math.max(-1.2, Math.min(1.2, p.y / 250));
  const over = Math.hypot(p.x, p.y) < 250;
  setWatched(over);
  gazeLabel = over ? 'MET' : 'AVERTED';
});
stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') clearTimeout(touchTimer); });
stage.addEventListener('pointerup', e => {
  if (mode !== 'cursor' || e.pointerType === 'mouse') return;
  touchTimer = setTimeout(() => { present = false; setWatched(false); gazeLabel = 'NONE'; }, 700);
});
stage.addEventListener('pointerleave', e => {
  if (mode !== 'cursor' || e.pointerType !== 'mouse') return;
  present = false; setWatched(false); gazeLabel = 'NONE'; rawTx = rawTy = 0;
});

// camera: MediaPipe face landmarker in the browser (head pose + blink), no Python or serial needed
const camBtn = $('camBtn'), feed = $('feed'), video = $('video'), boxes = $('boxes');
let landmarker = null, stream = null, lastDetect = 0, lastFaces = 0;
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';

function showNote(msg) {
  noteEl.textContent = msg; noteEl.hidden = false;
  clearTimeout(showNote.t); showNote.t = setTimeout(() => { noteEl.hidden = true; }, 9000);
}
async function startCamera() {
  camBtn.disabled = true; camBtn.textContent = 'Starting…';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera API');
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    const mp = await import(MP + '/vision_bundle.mjs');
    const files = await mp.FilesetResolver.forVisionTasks(MP + '/wasm');
    const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 4, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true });
    try { landmarker = await mp.FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch { landmarker = await mp.FaceLandmarker.createFromOptions(files, opts('CPU')); }
    mode = 'camera'; feed.hidden = false;
    hintEl.textContent = 'Look at the wheels'; hintEl.classList.remove('gone'); everWatched = false;
    present = false; setWatched(false); gazeLabel = 'NONE';
    camBtn.textContent = 'Use cursor'; camBtn.disabled = false;
  } catch (err) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    camBtn.textContent = 'Use camera'; camBtn.disabled = false;
    showNote('The camera isn\'t available in this view, so your cursor stands in for your gaze. Open the HTML file in Chrome to use the camera.');
  }
}
function stopCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; landmarker?.close?.(); landmarker = null;
  mode = 'cursor'; feed.hidden = true; boxes.innerHTML = '';
  present = false; setWatched(false); gazeLabel = 'NONE'; lastFaces = 0;
  hintEl.textContent = 'Hover over the wheels to look at them';
  camBtn.textContent = 'Use camera';
}
camBtn.addEventListener('click', () => mode === 'camera' ? stopCamera() : startCamera());

function detect(now) {
  if (!landmarker || video.readyState < 2 || now - lastDetect < 66) return;
  lastDetect = now;
  let res; try { res = landmarker.detectForVideo(video, now); } catch { return; }
  const faces = res.faceLandmarks || [];
  if (faces.length > lastFaces) for (let k = lastFaces; k < faces.length; k++) logSubject();
  lastFaces = faces.length;
  present = faces.length > 0;
  boxes.innerHTML = '';
  let anyLooking = false, best = null;
  faces.forEach((lm, i) => {
    let minX = 1, maxX = 0, minY = 1, maxY = 0, sx = 0, sy = 0;
    for (const p of lm) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); sx += p.x; sy += p.y; }
    const m = res.facialTransformationMatrixes?.[i]?.data;
    let yaw = 0, pitch = 0;
    if (m) { yaw = deg(Math.atan2(m[8], Math.abs(m[10]))); pitch = deg(Math.atan2(m[9], Math.abs(m[10]))); }
    const cats = res.faceBlendshapes?.[i]?.categories || [];
    const bl = n => cats.find(c => c.categoryName === n)?.score ?? 0;
    const blink = (bl('eyeBlinkLeft') + bl('eyeBlinkRight')) / 2;
    const looking = Math.abs(yaw) < 20 && Math.abs(pitch) < 18 && blink < .5;
    if (looking) anyLooking = true;
    const area = (maxX - minX) * (maxY - minY);
    if (!best || area > best.area) best = { area, cx: sx / lm.length, cy: sy / lm.length, yaw, pitch, looking };
    const b = document.createElement('div'); b.className = 'box';
    Object.assign(b.style, { left: ((1 - maxX) * 100) + '%', top: (minY * 100) + '%', width: ((maxX - minX) * 100) + '%', height: ((maxY - minY) * 100) + '%' });
    if (looking) b.style.borderStyle = 'solid'; else b.style.borderStyle = 'dashed';
    const s = document.createElement('span'); s.textContent = `${looking ? 'GAZE' : 'AVERT'} ${Math.round(yaw)}°`; b.appendChild(s);
    boxes.appendChild(b);
  });
  if (best) { rawTx = (0.5 - best.cx) * 2.4; rawTy = (best.cy - 0.5) * 2.4; }
  setWatched(anyLooking);
  gazeLabel = !present ? 'NONE' : anyLooking ? 'MET' : 'AVERTED';
}
</script>
