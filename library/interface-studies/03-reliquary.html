<style>
  /* Layout: a vitrine. The emblem is catalogued in exploded view on grey vellum; the lock dial reassembles it. */
  :root {
    --bg: #e3e1db; --panel: #d9d6ce; --ink: #17150f; --dim: rgba(23,21,15,.5); --hair: rgba(23,21,15,.16);
    --rubric: #b8231a;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --display: 'UnifrakturMaguntia', 'Old English Text MT', serif;
    --text: 'EB Garamond', Garamond, 'Times New Roman', serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; font: 500 11px/1.4 var(--mono); color: var(--ink); user-select: none; -webkit-user-select: none; }
  .stage {
    flex: 1; min-height: 0; position: relative;
    background-image: linear-gradient(var(--hair) 1px, transparent 1px), linear-gradient(90deg, var(--hair) 1px, transparent 1px);
    background-size: 44px 44px; background-position: center; background-blend-mode: normal;
  }
  .stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, var(--bg) 78%); pointer-events: none; }
  svg#art { position: relative; display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 14px; z-index: 2; display: flex; align-items: center; gap: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #hudL { left: max(18px, env(safe-area-inset-left, 0px)); }
  #hudR { right: max(18px, env(safe-area-inset-right, 0px)); }
  .hud b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; transition: color .6s; }
  .title { font: 400 24px/1 var(--display); letter-spacing: .01em; text-transform: none; color: var(--ink); }
  .title small { font: 500 10px/1 var(--mono); letter-spacing: .14em; color: var(--dim); margin-left: 8px; }
  body.released #hudState { color: var(--rubric); }
  .cells { display: flex; gap: 3px; }
  .cell { width: 14px; height: 6px; border: 1px solid rgba(23,21,15,.4); border-radius: 1px; transition: background-color .3s, border-color .3s; }
  .cell.on { background: var(--ink); border-color: var(--ink); }
  body.released .cell.on { background: var(--rubric); border-color: var(--rubric); }
  .inscription {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; width: min(560px, calc(100% - 32px));
    text-align: center; font: italic 400 17px/1.35 var(--text); color: var(--ink); text-wrap: balance;
    opacity: 0; transition: opacity 1.6s ease;
  }
  .inscription::first-letter { color: var(--rubric); font: 400 22px/1 var(--display); font-style: normal; }
  body.released .inscription { opacity: 1; }
  .strip {
    flex: none; display: flex; align-items: center; gap: 14px; padding-block: 12px;
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    border-top: 1px solid rgba(23,21,15,.18); background: var(--panel);
    letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
  }
  .strip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow: hidden; min-height: 30px; align-items: center; }
  .chip {
    flex: none; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 6px;
    border: 1px solid rgba(23,21,15,.45); color: var(--ink); text-transform: none; letter-spacing: .02em;
    font: italic 400 14px/1 var(--text); background: rgba(255,255,255,.25); animation: stamp .7s ease-out; white-space: nowrap;
  }
  .chip i { font: 400 15px/1 var(--display); font-style: normal; color: var(--rubric); }
  @keyframes stamp { 0% { transform: scale(.5); opacity: 0; border-color: var(--rubric); } 35% { transform: scale(1); opacity: 1; border-color: var(--rubric); } }
  @media (max-width: 640px) {
    .hud { font-size: 10px; gap: 8px; top: 10px; }
    .title small, .cells, .opt, .chips { display: none; }
    .strip { justify-content: space-between; }
    .inscription { font-size: 14px; }
    .chip { padding: 0 7px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .chip { animation: none; } }
</style>

<div class="stage">
  <div class="hud" id="hudL">
    <span class="title">Reliquary<small>Cyber Reliquary · Pl. II</small></span>
    <span class="cells" id="cells"></span>
    <b id="hudState">STANDBY</b>
  </div>
  <div class="hud" id="hudR">AIM <b id="angle">000.0°</b></div>
  <p class="inscription">The reliquary does not destroy the relic. It makes it visible as what it is.</p>

    <circle r="268" fill="none" stroke="rgba(23,21,15,.18)" stroke-width=".6"/>

    <circle id="gearB" r="232" fill="none" stroke="rgba(23,21,15,.25)" stroke-width="1" stroke-dasharray="2 9"/>

  </g>

    <path d="M-176 -110 A212 212 0 0 1 -158 -140" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="emblemWrap">

  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], p = tw.ms > 0 ? Math.min(1, (clock - tw.start) / tw.ms) : 1;
    tw.fn(tw.ease(p)); if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (let i = waiters.length - 1; i >= 0; i--) if (clock >= waiters[i].t) waiters.splice(i, 1)[0].res();

  rel += ((lockedCount === N ? 1 : 0) - rel) * (1 - Math.exp(-dt / 900));

  $('gearA').setAttribute('transform', `rotate(${angle.toFixed(2)})`);
  $('gearB').setAttribute('transform', `rotate(${(-angle * 1.25).toFixed(2)})`);
  const ax = Math.sin(rad(angle)) * RADIUS, ay = -Math.cos(rad(angle)) * RADIUS;
  $('aim').setAttribute('transform', `translate(${ax.toFixed(2)} ${ay.toFixed(2)}) rotate(${angle.toFixed(1)})`);
  $('angle').textContent = (((angle % 360) + 360) % 360).toFixed(1).padStart(5, '0') + '°';

  let near = null, nd = 1e9;
  for (const t of targets) { const d = Math.abs(angleDiff(angle, t.angle)); if (d < nd) { nd = d; near = t; } }

  targets.forEach((t, i) => {
    const f = t.frag, s = t.seat, open = 1 - s;
    const g = Math.exp(-(clock - t.glow) / 600);
    const on = t === near && nd <= TOLERANCE;
    const dx = Math.sin(rad(t.angle)), dy = -Math.cos(rad(t.angle));
    // exploded fragments drift slightly, like objects hung on wire in a case
    const drift = motion * open * 7 * Math.sin(clock / (2600 + i * 410) + i * 1.7);
    const off = f.dist * open + drift;
    const ox = dx * off, oy = dy * off, spin = f.spin * open;
    const tr = `translate(${ox.toFixed(2)} ${oy.toFixed(2)}) rotate(${spin.toFixed(2)} ${f.anchor[0]} ${f.anchor[1]})`;
    for (const L of t.layers) { L.setAttribute('transform', tr); L.setAttribute('opacity', (.32 + .68 * s).toFixed(3)); }

    // catalogue leader from the station's label to the fragment, faded as it seats
    const fx = (f.anchor[0] + ox - CX) * ES, fy = (f.anchor[1] + oy - CY) * ES;
    const [lx, ly] = t.labelPos;
    const sx = lx - dx * 14, sy = ly - dy * 14;
    const mx = sx + (fx - sx) * .5 + dy * 12, my = sy + (fy - sy) * .5 - dx * 12;
    t.leader.setAttribute('d', `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${fx.toFixed(1)} ${fy.toFixed(1)}`);
    t.leader.setAttribute('opacity', (open * .9).toFixed(3));
    t.tip.setAttribute('cx', fx.toFixed(1)); t.tip.setAttribute('cy', fy.toFixed(1)); t.tip.setAttribute('opacity', (open * .9).toFixed(3));

    t.arc.setAttribute('stroke', t.locked ? mixCol(.9, g) : on ? 'rgba(23,21,15,.7)' : 'rgba(23,21,15,.25)');
    t.arc.setAttribute('stroke-width', (t.locked || on ? 5 : 3) + g * 2);
    t.nm.setAttribute('fill', t.locked ? 'rgba(23,21,15,.95)' : on ? 'rgba(23,21,15,.85)' : 'rgba(23,21,15,.6)');
    if (g > .05) t.arc.setAttribute('filter', 'url(#glow)'); else t.arc.removeAttribute('filter');
  });

  // the relic itself sits at the centre the whole time, half-present until the case is complete
  const k = lockedCount / N;
  centerLayers.forEach(L => L.setAttribute('opacity', (.45 + .55 * Math.max(k, rel)).toFixed(3)));
  ticksL.forEach((tk, i) => {
    const lit = i < Math.round(k * ticksL.length);
    let o = lit ? 1 : .14;
    if (rel > .5 && motion) { const ph = ((clock / 3200) - i * .022) % 1; o = ph < .12 ? .25 + ph * 6 : 1; }
    tk.setAttribute('opacity', o.toFixed(3));
    tk.setAttribute('fill', lit ? RUBRIC : '#17150f');
  });

  // eyes ignite on completion, then blink
  ignite += ((lockedCount === N ? 1 : 0) - ignite) * (1 - Math.exp(-dt / 260));
  let blink = 1;
  if (rel > .6) { const ph = (clock % 5200) / 5200; if (ph > .96) blink = Math.max(.1, Math.abs(ph - .98) / .02); }
  const es = (.2 + .8 * ignite) * (1 + .35 * Math.sin(Math.min(1, ignite) * Math.PI));
  eyesL.setAttribute('transform', `translate(488 449) scale(${es.toFixed(3)} ${(es * blink).toFixed(3)}) translate(-488 -449)`);
  eyesL.setAttribute('fill', ignite > .1 ? RUBRIC : '#17150f');
  eyesL.setAttribute('opacity', (.2 + .8 * ignite).toFixed(3));
  if (ignite > .3) eyesL.setAttribute('filter', 'url(#glow)'); else eyesL.removeAttribute('filter');

  // complete: the glass closes over it, the outer wheel breathes
  $('vitrine').setAttribute('opacity', (rel * .9).toFixed(3));
  $('vitrine').setAttribute('transform', `scale(${(1.08 - .08 * rel).toFixed(4)})`);
  const breathe = 1 + motion * rel * .012 * Math.sin(clock / 1400);
  const px = Math.sin(rad(angle)) * 5 * motion, py = -Math.cos(rad(angle)) * 5 * motion;
  $('emblemWrap').setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)}) scale(${breathe.toFixed(4)})`);
  $('mech').setAttribute('opacity', (1 - .45 * rel).toFixed(3));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── events ───────────────────────────────────────────────────────────────────────────────────────
function beam(t) {
  const f = t.frag, a = t.angle;
  const dx = Math.sin(rad(a)), dy = -Math.cos(rad(a));
  const sx = dx * (RADIUS + 9), sy = dy * (RADIUS + 9);
  const ox = dx * f.dist, oy = dy * f.dist;
  const ex = (f.anchor[0] + ox - CX) * ES, ey = (f.anchor[1] + oy - CY) * ES;
  const len = Math.hypot(ex - sx, ey - sy);
  const g = el('g', { filter: 'url(#glow)' }, $('fx'));
  const line = el('line', { x1: sx, y1: sy, x2: ex, y2: ey, stroke: RUBRIC, 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-dasharray': len, 'stroke-dashoffset': len }, g);
  const halo = el('circle', { cx: ex, cy: ey, r: 6, fill: 'none', stroke: RUBRIC, 'stroke-width': 1.2, opacity: 0 }, g);
  halo.style.transformBox = 'fill-box'; halo.style.transformOrigin = 'center';
  line.animate([{ strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, offset: .45 }, { strokeDashoffset: 0, opacity: 0 }], { duration: 900, easing: 'ease-out', fill: 'forwards' });
  halo.animate([{ opacity: 0, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(.4)', offset: .4 }, { opacity: 1, transform: 'scale(1)', offset: .45 }, { opacity: 0, transform: 'scale(3.4)' }], { duration: 900, easing: 'ease-out', fill: 'forwards' }).finished.then(() => g.remove());
}
function lock(i) {
  const t = targets[i];
  t.locked = true; lockedCount++; order.push(i); t.glow = clock;
  beam(t);
  const from = t.seat;
  setTimeout(() => tween(1100, p => { t.seat = from + (1 - from) * p; }, easeOutBack), 380);
  const cell = cells[lockedCount - 1]; cell.classList.add('on');
  const chip = document.createElement('div'); chip.className = 'chip';
  chip.innerHTML = `<i>${NUMS[i]}</i>`; chip.append(t.frag.name);
  $('chips').appendChild(chip); chipEls.push(chip);
  $('count').textContent = `${lockedCount}/${N}`;
  document.body.classList.toggle('released', lockedCount === N);
  $('hudState').textContent = lockedCount === N ? 'RELIQUARY SEALED' : `SEATING ${t.frag.name.toUpperCase()}`;
}
function unlock(i) {
  const t = targets[i];
  t.locked = false; lockedCount--; order.pop();
  const from = t.seat;
  tween(1300, p => { t.seat = from * (1 - p); }, easeInOutCubic);
  cells[lockedCount].classList.remove('on');
  const chip = chipEls.pop();
  if (chip) chip.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.6)' }], { duration: 220, fill: 'forwards' }).finished.then(() => chip.remove());
  $('count').textContent = `${lockedCount}/${N}`;
  document.body.classList.remove('released');
}

// ── choreography ─────────────────────────────────────────────────────────────────────────────────
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function aimTo(target) { const from = angle, d = angleDiff(target, angle); await tween(800 + Math.abs(d) * 7, p => { angle = from + d * p; }, easeInOutBack(.9)); }
async function cycle(n) {
  $('cycle').textContent = pad2(n);
  $('hudState').textContent = 'CATALOGUED';
  await wait(1400);
  for (const i of shuffle([0, 1, 2, 3, 4, 5])) {
    $('hudState').textContent = 'ACQUIRING';
    await aimTo(targets[i].angle);
    await wait(DWELL);
    lock(i);
    await wait(AFTER_LOCK);
  }
  await wait(800);
  const from = angle, sweep = (Math.random() < .5 ? -1 : 1) * 180;
  await tween(RELEASE_HOLD, p => { angle = from + sweep * p; }, easeInOutSine);
  $('hudState').textContent = 'DISASSEMBLING';
  for (const i of [...order].reverse()) { unlock(i); await wait(UNWIND_STEP); }
  await wait(BETWEEN);
}
(async () => { for (let n = 1; ; n++) await cycle(n); })();
</script>
