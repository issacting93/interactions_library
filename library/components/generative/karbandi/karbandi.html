<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karbandi Lattice</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #161618; }
  body {
    font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    color: #ece8de;
    background-image: radial-gradient(rgba(236,232,222,.16) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  svg { display: block; width: 100%; height: 100%; }
  #rotor { transform-origin: 0 0; animation: spin 220s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chord { stroke: #e8b04a; stroke-width: 1.1; opacity: .7; transition: opacity .3s; }
  .outer { fill: none; stroke: rgba(236,232,222,.25); stroke-width: 1; transition: stroke-dasharray .4s, opacity .3s; }
  .point { fill: #e8b04a; opacity: .85; }
  .shamseh { fill: rgba(232,176,74,.12); stroke: #e8b04a; stroke-width: 1.6; transition: r .5s ease, opacity .4s; }
  .center { fill: #e8b04a; }
  .hud {
    position: fixed; left: 20px; bottom: 18px; z-index: 2;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(236,232,222,.5); pointer-events: none;
  }
  .hud b { color: #e8b04a; }
  .flash .outer { stroke-dasharray: 2 6; opacity: .6; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg">
  <g id="stage">
    <g id="rotor">
      <circle id="outer" class="outer" r="0"></circle>
      <g id="chords"></g>
      <circle id="shamseh" class="shamseh" r="0"></circle>
      <g id="points"></g>
      <circle class="center" r="4"></circle>
    </g>
  </g>
</svg>
<div class="hud">KARBANDI · <b id="hudN">16</b>-SIDED · STEP <b id="hudK">6</b> · MOVE TO TUNE</div>

<script>
/* ─────────────────────────────────────────────────────────────
   KARBANDI LATTICE — ambient radial-chord geometry from Persian
   muqarnas vaulting: an n-sided circle connects every point to
   the one k steps away, leaving a "shamseh" medallion where the
   chords clear the centre. Pointer x steers the connection step
   in real time; the division count drifts through a short list
   of presets on its own, with the whole lattice turning slowly.
   ───────────────────────────────────────────────────────────── */

const NS = 'http://www.w3.org/2000/svg';
const W = innerWidth, H = innerHeight;
const svg = document.getElementById('art');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
document.getElementById('stage').setAttribute('transform', `translate(${W / 2} ${H / 2})`);

const outerEl = document.getElementById('outer');
const shamsehEl = document.getElementById('shamseh');
const chordsEl = document.getElementById('chords');
const pointsEl = document.getElementById('points');
const hudN = document.getElementById('hudN');
const hudK = document.getElementById('hudK');

const RADIUS = Math.min(W, H) * 0.32;
const DIVISIONS = [8, 12, 16, 10, 14, 18, 9];
let divIdx = 0;
let n = DIVISIONS[divIdx];
let tFrac = 0.5; // 0..1, pointer-driven fraction of the valid step range

function el(tag, attrs) {
  const node = document.createElementNS(NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}
const f2 = v => v.toFixed(2);

function stepFromFraction(divisions, frac) {
  const kMax = Math.floor(divisions / 2);
  return Math.max(1, Math.round(1 + frac * (kMax - 1)));
}

function shamsehRadius(divisions, k) {
  const chord = 2 * RADIUS * Math.sin((k * Math.PI) / divisions);
  return Math.max(0, (RADIUS - chord / 2) * 0.6);
}

function render() {
  const k = stepFromFraction(n, tFrac);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    pts.push([Math.cos(a) * RADIUS, Math.sin(a) * RADIUS]);
  }

  outerEl.setAttribute('r', RADIUS);

  chordsEl.textContent = '';
  for (let i = 0; i < n; i++) {
    const [x1, y1] = pts[i];
    const [x2, y2] = pts[(i + k) % n];
    chordsEl.appendChild(el('line', { class: 'chord', x1: f2(x1), y1: f2(y1), x2: f2(x2), y2: f2(y2) }));
  }

  pointsEl.textContent = '';
  pts.forEach(([x, y]) => pointsEl.appendChild(el('circle', { class: 'point', cx: f2(x), cy: f2(y), r: 3 })));

  shamsehEl.setAttribute('r', f2(shamsehRadius(n, k)));

  hudN.textContent = n;
  hudK.textContent = k;
}

document.addEventListener('pointermove', e => {
  tFrac = Math.min(1, Math.max(0, e.clientX / W));
  render();
}, { passive: true });

setInterval(() => {
  divIdx = (divIdx + 1) % DIVISIONS.length;
  n = DIVISIONS[divIdx];
  document.body.classList.add('flash');
  render();
  setTimeout(() => document.body.classList.remove('flash'), 400);
}, 9000);

render();
</script>
</body>
</html>
