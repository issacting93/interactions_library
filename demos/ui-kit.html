<title>TAPE 08 · UI Kit — Atoms & Molecules</title>

<link rel="stylesheet" href="shared/tape08-tokens.css">
<style>
/* ── flat sheet: raw elements, side by side, no card chrome ── */
*{box-sizing:border-box}
body{margin:0;padding:28px;background:var(--t8-ground);color:var(--t8-ink);font-family:var(--t8-ui);font-size:12px;letter-spacing:.04em}

.group{margin-bottom:36px}
.label{margin:0 0 12px;font-family:var(--t8-display);font-weight:300;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--t8-ink-2)}

.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px}

.item{display:flex;flex-direction:column;gap:6px;margin:0}
.item .states{display:flex;flex-wrap:wrap;gap:8px}
.item svg{display:block}
.item img{display:block;width:260px;height:auto}
.item figcaption{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t8-ink-2)}
.item figcaption .code{color:#8A877F;margin-right:6px}

/* ── live motion (all reduced-motion-gated) ── */
.flow{animation:dashflow 1s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-22}}
.breathe{animation:breathe 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.spin{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:ledblink 1s steps(2,start) infinite}
@keyframes ledblink{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flow,.breathe,.spin,.blink{animation:none}}
</style>
</head>
