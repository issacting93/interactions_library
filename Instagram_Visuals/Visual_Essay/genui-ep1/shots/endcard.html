<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GenUI Ep.1 — endcard</title>
<!--
  OUTRO end card (1:05-1:15, final beat): series title + episode + "PART 1 OF 3" marker.
  Mostly static for a clean hold in the edit, with a slow breathing glow on the accent rule and
  a one-time hairline draw-on so it doesn't look like a dead frame if used as a short loop.
  Re-skinned to the "Design Research in the Age of AI" system: IBM Plex Mono only (Martian Mono
  retired), near-black ground, the dot grid already here is the deck's own decorative motif
  (research-core.css calls it .rt-dotgrid) so it needed no change but its colour. --accent now
  carries --rt-part1 (violet) since this show is Part 1 of 3.
  Loop: 5.0s. ?driven=1 + window.essayStep(ms) for deterministic capture.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0A0A0A; --ink:#ECEAE3; --ink2:#78766F; --line2:rgba(236,234,227,.12); --accent:#9B90E8; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--ground);overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--ink)}
  .border{position:absolute;inset:28px;border:1px solid var(--line2);border-radius:4px}
  .grid{position:absolute;inset:28px;background-image:radial-gradient(var(--line2) 1px, transparent 1px);background-size:30px 30px;opacity:.5}
  .center{position:absolute;left:0;top:800px;width:1080px;text-align:center}
  .micro{font-size:16px;letter-spacing:.3em;color:var(--ink2);margin-bottom:28px}
  h1{font-weight:300;font-size:92px;letter-spacing:.02em;line-height:1.05}
  .rule{width:220px;height:2px;background:var(--accent);margin:34px auto}
  .sub{font-size:22px;letter-spacing:.06em;color:var(--ink2)}
  .chip{position:absolute;left:0;top:1140px;width:1080px;text-align:center}
  .chip span{display:inline-block;padding:14px 32px;border:1.5px solid var(--accent);border-radius:30px;font-size:16px;letter-spacing:.2em;color:var(--accent)}
</style>
</head>
<body>
<div class="border"></div>
<div class="grid"></div>
<div class="center">
  <div class="micro">GENERATIVE UI</div>
  <h1>EP. 01</h1>
  <div class="rule" id="rule"></div>
  <div class="sub">LIVE, REAL-TIME GENERATION</div>
</div>
<div class="chip" id="chip"><span>PART 1 OF 3</span></div>

<script src="essay-core.js"></script>
<script>
(function () {
  const LOOP = 5.0;
  const rule = document.getElementById('rule');
  const chip = document.getElementById('chip');

  function step(tAbs) {
    const t = tAbs % LOOP;
    rule.style.transform = `scaleX(${ease.outCubic(prog(t, 0.1, 0.5))})`;
    rule.style.opacity = String(0.7 + 0.3 * Math.sin(t * 1.4));
    chip.style.opacity = String(ease.outCubic(prog(t, 0.4, 0.4)));
  }
  runEssay(step);
})();
</script>
</body>
</html>
