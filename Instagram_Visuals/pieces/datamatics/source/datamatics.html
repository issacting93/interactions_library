<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Datamatics</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Reconstructed from boids / murmuration-rosette (the flock) + rain-vortex-rev-b (the valve
     ring) + datamatic-tape (the raw readout). No colour anywhere: this piece's identity is the
     house palette's own STORY mode taken to its limit — black ground, white hairlines, nothing
     else. The flock is the dataset; the ring addresses it; the tape reads it. Layout: one
     full-bleed instrument, a four-knob deck below. */
  :root {
    --bg: #000; --ink: #fff; --dim: rgba(255,255,255,.55); --hair: rgba(255,255,255,.16);
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 11px/1.4 var(--mono); }
  body { display: flex; flex-direction: column; }
  canvas { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; cursor: crosshair; }
  .deck { flex: none; border-top: 1px solid var(--hair); background: #060606;
    padding-block: 12px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .deckhead { display: flex; justify-content: space-between; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-size: 10px; margin-bottom: 10px; gap: 12px; }
  .deckhead button { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: transparent;
    border: 1px solid rgba(255,255,255,.3); padding: 6px 9px; cursor: pointer; }
  .deckhead button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #000; }
  .deckhead button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .knobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .knob { padding: 0 14px; border-left: 1px solid var(--hair); display: grid; gap: 6px; min-width: 0; }
  .knob:first-child { border-left: 0; padding-left: 0; }
  .knob label { letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-size: 10px; }
  .knob output { font: 600 20px/1 var(--display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: rgba(255,255,255,.4); }
  input[type=range]::-moz-range-track { height: 1px; background: rgba(255,255,255,.4); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 16px; margin-top: -8px; background: var(--ink); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-thumb { width: 10px; height: 16px; background: var(--ink); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 640px) {
    .knobs { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; }
    .knob:nth-child(3) { border-left: 0; padding-left: 0; }
    .deckhead .hide-s { display: none; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<canvas id="cv" tabindex="0" aria-label="Datamatics: a 3D flock read as data. Click a ring address to call it, click centre to release, arrow keys also address it."></canvas>
<div class="deck">
  <div class="deckhead"><span>Controls</span><span class="hide-s">Click a ring address to call the flock · click centre to release</span>
    <button id="release" type="button" aria-pressed="false">Release</button></div>
  <div class="knobs">
    <div class="knob"><label for="node">Node</label><input id="node" type="range" min="0" max="7" step="1" value="0"><output id="nodeO" for="node">0/8</output></div>
    <div class="knob"><label for="density">Density</label><input id="density" type="range" min="0" max="100" value="55"><output id="densityO" for="density">0.55</output></div>
    <div class="knob"><label for="clock">Clock</label><input id="clock" type="range" min="10" max="200" value="100"><output id="clockO" for="clock">1.00×</output></div>
    <div class="knob"><label for="thread">Thread</label><input id="thread" type="range" min="0" max="100" value="45"><output id="threadO" for="thread">0.45</output></div>
  </div>
</div>

<script>
const TAU = Math.PI * 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COND = "'Barlow Condensed', 'Arial Narrow', sans-serif", MONO = "'IBM Plex Mono', ui-monospace, monospace";
const rad = d => d * Math.PI / 180;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

// ── controls ─────────────────────────────────────────────────────────────────────────────────────
const K = { node: 0, density: .55, clock: 1, thread: .45, released: false };
function bind(id, f, fmt) { const i = $(id), o = $(id + 'O'); const set = () => { K[id] = f(+i.value); o.textContent = fmt(K[id]); }; i.addEventListener('input', () => { set(); K.released = false; relBtn.setAttribute('aria-pressed', 'false'); }); set(); }
bind('node', v => Math.round(v), v => `${v}/8`);
bind('density', v => v / 100, v => v.toFixed(2));
bind('clock', v => v / 100, v => v.toFixed(2) + '×');
bind('thread', v => v / 100, v => v.toFixed(2));
const relBtn = $('release');
relBtn.onclick = () => { K.released = !K.released; relBtn.setAttribute('aria-pressed', String(K.released)); };

// ── deterministic noise/hash (shared seed space with the barcode) ──────────────────────────────
const hash = n => { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); return ((n ^ (n >>> 16)) >>> 0) / 4294967295; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── canvas + input ───────────────────────────────────────────────────────────────────────────────
const cv = $('cv'), c = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const fit = () => { DPR = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; };
new ResizeObserver(fit).observe(cv); fit();

// ── the flock: separation/alignment/cohesion/seek on a shell sphere, pure JS, no renderer ───────
const COUNT = 96, RING_R = 7.5, RADIAL_K = 1.7, MAX_SPEED = 3.0, MAX_FORCE = 4.6;
const W_SEP = 2.4, W_ALI = .9, W_COH = .45, W_SEEK = 2.8, MAX_LINES = 480;
// matches the ring ticks' own screen projection (a = i*45-90, sin for y, no flip) so the flock
// visibly clusters at the same address its tick highlights, not its mirror
const node3D = i => { const a = rad(i * 45 - 90); return { x: Math.cos(a) * RING_R, y: Math.sin(a) * RING_R, z: 0 }; };
function makeFlock(seed) {
  const rng = mulberry32(seed);
  const boids = Array.from({ length: COUNT }, () => {
    const th = Math.acos(2 * rng() - 1), ph = TAU * rng(), r = RING_R * (.9 + .2 * rng());
    const pos = { x: r * Math.sin(th) * Math.cos(ph), y: r * Math.sin(th) * Math.sin(ph), z: r * Math.cos(th) };
    const vx = rng() - .5, vy = rng() - .5, vz = rng() - .5, len = Math.hypot(vx, vy, vz) || 1, s = MAX_SPEED * .4 / len;
    return { pos, vel: { x: vx * s, y: vy * s, z: vz * s } };
  });
  return { boids, lineN: 0, lines: new Float32Array(MAX_LINES * 6) };
}
let flock = makeFlock(7781);
function stepFlock(sim, targetIdx, perception, lineDist, dt) {
  const target = targetIdx == null ? null : node3D(targetIdx);
  const { boids } = sim, n = boids.length;
  const ax = new Float64Array(n), ay = new Float64Array(n), az = new Float64Array(n);
  let lineN = 0;
  const steer = (dx, dy, dz, vx, vy, vz, w, out) => {
    let len = Math.hypot(dx, dy, dz); if (!len) return;
    const k = MAX_SPEED / len; dx = dx * k - vx; dy = dy * k - vy; dz = dz * k - vz;
    let fl = Math.hypot(dx, dy, dz); if (fl > MAX_FORCE) { const fk = MAX_FORCE / fl; dx *= fk; dy *= fk; dz *= fk; }
    out.x += dx * w; out.y += dy * w; out.z += dz * w;
  };
  for (let i = 0; i < n; i++) {
    const b = boids[i];
    let sepx=0,sepy=0,sepz=0, alix=0,aliy=0,aliz=0, cohx=0,cohy=0,cohz=0, cnt=0;
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const o = boids[j], dx = b.pos.x - o.pos.x, dy = b.pos.y - o.pos.y, dz = b.pos.z - o.pos.z;
      const d = Math.hypot(dx, dy, dz);
      if (d > 0 && d < perception) {
        const inv = 1 / (d * d);
        sepx += dx * inv; sepy += dy * inv; sepz += dz * inv;
        alix += o.vel.x; aliy += o.vel.y; aliz += o.vel.z;
        cohx += o.pos.x; cohy += o.pos.y; cohz += o.pos.z; cnt++;
      }
      if (j > i && d > 0 && d < lineDist && lineN < MAX_LINES) {
        const k = lineN++ * 6;
        sim.lines[k]=b.pos.x; sim.lines[k+1]=b.pos.y; sim.lines[k+2]=b.pos.z;
        sim.lines[k+3]=o.pos.x; sim.lines[k+4]=o.pos.y; sim.lines[k+5]=o.pos.z;
      }
    }
    const out = { x: 0, y: 0, z: 0 };
    if (cnt > 0) {
      steer(sepx, sepy, sepz, b.vel.x, b.vel.y, b.vel.z, W_SEP, out);
      steer(alix/cnt, aliy/cnt, aliz/cnt, b.vel.x, b.vel.y, b.vel.z, W_ALI, out);
      steer(cohx/cnt-b.pos.x, cohy/cnt-b.pos.y, cohz/cnt-b.pos.z, b.vel.x, b.vel.y, b.vel.z, W_COH, out);
    }
    if (target) steer(target.x-b.pos.x, target.y-b.pos.y, target.z-b.pos.z, b.vel.x, b.vel.y, b.vel.z, W_SEEK, out);
    const r = Math.hypot(b.pos.x, b.pos.y, b.pos.z) || 1, pull = (RING_R - r) * RADIAL_K;
    out.x += (b.pos.x / r) * pull; out.y += (b.pos.y / r) * pull; out.z += (b.pos.z / r) * pull;
    ax[i] = out.x; ay[i] = out.y; az[i] = out.z;
  }
  for (let i = 0; i < n; i++) {
    const b = boids[i];
    b.vel.x += ax[i]*dt; b.vel.y += ay[i]*dt; b.vel.z += az[i]*dt;
    const sp = Math.hypot(b.vel.x, b.vel.y, b.vel.z);
    if (sp > MAX_SPEED) { const k = MAX_SPEED/sp; b.vel.x *= k; b.vel.y *= k; b.vel.z *= k; }
    b.pos.x += b.vel.x*dt; b.pos.y += b.vel.y*dt; b.pos.z += b.vel.z*dt;
  }
  sim.lineN = lineN;
}

// ── ring input: 8 address stations, click or arrow/number keys to call, centre to release ──────
let roll = 0; // slow constant roll for depth, not an orbit camera — a scan, not a cinematic shot
const ptr = { x: null, y: null };
function ringGeom() {
  const cx = W / 2, cy = H * .46, R = Math.min(W, H) * .34;
  return { cx, cy, R };
}
cv.addEventListener('pointerdown', e => {
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  const { cx, cy, R } = ringGeom(), dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
  if (d < R * .22) { K.released = !K.released; relBtn.setAttribute('aria-pressed', String(K.released)); return; }
  if (d > R * .72 && d < R * 1.3) {
    const a = ((Math.atan2(dy, dx) * 180 / Math.PI + 90) + 360) % 360;
    const i = Math.round(a / 45) % 8;
    K.node = i; $('node').value = K.node; $('nodeO').textContent = `${K.node}/8`; K.released = false; relBtn.setAttribute('aria-pressed', 'false');
  }
});
cv.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '8') { K.node = +e.key - 1; $('node').value = K.node; $('nodeO').textContent = `${K.node}/8`; K.released = false; relBtn.setAttribute('aria-pressed', 'false'); }
  if (e.key === '0' || e.key === 'Escape') relBtn.click();
});

// ── the tape: barcode + numeric readout, seeded by the flock's own real numbers, not decoration ─
const NL = 220, RH = 64;
const raster = document.createElement('canvas'); raster.width = NL; raster.height = RH;
const rctx = raster.getContext('2d'); rctx.fillStyle = '#000'; rctx.fillRect(0, 0, NL, RH);
const row = rctx.createImageData(NL, 1);
let rasterTick = 0, tapeScroll = 0;

function draw(t, dt) {
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const pad = 18, bandH = Math.max(96, H * .22), bandY = H - bandH - 6;
  const { cx, cy, R } = ringGeom();

  // ── flock: orthographic-ish projection (slow roll for depth, no cinematic orbit) ─────────────
  const rc = Math.cos(roll), rs = Math.sin(roll), F = 16; // focal distance
  const proj = p => {
    const x = p.x * rc - p.z * rs, z = p.x * rs + p.z * rc, y = p.y;
    const s = F / (F + z);
    return { sx: cx + x * s * (R / RING_R) * .62, sy: cy + y * s * (R / RING_R) * .62, s };
  };
  c.fillStyle = '#fff';
  const pts = flock.boids.map(b => proj(b.pos));
  // thread lines first, under the dots
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = .6; c.beginPath();
  for (let k = 0; k < flock.lineN; k++) {
    const i6 = k * 6;
    const a = proj({ x: flock.lines[i6], y: flock.lines[i6+1], z: flock.lines[i6+2] });
    const b = proj({ x: flock.lines[i6+3], y: flock.lines[i6+4], z: flock.lines[i6+5] });
    c.moveTo(a.sx, a.sy); c.lineTo(b.sx, b.sy);
  }
  c.stroke(); c.lineWidth = 1;
  pts.forEach(p => { const sz = Math.max(1.1, 2.6 * p.s); c.globalAlpha = clamp(.35 + .65 * p.s); c.fillRect(p.sx - sz/2, p.sy - sz/2, sz, sz); });
  c.globalAlpha = 1;

  // ── scan ring: a rotating sweep hairline + 8 plain address ticks, no glow, no beams ──────────
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.arc(cx, cy, R * .72, 0, TAU); c.stroke();
  const sweepA = (t * .00035 * K.clock) % TAU;
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.beginPath();
  c.moveTo(cx + Math.cos(sweepA) * R * .72, cy + Math.sin(sweepA) * R * .72);
  c.lineTo(cx + Math.cos(sweepA) * R * 1.0, cy + Math.sin(sweepA) * R * 1.0);
  c.stroke();
  for (let i = 0; i < 8; i++) {
    const a = rad(i * 45 - 90), x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    const on = !K.released && i === K.node;
    const sz = 7;
    c.fillStyle = on ? '#fff' : '#000';
    c.strokeStyle = '#fff';
    c.beginPath(); c.rect(x - sz/2, y - sz/2, sz, sz); c.fill(); c.stroke();
    c.font = `500 10px ${MONO}`; c.fillStyle = 'rgba(255,255,255,.6)'; c.textAlign = 'center';
    c.fillText(String(i), x, y + sz + 13);
  }
  // centre: release pad
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.rect(cx - R*.11, cy - R*.11, R*.22, R*.22); c.stroke();
  c.beginPath(); c.moveTo(cx - R*.05, cy); c.lineTo(cx + R*.05, cy); c.moveTo(cx, cy - R*.05); c.lineTo(cx, cy + R*.05); c.stroke();

  // ── telemetry: the real numbers, no padding, no decoration ────────────────────────────────────
  const target = K.released ? null : node3D(K.node);
  let sumD = 0; for (const b of flock.boids) sumD += target ? Math.hypot(b.pos.x-target.x, b.pos.y-target.y, b.pos.z-target.z) : Math.hypot(b.pos.x, b.pos.y, b.pos.z);
  const avgD = sumD / flock.boids.length;
  const threads = flock.lineN;
  const seed = (threads & 0x3ff) ^ ((Math.floor(avgD * 8) & 0xff) << 10) ^ ((K.released ? 15 : K.node) << 18);

  // barcode row, keyed to the real seed — changing the flock visibly rewrites the code
  const bw = Math.max(2, (W - pad * 2) / NL);
  for (let i = 0; i < NL; i++) {
    const idx = i + Math.floor(seed * 2.7);
    const on = hash(idx * 2654435761 >>> 0) > (.56 - K.thread * .18);
    row.data[i*4] = row.data[i*4+1] = row.data[i*4+2] = on ? 255 : 0; row.data[i*4+3] = 255;
  }
  if (++rasterTick % 2 === 0) { rctx.drawImage(raster, 0, 0, NL, RH - 1, 0, 1, NL, RH - 1); rctx.putImageData(row, 0, 0); }

  c.fillStyle = '#000'; c.fillRect(pad, bandY, W - pad * 2, bandH);
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.strokeRect(pad + .5, bandY + .5, W - pad * 2 - 1, bandH - 1);
  const barH = 24;
  c.fillStyle = '#fff';
  for (let i = 0; i < NL; i++) if (row.data[i*4] > 0) c.fillRect(pad + i * bw, bandY + 14, Math.max(1, bw * .82), barH);
  c.imageSmoothingEnabled = false;
  c.drawImage(raster, pad, bandY + 14 + barH + 4, W - pad * 2, bandH - barH - 20);
  c.imageSmoothingEnabled = true;

  c.font = `400 10px ${MONO}`; c.textAlign = 'left'; c.fillStyle = 'rgba(255,255,255,.8)';
  const bits = threads.toString(2).padStart(10, '0');
  c.fillText(`LINES ${String(threads).padStart(3,'0')}  BIN ${bits}  HEX 0x${threads.toString(16).toUpperCase().padStart(3,'0')}`, pad + 8, bandY + bandH - 6);
  c.textAlign = 'right';
  c.fillText(`SEEK Δ${avgD.toFixed(3)}  NODE ${K.released ? '— RELEASED' : String(K.node).padStart(1,'0') + '/8'}`, W - pad - 8, bandY + bandH - 6);

  // ── HUD ──────────────────────────────────────────────────────────────────────────────────────
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.fillStyle = '#fff'; c.font = `700 30px ${COND}`; c.fillText('DTM-17', pad, 40);
  const codeW = c.measureText('DTM-17').width + 14;
  c.font = `500 10px ${MONO}`; c.fillStyle = 'rgba(255,255,255,.6)';
  c.fillText('DATAMATICS', pad + codeW, 28); c.fillText(`${COUNT} POINTS · READ, NOT RENDERED`, pad + codeW, 41);
}

// ── loop ────────────────────────────────────────────────────────────────────────────────────────
let last = performance.now();
function loop(now) {
  const dt = Math.min(64, now - last) / 1000; last = now;
  const perception = 2.6 + K.density * 4.2, lineDist = .9 + K.density * 2.4;
  const motion = reduce ? .2 : 1;
  stepFlock(flock, K.released ? null : K.node, perception, lineDist, dt * K.clock * motion);
  roll += dt * .05 * motion;
  if (W) draw(now, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
