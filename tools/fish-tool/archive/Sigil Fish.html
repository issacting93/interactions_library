<title>Sigil Fish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed deep-water canvas, fish swims head-up in the centre; slim control drawer docks at the bottom. Single dark world by choice. */
:root {
  --void: #030706;
  --panel: rgba(8, 15, 14, 0.86);
  --line: #1f3a33;
  --teal: #61e5bf;
  --teal-dim: #367f6a;
  --text: #cfe9e0;
  --muted: #7fa398;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--text); font-family: var(--mono); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.mark {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; display: grid; gap: 4px; max-width: 30ch;
}
.mark h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--teal); }
.mark p { margin: 0; font-size: 11px; line-height: 1.6; letter-spacing: 0.04em; color: var(--muted); }
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
  display: flex; flex-direction: column; gap: 12px;
}
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
button, .seg label {
  font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text); background: transparent; border: 1px solid var(--line);
  padding: 8px 12px; cursor: pointer; border-radius: 2px;
}
button:hover, .seg label:hover { border-color: var(--teal-dim); }
button:focus-visible, .seg input:focus-visible + label, input[type=range]:focus-visible { outline: 1px solid var(--teal); outline-offset: 2px; }
.seg { display: inline-flex; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { margin-left: -1px; }
.seg input:checked + label { color: var(--void); background: var(--teal); border-color: var(--teal); }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl span { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ctl output { color: var(--teal); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
input[type=range]::-moz-range-track { height: 1px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4.5px; background: var(--teal); transform: rotate(45deg); border: 0; }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; background: var(--teal); transform: rotate(45deg); border: 0; border-radius: 0; }
@media (max-width: 640px) { .mark p { display: none; } }
</style>

<canvas id="c" aria-label="A fish assembled from sigil parts, swimming with a travelling body wave"></canvas>

<div class="mark">
  <h1>Sigil Fish</h1>
  <p>Medallion head, whisker barbels, pectoral and pelvic fins, five spine plates, forked tail. 26 parts, mirrored.</p>
</div>

<div class="drawer">
  <div class="bar">
    <div class="seg" role="radiogroup" aria-label="Render mode">
      <input type="radio" name="mode" id="m-vector" value="vector"><label for="m-vector">Vector</label>
      <input type="radio" name="mode" id="m-hybrid" value="hybrid" checked><label for="m-hybrid">Hybrid</label>
      <input type="radio" name="mode" id="m-points" value="points"><label for="m-points">Points</label>
    </div>
    <span class="spacer"></span>
    <button id="pause" type="button">Pause</button>
    <button id="tune" type="button" aria-expanded="true" aria-controls="sliders">Hide controls</button>
  </div>
  <div class="sliders" id="sliders">
    <label class="ctl"><span>Body wave <output id="o-wave"></output></span><input type="range" id="wave" min="0" max="500" step="10" value="220"></label>
    <label class="ctl"><span>Tail flick <output id="o-flick"></output></span><input type="range" id="flick" min="0" max="25" step="0.5" value="9"></label>
    <label class="ctl"><span>Fin paddle <output id="o-fin"></output></span><input type="range" id="fin" min="0" max="30" step="0.5" value="12"></label>
    <label class="ctl"><span>Wander <output id="o-wander"></output></span><input type="range" id="wander" min="0" max="1" step="0.05" value="0.5"></label>
    <label class="ctl"><span>Speed <output id="o-speed"></output></span><input type="range" id="speed" min="0" max="3" step="0.05" value="1"></label>
    <label class="ctl"><span>Shimmer <output id="o-shimmer"></output></span><input type="range" id="shimmer" min="0" max="1" step="0.05" value="0.55"></label>
    <label class="ctl"><span>Glow <output id="o-glow"></output></span><input type="range" id="glow" min="0" max="40" step="1" value="12"></label>
  </div>
</div>

  let pick = Math.random() * totalN, ring = allRings[0];
  for (const r of allRings) { if ((pick -= r.n) <= 0) { ring = r; break; } }
  particles.push({ ring, pos: Math.random() * ring.n, vel: (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.6), seed: Math.random() * 1000, size: 0.5 + Math.random() * 1.1 });
}

// ---- motion ----
const P = { wave: 220, flick: 9, fin: 12, wander: 0.5, speed: 1, shimmer: 0.55, glow: 12 };
const DEG = Math.PI / 180;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// lateral body wave: small at the head, growing toward the tail, one wavelength per body
function bodyX(y, t) {
  const s = Math.min(1.15, Math.max(0, (y - BY0) / LEN));
  const env = 0.1 + 0.9 * Math.pow(s, 1.7);
  return P.wave * env * Math.sin(s * 2 * Math.PI * 0.9 - t);
}
function bodySlope(y, t) { return (bodyX(y + 40, t) - bodyX(y - 40, t)) / 80; }

function rot(px, py, x, y, a) {
  const c = Math.cos(a), s = Math.sin(a), dx = x - px, dy = y - py;
  return [px + dx * c - dy * s, py + dx * s + dy * c];
}

function moveRing(part, r, t) {
  const b = r.base, c = r.cur;
  const [ax, ay] = part.anchor, side = part.side || 1;
  const g = part.group;
  for (let i = 0; i < b.length; i += 2) {
    let x = b[i], y = b[i + 1];
    if (g === 'pectoral' || g === 'pelvic' || g === 'shoulder') {
      // fins row: rotate about the root, both sides together, tips lag the root
      const d = Math.hypot(x - ax, y - ay);
      const lag = d * 0.0009;
      const amp = g === 'shoulder' ? 0.5 : g === 'pelvic' ? 0.75 : 1;
      const ph = g === 'pelvic' ? 1.3 : g === 'shoulder' ? 0.6 : 0;
      const a = -side * P.fin * amp * DEG * Math.sin(t * 0.5 - ph - lag);
      [x, y] = rot(ax, ay, x, y, a);
      // ride the body at the root, flex a little with the wave further out
      x += bodyX(ay, t) + 0.35 * (bodyX(y, t) - bodyX(ay, t));
    } else if (g === 'whisker') {
      const d = Math.hypot(x - ax, y - ay);
      const a = (-side * 6 * Math.sin(t * 0.7 - d * 0.004) - bodySlope(ay, t) * 0.6) * DEG * 10 * smooth(0, 300, d) / 10;
      [x, y] = rot(ax, ay, x, y, a);
      x += bodyX(ay, t);
    } else if (g === 'tail') {
      // lobes follow the wave point by point, plus an extra flick that grows to the tips
      const d = Math.max(0, y - ay);
      x += bodyX(y, t);
      x += Math.sin(t - 0.9) * P.flick * 12 * Math.pow(d / 3000, 1.5);
      y -= Math.abs(Math.sin(t - 0.9)) * P.flick * 2 * (d / 3000);
    } else {
      x += bodyX(y, t);
    }
    c[i] = x; c[i + 1] = y;
  }
}

// ---- rendering ----
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, vw = 0, vh = 0, baseScale = 1, stageH = 0, stageTop = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = canvas.clientWidth; vh = canvas.clientHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  const drawer = document.querySelector('.drawer').getBoundingClientRect().height;
  stageTop = 24; stageH = vh - drawer - 48;
  const bw = (BX1 - BX0) + 1400, bh = LEN + 500;
  baseScale = Math.min((vw - 32) / bw, stageH / bh);
}
new ResizeObserver(resize).observe(document.body);
resize();

let mode = 'hybrid';
function frame(t, tw) {
  for (const p of parts) for (const r of p.rings) moveRing(p, r, t);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#030706';
  ctx.fillRect(0, 0, vw, vh);

  // wander: a slow loop around the stage, heading follows the path
  const W = P.wander;
  const roamX = Math.sin(tw * 0.11) * vw * 0.16 * W;
  const roamY = Math.sin(tw * 0.22) * stageH * 0.05 * W;
  const heading = Math.cos(tw * 0.11) * 0.18 * W - Math.sin(tw * 0.22) * 0.02 * W;
  const cx = vw / 2 + roamX, cy = stageTop + stageH / 2 + roamY;
  const s = baseScale;
  ctx.setTransform(dpr * s * Math.cos(heading), dpr * s * Math.sin(heading), -dpr * s * Math.sin(heading), dpr * s * Math.cos(heading), dpr * cx, dpr * cy);
  ctx.translate(-(BX0 + BX1) / 2, -(BY0 + BY1) / 2);
  const lw = 1.8 / s;

  if (mode !== 'points') {
    for (const p of parts) {
      const path = new Path2D();
      for (const r of p.rings) {
        const c = r.cur;
        path.moveTo(c[0], c[1]);
        for (let i = 2; i < c.length; i += 2) path.lineTo(c[i], c[i + 1]);
        path.closePath();
      }
      if (p.role !== 'ring') {
        const g = ctx.createLinearGradient(0, p.y0, 0, p.y1);
        g.addColorStop(0, '#2b292a'); g.addColorStop(1, '#0d0d0d');
        ctx.fillStyle = g;
        ctx.fill(path, 'evenodd');
      }
      const sg = ctx.createLinearGradient(0, p.y0, 0, p.y1);
      sg.addColorStop(0, '#61e5bf'); sg.addColorStop(0.55, '#367f6a'); sg.addColorStop(1, '#2a6455');
      ctx.strokeStyle = p.role === 'ring' ? '#61e5bf' : sg;
      ctx.lineWidth = lw;
      ctx.shadowColor = 'rgba(97,229,191,0.75)';
      ctx.shadowBlur = P.glow * dpr;
      ctx.stroke(path);
      ctx.shadowBlur = 0;
    }
  }

  if (mode !== 'vector') {
    ctx.globalCompositeOperation = 'lighter';
    if (mode === 'points') {
      ctx.fillStyle = 'rgba(97,229,191,0.55)';
      for (const r of allRings) { const c = r.cur; for (let i = 0; i < c.length; i += 4) ctx.fillRect(c[i] - lw / 2, c[i + 1] - lw / 2, lw, lw); }
    }
    const count = Math.floor(PARTICLES * (mode === 'points' ? 1 : P.shimmer));
    for (let k = 0; k < count; k++) {
      const p = particles[k], c = p.ring.cur, n = p.ring.n;
      p.pos = (p.pos + p.vel * (P.speed + 0.2) + n) % n;
      const i = Math.floor(p.pos) * 2;
      const flick = 0.5 + 0.5 * Math.sin(tw * 3 + p.seed);
      const a = 0.25 + 0.75 * flick * flick;
      const rad = (p.size * (1 + flick)) / s;
      ctx.fillStyle = `rgba(150,255,220,${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(c[i], c[i + 1], rad, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(97,229,191,${(a * 0.09).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(c[i], c[i + 1], rad * 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ---- loop & controls ----
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = reduce, clock = 1.2, wclock = 0, last = performance.now();
const pauseBtn = document.getElementById('pause');
pauseBtn.textContent = paused ? 'Play' : 'Pause';
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; });

const tuneBtn = document.getElementById('tune'), sliders = document.getElementById('sliders');
tuneBtn.addEventListener('click', () => {
  sliders.hidden = !sliders.hidden;
  tuneBtn.setAttribute('aria-expanded', String(!sliders.hidden));
  tuneBtn.textContent = sliders.hidden ? 'Show controls' : 'Hide controls';
  resize();
});

const fmt = { wave: v => v, flick: v => v + '°', fin: v => v + '°', wander: v => Math.round(v * 100) + '%', speed: v => (+v).toFixed(2) + '×', shimmer: v => Math.round(v * 100) + '%', glow: v => v };
for (const key of Object.keys(P)) {
  const el = document.getElementById(key), o = document.getElementById('o-' + key);
  const set = () => { P[key] = parseFloat(el.value); o.textContent = fmt[key](el.value); };
  el.addEventListener('input', set); set();
}
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => { mode = r.value; }));

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { clock += dt * P.speed * 3.0; wclock += dt * P.speed; }
  frame(clock, wclock);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body></html>
