<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Grammar</title>
<!--
  City Grammar — the ancient city built in layers (shared/city/city-grammar.js) from three
  spreadsheets (shared/city/grammar/*.csv):
    HEIGHT     terraces, the tower's acropolis highest, stepping down to the lower town
    ZONING     districts by rule: university round the tower, villas high, dense housing low,
               markets where the avenues cross, shrines, gardens, a canal
    MODULES    a dual grid per terrace -- each tile picks a module from which of its corners are
               built, its street front a socket that has to meet its neighbour's
    STITCHING  retaining walls, stairs, sacred gates, bridges, wells, the wall and its gates
  Two views: Route (drawn in a style recipe, shared/style/style-recipes.js) and Plan (from above,
  coloured by district, street fronts coloured by socket). Click a building to read its module row.
  Serve from the repo root and open /tools/city-grammar/. ?seed= picks the city.
-->
<style>
  :root { --ink: #dfe5da; --ink-2: #9faba2; --ink-3: #6a776f; --rule: rgba(223,229,218,.16); --warm: #f0b35a; --panel: rgba(16,20,18,.72);
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a201d; color: var(--ink); font: 12px/1.5 var(--mono); overflow: hidden; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  .grain, .vig { position: fixed; inset: 0; pointer-events: none; }
  .vig { background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,.7) 100%); }
  .grain { inset: -50%; mix-blend-mode: overlay; opacity: .45;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  body.plan .grain, body.plan .vig { display: none; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; pointer-events: none; }
  .title h1 { font: 500 13px var(--mono); letter-spacing: .32em; text-transform: uppercase; margin: 0 0 2px; }
  .title p { margin: 0; color: var(--ink-2); letter-spacing: .06em; font-size: 11px; }
  .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
  button, select, input, .btnlink { font: 10.5px var(--mono); text-decoration: none; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: rgba(16,20,18,.6); backdrop-filter: blur(6px); border: 1px solid var(--rule); border-radius: 2px; padding: 7px 10px; cursor: pointer; }
  select, input { text-transform: none; letter-spacing: .03em; }
  input { width: 92px; cursor: text; }
  button:hover, select:hover, .btnlink:hover { border-color: rgba(223,229,218,.4); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--warm); color: var(--warm); }
  .status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); pointer-events: none; }
  .status[hidden] { display: none; }
  /* the inspector: the module row the clicked building was built from */
  .insp { position: fixed; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(330px, calc(100vw - 32px)); background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--rule); border-radius: 2px; padding: 12px 14px; }
  .insp[hidden] { display: none; }
  .insp h2 { font: 500 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; margin: 0 0 2px; }
  .insp .id { color: var(--ink-3); font-size: 10.5px; margin-bottom: 8px; }
  .insp dl { display: grid; grid-template-columns: 82px 1fr; gap: 3px 10px; margin: 0; font-size: 11px; }
  .insp dt { color: var(--ink-2); letter-spacing: .06em; }
  .insp dd { margin: 0; }
  .insp .note { margin: 8px 0 0; color: var(--ink-2); font-size: 11px; }
  .insp .x { position: absolute; top: 6px; right: 6px; padding: 2px 7px; }
  .sock { display: inline-block; padding: 0 5px; border-radius: 2px; color: #111; font-size: 10px; margin-right: 3px; }
  .legend { position: fixed; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--rule); border-radius: 2px; padding: 10px 12px; font-size: 10.5px; display: none; max-width: 230px; }
  body.plan .legend { display: block; }
  .legend h3 { margin: 0 0 6px; font: 500 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
  .legend div { display: flex; align-items: center; gap: 7px; line-height: 1.7; }
  .legend i { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .legend .gap { height: 8px; }
  .hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); color: var(--ink-3); font-size: 10.5px; letter-spacing: .08em; pointer-events: none; white-space: nowrap; }
  @media (max-width: 760px) { .hint { display: none; } .legend { max-width: 160px; } }

<body>
<canvas id="gl"></canvas>
<div class="grain"></div><div class="vig"></div>
<div class="status" id="status">Reading the grammar…</div>
<div class="hint">drag to turn · scroll to zoom · click a building to read its module</div>
<div class="legend" id="legend"></div>
<aside class="insp" id="insp" hidden aria-live="polite"></aside>
<div class="hud">
  <div class="title"><h1>City Grammar</h1><p id="sub"></p></div>
  <div class="tools">
    <input id="seed" type="number" aria-label="Seed">
    <button id="newCity">New city</button>
    <button id="viewBtn" aria-pressed="false" title="From above, coloured by district; street fronts coloured by socket">Plan</button>
    <select id="style" aria-label="Style"></select>
    <button id="relBtn" title="Reload the three spreadsheets and rebuild (after you edit them)">Reload sheets</button>
    <a class="btnlink" href="../../shared/city/grammar/README.md" target="_blank">The sheets</a>
  </div>
</div>

<script src="../../forge/web/forge-world.js"></script>
<script src="../../shared/style/style-recipes.js"></script>
<script src="../../shared/city/city-grammar.js"></script>
<script type="module">
import * as THREE from "three";
const $ = (id) => document.getElementById(id);
const store = { get: (k, d) => { try { return localStorage.getItem("city-grammar:" + k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem("city-grammar:" + k, v); } catch {} } };

// ── renderer, camera ────────────────────────────────────────────────────────────────────────
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene();
const persp = new THREE.PerspectiveCamera(32, 1, 0.5, 400), ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.5, 400);
const view = { yaw: 0.75, pitch: 0.52, dist: 46, plan: store.get("view", "route") === "plan" };

// ── the shared style chunk, in a three.js material ──────────────────────────────────────────
const shared = StyleRecipes.threeUniforms(THREE);
const VS = /* glsl */`
  attribute float tileId; attribute vec3 color;
  varying vec3 vW, vN, vC; varying float vTile;
  void main() { vW = (modelMatrix * vec4(position, 1.0)).xyz; vN = normalize(mat3(modelMatrix) * normal); vC = color; vTile = tileId;
    gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0); }`;
const FS = /* glsl */`
  ${StyleRecipes.GLSL}
  uniform float uTone, uLine, uBandFix, uPlan, uSel;
  varying vec3 vW, vN, vC; varying float vTile;
  void main() {
    vec3 col;
    if (uPlan > 0.5) {   // Plan: the district colour, lit just enough to read the massing
      col = uLine > 0.5 ? vC : vC * (0.62 + 0.38 * max(dot(normalize(vN), normalize(vec3(-0.4, 1.0, 0.3))), 0.0));
    } else col = stShade(vW, uLine > 0.5 ? vec3(0.0) : vN, uLine, uTone, uBandFix);
    if (uSel >= 0.0 && abs(vTile - uSel) < 0.5 && uLine < 0.5) col = mix(col, vec3(0.94, 0.7, 0.35), 0.45);
    gl_FragColor = vec4(col, 1.0);
    #include <colorspace_fragment>
  }`;
const uPlan = { value: view.plan ? 1 : 0 }, uSel = { value: -1 };
const mat = (tone, opts = {}) => new THREE.ShaderMaterial({
  uniforms: { ...shared, uTone: { value: tone }, uLine: { value: opts.line ? 1 : 0 }, uBandFix: { value: opts.band ?? -1 }, uPlan, uSel },
  vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide,
  polygonOffset: !opts.line, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const M = { bldg: mat(-0.04), ground: mat(0.02), water: mat(0.22), green: mat(-0.1), line: mat(0, { line: true }), sock: mat(0, { line: true }) };
M.sock.depthTest = false;

// ── geometry accumulators: triangles with flat normals, a district colour, and the tile they came from ──
class Tri {
  constructor() { this.p = []; this.n = []; this.c = []; this.t = []; }
  tri(a, b, c, col, tid = -1) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const L = Math.hypot(nx, ny, nz) || 1; nx /= L; ny /= L; nz /= L;
    for (const q of [a, b, c]) { this.p.push(q[0], q[1], q[2]); this.n.push(nx, ny, nz); this.c.push(col.r, col.g, col.b); this.t.push(tid); }
  }
  quad(a, b, c, d, col, tid) { this.tri(a, b, c, col, tid); this.tri(a, c, d, col, tid); }
  mesh(m) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(this.p, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(this.c, 3)); g.setAttribute("tileId", new THREE.Float32BufferAttribute(this.t, 1));
    return new THREE.Mesh(g, m);
  }
}
class Lines {
  constructor() { this.p = []; this.c = []; }
  seg(a, b, col) { this.p.push(...a, ...b); this.c.push(col.r, col.g, col.b, col.r, col.g, col.b); }
  poly(pts, col, closed) { for (let k = 0; k < pts.length - (closed ? 0 : 1); k++) this.seg(pts[k], pts[(k + 1) % pts.length], col); }
  mesh(m) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(this.p, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(new Float32Array(this.p.length), 3)); g.setAttribute("tileId", new THREE.Float32BufferAttribute(new Float32Array(this.p.length / 3).fill(-1), 1));
    return new THREE.LineSegments(g, m);
  }
}
const ring = (r0, r1, y, a0, a1, segs, acc, col, up = true) => {
  for (let k = 0; k < segs; k++) {
    const t0 = a0 + (a1 - a0) * k / segs, t1 = a0 + (a1 - a0) * (k + 1) / segs, c0 = Math.cos(t0), s0 = Math.sin(t0), c1 = Math.cos(t1), s1 = Math.sin(t1);
    const A = [c0 * r0, y, s0 * r0], B = [c1 * r0, y, s1 * r0], C = [c1 * r1, y, s1 * r1], D = [c0 * r1, y, s0 * r1];
    up ? acc.quad(A, D, C, B, col) : acc.quad(A, B, C, D, col);
  }
};
const wallRing = (r, y0, y1, a0, a1, segs, acc, col) => {
  for (let k = 0; k < segs; k++) {
    const t0 = a0 + (a1 - a0) * k / segs, t1 = a0 + (a1 - a0) * (k + 1) / segs;
    acc.quad([Math.cos(t0) * r, y0, Math.sin(t0) * r], [Math.cos(t1) * r, y0, Math.sin(t1) * r], [Math.cos(t1) * r, y1, Math.sin(t1) * r], [Math.cos(t0) * r, y1, Math.sin(t0) * r], col);
  }
};
function prism(acc, lines, poly, y0, y1, col, tid, ink, outline = true) {
  for (let k = 0; k < poly.length; k++) { const a = poly[k], b = poly[(k + 1) % poly.length]; acc.quad([a[0], y0, a[1]], [b[0], y0, b[1]], [b[0], y1, b[1]], [a[0], y1, a[1]], col, tid); }
  for (let k = 1; k < poly.length - 1; k++) acc.tri([poly[0][0], y1, poly[0][1]], [poly[k + 1][0], y1, poly[k + 1][1]], [poly[k][0], y1, poly[k][1]], col, tid);
  if (outline && lines) lines.poly(poly.map((p) => [p[0], y1, p[1]]), ink, true);
}
const centroid = (poly) => poly.reduce((s, p) => [s[0] + p[0] / poly.length, s[1] + p[1] / poly.length], [0, 0]);
const ngon = (x, z, r, n, rot = 0) => Array.from({ length: n }, (_, k) => [x + Math.cos(rot + k / n * Math.PI * 2) * r, z + Math.sin(rot + k / n * Math.PI * 2) * r]);
function cone(acc, lines, x, z, y0, r, h, n, col, tid, ink) {
  const base = ngon(x, z, r, n);
  for (let k = 0; k < n; k++) { const a = base[k], b = base[(k + 1) % n]; acc.tri([a[0], y0, a[1]], [b[0], y0, b[1]], [x, y0 + h, z], col, tid); }
  if (lines) { lines.seg([x, y0, z].map((v, i) => i === 1 ? y0 : v), [x, y0 + h, z], ink); for (let k = 0; k < n; k += Math.max(1, n >> 2)) lines.seg([base[k][0], y0, base[k][1]], [x, y0 + h, z], ink); }
}
// a deep pagoda eave: a thin overhanging slab, a tier above it, and a little hat
function eaves(acc, lines, poly, y, col, tid, ink, tiers = 2) {
  let c = centroid(poly), p = poly, yy = y;
  for (let k = 0; k < tiers; k++) {
    const grow = 1.28 - k * 0.32, slab = p.map((q) => [c[0] + (q[0] - c[0]) * grow, c[1] + (q[1] - c[1]) * grow]);
    prism(acc, lines, slab, yy, yy + 0.05, col, tid, ink);
    const up = p.map((q) => [c[0] + (q[0] - c[0]) * (0.75 - k * 0.2), c[1] + (q[1] - c[1]) * (0.75 - k * 0.2)]);
    prism(acc, null, up, yy + 0.05, yy + 0.2, col, tid, ink, false);
    yy += 0.2; p = up;
  }
  hip(acc, lines, p, yy, 0.18, col, tid, ink);
}
function hip(acc, lines, poly, y, h, col, tid, ink) {
  const c = centroid(poly), apex = [c[0], y + h, c[1]];
  for (let k = 0; k < poly.length; k++) { const a = poly[k], b = poly[(k + 1) % poly.length]; acc.tri([a[0], y, a[1]], [b[0], y, b[1]], apex, col, tid); }
  // no lines here: the street front's top edge already outlines the block; per-tile roof lines would
  // turn the roofscape into the tile grid
}

// ── the sheets, the city ────────────────────────────────────────────────────────────────────
let sheet = null, city = null, world = null;
const COLORS = {};
const ink = new THREE.Color("#000"), inkTone = () => ink;
const SOCK_COL = { plain: "#9a9a92", door: "#6fa3d8", arcade: "#e8a34a", sacred: "#d9534f", blank: "#555" };
function districtColor(id) { return COLORS[id] || (COLORS[id] = new THREE.Color((sheet.byId[id] && sheet.byId[id].colour) || "#888")); }

// the marching-squares outline of a tile's built part, in its own (u,v) square: a=(0,0) b=(1,0) c=(1,1) d=(0,1)
const UV = [[0, 0], [1, 0], [1, 1], [0, 1]], CUT = 0.6;
function footprint(t) {
  const s = t.corners.map((L) => L.solid), edgePt = (p, q) => [UV[p][0] + (UV[q][0] - UV[p][0]) * CUT, UV[p][1] + (UV[q][1] - UV[p][1]) * CUT];
  if (t.shape === "saddle") return [0, 1, 2, 3].filter((k) => s[k]).map((k) => [UV[k], edgePt(k, (k + 1) % 4), edgePt(k, (k + 3) % 4)].map((p, i) => ({ uv: p, contour: i > 0 }))).map((pl) => [pl[0], pl[1], pl[2]]);
  const out = [];
  for (let k = 0; k < 4; k++) {
    const n = (k + 1) % 4;
    if (s[k]) out.push({ uv: UV[k], contour: false });
    if (s[k] !== s[n]) out.push({ uv: s[k] ? edgePt(k, n) : edgePt(n, k), contour: true });
  }
  return [out];
}
function tileToWorld(t, uv) {
  const T = city.terraces[t.terrace], r = T.radii[t.i] + (T.radii[t.i + 1] - T.radii[t.i]) * uv[1], a = (t.j + uv[0]) / T.sectors * Math.PI * 2;
  return [Math.cos(a) * r, Math.sin(a) * r];
}

function buildWorld() {
  if (world) { scene.remove(world); world.traverse((o) => o.geometry && o.geometry.dispose()); }
  world = new THREE.Group(); scene.add(world);
  const B = new Tri(), G = new Tri(), W = new Tri(), V = new Tri(), Lk = new Lines(), S = new Lines();
  const groundCol = new THREE.Color("#b7ad98"), roadCol = new THREE.Color("#8d8578"), waterCol = new THREE.Color("#6f9db0"), greenCol = new THREE.Color("#8fb38a");
  const TER = city.terraces, FH = city.floorH;
  // HEIGHT: each terrace a ring of ground at its level, the ring road outside it one level down,
  // the retaining wall between (the stitch below draws its buttresses and stairs)
  for (let k = 0; k < TER.length; k++) {
    const T = TER[k], inner = k === 0 ? 0 : TER[k - 1].r1, outer = k === TER.length - 1 ? city.wall.r1 + 0.6 : T.r1;
    ring(inner, outer, T.y, 0, Math.PI * 2, 128, G, k === 0 ? groundCol : groundCol);
    if (k < TER.length - 1) { wallRing(T.r1, TER[k + 1].y, T.y, 0, Math.PI * 2, 128, G, roadCol); Lk.poly(ngon(0, 0, T.r1, 128).map((p) => [p[0], T.y, p[1]]), ink, true); }
  }
  ring(city.wall.r1 + 0.6, 70, TER[TER.length - 1].y - 0.02, 0, Math.PI * 2, 96, G, new THREE.Color("#9e9886"));
  // the avenues: a pair of kerb lines down each spoke, terrace by terrace
  for (const a of city.spokes) for (const T of TER) for (const s of [-1, 1]) {
    const off = s * 0.16, c = Math.cos(a), sn = Math.sin(a), px = -sn * off, pz = c * off;
    Lk.seg([c * T.r0 + px, T.y + 0.01, sn * T.r0 + pz], [c * T.r1 + px, T.y + 0.01, sn * T.r1 + pz], ink);
  }
  // open lots: water, gardens, sacred trees
  for (const T of TER) for (const row of T.lots) for (const L of row) {
    const step = (T.r1 - T.r0) / T.rings, wa = Math.PI * 2 / T.sectors;
    if (L.open === "water" && !L.spoke) {
      const a0 = L.a - wa / 2, a1 = L.a + wa / 2;
      ring(L.r - step * 0.45, L.r + step * 0.45, T.y - 0.03, a0, a1, 2, W, waterCol);
      for (let q = 0; q < 2; q++) { const rr = L.r - step * 0.2 + q * step * 0.4; Lk.seg([Math.cos(a0 + 0.02) * rr, T.y - 0.02, Math.sin(a0 + 0.02) * rr], [Math.cos(a1 - 0.05) * rr, T.y - 0.02, Math.sin(a1 - 0.05) * rr], ink); }
    } else if (!L.solid && (L.open === "garden" || (L.open === "courtyard" && (L.i + L.j) % 3 === 0) || L.open === "sacred")) {
      const h = L.open === "sacred" ? 0.9 : 0.45 + ((L.i * 7 + L.j * 13) % 5) * 0.08;
      cone(V, Lk, L.x, L.z, T.y, h * 0.32, h, 6, greenCol, -1, ink);
    }
  }
  // MODULES: every tile's built part, extruded to its floors, its bands, its roof, its street front
  for (const t of city.tiles) {
    if (!t.module) continue;
    const col = districtColor(t.district), tid = city.tiles.indexOf(t), y0 = t.y, y1 = t.y + t.floors * FH;
    for (const pl of footprint(t)) {
      const poly = pl.map((p) => tileToWorld(t, p.uv));
      prism(B, null, poly, y0, y1, col, tid, ink, false);
      // the street front: the contour edge(s), where the module's socket faces the lane
      for (let k = 0; k < pl.length; k++) {
        const p = pl[k], q = pl[(k + 1) % pl.length]; if (!(p.contour && q.contour)) continue;
        const a = poly[k], b = poly[(k + 1) % pl.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
        Lk.seg([a[0], y0, a[1]], [a[0], y1, a[1]], ink); Lk.seg([b[0], y0, b[1]], [b[0], y1, b[1]], ink); Lk.seg([a[0], y1, a[1]], [b[0], y1, b[1]], ink);
        facade(Lk, a, b, L, y0, t, ink);
        S.seg([a[0], y1 + 0.03, a[1]], [b[0], y1 + 0.03, b[1]], new THREE.Color(SOCK_COL[t.module.socket] || "#fff"));
      }
      // roofs
      const roof = t.roof && t.roof.shape;
      if (roof === "pyramid") hip(B, null, poly, y1, 0.22, col, tid, ink);
      else if (roof === "eave") eaves(B, Lk, poly, y1, col, tid, ink, t.district === "sanctum" || t.district === "shrine" ? 2 : 1);
      else if (roof === "spire") {
        const c = centroid(poly), r = Math.min(0.22, 0.4 * Math.sqrt(Math.abs(area(poly))));

        cone(B, Lk, c[0], c[1], y1 + 0.35, r * 1.05, 0.9 + (t.floors * 0.12), 8, col, tid, ink);

  }
  // the tower: Gothic shaft, pagoda eaves stacked up it, a spire
  { const T0 = TER[0], y = T0.y, col = districtColor("tower");
    prism(B, Lk, ngon(0, 0, 1.25, 12), y, y + 0.7, col, -1, ink);
    let yy = y + 0.7, r = 0.95;
    for (let k = 0; k < 4; k++) {
      const h = 0.95 - k * 0.12;
      prism(B, Lk, ngon(0, 0, r, 12, k * 0.13), yy, yy + h, col, -1, ink);
      for (let q = 0; q < 12; q += 2) { const a = q / 12 * Math.PI * 2 + k * 0.13; Lk.seg([Math.cos(a) * r, yy + 0.15, Math.sin(a) * r], [Math.cos(a) * r, yy + h - 0.15, Math.sin(a) * r], ink); }
      yy += h; prism(B, Lk, ngon(0, 0, r * 1.45, 12, k * 0.13), yy, yy + 0.06, col, -1, ink); yy += 0.06; r *= 0.8;
    }

  // STITCHING
  for (const s of city.stitches) stitch(s, B, Lk, ink);
  world.add(G.mesh(M.ground), W.mesh(M.water), V.mesh(M.green), B.mesh(M.bldg), Lk.mesh(M.line));

const area = (p) => p.reduce((s, q, k) => { const r = p[(k + 1) % p.length]; return s + q[0] * r[1] - r[0] * q[1]; }, 0) / 2;
// facade line work per socket: arcades, doors, a sacred rope, plain lancet windows
function facade(L, a, b, len, y0, t, col) {
  const dir = [(b[0] - a[0]) / len, (b[1] - a[1]) / len], at = (s, y) => [a[0] + dir[0] * s, y, a[1] + dir[1] * s];
  const FH = city.floorH, sock = t.module.socket;
  if (sock === "arcade") {
    const n = Math.max(1, Math.round(len / 0.28)), w = len / n;
    for (let k = 0; k < n; k++) { const s0 = k * w, pts = []; for (let q = 0; q <= 6; q++) { const th = Math.PI * q / 6; pts.push(at(s0 + w / 2 - Math.cos(th) * w * 0.38, y0 + FH * 0.55 + Math.sin(th) * w * 0.38)); } L.poly(pts, col); L.seg(at(s0 + w * 0.12, y0), at(s0 + w * 0.12, y0 + FH * 0.55), col); L.seg(at(s0 + w * 0.88, y0), at(s0 + w * 0.88, y0 + FH * 0.55), col); }
  } else if (sock === "door") {
    const n = Math.max(1, Math.floor(len / 0.42));
    for (let k = 0; k < n; k++) { const s = (k + 0.5) * len / n; L.poly([at(s - 0.06, y0), at(s - 0.06, y0 + FH * 0.7), at(s + 0.06, y0 + FH * 0.7), at(s + 0.06, y0)], col); }
  } else if (sock === "sacred") {
    const pts = []; for (let q = 0; q <= 8; q++) { const s = len * q / 8; pts.push(at(s, y0 + FH * 0.82 - Math.sin(Math.PI * q / 8) * 0.06)); } L.poly(pts, col);
    for (let q = 1; q < 8; q += 2) { const s = len * q / 8, y = y0 + FH * 0.82 - Math.sin(Math.PI * q / 8) * 0.06; L.poly([at(s, y), at(s + 0.03, y - 0.05), at(s - 0.01, y - 0.09), at(s + 0.02, y - 0.14)], col); }
  }
  if (sock !== "arcade") {   // lancet windows on every floor above (and on plain/door ground floors)
    const n = Math.max(1, Math.floor(len / 0.3));
    for (let f = sock === "plain" ? 0 : 1; f < t.floors; f++) for (let k = 0; k < n; k++) {
      const s = (k + 0.5) * len / n, yb = y0 + f * FH + FH * 0.25, yt = y0 + f * FH + FH * 0.7;
      L.seg(at(s, yb), at(s, yt), col); L.seg(at(s, yt), at(s + 0.025, yt + 0.05), col);
    }

  for (let f = 1; f < t.floors; f++) L.seg(at(0, y0 + f * FH), at(len, y0 + f * FH), col);   // storey bands (the stack)

function stitch(s, B, L, col) {
  const stone = new THREE.Color("#c9bfa8"), cs = Math.cos(s.a || 0), sn = Math.sin(s.a || 0), side = [-sn, cs];
  const box = (x, z, w, d, y0, h, rot = s.a || 0) => { const c = Math.cos(rot), q = Math.sin(rot); const p = [[-w, -d], [w, -d], [w, d], [-w, d]].map(([u, v]) => [x + u * c - v * q, z + u * q + v * c]); prism(B, L, p, y0, y0 + h, stone, -1, col); };
  if (s.kind === "terrace-edge") {   // buttresses down the retaining wall, Gothic, every so often
    for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2; if (s.gaps.some((g) => Math.abs(Math.atan2(Math.sin(a - g), Math.cos(a - g))) < 0.08)) continue; box(Math.cos(a) * (s.r + 0.06), Math.sin(a) * (s.r + 0.06), 0.07, 0.05, s.y0, s.y1 - s.y0 - 0.05, a); }
  } else if (s.kind === "spoke-edge") {   // a stair up the retaining wall
    const n = 7, r0 = s.r1 + 0.02, r1 = s.r0 - 0.02;
    for (let k = 0; k < n; k++) { const r = r1 + (r0 - r1) * (k + 0.5) / n, h = (s.y1 - s.y0) * (k + 1) / n; box(cs * r, sn * r, (r0 - r1) / n / 2 + 0.01, 0.22, s.y0, h); }
  } else if (s.kind === "sanctum-spoke") {   // a torii, its lintel a Gothic pointed arch
    const w = 0.34, h = 0.75, P = (u, y) => [s.x + side[0] * u, s.y + y, s.z + side[1] * u];
    for (const u of [-w, w]) box(s.x + side[0] * u, s.z + side[1] * u, 0.035, 0.035, s.y, h);
    const lint = []; for (let q = 0; q <= 8; q++) { const u = -w * 1.35 + q / 8 * w * 2.7; lint.push(P(u, h + 0.05 + Math.pow(Math.abs(u) / (w * 1.35), 2) * 0.08)); } L.poly(lint, col);
    L.seg(P(-w * 1.1, h - 0.1), P(w * 1.1, h - 0.1), col);
    // Gothic tracery under the lintel: a pointed arch, two arcs meeting at the top
    const arch = []; for (let q = 0; q <= 10; q++) { const u = -w + q / 10 * 2 * w; arch.push(P(u, h - 0.42 + (1 - Math.pow(Math.abs(u) / w, 1.6)) * 0.3)); } L.poly(arch, col);
  } else if (s.kind === "canal-spoke") {   // a bridge
    box(s.x, s.z, 0.42, 0.2, s.y - 0.04, 0.08);
    const arch = []; for (let q = 0; q <= 8; q++) { const th = Math.PI * q / 8, u = -Math.cos(th) * 0.32; arch.push([s.x + cs * u, s.y - 0.09 + Math.sin(th) * 0.08, s.z + sn * u]); } L.poly(arch, col);
  } else if (s.kind === "ring-spoke") {   // a well with a little roof
    prism(B, L, ngon(s.x, s.z, 0.11, 8), s.y, s.y + 0.1, stone, -1, col);
    for (const k of [0, 4]) { const p = ngon(s.x, s.z, 0.1, 8)[k]; L.seg([p[0], s.y + 0.1, p[1]], [p[0], s.y + 0.32, p[1]], col); }
    hip(B, L, ngon(s.x, s.z, 0.16, 4, Math.PI / 4), s.y + 0.32, 0.1, stone, -1, col);
  } else if (s.kind === "wall") {

    for (let k = 0; k < segs; k++) {
      const a0 = k / segs * Math.PI * 2, a1 = (k + 1) / segs * Math.PI * 2, am = (a0 + a1) / 2;
      if (s.gaps.some((g) => Math.abs(Math.atan2(Math.sin(am - g), Math.cos(am - g))) < 0.05)) continue;
      const h = 0.75 + (k % 2 ? 0.08 : 0);   // crenellations
      const p = [[s.r0, a0], [s.r0 + 0.35, a0], [s.r0 + 0.35, a1], [s.r0, a1]].map(([r, a]) => [Math.cos(a) * r, Math.sin(a) * r]);
      prism(B, null, p, s.y, s.y + h, stone, -1, col, false);
      L.seg([p[0][0], s.y + h, p[0][1]], [p[3][0], s.y + h, p[3][1]], col);

    for (const u of [-0.42, 0.42]) { const x = s.x + side[0] * u, z = s.z + side[1] * u, p = ngon(x, z, 0.2, 8); prism(B, L, p, s.y, s.y + 1.3, stone, -1, col); eaves(B, L, p, s.y + 1.3, stone, -1, col, 2); }
    const arch = []; for (let q = 0; q <= 10; q++) { const th = Math.PI * q / 10; arch.push([s.x + side[0] * -Math.cos(th) * 0.22, s.y + 0.5 + Math.sin(th) * 0.3, s.z + side[1] * -Math.cos(th) * 0.22]); } L.poly(arch, col);

}

// ── style frame, camera, drawing ────────────────────────────────────────────────────────────
let look = StyleRecipes.get("route-zero");
function applyStyle() {
  look = StyleRecipes.get($("style").value);
  StyleRecipes.applyThree(shared, look, THREE, { up: [0, 1, 0], sun: [-0.6, 0.7, 0.4], lights: city ? city.lights : [] });
  const sky = look.palette.sky;
  document.body.style.background = view.plan ? "#1d1f1e" : `linear-gradient(${sky[0]}, ${sky[1]} 55%, ${sky[2]})`;
  renderer.setClearColor(view.plan ? "#1d1f1e" : sky[1], 1);
  ink.set(view.plan ? "#16181a" : look.palette.line);
  document.querySelector(".grain").style.opacity = look.atmo.grain * 0.45; document.querySelector(".vig").style.opacity = look.atmo.vignette;
  store.set("style", look.id); needsDraw = true;
}
function placeCamera() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  if (view.plan) {
    const half = 17.5, asp = w / h; ortho.left = -half * Math.max(1, asp); ortho.right = half * Math.max(1, asp); ortho.top = half / Math.min(1, asp); ortho.bottom = -half / Math.min(1, asp);
    ortho.position.set(0, 60, 0.001); ortho.up.set(Math.sin(view.yaw), 0, -Math.cos(view.yaw)); ortho.lookAt(0, 0, 0); ortho.updateProjectionMatrix();
  } else {

    const target = [0, 2.2, 0];
    persp.position.set(Math.cos(view.yaw) * Math.cos(view.pitch) * view.dist, target[1] + Math.sin(view.pitch) * view.dist, Math.sin(view.yaw) * Math.cos(view.pitch) * view.dist);
    persp.lookAt(...target);
  }
  const cam = view.plan ? ortho : persp, d = cam.position.length();
  shared.uStCam.value.copy(cam.position); shared.uStNear.value = Math.max(1, d - 18); shared.uStFar.value = d + 22;
  needsDraw = true;
}
let needsDraw = true;
function frame() { if (needsDraw) { renderer.render(scene, view.plan ? ortho : persp); needsDraw = false; } requestAnimationFrame(frame); }

// ── interaction ─────────────────────────────────────────────────────────────────────────────
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  view.yaw += dx * 0.006; if (!view.plan) view.pitch = Math.min(1.45, Math.max(0.12, view.pitch + dy * 0.004)); placeCamera();
});
canvas.addEventListener("pointerup", (e) => { const d = drag; drag = null; if (d && d.moved < 5) pickAt(e.clientX, e.clientY); });
canvas.addEventListener("wheel", (e) => { e.preventDefault(); view.dist = Math.min(110, Math.max(14, view.dist * Math.exp(e.deltaY * 0.001))); placeCamera(); }, { passive: false });
addEventListener("resize", placeCamera);
const ray = new THREE.Raycaster();
function pickAt(x, y) {
  ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), view.plan ? ortho : persp);
  const hit = ray.intersectObject(world.userData.bldg)[0];
  const tid = hit ? world.userData.bldg.geometry.attributes.tileId.array[hit.face.a] : -1;
  inspect(tid >= 0 ? city.tiles[tid] : null);

const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function inspect(t) {
  uSel.value = t ? city.tiles.indexOf(t) : -1; needsDraw = true;
  const box = $("insp"); if (!t) { box.hidden = true; return; }
  const m = t.module, D = sheet.byId[t.district] || { name: t.district }, SIDES = ["inward", "clockwise", "outward", "counter"];
  const chip = (s) => `<span class="sock" style="background:${SOCK_COL[s] || "#ccc"}">${esc(s)}</span>`;
  const sides = t.sides.map((s, k) => (s ? `${SIDES[k]} ${chip(s)}` : "")).filter(Boolean).join(" ") || "none (inside the block)";
  box.innerHTML = `<button class="x" id="inspX" aria-label="Close">×</button><h2>${esc(m.name)}</h2><div class="id">${esc(m.id)} · modules.csv</div>
    <dl><dt>District</dt><dd>${esc(D.name)}</dd><dt>Shape</dt><dd>${esc(t.shape)} (corners ${t.corners.map((L) => (L.solid ? "■" : "□")).join("")})</dd>
    <dt>Street front</dt><dd>${sides}</dd><dt>Floors</dt><dd>${t.floors}: ${t.stack.map((r) => esc(r.name)).join(" → ")}</dd>
    <dt>Roof</dt><dd>${t.roof ? esc(t.roof.name) : "—"}</dd><dt>Terrace</dt><dd>${t.terrace} (level ${city.terraces[t.terrace].level})</dd>
    <dt>Part</dt><dd>${m.part ? esc(m.part) : "<span style='color:var(--ink-3)'>empty: put a Forge object id in the part column</span>"}</dd></dl>

function legend() {
  const ds = sheet.districts.filter((d) => city.tiles.some((t) => t.district === d.id) || d.id === "tower");
  $("legend").innerHTML = `<h3>Districts</h3>${ds.map((d) => `<div><i style="background:${d.colour}"></i>${esc(d.name)}</div>`).join("")}<div class="gap"></div><h3>Street fronts (sockets)</h3>${Object.entries(SOCK_COL).filter(([k]) => k !== "blank").map(([k, c]) => `<div><i style="background:${c}"></i>${k}</div>`).join("")}`;

// ── build ───────────────────────────────────────────────────────────────────────────────────
function makeCity(seed) {
  seed = seed >>> 0; $("seed").value = seed; store.set("seed", seed);
  const t0 = performance.now();
  city = CityGrammar.build(seed, sheet);
  buildWorld(); applyStyle(); legend(); inspect(null);
  const n = city.tiles.filter((t) => t.module).length, used = new Set(city.tiles.filter((t) => t.module).map((t) => t.module.id)).size;
  $("sub").textContent = `city #${seed} · ${city.terraces.length} terraces · ${n} modules (${used} kinds) · ${city.stitches.length} stitches · ${Math.round(performance.now() - t0)} ms`;
  history.replaceState(null, "", "?seed=" + seed);
  window.CITY = city;
}
async function loadSheets() { sheet = await CityGrammar.load(); }
function fillStyles() {
  const cur = $("style").value || store.get("style", "route-zero");
  $("style").innerHTML = ""; for (const r of StyleRecipes.all()) $("style").add(new Option(r.name + (r.saved ? " (saved)" : ""), r.id));
  $("style").value = cur; if (!$("style").value) $("style").value = "route-zero";
}
$("style").onchange = applyStyle;
$("newCity").onclick = () => makeCity(Math.floor(Math.random() * 1e6));
$("seed").onchange = () => makeCity(+$("seed").value || 1);
$("viewBtn").onclick = () => { view.plan = !view.plan; store.set("view", view.plan ? "plan" : "route"); syncView(); };
$("relBtn").onclick = async () => { await loadSheets(); COLORS && Object.keys(COLORS).forEach((k) => delete COLORS[k]); makeCity(city.seed); };
function syncView() {
  $("viewBtn").setAttribute("aria-pressed", view.plan); document.body.classList.toggle("plan", view.plan);
  uPlan.value = view.plan ? 1 : 0; if (world) world.userData.sock.visible = view.plan; applyStyle(); placeCamera();
}

try {
  await loadSheets();
  fillStyles(); StyleRecipes.loadSaved().then(fillStyles).catch(() => {});
  const q = new URLSearchParams(location.search);
  makeCity(+(q.get("seed") || store.get("seed", 7)));
  syncView();
  $("status").hidden = true;
  requestAnimationFrame(frame);
  window.CITY_GRAMMAR = { ready: true, makeCity, setView: (p) => { view.plan = p; syncView(); }, setStyle: (id) => { $("style").value = id; applyStyle(); }, inspect: (k) => inspect(city.tiles[k]), view };
} catch (e) {
  $("status").textContent = "Couldn't read the grammar sheets: " + e.message; console.error(e);
}
</script>
