<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAPE 08 Patch Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Martian+Mono:wdth,wght@75..112.5,100..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tape08-tokens.css">
<style>
/* Layout: top strip (presets · transport · readouts) → palette | patch stage → status bar.
   The stage holds a pannable/zoomable world: an SVG wire layer under absolutely placed node cards. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--t8-ground);color:var(--t8-ink);font-family:var(--t8-ui);font-size:12px;letter-spacing:.01em;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--t8-ink);outline-offset:2px}
.flab{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--t8-ink-2)}

/* ── top strip ── */
.top{display:flex;align-items:center;gap:16px 24px;padding:10px 28px;border-bottom:1px solid var(--t8-line-2);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:4px}
.brand b{font-family:var(--t8-display);font-weight:400;font-size:14px;letter-spacing:.12em;white-space:nowrap}
.brand span{font-size:9px;letter-spacing:.24em;color:var(--t8-ink-2)}
.cluster{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--t8-line-4);
  border-radius:var(--t8-r-btn);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--t8-line-5)}
.btn.quiet{color:var(--t8-ink-2)}
.btn.preset[aria-pressed="true"]{border-color:var(--t8-accent);color:var(--t8-accent)}
.btn.play{border-color:var(--t8-accent);color:var(--t8-accent);min-width:104px;justify-content:center}
.btn.play[aria-pressed="true"]{background:var(--t8-accent);color:var(--t8-on-signal)}
.btn svg{display:block}
.readouts{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap}
.ro{display:flex;flex-direction:column;gap:1px;min-width:44px}
.ro b{font-family:var(--t8-display);font-weight:300;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro b small{font-family:var(--t8-ui);font-size:9px;color:var(--t8-ink-2);margin-left:3px;letter-spacing:.1em}
.ro.loop b{color:var(--t8-loop)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--t8-ink-2);white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.status.play{color:var(--t8-accent)} .status.err{color:var(--t8-rec)} .status.ok{color:var(--t8-ink)}

/* ── main ── */
.main{flex:1;display:flex;min-height:0}
.palette{width:216px;flex:none;background:var(--t8-panel);border-right:1px solid var(--t8-line-2);padding:20px 14px;overflow:auto;
  display:flex;flex-direction:column;gap:6px}
.palette h2{margin:10px 4px 2px;font-weight:400}
.palette h2:first-child{margin-top:0}
.pal{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:transparent;border:1px solid var(--t8-line-3);
  border-radius:var(--t8-r-btn);text-align:left}
.pal:hover{border-color:var(--t8-line-5)}
.pal i{width:7px;height:7px;border:1px solid var(--c);flex:none}
.pal b{flex:1;font-family:var(--t8-display);font-weight:400;font-size:12px;letter-spacing:.08em}
.pal small{font-size:9px;letter-spacing:.14em;color:var(--t8-ink-2);white-space:nowrap}
.palette .note{margin:14px 4px 0;font-size:10px;line-height:1.6;letter-spacing:.04em;color:var(--t8-ink-2)}

.stage{flex:1;position:relative;overflow:hidden;touch-action:none;background-color:var(--t8-ground);
  background-image:radial-gradient(rgba(236,232,222,.06) 1px,transparent 1px);background-size:16px 16px;cursor:default}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:-5000px;top:-5000px;width:20000px;height:20000px;overflow:visible;pointer-events:none}
.w{fill:none;stroke:var(--t8-ink-2);stroke-width:1.5;stroke-linejoin:round}
#wires.live .w{stroke:var(--t8-ink)}
.w.ctl{stroke-dasharray:4 4}
#wires .w.loop{stroke:var(--t8-loop)}
#wires .w.sel{stroke:var(--t8-accent);stroke-width:2}
#wires .w.tmp{stroke:var(--t8-ink);stroke-dasharray:2 4}
#wires .w.err{stroke:var(--t8-rec);stroke-dasharray:none;stroke-width:2}
.whit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.wdel{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1px solid var(--t8-accent);
  background:var(--t8-ground);color:var(--t8-accent);display:none;align-items:center;justify-content:center;z-index:5}
.wdel.on{display:flex}

/* ── node card ── */
.node{position:absolute;width:264px;border:1px solid var(--t8-line-4);border-radius:var(--t8-r-card);background:var(--t8-panel);
  user-select:none;-webkit-user-select:none;z-index:1}
.node.sel{border-color:var(--t8-accent);background:var(--t8-lane-sel);z-index:2}
.node header{height:52px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-bottom:1px solid var(--t8-line-1);cursor:grab;min-width:0}
.idxbox{width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--c);color:var(--c);display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--t8-display);font-size:10px;font-variant-numeric:tabular-nums}
.nm{font-family:var(--t8-display);font-weight:400;font-size:13px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nm[contenteditable="true"]{outline:1px solid var(--t8-accent);outline-offset:3px;cursor:text;text-overflow:clip}
.node header em{font-style:normal;font-size:8px;letter-spacing:.2em;color:var(--t8-ink-2);white-space:nowrap}
.node header .sp{flex:1}
.led{width:44px;height:40px;flex:none;border-radius:var(--t8-r-btn);border:1px solid var(--t8-line-4);background:transparent;display:inline-flex;
  align-items:center;justify-content:center;gap:5px;font-size:8px;font-weight:600;letter-spacing:.16em;color:var(--t8-ink-2);padding:0}
.led i{width:6px;height:6px;border-radius:50%;border:1px solid var(--c)}
.led[aria-pressed="true"]{border-color:var(--c);color:var(--c)}
.led[aria-pressed="true"] i{background:var(--c)}
.icon{width:44px;height:44px;flex:none;background:transparent;border:0;color:var(--t8-ink-2);display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--t8-r-btn);padding:0}
.icon:hover{color:var(--t8-ink)}
.io{position:relative;border-bottom:1px solid var(--t8-line-1)}
.io-row{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:9px;letter-spacing:.22em;color:var(--t8-ink-2)}
.port{position:absolute;width:44px;height:40px;padding:0;background:transparent;border:0;display:flex;align-items:center;justify-content:center;
  cursor:crosshair;z-index:3;touch-action:none}
.port.in{left:-22px} .port.out{right:-22px}
.port i{width:10px;height:10px;border:1px solid var(--t8-ink);background:var(--t8-ground);display:block}
.port.control i{width:9px;height:9px;transform:rotate(45deg);border-color:var(--t8-ink-2)}
.port.on i{background:var(--t8-ink)}
.port.control.on i{background:var(--t8-ink-2)}
.port.armed i,.port.hot i{border-color:var(--t8-accent);background:var(--t8-accent)}
.port.bad i{border-color:var(--t8-rec)}
.node.byp .knobs,.node.byp .field,.node.byp .mtr{opacity:.3}
.node.byp .nm{color:var(--t8-ink-2)}
.node.byp .idxbox{color:var(--t8-ink-2);border-color:var(--t8-line-5)}

.field{padding:12px 12px 0}
.field .flab{display:block;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--t8-line-3);border-radius:var(--t8-r-lane);overflow:hidden}
.seg button{flex:1;height:44px;min-width:0;padding:0;background:transparent;border:0;border-left:1px solid var(--t8-line-3);
  font-size:9px;font-weight:500;letter-spacing:.16em;color:var(--t8-ink-2);position:relative}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{color:var(--t8-ink);background:var(--t8-lane-sel)}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:25%;right:25%;bottom:8px;border-bottom:1px solid var(--t8-accent)}
.knobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 2px;padding:10px 6px 12px}
.knobs:empty{display:none}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:ns-resize;touch-action:none;border-radius:var(--t8-r-btn);padding:2px 0 4px;min-width:0}
.knob svg{width:44px;height:44px;display:block}
.knob .trk{fill:none;stroke:var(--t8-line-4);stroke-width:1.5}
.knob .va{fill:none;stroke:var(--c);stroke-width:2}
.knob .tick{stroke:var(--t8-ink-2);stroke-width:1}
.knob .face{fill:var(--t8-ground);stroke:var(--t8-ink);stroke-width:1.2}
.knob .pt{stroke:var(--t8-ink);stroke-width:1.2}
.knob b{font-family:var(--t8-display);font-weight:300;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.knob b small{font-family:var(--t8-ui);font-size:8px;color:var(--t8-ink-2);margin-left:2px}
.knob .lb{font-size:8px;letter-spacing:.22em;color:var(--t8-ink-2);white-space:nowrap}
.mtr{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px}
.mtr-top{display:flex;align-items:baseline;justify-content:space-between}
.mtr-top b{font-family:var(--t8-display);font-weight:300;font-size:17px;font-variant-numeric:tabular-nums}
.mtr-top b small{font-family:var(--t8-ui);font-size:9px;color:var(--t8-ink-2);margin-left:3px}
.mtr-top b.clip{color:var(--t8-rec)}
.mtr canvas{display:block;width:100%}
.mtr canvas.cs{height:48px;border-top:1px solid var(--t8-line-1);padding-top:0}
.mtr canvas.cm{height:12px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px 0}
.file .fname{font-size:9px;letter-spacing:.16em;color:var(--t8-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file[hidden]{display:none}

/* ── zoom ── */
.zoom{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:6px;z-index:6;background:var(--t8-bar);
  border:1px solid var(--t8-line-2);border-radius:var(--t8-r-lane);padding:4px}
.zoom .ro{align-items:center;min-width:56px}
.zoom .ro b{font-size:13px}
.sq{width:44px;height:44px;border:1px solid var(--t8-line-3);border-radius:var(--t8-r-btn);background:transparent;color:var(--t8-ink-2);
  font-size:10px;font-weight:600;letter-spacing:.12em;display:inline-flex;align-items:center;justify-content:center;padding:0}
.sq:hover{color:var(--t8-ink)}

/* ── bottom bar ── */
.bar{min-height:44px;background:var(--t8-bar);border-top:1px solid var(--t8-line-2);display:flex;align-items:center;gap:16px;padding:6px 28px;flex-wrap:wrap}
.bar .hint{margin-left:auto;font-size:9px;letter-spacing:.2em;color:var(--t8-ink-2)}

@media (max-width:760px){
  .top{padding:10px 16px;gap:10px 16px}
  .readouts{margin-left:0;gap:14px}
  .main{flex-direction:column}
  .palette{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--t8-line-2);padding:8px 16px;align-items:center}
  .palette h2,.palette .note{display:none}
  .pal{flex:none}
  .bar{padding:6px 16px}
  .bar .hint{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>TAPE 08 · PATCH</b><span>MODULAR FX · V0</span></div>
  <button class="btn play" id="run" type="button" aria-pressed="false">
    <svg id="runIco" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1 L11 6 L2 11 Z" fill="currentColor"/></svg><span id="runTx">RUN</span>
  </button>
  <div class="cluster" id="presets" role="group" aria-label="Presets"></div>
  <div class="cluster">
    <button class="btn quiet" id="exp" type="button">EXPORT</button>
    <button class="btn quiet" id="imp" type="button">IMPORT</button>
  </div>
  <div class="readouts">
    <div class="ro"><span class="flab">Nodes</span><b id="roN">00</b></div>
    <div class="ro"><span class="flab">Wires</span><b id="roE">00</b></div>
    <div class="ro" id="roLw"><span class="flab">Loops</span><b id="roL">00</b></div>
    <div class="ro"><span class="flab">Topology</span><b id="roT" style="font-size:13px;line-height:23px">CHAIN</b></div>
    <div class="ro"><span class="flab">Build</span><b id="roB">—</b></div>
    <div class="ro"><span class="flab">Rate</span><b id="roS">—</b></div>
  </div>
</div>

<div class="main">
  <nav class="palette" id="palette" aria-label="Add node"></nav>
  <div class="stage" id="stage">
    <div class="world" id="world">
      <svg id="wires" aria-hidden="true"><g transform="translate(5000 5000)"><g id="gW"></g><g id="gH"></g><g id="gTmp"></g></g></svg>
      <button class="wdel" id="wdel" type="button" aria-label="Remove selected wire">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
    <div class="zoom">
      <button class="sq" id="zOut" type="button" aria-label="Zoom out"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6 H10" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <div class="ro"><b id="zRd">100<small>%</small></b></div>
      <button class="sq" id="zIn" type="button" aria-label="Zoom in"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6 H10 M6 2 V10" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="sq" id="zFit" type="button">FIT</button>
    </div>
  </div>
</div>

<div class="bar">
  <span class="status" id="status" role="status" aria-live="polite"><i></i><span id="statusTx">STOPPED · PRESS RUN</span></span>
  <span class="hint">DRAG OUT → IN · OR TAP TWO PORTS · DEL REMOVES · ⌘ SCROLL ZOOMS</span>
</div>

<input type="file" id="fileIn" accept="audio/*" hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   TAPE 08 · PATCH — modular FX graph, v0
   model (GraphNode / GraphEdge) → analyze (SCC + topo order) → reconcile (Web Audio)
   ══════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const W = 264, HEAD = 52, ROW = 40, SNAP = 8;
const MINUS = '−';
const STORE = 't8-patchbay-v0';

// ── node definitions ──
const A = name => ({ name, kind: 'audio' });
const C = name => ({ name, kind: 'control' });
const P = (k, min, max, def, unit, curve = 'lin', bi = false) => ({ k, min, max, def, unit, curve, bi });
const E = (k, opts, def) => ({ k, opts, def, enum: true });
const BONE = '#CFC8B8';

const DEFS = {
  SOURCE:    { name: 'SOURCE',    group: 'IO',      c: BONE,      ins: [], outs: [A('OUT')],
               params: [E('MODE', ['LOOP', 'PAD', 'NOISE', 'MIC', 'FILE'], 0), P('LEVEL', -60, 6, -6, 'dB')] },
  OUTPUT:    { name: 'OUTPUT',    group: 'IO',      c: BONE,      ins: [A('IN')], outs: [],
               params: [P('VOL', -60, 6, -6, 'dB')], meter: true },
  GAIN:      { name: 'GAIN',      group: 'ROUTE',   c: BONE,      ins: [A('IN'), C('AMP CV')], outs: [A('OUT')], byp: true,
               params: [P('GAIN', -60, 12, 0, 'dB'), P('PAN', -1, 1, 0, 'pan', 'lin', true)] },
  MIXER:     { name: 'MIXER',     group: 'ROUTE',   c: BONE,      ins: [A('IN 1'), A('IN 2'), A('IN 3'), A('IN 4')], outs: [A('OUT')],
               params: [P('IN 1', -60, 6, 0, 'dB'), P('IN 2', -60, 6, 0, 'dB'), P('IN 3', -60, 6, 0, 'dB'), P('IN 4', -60, 6, 0, 'dB')] },
  TAP:       { name: 'TAP',       group: 'ROUTE',   c: BONE,      ins: [A('IN')], outs: [A('THRU')], params: [], meter: true, scope: true },
  CROSSOVER: { name: 'CROSSOVER', group: 'ROUTE',   c: BONE,      ins: [A('IN')], outs: [A('LOW'), A('MID'), A('HIGH')],
               params: [P('LOW', 40, 1000, 250, 'Hz', 'log'), P('HIGH', 1000, 12000, 3000, 'Hz', 'log')] },
  DRYWET:    { name: 'DRY/WET',   group: 'ROUTE',   c: BONE,      ins: [A('DRY'), A('WET')], outs: [A('OUT')],
               params: [P('MIX', 0, 100, 50, '%')] },
  FILTER:    { name: 'FILTER',    group: 'EFFECT',  c: '#E8B04A', ins: [A('IN'), C('FREQ CV')], outs: [A('OUT')], byp: true,
               params: [E('MODE', ['LP', 'BP', 'HP'], 0), P('FREQ', 20, 20000, 2000, 'Hz', 'log'), P('RES', 0.3, 18, 0.7, 'Q', 'log')] },
  DRIVE:     { name: 'DRIVE',     group: 'EFFECT',  c: '#FF8A3D', ins: [A('IN')], outs: [A('OUT')], byp: true,
               params: [P('DRIVE', 0, 40, 12, 'dB'), P('TONE', 500, 18000, 8000, 'Hz', 'log'), P('OUT', -30, 6, -6, 'dB')] },
  DELAY:     { name: 'DELAY',     group: 'EFFECT',  c: '#A98BFF', ins: [A('IN'), C('TIME CV')], outs: [A('OUT')], byp: true,
               params: [P('TIME', 1, 2000, 250, 'ms', 'log'), P('FDBK', 0, 95, 30, '%'), P('TONE', 500, 18000, 9000, 'Hz', 'log'), P('MIX', 0, 100, 100, '%')] },
  REVERB:    { name: 'REVERB',    group: 'EFFECT',  c: '#5CC8E0', ins: [A('IN')], outs: [A('OUT')], byp: true,
               params: [P('MIX', 0, 100, 30, '%'), P('DECAY', 0.2, 8, 2.5, 's', 'log'), P('PRE', 0, 200, 15, 'ms'), P('DAMP', 800, 18000, 7000, 'Hz', 'log')] },
  LFO:       { name: 'LFO',       group: 'CONTROL', c: '#6F8CFF', ins: [], outs: [C('CV')], byp: true,
               params: [E('SHAPE', ['SIN', 'TRI', 'SQR', 'SAW'], 0), P('RATE', 0.05, 20, 1, 'Hz', 'log'), P('DEPTH', 0, 100, 50, '%')] },
};
const GROUPS = [['IO', 'In / out'], ['ROUTE', 'Route'], ['EFFECT', 'Effect'], ['CONTROL', 'Control']];
const paramOf = (type, k) => DEFS[type].params.find(p => p.k === k);

// ── value helpers ──
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const toNorm = (p, v) => p.curve === 'log' ? Math.log(v / p.min) / Math.log(p.max / p.min) : (v - p.min) / (p.max - p.min);
const fromNorm = (p, t) => p.curve === 'log' ? p.min * Math.pow(p.max / p.min, t) : p.min + t * (p.max - p.min);
const dbToGain = d => d <= -60 ? 0 : Math.pow(10, d / 20);
const neg = s => s.replace('-', MINUS);
const sgn = (v, d) => (v > 0.0001 ? '+' : v < -0.0001 ? MINUS : '') + Math.abs(v).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad2 = n => String(n).padStart(2, '0');

function fmt(p, v) {
  switch (p.unit) {
    case 'dB':  return v <= -60 ? ['−∞', 'dB'] : [sgn(v, 1), 'dB'];
    case 'Hz':  return v >= 1000 ? [(v / 1000).toFixed(v >= 10000 ? 1 : 2), 'kHz'] : [v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.round(v)), 'Hz'];
    case 'ms':  return [v < 10 ? v.toFixed(1) : String(Math.round(v)), 'ms'];
    case 's':   return [v.toFixed(1), 's'];
    case '%':   return [String(Math.round(v)), '%'];
    case 'Q':   return [v.toFixed(1), 'Q'];
    case 'pan': return Math.abs(v) < 0.005 ? ['C', ''] : [(v < 0 ? 'L' : 'R') + Math.round(Math.abs(v) * 100), ''];
  }
  return [neg(String(v)), ''];
}

/* ══════════════════════════════════════════════════════════════
   MODEL — mirrors the Swift sketch: GraphNode { id, type, parameters, bypassed } · GraphEdge { fromNode, fromPort, toNode, toPort }
   Enum parameters are stored as Float indices so the dictionary stays [String: Float].
   ══════════════════════════════════════════════════════════════ */
let graph = { nodes: [], edges: [] };
let seq = 0;
let currentPreset = null;
const ekey = e => `${e.fromNode}:${e.fromPort}>${e.toNode}:${e.toPort}`;
const byId = id => graph.nodes.find(n => n.id === id);
const labelOf = n => n.label || DEFS[n.type].name;

function makeNode(type, x, y, label, params = {}, bypassed = false) {
  const parameters = {};
  for (const p of DEFS[type].params) parameters[p.k] = p.k in params ? params[p.k] : p.def;
  return { id: 'n' + (++seq), type, label: label || '', x, y, parameters, bypassed };
}

// ── analyze: Tarjan SCC → legality → topological order ──
// Strongly connected components; `cyclic` holds components that contain a loop (size > 1 or a self-edge).
function scc(ids, edges) {
  const idx = new Map(ids.map((id, i) => [id, i]));
  const adj = ids.map(() => []);
  const selfLoop = new Set();
  for (const e of edges) {
    if (!idx.has(e.fromNode) || !idx.has(e.toNode)) continue;
    if (e.fromNode === e.toNode) selfLoop.add(idx.get(e.fromNode));
    adj[idx.get(e.fromNode)].push(idx.get(e.toNode));
  }
  let counter = 0, cc = 0;
  const ix = [], low = [], on = [], st = [], comp = new Array(ids.length).fill(-1);
  const strong = v => {
    ix[v] = low[v] = counter++; st.push(v); on[v] = true;
    for (const w of adj[v]) {
      if (ix[w] === undefined) { strong(w); low[v] = Math.min(low[v], low[w]); }
      else if (on[w]) low[v] = Math.min(low[v], ix[w]);
    }
    if (low[v] === ix[v]) { let w; do { w = st.pop(); on[w] = false; comp[w] = cc; } while (w !== v); cc++; }
  };
  ids.forEach((_, v) => { if (ix[v] === undefined) strong(v); });
  const size = new Array(cc).fill(0);
  comp.forEach(c => size[c]++);
  const cyclic = new Set();
  comp.forEach((c, v) => { if (size[c] > 1 || selfLoop.has(v)) cyclic.add(c); });
  return { comp: new Map(ids.map((id, i) => [id, comp[i]])), cyclic };
}

function analyze(nodes, edges) {
  // "every loop passes through a DELAY" ⇔ the graph with all DELAY nodes removed has no loop
  const isDelay = id => byIdIn(nodes, id).type === 'DELAY';
  const full = scc(nodes.map(n => n.id), edges);
  const rest = scc(nodes.filter(n => n.type !== 'DELAY').map(n => n.id), edges.filter(e => !isDelay(e.fromNode) && !isDelay(e.toNode)));
  const inLoop = (s, e) => s.comp.has(e.fromNode) && s.comp.has(e.toNode) && s.comp.get(e.fromNode) === s.comp.get(e.toNode) && s.cyclic.has(s.comp.get(e.fromNode));
  const illegal = edges.filter(e => inLoop(rest, e));
  const loopEdges = new Set(edges.filter(e => inLoop(full, e)).map(ekey));
  const cyclic = full.cyclic;

  // processing order: break each loop at the edge entering its DELAY, then Kahn (ties → left-to-right)
  const kept = edges.filter(e => !(loopEdges.has(ekey(e)) && isDelay(e.toNode)));
  const indeg = new Map(nodes.map(n => [n.id, 0]));
  kept.forEach(e => indeg.set(e.toNode, indeg.get(e.toNode) + 1));
  const ready = nodes.filter(n => indeg.get(n.id) === 0);
  const order = new Map();
  while (ready.length) {
    ready.sort((a, b) => a.x - b.x || a.y - b.y);
    const n = ready.shift();
    order.set(n.id, order.size + 1);
    for (const e of kept) if (e.fromNode === n.id) {
      indeg.set(e.toNode, indeg.get(e.toNode) - 1);
      if (indeg.get(e.toNode) === 0) ready.push(byIdIn(nodes, e.toNode));
    }
  }
  return { ok: illegal.length === 0, loops: cyclic.size, loopEdges, order };
}
const byIdIn = (nodes, id) => nodes.find(n => n.id === id);

function topology(a) {
  if (a.loops) return 'FEEDBACK';
  const outCount = new Map(), inCount = new Map(), nodesIn = new Map();
  for (const e of graph.edges) {
    const ko = `${e.fromNode}:${e.fromPort}`, ki = `${e.toNode}:${e.toPort}`;
    outCount.set(ko, (outCount.get(ko) || 0) + 1);
    inCount.set(ki, (inCount.get(ki) || 0) + 1);
    nodesIn.set(e.toNode, (nodesIn.get(e.toNode) || new Set()).add(e.toPort));
  }
  const branch = [...outCount.values(), ...inCount.values()].some(c => c > 1)
    || [...nodesIn.values()].some(s => s.size > 1)
    || graph.nodes.some(n => DEFS[n.type].outs.length > 1 && graph.edges.filter(e => e.fromNode === n.id).length > 1);
  return branch ? 'PARALLEL' : 'CHAIN';
}

// ── edits ──
function tryConnect(fromNode, fromPort, toNode, toPort) {
  const fn = byId(fromNode), tn = byId(toNode);
  const ok = DEFS[fn.type].outs[fromPort], ik = DEFS[tn.type].ins[toPort];
  if (ok.kind !== ik.kind) return fail(ok.kind === 'audio' ? 'TYPE · AUDIO CANNOT DRIVE A CV INPUT' : 'TYPE · CV ONLY PATCHES INTO CV INPUTS');
  const edge = { fromNode, fromPort, toNode, toPort };
  if (graph.edges.some(e => ekey(e) === ekey(edge))) return fail('ALREADY PATCHED');
  // CV inputs take exactly one connection — a new cable replaces the old one
  let edges = graph.edges;
  if (ik.kind === 'control') edges = edges.filter(e => !(e.toNode === toNode && e.toPort === toPort));
  const next = [...edges, edge];
  if (!analyze(graph.nodes, next).ok) return fail('CYCLE · ADD A DELAY TO THE LOOP');
  graph.edges = next;
  commit();
  say(`PATCHED ${labelOf(fn)}.${ok.name} → ${labelOf(tn)}.${ik.name}`, 'ok');
  return true;
}
function fail(msg) { say(msg, 'err'); return false; }

function removeEdge(k) {
  const e = graph.edges.find(x => ekey(x) === k);
  if (!e) return;
  graph.edges = graph.edges.filter(x => x !== e);
  if (sel && sel.kind === 'edge' && sel.id === k) sel = null;
  commit();
  say(`UNPATCHED ${labelOf(byId(e.fromNode))} → ${labelOf(byId(e.toNode))}`);
}
function removeNode(id) {
  const n = byId(id);
  if (!n) return;
  graph.edges = graph.edges.filter(e => e.fromNode !== id && e.toNode !== id);
  graph.nodes = graph.nodes.filter(x => x !== n);
  els.get(id)?.el.remove();
  els.delete(id);
  fileBuffers.delete(id);
  if (sel && sel.id === id) sel = null;
  commit();
  say(`REMOVED ${labelOf(n)}`);
}
function addNode(type) {
  const r = stage.getBoundingClientRect();
  const c = toWorld(r.left + r.width / 2, r.top + r.height / 2);
  const k = graph.nodes.length % 5;
  const n = makeNode(type, snap(c.x - W / 2 + k * 24), snap(c.y - 120 + k * 24));
  graph.nodes.push(n);
  renderNode(n);
  select({ kind: 'node', id: n.id });
  commit();
  say(`ADDED ${DEFS[type].name}`);
}
const snap = v => Math.round(v / SNAP) * SNAP;

/* ══════════════════════════════════════════════════════════════
   ENGINE — reconcile the model into a live Web Audio graph.
   Nodes are built once and kept; only the diff of edges is (dis)connected,
   so parameter moves and re-patching never restart a source.
   ══════════════════════════════════════════════════════════════ */
let ctx = null, running = false;
const insts = new Map();        // node id → instance
const live = new Map();         // edge key → [AudioNode, AudioNode]
const fileBuffers = new Map();  // node id → { buffer, name }
let loopT0 = null;
const loopBuffer = renderLoop();

const smooth = (param, v) => param.setTargetAtTime(v, ctx.currentTime, 0.015);

function kit() {
  const owned = [], stops = [];
  return {
    G(v = 1) { const g = ctx.createGain(); g.gain.value = v; owned.push(g); return g; },
    add(n) { owned.push(n); return n; },
    stop(n) { stops.push(n); return n; },
    bq(type, f = 1000, q = Math.SQRT1_2) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; owned.push(b); return b; },
    shaper(fn, n = 2048) {
      const s = ctx.createWaveShaper(), c = new Float32Array(n);
      for (let i = 0; i < n; i++) c[i] = fn(i / (n - 1) * 2 - 1);
      s.curve = c; s.oversample = '4x'; owned.push(s); return s;
    },
    dispose() {
      stops.forEach(s => { try { s.stop(); } catch (_) {} });
      owned.forEach(o => { try { o.disconnect(); } catch (_) {} });
    },
  };
}
// bypass shell for 1-in-1-out effects: input → [effect] → wet ┐ ; input → dry ┘ → out
function shell(K) {
  const input = K.G(), out = K.G(), dry = K.G(0), wet = K.G(1);
  input.connect(dry); dry.connect(out); wet.connect(out);
  return { input, out, wet, bypass(b) { smooth(wet.gain, b ? 0 : 1); smooth(dry.gain, b ? 1 : 0); } };
}
function stereo(K) {
  const g = K.G(); g.channelCount = 2; g.channelCountMode = 'explicit'; g.channelInterpretation = 'speakers';
  const sp = K.add(ctx.createChannelSplitter(2));
  const an = [0, 1].map(() => { const a = K.add(ctx.createAnalyser()); a.fftSize = 1024; return a; });
  g.connect(sp); sp.connect(an[0], 0); sp.connect(an[1], 1);
  return { input: g, an };
}

const BUILD = {
  SOURCE(n) {
    const K = kit(), out = K.G();
    let gen = null, token = 0;
    const I = { ins: [], outs: [out], dead: false };
    const stopGen = () => { if (!gen) return; gen.stop?.(); gen.nodes.forEach(x => { try { x.disconnect(); } catch (_) {} }); gen = null; };
    const start = async mode => {
      stopGen();
      const my = ++token;
      let g = null;
      try { g = await GEN[mode](n); } catch (err) { say(err.message || 'SOURCE · FAILED', 'err'); }
      if (my !== token || I.dead) { if (g) { g.stop?.(); g.nodes.forEach(x => x.disconnect()); } return; }
      gen = g;
      if (g) g.node.connect(out);
    };
    I.set = (k, v) => {
      if (k === 'MODE') start(DEFS.SOURCE.params[0].opts[v]);
      if (k === 'LEVEL') smooth(out.gain, dbToGain(v));
    };
    I.dispose = () => { I.dead = true; token++; stopGen(); K.dispose(); };
    return I;
  },
  OUTPUT() {
    const K = kit(), input = K.G(), vol = K.G();
    const lim = K.add(ctx.createDynamicsCompressor());
    lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.1;
    const clip = K.shaper(x => x, 2);          // 2-point linear curve: clamps anything past ±1
    const m = stereo(K);
    input.connect(vol); vol.connect(lim); lim.connect(clip); clip.connect(ctx.destination); clip.connect(m.input);
    return { ins: [input], outs: [], an: m.an, set(k, v) { if (k === 'VOL') smooth(vol.gain, dbToGain(v)); }, dispose: () => K.dispose() };
  },
  GAIN() {
    const K = kit(), sh = shell(K), amp = K.G(), g = K.G(), pan = K.add(ctx.createStereoPanner()), cv = K.G(1);
    sh.input.connect(amp); amp.connect(g); g.connect(pan); pan.connect(sh.wet); cv.connect(amp.gain);
    return { ins: [sh.input, cv], outs: [sh.out], bypass: sh.bypass, dispose: () => K.dispose(),
      set(k, v) { if (k === 'GAIN') smooth(g.gain, dbToGain(v)); if (k === 'PAN') smooth(pan.pan, v); } };
  },
  MIXER() {
    const K = kit(), out = K.G(), ch = [0, 1, 2, 3].map(() => K.G());
    ch.forEach(g => g.connect(out));
    return { ins: ch, outs: [out], dispose: () => K.dispose(),
      set(k, v) { const i = DEFS.MIXER.params.findIndex(p => p.k === k); if (i >= 0) smooth(ch[i].gain, dbToGain(v)); } };
  },
  TAP() {
    const K = kit(), input = K.G(), out = K.G(), m = stereo(K);
    input.connect(out); input.connect(m.input);
    return { ins: [input], outs: [out], an: m.an, set() {}, dispose: () => K.dispose() };
  },
  CROSSOVER() {
    // Linkwitz–Riley 4th order: two cascaded Butterworth sections per edge
    const K = kit(), input = K.G(), lo = K.G(), mid = K.G(), hi = K.G();
    const l1 = K.bq('lowpass'), l2 = K.bq('lowpass'), h1 = K.bq('highpass'), h2 = K.bq('highpass');
    const m1 = K.bq('lowpass'), m2 = K.bq('lowpass'), u1 = K.bq('highpass'), u2 = K.bq('highpass');
    input.connect(l1); l1.connect(l2); l2.connect(lo);
    input.connect(h1); h1.connect(h2); h2.connect(m1); m1.connect(m2); m2.connect(mid);
    input.connect(u1); u1.connect(u2); u2.connect(hi);
    return { ins: [input], outs: [lo, mid, hi], dispose: () => K.dispose(),
      set(k, v) {
        const fs = k === 'LOW' ? [l1, l2, h1, h2] : [m1, m2, u1, u2];
        fs.forEach(f => smooth(f.frequency, v));
      } };
  },
  DRYWET() {
    const K = kit(), d = K.G(), w = K.G(), out = K.G();
    d.connect(out); w.connect(out);
    return { ins: [d, w], outs: [out], dispose: () => K.dispose(),
      set(k, v) { const m = v / 100; smooth(d.gain, Math.cos(m * Math.PI / 2)); smooth(w.gain, Math.sin(m * Math.PI / 2)); } };
  },
  FILTER() {
    const K = kit(), sh = shell(K), f = K.bq('lowpass'), cv = K.G(2400);  // CV ±1 → ±2 octaves
    sh.input.connect(f); f.connect(sh.wet); cv.connect(f.detune);
    return { ins: [sh.input, cv], outs: [sh.out], bypass: sh.bypass, dispose: () => K.dispose(),
      set(k, v) {
        if (k === 'MODE') f.type = ['lowpass', 'bandpass', 'highpass'][v];
        if (k === 'FREQ') smooth(f.frequency, v);
        if (k === 'RES') smooth(f.Q, v);
      } };
  },
  DRIVE() {
    const K = kit(), sh = shell(K), pre = K.G(), ws = K.shaper(x => Math.tanh(3 * x) / Math.tanh(3)), tone = K.bq('lowpass'), post = K.G();
    sh.input.connect(pre); pre.connect(ws); ws.connect(tone); tone.connect(post); post.connect(sh.wet);
    return { ins: [sh.input], outs: [sh.out], bypass: sh.bypass, dispose: () => K.dispose(),
      set(k, v) {
        if (k === 'DRIVE') smooth(pre.gain, dbToGain(v));
        if (k === 'TONE') smooth(tone.frequency, v);
        if (k === 'OUT') smooth(post.gain, dbToGain(v));
      } };
  },
  DELAY() {
    // Every path from IN to OUT crosses a DelayNode — including the dry path and bypass.
    // Web Audio clamps a DelayNode inside a cycle to ≥ 128 frames, so any loop through this node stays legal.
    const K = kit(), input = K.G(), out = K.G(), sum = K.G(), fb = K.G(0), wet = K.G(1), dry = K.G(0), cv = K.G(0.01);
    const d = K.add(ctx.createDelay(2.5)), dryD = K.add(ctx.createDelay(0.05));
    const tone = K.bq('lowpass'), pre = K.G(0.25), sat = K.shaper(x => Math.tanh(4 * x));  // tape-ish ceiling at 0 dBFS
    dryD.delayTime.value = 0;
    input.connect(sum); sum.connect(d); d.connect(tone); tone.connect(pre); pre.connect(sat);
    sat.connect(fb); fb.connect(sum); sat.connect(wet); wet.connect(out);
    input.connect(dryD); dryD.connect(dry); dry.connect(out);
    cv.connect(d.delayTime);
    const p = {}; let byp = false;
    const apply = () => {
      if (p.TIME != null) smooth(d.delayTime, p.TIME / 1000);
      if (p.TONE != null) smooth(tone.frequency, p.TONE);
      smooth(fb.gain, byp ? 0 : (p.FDBK || 0) / 100);
      const m = byp ? 0 : (p.MIX ?? 100) / 100;
      smooth(wet.gain, m); smooth(dry.gain, 1 - m);
    };
    return { ins: [input, cv], outs: [out], dispose: () => K.dispose(),
      set(k, v) { p[k] = v; apply(); }, bypass(b) { byp = b; apply(); } };
  },
  REVERB() {
    const K = kit(), sh = shell(K), dryG = K.G(), wetG = K.G(), pre = K.add(ctx.createDelay(0.5));
    const conv = K.add(ctx.createConvolver()), damp = K.bq('lowpass');
    sh.input.connect(dryG); dryG.connect(sh.wet);
    sh.input.connect(pre); pre.connect(conv); conv.connect(damp); damp.connect(wetG); wetG.connect(sh.wet);
    let timer = null, first = true;
    const ir = sec => {
      const sr = ctx.sampleRate, len = Math.max(1, Math.floor(sr * sec)), b = ctx.createBuffer(2, len, sr);
      for (let c = 0; c < 2; c++) {
        const data = b.getChannelData(c);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-6.9 * i / len);
      }
      return b;
    };
    return { ins: [sh.input], outs: [sh.out], bypass: sh.bypass, dispose: () => { clearTimeout(timer); K.dispose(); },
      set(k, v) {
        if (k === 'MIX') { smooth(wetG.gain, v / 100); smooth(dryG.gain, 1 - v / 100); }
        if (k === 'PRE') smooth(pre.delayTime, v / 1000);
        if (k === 'DAMP') smooth(damp.frequency, v);
        if (k === 'DECAY') {
          clearTimeout(timer);
          if (first) { conv.buffer = ir(v); first = false; }
          else timer = setTimeout(() => { conv.buffer = ir(v); }, 140);
        }
      } };
  },
  LFO() {
    const K = kit(), osc = K.stop(K.add(ctx.createOscillator())), dep = K.G(0.5);
    osc.connect(dep); osc.start();
    let depth = 0.5, byp = false;
    return { ins: [], outs: [dep], dispose: () => K.dispose(),
      bypass(b) { byp = b; smooth(dep.gain, b ? 0 : depth); },
      set(k, v) {
        if (k === 'SHAPE') osc.type = ['sine', 'triangle', 'square', 'sawtooth'][v];
        if (k === 'RATE') smooth(osc.frequency, v);
        if (k === 'DEPTH') { depth = v / 100; if (!byp) smooth(dep.gain, depth); }
      } };
  },
};

// ── source generators ──
let micStream = null;
const GEN = {
  async LOOP() {
    const buf = await loopBuffer;
    const s = ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    const when = ctx.currentTime + 0.03;
    if (loopT0 == null) loopT0 = when;
    s.start(when, ((when - loopT0) % buf.duration + buf.duration) % buf.duration);   // all LOOP sources share one bar grid
    return { node: s, nodes: [s], stop: () => { try { s.stop(); } catch (_) {} } };
  },
  async PAD() {
    const g = ctx.createGain(), lp = ctx.createBiquadFilter();
    g.gain.value = 0.07; lp.type = 'lowpass'; lp.frequency.value = 1400; lp.Q.value = 0.4;
    const oscs = [];
    for (const f of [110, 130.81, 164.81, 196]) for (const det of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(); oscs.push(o);
    }
    lp.connect(g);
    return { node: g, nodes: [...oscs, lp, g], stop: () => oscs.forEach(o => o.stop()) };
  },
  async NOISE() {
    const b = ctx.createBuffer(2, ctx.sampleRate * 2, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = b; s.loop = true; g.gain.value = 0.25; s.connect(g); s.start();
    return { node: g, nodes: [s, g], stop: () => s.stop() };
  },
  async MIC() {
    if (!micStream) {
      try { micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
      catch (_) { throw new Error('MIC · BLOCKED BY BROWSER'); }
      say('MIC · LIVE · USE HEADPHONES', 'ok');
    }
    const s = ctx.createMediaStreamSource(micStream);
    return { node: s, nodes: [s] };
  },
  async FILE(n) {
    const f = fileBuffers.get(n.id);
    if (!f) return null;
    const s = ctx.createBufferSource();
    s.buffer = f.buffer; s.loop = true; s.start();
    return { node: s, nodes: [s], stop: () => { try { s.stop(); } catch (_) {} } };
  },
};

// 2-bar drum + bass loop at 112 BPM, rendered offline once at load
function renderLoop() {
  const sr = 44100, step = 60 / 112 / 4, dur = step * 32;
  const oc = new OfflineAudioContext(2, Math.round(sr * dur), sr);
  const nb = oc.createBuffer(1, sr, sr), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const bus = oc.createGain(); bus.gain.value = 0.7; bus.connect(oc.destination);
  const env = (g, t, a, len) => { g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len); };
  const noise = (t, len, type, f, q, a, pan = 0) => {
    const s = oc.createBufferSource(), bf = oc.createBiquadFilter(), g = oc.createGain(), p = oc.createStereoPanner();
    s.buffer = nb; bf.type = type; bf.frequency.value = f; bf.Q.value = q; p.pan.value = pan; env(g, t, a, len);
    s.connect(bf); bf.connect(g); g.connect(p); p.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + len + 0.02);
  };
  const tone = (t, len, type, f0, f1, a, lp) => {
    const o = oc.createOscillator(), g = oc.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + Math.min(len, 0.12));
    env(g, t, a, len);
    if (lp) { const f = oc.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(lp, t); f.frequency.exponentialRampToValueAtTime(220, t + len); o.connect(f); f.connect(g); }
    else o.connect(g);
    g.connect(bus); o.start(t); o.stop(t + len + 0.02);
  };
  [0, 7, 10, 16, 23, 26].forEach(s => tone(s * step, 0.42, 'sine', 150, 45, 1));
  [4, 12, 20, 28].forEach(s => { noise(s * step, 0.2, 'bandpass', 1800, 0.7, 0.55); tone(s * step, 0.1, 'triangle', 185, 185, 0.25); });
  for (let s = 0; s < 32; s += 2) noise(s * step, s % 8 === 6 ? 0.22 : 0.045, 'highpass', 7500, 0.5, s % 4 === 2 ? 0.16 : 0.1, s % 4 === 0 ? -0.2 : 0.2);
  [[0, 3, 55], [7, 2, 55], [10, 4, 65.41], [16, 3, 49], [23, 2, 49], [26, 4, 73.42]]
    .forEach(([s, l, f]) => tone(s * step, l * step, 'sawtooth', f, f, 0.22, 900));
  return oc.startRendering();
}

function reconcile() {
  if (!ctx) return;
  const t0 = performance.now();
  const want = new Map(graph.edges.map(e => [ekey(e), e]));
  for (const [k, pair] of live) if (!want.has(k)) { try { pair[0].disconnect(pair[1]); } catch (_) {} live.delete(k); }
  const ids = new Set(graph.nodes.map(n => n.id));
  for (const [id, inst] of insts) if (!ids.has(id)) { inst.dispose(); insts.delete(id); }
  for (const n of graph.nodes) {
    if (insts.has(n.id)) continue;
    const inst = BUILD[n.type](n);
    insts.set(n.id, inst);
    for (const p of DEFS[n.type].params) inst.set(p.k, n.parameters[p.k]);
    inst.bypass?.(n.bypassed);
  }
  for (const [k, e] of want) {
    if (live.has(k)) continue;
    const s = insts.get(e.fromNode).outs[e.fromPort], d = insts.get(e.toNode).ins[e.toPort];
    s.connect(d);
    live.set(k, [s, d]);
  }
  $('#roB').innerHTML = `${(performance.now() - t0).toFixed(1)}<small>ms</small>`;
}

async function toggleRun() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    $('#roS').innerHTML = `${(ctx.sampleRate / 1000).toFixed(1)}<small>kHz</small>`;
  }
  if (!running) {
    await ctx.resume();
    running = true;
    reconcile();
    say('RUNNING', 'play');
  } else {
    await ctx.suspend();
    running = false;
    say('STOPPED');
  }
  const b = $('#run');
  b.setAttribute('aria-pressed', String(running));
  $('#runTx').textContent = running ? 'STOP' : 'RUN';
  $('#runIco').innerHTML = running ? '<rect x="2" y="2" width="8" height="8" rx="1" fill="currentColor"/>' : '<path d="M2 1 L11 6 L2 11 Z" fill="currentColor"/>';
  $('#wires').classList.toggle('live', running);
}

/* ══════════════════════════════════════════════════════════════
   VIEW — cards, knobs, wires
   ══════════════════════════════════════════════════════════════ */
const stage = $('#stage'), world = $('#world'), gW = $('#gW'), gH = $('#gH'), gTmp = $('#gTmp'), wdel = $('#wdel');
const els = new Map();   // node id → { el, knobs: Map(k → el), meter, scope, readout, file }
let view = { x: 40, y: 40, s: 1 };
let sel = null;          // { kind: 'node'|'edge', id }
let ana = { ok: true, loops: 0, loopEdges: new Set(), order: new Map() };

const X_ICON = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.2"/></svg>';

function arc(a, b) {
  if (Math.abs(b - a) < 0.001) return 'M0 0';
  const lo = Math.min(a, b), hi = Math.max(a, b), r = 18;
  const s = (135 + 270 * lo) * Math.PI / 180, e = (135 + 270 * hi) * Math.PI / 180;
  return `M${(22 + r * Math.cos(s)).toFixed(2)} ${(22 + r * Math.sin(s)).toFixed(2)} A18 18 0 ${270 * (hi - lo) > 180 ? 1 : 0} 1 ${(22 + r * Math.cos(e)).toFixed(2)} ${(22 + r * Math.sin(e)).toFixed(2)}`;
}

function renderNode(n) {
  els.get(n.id)?.el.remove();
  const d = DEFS[n.type], label = labelOf(n), rows = Math.max(d.ins.length, d.outs.length);
  const el = document.createElement('div');
  el.className = 'node' + (n.bypassed ? ' byp' : '');
  el.dataset.id = n.id;
  el.style.setProperty('--c', d.c);
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';

  let h = `<header><span class="idxbox">00</span><b class="nm" title="Double-click to rename">${esc(label)}</b>`;
  h += label !== d.name ? `<em>${d.name}</em>` : '';
  h += '<span class="sp"></span>';
  if (d.byp) h += `<button class="led" type="button" aria-pressed="${!n.bypassed}" aria-label="Bypass ${esc(label)}"><i></i><span>${n.bypassed ? 'BYP' : 'ON'}</span></button>`;
  h += `<button class="icon rm" type="button" aria-label="Remove ${esc(label)}">${X_ICON}</button></header>`;
  h += `<div class="io" style="height:${rows * ROW}px">`;
  for (let i = 0; i < rows; i++) h += `<div class="io-row"><span>${d.ins[i]?.name || ''}</span><span>${d.outs[i]?.name || ''}</span></div>`;
  h += '</div>';
  const port = (dir, p, i) => `<button class="port ${dir} ${p.kind}" type="button" style="top:${HEAD + i * ROW}px" data-node="${n.id}" data-dir="${dir}" data-idx="${i}" aria-label="${esc(label)} ${dir === 'in' ? 'input' : 'output'} ${p.name}"><i></i></button>`;
  d.ins.forEach((p, i) => { h += port('in', p, i); });
  d.outs.forEach((p, i) => { h += port('out', p, i); });
  for (const p of d.params.filter(p => p.enum)) {
    h += `<div class="field"><span class="flab">${p.k}</span><div class="seg" role="group" aria-label="${p.k}">`;
    h += p.opts.map((o, j) => `<button type="button" data-k="${p.k}" data-v="${j}" aria-pressed="${n.parameters[p.k] === j}">${o}</button>`).join('');
    h += '</div></div>';
  }
  if (n.type === 'SOURCE') h += `<div class="file" ${n.parameters.MODE === 4 ? '' : 'hidden'}><button class="btn quiet load" type="button">LOAD</button><span class="fname">${esc(fileBuffers.get(n.id)?.name || 'NO FILE · DROP AUDIO HERE')}</span></div>`;
  h += '<div class="knobs"></div>';
  if (d.meter) h += `<div class="mtr"><div class="mtr-top"><span class="flab">Peak</span><b class="rd">−∞<small>dB</small></b></div><canvas class="cm"></canvas>${d.scope ? '<canvas class="cs"></canvas>' : ''}</div>`;
  el.innerHTML = h;

  const ui = { el, knobs: new Map(), readout: el.querySelector('.rd'), meter: el.querySelector('.cm'), scope: el.querySelector('.cs') };
  const kw = el.querySelector('.knobs');
  for (const p of d.params.filter(p => !p.enum)) {
    const k = document.createElement('div');
    k.className = 'knob'; k.tabIndex = 0; k.dataset.node = n.id; k.dataset.k = p.k;
    k.setAttribute('role', 'slider');
    k.setAttribute('aria-label', `${label} ${p.k}`);
    k.innerHTML = `<svg viewBox="0 0 44 44" aria-hidden="true"><path class="trk" d="${arc(0, 1)}"/><path class="va"/><line class="tick" x1="22" y1="1" x2="22" y2="4"/><circle class="face" cx="22" cy="22" r="10"/><line class="pt" x1="22" y1="22"/></svg><b><span class="v"></span><small class="u"></small></b><span class="lb">${p.k}</span>`;
    kw.appendChild(k);
    ui.knobs.set(p.k, k);
  }
  world.appendChild(el);
  els.set(n.id, ui);
  for (const p of d.params) if (!p.enum) paintKnob(n, p);
}

function paintKnob(n, p) {
  const k = els.get(n.id)?.knobs.get(p.k);
  if (!k) return;
  const v = n.parameters[p.k], t = clamp(toNorm(p, v), 0, 1), a = (135 + 270 * t) * Math.PI / 180;
  k.querySelector('.va').setAttribute('d', p.bi ? arc(0.5, t) : arc(0, t));
  const pt = k.querySelector('.pt');
  pt.setAttribute('x2', (22 + 10 * Math.cos(a)).toFixed(2));
  pt.setAttribute('y2', (22 + 10 * Math.sin(a)).toFixed(2));
  const [txt, unit] = fmt(p, v);
  k.querySelector('.v').textContent = txt;
  k.querySelector('.u').textContent = unit;
  k.setAttribute('aria-valuemin', 0); k.setAttribute('aria-valuemax', 100);
  k.setAttribute('aria-valuenow', Math.round(t * 100));
  k.setAttribute('aria-valuetext', `${txt} ${unit}`.trim());
}

function setParam(n, p, v) {
  v = clamp(v, p.min, p.max);
  n.parameters[p.k] = v;
  insts.get(n.id)?.set(p.k, v);
  paintKnob(n, p);
  queueSave();
}
function setEnum(n, k, j) {
  n.parameters[k] = j;
  const ui = els.get(n.id);
  ui.el.querySelectorAll(`.seg button[data-k="${k}"]`).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === j)));
  if (n.type === 'SOURCE') {
    ui.el.querySelector('.file').hidden = j !== 4;
    drawWires();
    if (j === 4 && !fileBuffers.has(n.id)) pickFile(n.id);
  }
  insts.get(n.id)?.set(k, j);
  queueSave();
}
function setBypass(n, b) {
  n.bypassed = b;
  insts.get(n.id)?.bypass?.(b);
  const ui = els.get(n.id);
  ui.el.classList.toggle('byp', b);
  const led = ui.el.querySelector('.led');
  led.setAttribute('aria-pressed', String(!b));
  led.querySelector('span').textContent = b ? 'BYP' : 'ON';
  queueSave();
}

// ── wires ──
function portPos(id, dir, i) {
  const n = byId(id);
  return { x: dir === 'out' ? n.x + W - 1 : n.x + 1, y: n.y + 1 + HEAD + i * ROW + ROW / 2 };
}
function boxOf(id) {
  const n = byId(id), el = els.get(id)?.el;
  return { top: n.y, bottom: n.y + (el ? el.offsetHeight : 240) };
}
function route(a, b, A, B) {
  const X = 24;
  if (b.x - a.x >= 2 * X) { const mx = Math.round((a.x + b.x) / 2); return [a, { x: mx, y: a.y }, { x: mx, y: b.y }, b]; }
  let dy;
  if (A && B) {
    if (B.top - A.bottom >= 48) dy = (A.bottom + B.top) / 2;
    else if (A.top - B.bottom >= 48) dy = (B.bottom + A.top) / 2;
    else dy = Math.max(A.bottom, B.bottom) + 28;
  } else dy = (a.y + b.y) / 2;
  return [a, { x: a.x + X, y: a.y }, { x: a.x + X, y: dy }, { x: b.x - X, y: dy }, { x: b.x - X, y: b.y }, b];
}
function rounded(pts, R = 12) {
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p = pts[i], p1 = pts[i + 1];
    const l0 = Math.hypot(p.x - p0.x, p.y - p0.y), l1 = Math.hypot(p1.x - p.x, p1.y - p.y);
    const r = Math.min(R, l0 / 2, l1 / 2);
    if (r < 0.5) { d += ` L${p.x} ${p.y}`; continue; }
    d += ` L${p.x - (p.x - p0.x) / l0 * r} ${p.y - (p.y - p0.y) / l0 * r} Q${p.x} ${p.y} ${p.x + (p1.x - p.x) / l1 * r} ${p.y + (p1.y - p.y) / l1 * r}`;
  }
  const e = pts[pts.length - 1];
  return d + ` L${e.x} ${e.y}`;
}
function midpoint(pts) {
  const seg = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); seg.push(l); total += l; }
  let h = total / 2;
  for (let i = 0; i < seg.length; i++) {
    if (h <= seg[i]) { const t = seg[i] ? h / seg[i] : 0; return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t }; }
    h -= seg[i];
  }
  return pts[0];
}
function edgePts(e) {
  return route(portPos(e.fromNode, 'out', e.fromPort), portPos(e.toNode, 'in', e.toPort), boxOf(e.fromNode), boxOf(e.toNode));
}
function drawWires() {
  let vis = '', hit = '';
  wdel.classList.remove('on');
  for (const e of graph.edges) {
    const k = ekey(e), pts = edgePts(e), d = rounded(pts);
    const ctl = DEFS[byId(e.fromNode).type].outs[e.fromPort].kind === 'control';
    const cls = ['w', ctl && 'ctl', ana.loopEdges.has(k) && 'loop', sel?.kind === 'edge' && sel.id === k && 'sel'].filter(Boolean).join(' ');
    vis += `<path class="${cls}" d="${d}"/>`;
    hit += `<path class="whit" data-k="${k}" d="${d}"/>`;
    if (sel?.kind === 'edge' && sel.id === k) {
      const m = midpoint(pts);
      wdel.style.left = m.x + 'px'; wdel.style.top = m.y + 'px';
      wdel.classList.add('on');
    }
  }
  gW.innerHTML = vis;
  gH.innerHTML = hit;
}

// ── commit: model changed → analyze, repaint, reconcile, save ──
function commit() {
  ana = analyze(graph.nodes, graph.edges);
  for (const n of graph.nodes) {
    const ui = els.get(n.id);
    if (!ui) continue;
    ui.el.querySelector('.idxbox').textContent = pad2(ana.order.get(n.id) || 0);
    ui.el.querySelectorAll('.port').forEach(p => {
      const i = +p.dataset.idx;
      const on = p.dataset.dir === 'in' ? graph.edges.some(e => e.toNode === n.id && e.toPort === i) : graph.edges.some(e => e.fromNode === n.id && e.fromPort === i);
      p.classList.toggle('on', on);
    });
  }
  $('#roN').textContent = pad2(graph.nodes.length);
  $('#roE').textContent = pad2(graph.edges.length);
  $('#roL').textContent = pad2(ana.loops);
  $('#roLw').classList.toggle('loop', ana.loops > 0);
  $('#roT').textContent = topology(ana);
  drawWires();
  reconcile();
  queueSave();
}

// ── selection ──
function select(s) {
  sel = s;
  els.forEach((ui, id) => ui.el.classList.toggle('sel', s?.kind === 'node' && s.id === id));
  drawWires();
}

// ── pan / zoom ──
function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  stage.style.backgroundSize = `${16 * view.s}px ${16 * view.s}px`;
  $('#zRd').innerHTML = `${Math.round(view.s * 100)}<small>%</small>`;
}
function toWorld(cx, cy) {
  const r = stage.getBoundingClientRect();
  return { x: (cx - r.left - view.x) / view.s, y: (cy - r.top - view.y) / view.s };
}
function zoomAt(cx, cy, f) {
  const r = stage.getBoundingClientRect(), s = clamp(view.s * f, 0.3, 1.6);
  const px = cx - r.left, py = cy - r.top;
  view.x = px - (px - view.x) * (s / view.s);
  view.y = py - (py - view.y) * (s / view.s);
  view.s = s;
  applyView();
}
function fit() {
  const r = stage.getBoundingClientRect();
  if (!graph.nodes.length) { view = { x: 40, y: 40, s: 1 }; applyView(); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of graph.nodes) {
    const b = boxOf(n.id);
    x0 = Math.min(x0, n.x - 40); x1 = Math.max(x1, n.x + W + 40);
    y0 = Math.min(y0, b.top - 20); y1 = Math.max(y1, b.bottom + 48);
  }
  const s = clamp(Math.min((r.width - 48) / (x1 - x0), (r.height - 96) / (y1 - y0)), 0.3, 1);
  view = { s, x: (r.width - (x1 - x0) * s) / 2 - x0 * s, y: (r.height - 72 - (y1 - y0) * s) / 2 - y0 * s };
  applyView();
}

// ── status ──
let sayTimer = null;
function say(msg, tone = '') {
  const s = $('#status');
  s.className = 'status' + (tone ? ' ' + tone : '');
  $('#statusTx').textContent = msg;
  clearTimeout(sayTimer);
  if (tone === 'err' || tone === 'ok') sayTimer = setTimeout(() => say(running ? 'RUNNING' : 'STOPPED · PRESS RUN', running ? 'play' : ''), 3200);
}

/* ══════════════════════════════════════════════════════════════
   INTERACTION
   ══════════════════════════════════════════════════════════════ */
let drag = null, armed = null, lastKnob = { el: null, t: 0 };

function portRef(el) { return { id: el.dataset.node, dir: el.dataset.dir, idx: +el.dataset.idx }; }
function portEl(r) { return world.querySelector(`.port[data-node="${r.id}"][data-dir="${r.dir}"][data-idx="${r.idx}"]`); }
function kindOf(r) { const d = DEFS[byId(r.id).type]; return (r.dir === 'in' ? d.ins : d.outs)[r.idx].kind; }
function link(a, b) {
  const o = a.dir === 'out' ? a : b, i = a.dir === 'out' ? b : a;
  return tryConnect(o.id, o.idx, i.id, i.idx);
}
function disarm() { if (armed) portEl(armed)?.classList.remove('armed'); armed = null; }
function tapPort(el) {
  const r = portRef(el);
  if (!armed) { armed = r; el.classList.add('armed'); say(`${labelOf(byId(r.id))} · PICK ${r.dir === 'out' ? 'AN INPUT' : 'AN OUTPUT'}`); return; }
  if (armed.id === r.id && armed.dir === r.dir && armed.idx === r.idx) { disarm(); say(running ? 'RUNNING' : 'STOPPED · PRESS RUN', running ? 'play' : ''); return; }
  if (armed.dir === r.dir) { disarm(); tapPort(el); return; }
  const a = armed;
  disarm();
  if (!link(a, r)) flashBad(a, r);
}
function flashBad(a, r) {
  const o = a.dir === 'out' ? a : r, i = a.dir === 'out' ? r : a;
  const d = rounded(route(portPos(o.id, 'out', o.idx), portPos(i.id, 'in', i.idx), boxOf(o.id), boxOf(i.id)));
  gTmp.innerHTML = `<path class="w err" d="${d}"/>`;
  setTimeout(() => { gTmp.innerHTML = ''; }, 600);
}

stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const t = e.target;
  const port = t.closest('.port'), knob = t.closest('.knob'), hit = t.closest('.whit');
  if (t.closest('.zoom')) return;
  if (port) {
    e.preventDefault();
    drag = { kind: 'port', el: port, ref: portRef(port), sx: e.clientX, sy: e.clientY, moved: false };
    stage.setPointerCapture(e.pointerId);
    return;
  }
  if (knob) {
    e.preventDefault();
    knob.focus({ preventScroll: true });
    const n = byId(knob.dataset.node), p = paramOf(n.type, knob.dataset.k), now = performance.now();
    if (lastKnob.el === knob && now - lastKnob.t < 320) { setParam(n, p, p.def); lastKnob.el = null; return; }  // double-tap → default
    lastKnob = { el: knob, t: now };
    drag = { kind: 'knob', n, p, sy: e.clientY, t0: clamp(toNorm(p, n.parameters[p.k]), 0, 1) };
    stage.setPointerCapture(e.pointerId);
    return;
  }
  if (hit) { e.preventDefault(); select({ kind: 'edge', id: hit.dataset.k }); return; }
  if (t.closest('button') || t.closest('[contenteditable="true"]')) return;
  const node = t.closest('.node');
  if (node) {
    select({ kind: 'node', id: node.dataset.id });
    if (t.closest('header')) {
      const n = byId(node.dataset.id), p = toWorld(e.clientX, e.clientY);
      drag = { kind: 'node', n, el: node, ox: p.x - n.x, oy: p.y - n.y, sx: e.clientX, sy: e.clientY, moved: false, pid: e.pointerId };
    }
    return;
  }
  select(null); disarm();
  drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  stage.classList.add('panning');
  stage.setPointerCapture(e.pointerId);
});

let hot = null;
function setHot(el, cls) {
  if (hot) hot.classList.remove('hot', 'bad');
  hot = el;
  if (el) el.classList.add(cls);
}

stage.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.kind === 'pan') {
    view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy;
    applyView();
  } else if (drag.kind === 'knob') {
    const t = clamp(drag.t0 + (drag.sy - e.clientY) / (e.shiftKey ? 800 : 200), 0, 1);
    setParam(drag.n, drag.p, fromNorm(drag.p, t));
  } else if (drag.kind === 'node') {
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true;
      stage.setPointerCapture(drag.pid);
    }
    const p = toWorld(e.clientX, e.clientY);
    drag.n.x = snap(p.x - drag.ox); drag.n.y = snap(p.y - drag.oy);
    drag.el.style.left = drag.n.x + 'px'; drag.el.style.top = drag.n.y + 'px';
    drawWires();
  } else if (drag.kind === 'port') {
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
      drag.moved = true;
      disarm();
      let a = drag.ref;
      if (a.dir === 'in') {
        // grabbing a patched input lifts its most recent cable so it can be re-routed
        const prev = [...graph.edges].reverse().find(x => x.toNode === a.id && x.toPort === a.idx);
        if (prev) { graph.edges = graph.edges.filter(x => x !== prev); commit(); a = { id: prev.fromNode, dir: 'out', idx: prev.fromPort }; }
      }
      drag.anchor = a;
    }
    const c = toWorld(e.clientX, e.clientY), a = drag.anchor, ap = portPos(a.id, a.dir, a.idx);
    const pts = a.dir === 'out' ? route(ap, c, boxOf(a.id), null) : route(c, ap, null, boxOf(a.id));
    gTmp.innerHTML = `<path class="w tmp" d="${rounded(pts)}"/>`;
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.port');
    if (over && over.dataset.dir !== a.dir) setHot(over, kindOf(portRef(over)) === kindOf(a) ? 'hot' : 'bad');
    else setHot(null);
  }
});

function endDrag(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  stage.classList.remove('panning');
  if (d.kind === 'port') {
    setHot(null);
    if (!d.moved) { tapPort(d.el); return; }
    gTmp.innerHTML = '';
    const over = e.type === 'pointerup' && document.elementFromPoint(e.clientX, e.clientY)?.closest('.port');
    if (over && over.dataset.dir !== d.anchor.dir) {
      const r = portRef(over);
      if (!link(d.anchor, r)) flashBad(d.anchor, r);
    } else if (d.anchor !== d.ref) say('CABLE PULLED');
  } else if (d.kind === 'node' && d.moved) queueSave();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

stage.addEventListener('wheel', e => {
  if (e.target.closest('.zoom')) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
  else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
}, { passive: false });

// buttons inside cards (delegated)
world.addEventListener('click', e => {
  const t = e.target;
  const port = t.closest('.port');
  if (port) { if (e.detail === 0) tapPort(port); return; }   // keyboard activation; pointer taps are handled on pointerup
  const node = t.closest('.node');
  if (!node) return;
  const n = byId(node.dataset.id);
  if (t.closest('.rm')) return removeNode(n.id);
  if (t.closest('.led')) return setBypass(n, !n.bypassed);
  if (t.closest('.load')) return pickFile(n.id);
  const seg = t.closest('.seg button');
  if (seg) return setEnum(n, seg.dataset.k, +seg.dataset.v);
});
wdel.addEventListener('click', () => { if (sel?.kind === 'edge') removeEdge(sel.id); });

// rename
world.addEventListener('dblclick', e => {
  const nm = e.target.closest('.nm');
  if (!nm) return;
  const n = byId(nm.closest('.node').dataset.id);
  nm.contentEditable = 'true';
  nm.focus();
  document.getSelection().selectAllChildren(nm);
  const done = keep => {
    nm.removeEventListener('blur', onBlur);
    nm.contentEditable = 'false';
    if (keep) {
      const v = nm.textContent.trim().toUpperCase().slice(0, 16);
      n.label = v && v !== DEFS[n.type].name ? v : '';
    }
    renderNode(n); select({ kind: 'node', id: n.id }); commit();
  };
  const onBlur = () => done(true);
  nm.addEventListener('blur', onBlur);
  nm.addEventListener('keydown', k => {
    if (k.key === 'Enter') { k.preventDefault(); nm.blur(); }
    if (k.key === 'Escape') { nm.removeEventListener('blur', onBlur); done(false); }
    k.stopPropagation();
  });
});

// knobs: keyboard
world.addEventListener('keydown', e => {
  const k = e.target.closest('.knob');
  if (!k) return;
  const n = byId(k.dataset.node), p = paramOf(n.type, k.dataset.k), t = clamp(toNorm(p, n.parameters[p.k]), 0, 1);
  const step = e.shiftKey ? 0.1 : 0.01;
  const map = { ArrowUp: t + step, ArrowRight: t + step, ArrowDown: t - step, ArrowLeft: t - step, Home: 0, End: 1, PageUp: t + 0.1, PageDown: t - 0.1 };
  if (e.key in map) { e.preventDefault(); e.stopPropagation(); setParam(n, p, fromNorm(p, clamp(map[e.key], 0, 1))); }
  else if (e.key === 'Backspace' || e.key === 'Delete') e.stopPropagation();
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.isContentEditable || t.tagName === 'INPUT') return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
    e.preventDefault();
    sel.kind === 'node' ? removeNode(sel.id) : removeEdge(sel.id);
  } else if (e.key === 'Escape') {
    disarm(); select(null);
  } else if (e.key === ' ' && (t === document.body || t === stage)) {
    e.preventDefault(); toggleRun();
  }
});

// files: load button + drop onto a SOURCE card
const fileIn = $('#fileIn');
let fileFor = null;
function pickFile(id) { fileFor = id; fileIn.value = ''; fileIn.click(); }
fileIn.addEventListener('change', () => { if (fileIn.files[0] && fileFor) loadFile(fileFor, fileIn.files[0]); });
async function loadFile(id, file) {
  const n = byId(id);
  if (!n) return;
  say(`DECODING ${file.name.toUpperCase()}`);
  try {
    const buffer = await new OfflineAudioContext(2, 1, 44100).decodeAudioData(await file.arrayBuffer());
    fileBuffers.set(id, { buffer, name: file.name.toUpperCase() });
    const f = els.get(id)?.el.querySelector('.fname');
    if (f) f.textContent = `${file.name.toUpperCase()} · ${buffer.duration.toFixed(1)} s`;
    if (n.parameters.MODE !== 4) setEnum(n, 'MODE', 4);
    else insts.get(id)?.set('MODE', 4);
    say(`LOADED ${file.name.toUpperCase()}`, 'ok');
  } catch (_) { say('FILE · CANNOT DECODE', 'err'); }
}
world.addEventListener('dragover', e => { if (e.target.closest('.node')) e.preventDefault(); });
world.addEventListener('drop', e => {
  const node = e.target.closest('.node');
  if (!node || !e.dataTransfer.files[0]) return;
  e.preventDefault();
  if (byId(node.dataset.id).type === 'SOURCE') loadFile(node.dataset.id, e.dataTransfer.files[0]);
  else say('DROP AUDIO ON A SOURCE', 'err');
});

/* ══════════════════════════════════════════════════════════════
   PRESETS · PERSISTENCE · EXPORT
   ══════════════════════════════════════════════════════════════ */
// [key, type, label, x, y, params, bypassed]  ·  edges: [from, fromPort, to, toPort]
const PRESETS = [
  { id: 'chain', name: 'TAPE 08 CHAIN',

      ['dry', 'TAP', 'DRY', 640, 0],
      ['flt', 'FILTER', '', 960, 0, { MODE: 0, FREQ: 9000, RES: 0.7 }],
      ['drv', 'DRIVE', '', 1280, 0, { DRIVE: 10, TONE: 9000, OUT: -8 }, true],
      ['dly', 'DELAY', '', 0, 460, { TIME: 402, FDBK: 35, TONE: 5000, MIX: 25 }],
      ['rev', 'REVERB', '', 320, 460, { MIX: 20, DECAY: 2.4, PRE: 20, DAMP: 7000 }],
      ['livet', 'TAP', 'LIVE', 640, 460],
      ['trk', 'SOURCE', 'TRK 01', 640, 780, { MODE: 1, LEVEL: -12 }],
      ['mst', 'MIXER', 'MASTER', 960, 460, { 'IN 2': -6 }],
      ['mvol', 'GAIN', 'MASTER VOL', 1280, 460],
      ['out', 'OUTPUT', '', 1600, 460, { VOL: -6 }],
    ],
    edges: [['in', 0, 'ivol', 0], ['ivol', 0, 'dry', 0], ['dry', 0, 'flt', 0], ['flt', 0, 'drv', 0], ['drv', 0, 'dly', 0],
      ['dly', 0, 'rev', 0], ['rev', 0, 'livet', 0], ['livet', 0, 'mst', 0], ['trk', 0, 'mst', 1], ['mst', 0, 'mvol', 0], ['mvol', 0, 'out', 0]] },
  { id: 'par', name: 'PARALLEL DRIVE',
    nodes: [
      ['in', 'SOURCE', '', 0, 140, { MODE: 0, LEVEL: -6 }],
      ['cln', 'GAIN', 'CLEAN', 360, 0, { GAIN: -3 }],
      ['drt', 'DRIVE', 'DIRT', 360, 300, { DRIVE: 30, TONE: 3800, OUT: -16 }],
      ['mix', 'MIXER', '', 720, 140, { 'IN 2': -4 }],
      ['out', 'OUTPUT', '', 1080, 140, { VOL: -6 }],
    ],
    edges: [['in', 0, 'cln', 0], ['in', 0, 'drt', 0], ['cln', 0, 'mix', 0], ['drt', 0, 'mix', 1], ['mix', 0, 'out', 0]] },
  { id: 'fb', name: 'FEEDBACK ECHO',
    nodes: [
      ['in', 'SOURCE', '', 0, -160, { MODE: 0, LEVEL: -6 }],
      ['wow', 'LFO', 'WOW', 720, -480, { SHAPE: 0, RATE: 0.6, DEPTH: 12 }],
      ['sum', 'MIXER', 'SUM', 360, 120],
      ['dly', 'DELAY', 'ECHO', 720, 120, { TIME: 402, FDBK: 0, TONE: 16000, MIX: 100 }],
      ['dark', 'FILTER', 'DARKEN', 720, 500, { MODE: 0, FREQ: 2200, RES: 0.8 }],
      ['fbk', 'GAIN', 'FDBK', 360, 520, { GAIN: -4 }],
      ['dw', 'DRYWET', '', 1080, -160, { MIX: 45 }],
      ['out', 'OUTPUT', '', 1440, -160, { VOL: -6 }],
    ],
    edges: [['in', 0, 'sum', 0], ['sum', 0, 'dly', 0], ['dly', 0, 'dark', 0], ['dark', 0, 'fbk', 0], ['fbk', 0, 'sum', 1],
      ['in', 0, 'dw', 0], ['dly', 0, 'dw', 1], ['dw', 0, 'out', 0], ['wow', 0, 'dly', 1]] },
  { id: 'mb', name: 'MULTIBAND',
    nodes: [
      ['in', 'SOURCE', '', 0, 280, { MODE: 0, LEVEL: -6 }],
      ['lfo', 'LFO', '', 360, -60, { SHAPE: 1, RATE: 0.8, DEPTH: 60 }],
      ['xo', 'CROSSOVER', '', 360, 280, { LOW: 200, HIGH: 2500 }],
      ['lo', 'DRIVE', 'LOW DRIVE', 720, -40, { DRIVE: 18, TONE: 2000, OUT: -10 }],
      ['md', 'FILTER', 'MID WAH', 760, 300, { MODE: 1, FREQ: 900, RES: 4 }],
      ['hi', 'REVERB', 'HIGH AIR', 720, 660, { MIX: 60, DECAY: 3.5, PRE: 30, DAMP: 12000 }],
      ['mix', 'MIXER', '', 1120, 280, { 'IN 1': -2, 'IN 3': -2 }],
      ['out', 'OUTPUT', '', 1480, 280, { VOL: -6 }],
    ],
    edges: [['in', 0, 'xo', 0], ['xo', 0, 'lo', 0], ['xo', 1, 'md', 0], ['xo', 2, 'hi', 0], ['lfo', 0, 'md', 1],
      ['lo', 0, 'mix', 0], ['md', 0, 'mix', 1], ['hi', 0, 'mix', 2], ['mix', 0, 'out', 0]] },
];

function loadGraph(g, presetId = null) {
  // a new patch reuses node ids, so tear the audio graph down and let reconcile build it fresh
  for (const [, pair] of live) { try { pair[0].disconnect(pair[1]); } catch (_) {} }
  live.clear();
  insts.forEach(i => i.dispose());
  insts.clear();
  els.forEach(ui => ui.el.remove());
  els.clear();
  sel = null; disarm();
  graph = g;
  seq = Math.max(0, ...graph.nodes.map(n => +String(n.id).replace(/\D/g, '') || 0));
  currentPreset = presetId;
  document.querySelectorAll('.preset').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === presetId)));
  graph.nodes.forEach(renderNode);
  commit();
  fit();
}
function loadPreset(p) {
  seq = 0;
  const map = {};
  const nodes = p.nodes.map(([key, type, label, x, y, params, byp]) => { const n = makeNode(type, x, y, label, params, !!byp); map[key] = n.id; return n; });
  const edges = p.edges.map(([a, ap, b, bp]) => ({ fromNode: map[a], fromPort: ap, toNode: map[b], toPort: bp }));
  if (!analyze(nodes, edges).ok) throw new Error('preset has an illegal cycle: ' + p.id);
  loadGraph({ nodes, edges }, p.id);
  say(`LOADED · ${p.name}`, 'ok');
}

let saveTimer = null;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify({ graph: serialize(), preset: currentPreset })); } catch (_) {}
  }, 250);
}
function serialize() {
  return {
    format: 'tape08.graph', version: 1,
    nodes: graph.nodes.map(({ id, type, label, x, y, parameters, bypassed }) => ({ id, type, label, x, y, parameters: { ...parameters }, bypassed })),
    edges: graph.edges.map(({ fromNode, fromPort, toNode, toPort }) => ({ fromNode, fromPort, toNode, toPort })),
  };
}
function deserialize(o) {
  if (!o || !Array.isArray(o.nodes) || !Array.isArray(o.edges)) throw new Error('not a patch');
  const nodes = o.nodes.filter(n => DEFS[n.type]).map(n => {
    const m = makeNode(n.type, +n.x || 0, +n.y || 0, n.label || '', n.parameters || {}, !!n.bypassed);
    m.id = String(n.id);
    return m;
  });
  const ids = new Set(nodes.map(n => n.id));
  const edges = o.edges.filter(e => ids.has(String(e.fromNode)) && ids.has(String(e.toNode))).map(e => ({ fromNode: String(e.fromNode), fromPort: +e.fromPort, toNode: String(e.toNode), toPort: +e.toPort }))
    .filter(e => DEFS[byIdIn(nodes, e.fromNode).type].outs[e.fromPort] && DEFS[byIdIn(nodes, e.toNode).type].ins[e.toPort]);
  if (!analyze(nodes, edges).ok) throw new Error('illegal cycle');
  return { nodes, edges };
}

$('#exp').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tape08-patch.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  say('EXPORTED · TAPE08-PATCH.JSON', 'ok');
});
const jsonIn = $('#jsonIn');
$('#imp').addEventListener('click', () => { jsonIn.value = ''; jsonIn.click(); });
jsonIn.addEventListener('change', async () => {
  try { loadGraph(deserialize(JSON.parse(await jsonIn.files[0].text()))); say('IMPORTED', 'ok'); }
  catch (err) { say(`IMPORT · ${String(err.message).toUpperCase()}`, 'err'); }
});

/* ══════════════════════════════════════════════════════════════
   METERS — fast attack, ~300 ms release, 2 s clip hold
   ══════════════════════════════════════════════════════════════ */
const mstate = new Map();
const tbuf = new Float32Array(1024);
let lastFrame = performance.now();
function sizeCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h };
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  for (const n of graph.nodes) {
    const d = DEFS[n.type];
    if (!d.meter) continue;
    const ui = els.get(n.id);
    if (!ui) continue;
    const inst = insts.get(n.id);
    const st = mstate.get(n.id) || { lvl: [0, 0], clip: 0, txt: 0 };
    mstate.set(n.id, st);
    let scopeData = null;
    for (let c = 0; c < 2; c++) {
      let pk = 0;
      if (inst?.an && running) {
        inst.an[c].getFloatTimeDomainData(tbuf);
        for (let i = 0; i < tbuf.length; i++) { const a = Math.abs(tbuf[i]); if (a > pk) pk = a; }
        if (c === 0 && ui.scope) scopeData = tbuf.slice();
      }
      st.lvl[c] = pk >= st.lvl[c] ? pk : st.lvl[c] * Math.exp(-dt / 0.3);
      if (pk >= 0.999) st.clip = now + 2000;
    }
    const clipping = now < st.clip;
    // segmented meter: 3 px bars, 2 px gaps, −60…0 dBFS
    const { g, w, h } = sizeCanvas(ui.meter);
    g.clearRect(0, 0, w, h);
    const segs = Math.floor((w + 2) / 5);
    for (let c = 0; c < 2; c++) {
      const db = st.lvl[c] > 0 ? 20 * Math.log10(st.lvl[c]) : -Infinity;
      const lit = Math.round(segs * (clamp(db, -60, 0) + 60) / 60);
      for (let s = 0; s < segs; s++) {
        g.fillStyle = s < lit ? (clipping ? '#FF4D5E' : d.c) : 'rgba(236,232,222,.07)';
        g.fillRect(s * 5, c * 8, 3, 4);
      }
    }
    if (ui.scope) {
      const sc = sizeCanvas(ui.scope);
      sc.g.clearRect(0, 0, sc.w, sc.h);
      sc.g.fillStyle = 'rgba(236,232,222,.07)';
      sc.g.fillRect(0, Math.round(sc.h / 2), sc.w, 1);
      if (scopeData) {
        sc.g.strokeStyle = '#ECE8DE'; sc.g.lineWidth = 1; sc.g.beginPath();
        for (let x = 0; x <= sc.w; x++) {
          const v = scopeData[Math.floor(x / sc.w * (scopeData.length - 1))];
          const y = sc.h / 2 - clamp(v, -1, 1) * (sc.h / 2 - 2);
          x ? sc.g.lineTo(x, y) : sc.g.moveTo(x, y);
        }
        sc.g.stroke();
      }
    }
    if (now - st.txt > 100) {
      st.txt = now;
      const pk = Math.max(st.lvl[0], st.lvl[1]), db = pk > 0 ? 20 * Math.log10(pk) : -Infinity;
      ui.readout.classList.toggle('clip', clipping);
      ui.readout.innerHTML = clipping ? 'CLIP' : (db < -60 ? '−∞' : sgn(db, 1)) + '<small>dB</small>';
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
(function init() {
  // palette
  const pal = $('#palette');
  let h = '';
  for (const [g, title] of GROUPS) {
    h += `<h2 class="flab">${title}</h2>`;
    for (const [type, d] of Object.entries(DEFS)) {
      if (d.group !== g) continue;
      const ai = d.ins.filter(p => p.kind === 'audio').length, cv = d.ins.some(p => p.kind === 'control');
      const outs = d.outs.length && d.outs[0].kind === 'control' ? 'CV' : d.outs.length;
      h += `<button class="pal" type="button" data-type="${type}" style="--c:${d.c}" aria-label="Add ${d.name}"><i></i><b>${d.name}</b><small>${ai}${cv ? '+CV' : ''} → ${outs}</small></button>`;
    }
  }
  h += '<p class="note">Any loop must pass through a DELAY. Outputs fan out; inputs sum. CV inputs take one cable.</p>';
  pal.innerHTML = h;
  pal.addEventListener('click', e => { const b = e.target.closest('.pal'); if (b) addNode(b.dataset.type); });

  // presets
  const pr = $('#presets');
  pr.innerHTML = PRESETS.map(p => `<button class="btn preset" type="button" data-id="${p.id}" aria-pressed="false">${p.name}</button>`).join('')
    + '<button class="btn quiet" type="button" id="clr">CLEAR</button>';
  pr.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'clr') { loadGraph({ nodes: [], edges: [] }); say('CLEARED · ADD A SOURCE AND AN OUTPUT'); return; }
    loadPreset(PRESETS.find(p => p.id === b.dataset.id));
  });

  $('#run').addEventListener('click', toggleRun);
  $('#zIn').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.2); });
  $('#zOut').addEventListener('click', () => { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.2); });
  $('#zFit').addEventListener('click', fit);

  let restored = false;
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s?.graph) { loadGraph(deserialize(s.graph), s.preset || null); restored = true; }
  } catch (_) {}
  if (!restored) loadPreset(PRESETS[0]);
  say('STOPPED · PRESS RUN');
  document.fonts?.ready.then(() => { drawWires(); });
  requestAnimationFrame(frame);
})();
</script>
