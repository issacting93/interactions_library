<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scriptorium</title>
<!--
  Scriptorium — breeding alien scripts that can turn into illustration.
  A script is a GlyphSystem recipe (shared/glyph/glyph-system.js): a hand taken from one of the eight
  Xenoglyph engines, a grammar that composes several concepts into one glyph (Hangul blocks, Heptapod
  rings, connected graphs), a frame and a determinative, and a figurative level that turns signs into
  heads and full figures made of creature parts (Maya script's plain / head / full-figure variants).
  The atlas is MAP-Elites (shared/evolve/map-elites.js) over whole scripts, judged by
  shared/glyph/script-search.js: legibility, figurativeness, density, symmetry, variety.
  Serve from the repo root and open /tools/scriptorium/.
-->
<style>
  /* Layout: a scriptorium desk — the atlas of scripts on the left, the open book of one script on the right. */
  :root {
    --paper: #efe9dd; --paper-2: #e6dfd0; --ink: #2b2118; --ink-2: #6f6252; --ink-3: #a4977f; --rule: #cfc5b2;
    --gold: #9a6b22; --plate: #efe9dd;
    --display: "IM Fell English", "Iowan Old Style", Palatino, Georgia, serif;
    --body: "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  button, select, input { font: 12px var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 2px; padding: 7px 10px; }
  button { cursor: pointer; letter-spacing: .06em; text-transform: uppercase; }
  button:hover, select:hover { border-color: var(--ink-2); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button:disabled { opacity: .45; cursor: default; }
  .wrap { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; padding-block: 18px 12px; border-bottom: 1px solid var(--rule); }
  h1 { font: 400 34px/1 var(--display); margin: 0; letter-spacing: .01em; }
  .sub { color: var(--ink-2); max-width: 64ch; font-size: 15px; }
  .stats { margin-left: auto; font: 11px var(--mono); color: var(--ink-2); }
  .stats b { color: var(--ink); font-weight: 400; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--rule); }
  .controls label, .field { font: 11px var(--mono); color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); gap: 28px; padding-block: 18px 32px; }
  .atlas { display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: auto 20px; gap: 6px; align-content: start; align-self: start; max-width: min(100%, calc(100vh - 190px)); }
  .ylab { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; }
  .xlab { grid-column: 2; text-align: center; }
  .ylab, .xlab { font: 10px var(--mono); color: var(--ink-3); letter-spacing: .12em; text-transform: uppercase; }
  .grid { display: grid; gap: 3px; aspect-ratio: 1; }
  .cell { position: relative; padding: 0; border: 1px solid transparent; background: var(--paper-2); aspect-ratio: 1; overflow: hidden; border-radius: 1px; }
  .cell canvas { width: 100%; height: 100%; display: block; filter: invert(1); mix-blend-mode: multiply; }
  .cell.empty { background: repeating-linear-gradient(135deg, var(--paper-2) 0 6px, var(--paper) 6px 7px); cursor: default; }
  .cell.sel { border-color: var(--gold); }
  .cell.new { animation: flash .9s ease-out; }
  @keyframes flash { from { box-shadow: inset 0 0 0 2px var(--gold); } to { box-shadow: inset 0 0 0 0 transparent; } }
  .cell .pin { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .book { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .book h2 { font: 400 22px var(--display); margin: 0; }
  .eyebrow { font: 10px var(--mono); color: var(--ink-3); letter-spacing: .14em; text-transform: uppercase; }
  .compose { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: start; }
  .glyph { aspect-ratio: 1; width: 100%; display: block; }
  .phrase { width: 100%; font: 16px var(--body); padding: 8px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip { font: 11px var(--mono); padding: 2px 7px; border: 1px solid var(--rule); border-radius: 10px; color: var(--ink-2); }
  .chip.f { border-color: var(--gold); color: var(--gold); }
  .dials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
  .dials .field { flex-direction: column; align-items: stretch; gap: 4px; }
  .dials input[type="range"] { padding: 0; border: 0; accent-color: var(--gold); }
  .dict { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px 4px; }
  .entry { text-align: center; font: 10px var(--mono); color: var(--ink-2); }
  .entry svg { width: 100%; aspect-ratio: 1; display: block; }
  .entry.cat { color: var(--ink-3); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .hint { font: 11px/1.5 var(--mono); color: var(--ink-3); }
  .traits { display: grid; gap: 4px; }
  .trait { display: grid; grid-template-columns: 130px 1fr 34px; gap: 8px; align-items: center; font: 10px var(--mono); color: var(--ink-2); }
  .bar { height: 3px; background: var(--rule); position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
  .trait.q .bar i { background: var(--gold); }
  .empty-note { color: var(--ink-3); font-style: italic; }
  /* skins: colours only, on the open book */
  .skin-ink { --g-ink: var(--ink); --g-ground: transparent; --g-plate: var(--paper); --g-glow: none; }
  .skin-gilt { --g-ink: #8a5a14; --g-ground: transparent; --g-plate: var(--paper); --g-glow: drop-shadow(0 0 1.5px #e8b860) drop-shadow(0 0 5px #f1cf8a); }
  .skin-glow { --g-ink: #9ff3e2; --g-ground: #0c1416; --g-plate: #0c1416; --g-glow: drop-shadow(0 0 2px #53e0c5); }
  .skin-blueprint { --g-ink: #cfe3ff; --g-ground: #173252; --g-plate: #173252; --g-glow: none; }
  .glyphs svg { color: var(--g-ink); --plate: var(--g-plate); background: var(--g-ground); filter: var(--g-glow); }
  .err { padding: 40px 0; color: #9a3b22; font: 13px var(--mono); }
  @media (max-width: 920px) {
    .desk { grid-template-columns: minmax(0, 1fr); }
    .atlas { max-width: 100%; }
    .stats { margin-left: 0; width: 100%; }
    .compose { grid-template-columns: 120px minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { .cell.new { animation: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=IM+Fell+English&family=JetBrains+Mono&display=swap">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Scriptorium</h1>
    <span class="sub">Alien scripts bred from the Xenoglyph hands. Each cell is a whole writing system; open one to read its dictionary, write a phrase in it, and turn its signs into figures.</span>
    <span class="stats" id="stats">loading the parts…</span>
  </header>
  <div class="controls">
    <button id="run" aria-pressed="false" disabled>Breed</button>
    <button id="reset" disabled>Start over</button>
    <label>Across <select id="ax"></select></label>
    <label>Up <select id="ay"></select></label>
    <label>Grid <select id="gn"><option>6</option><option selected>8</option><option>10</option></select></label>
  </div>
  <div class="desk">
    <div class="atlas">
      <div class="ylab" id="ylab"></div>
      <div class="grid" id="grid"></div>
      <div class="xlab" id="xlab"></div>
    </div>
    <section class="book" id="book"><p class="empty-note">Breeding has started. Pick any cell to open that script.</p></section>
  </div>
</div>

<script src="../../shared/generators/kit-utils.js"></script>
<script src="../../shared/xenoglyph-engine.js"></script>
<script src="../../shared/glyph/glyph-system.js"></script>
<script src="../../shared/glyph/script-search.js"></script>
<script src="../../shared/evolve/map-elites.js"></script>
<script>
(async function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const G = GlyphSystem, S = ScriptSearch;
  const params = new URLSearchParams(location.search);
  const R = ForgeKit.rng(Number(params.get("seed")) || (Date.now() % 1e9));
  const pct = (v) => Math.round(v * 100);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let kit;
  try { const raw = await (await fetch(params.get("kit") || "../../shared/creature-parts.json")).json(); kit = G.prepareKit(raw.parts || raw); }
  catch (e) { $("book").innerHTML = `<div class="err">Could not load the creature parts (${esc(e.message)}). Serve the repo root and open /tools/scriptorium/.</div>`; return; }

  for (const sel of [$("ax"), $("ay")]) for (const [id, a] of Object.entries(S.AXES)) sel.insertAdjacentHTML("beforeend", `<option value="${id}">${a.label}</option>`);
  $("ax").value = params.get("x") || "legibility"; $("ay").value = params.get("y") || "figurative";

  let me;
  const newArchive = () => { me = MapElites.create({ axes: S.AXES, x: $("ax").value, y: $("ay").value, n: Number($("gn").value), similarity: S.similarity, steer: 0.35, keep: 700 }); };
  newArchive();

  // ── atlas ───────────────────────────────────────────────────────────────
  let selected = null;
  const cells = [];
  function buildGrid() {
    const g = $("grid"), n = me.n;
    g.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`; g.innerHTML = ""; cells.length = 0;
    for (let row = 0; row < n; row++) for (let i = 0; i < n; i++) {
      const j = n - 1 - row, b = document.createElement("button");
      b.className = "cell empty"; b.setAttribute("aria-label", "empty niche");
      b.addEventListener("click", () => { const it = me.at(i, j); if (it) select(it); });
      g.appendChild(b); cells[j * n + i] = b;
    }
    $("xlab").textContent = S.AXES[me.x].label + " →"; $("ylab").textContent = S.AXES[me.y].label + " →";
    for (const c of me.cells()) paintCell(c.cell, c.item, false);
  }
  function describe(s) { return `${s.engine} hand, ${s.flesh} stroke, ${s.grammar} grammar`; }
  function paintCell(cell, item, flash) {
    const b = cells[cell]; if (!b) return;
    b.className = "cell" + (flash ? " new" : "") + (item === selected ? " sel" : "");
    b.innerHTML = "";
    const c = document.createElement("canvas"); c.width = item.thumb.width; c.height = item.thumb.height; c.getContext("2d").drawImage(item.thumb, 0, 0); b.appendChild(c);
    if (me.pins.includes(item)) b.insertAdjacentHTML("beforeend", '<span class="pin"></span>');
    b.setAttribute("aria-label", `${describe(item.genome)}; legibility ${pct(item.traits.legibility)}`); b.title = describe(item.genome);
  }
  function stats() { const s = me.stats(); $("stats").innerHTML = `<b>${s.filled}</b> of ${s.cells} niches · <b>${s.evaluated}</b> scripts bred · quality-diversity <b>${s.qd.toFixed(1)}</b>`; }

  // ── breeding ───────────────────────────────────────────────────────────
  let running = false, busy = false;
  async function add(script, flash) {
    let item; try { item = await S.evaluate(script, kit); } catch (e) { console.warn(e); return null; }
    const r = me.insert(item); if (r.placed) paintCell(r.cell, item, flash !== false);
    return item;
  }
  async function breedOne() {
    const s = me.stats();
    let g;
    if (s.filled < 10 || R() < 0.1) g = G.newScript(Math.floor(R() * 1e9), R);
    else if (R() < 0.3) { const two = me.pickTwo(R); g = two ? G.mutate(G.cross(two[0].genome, two[1].genome, R), R) : G.newScript(Math.floor(R() * 1e9), R); }
    else g = G.mutate(me.pick(R).genome, R);
    await add(g);
  }
  async function loop() {
    if (busy) return; busy = true;
    while (running) { const t0 = performance.now(); while (running && performance.now() - t0 < 30) await breedOne(); stats(); await new Promise((r) => requestAnimationFrame(r)); }
    busy = false;
  }
  function setRunning(on) { running = on; $("run").setAttribute("aria-pressed", on); $("run").textContent = on ? "Pause" : "Breed"; if (on) loop(); }
  $("run").addEventListener("click", () => setRunning(!running));
  $("reset").addEventListener("click", () => { const was = running; setRunning(false); setTimeout(() => { newArchive(); selected = null; buildGrid(); stats(); renderBook(); if (was) setRunning(true); }, 60); });
  for (const sel of [$("ax"), $("ay")]) sel.addEventListener("change", () => { me.setAxes($("ax").value, $("ay").value); buildGrid(); stats(); });
  $("gn").addEventListener("change", () => { me.setAxes(me.x, me.y, Number($("gn").value)); buildGrid(); stats(); });

  // ── the open book ───────────────────────────────────────────────────────
  let skin = "ink", phrase = "the bird flies over the sea at night";
  try { skin = localStorage.getItem("scriptorium:skin") || skin; phrase = localStorage.getItem("scriptorium:phrase") || phrase; } catch (e) {}
  function select(item) {
    const prev = selected; selected = item;
    for (const c of me.cells()) if (c.item === prev || c.item === item) paintCell(c.cell, c.item, false);
    renderBook();
  }
  const opt = (vals, cur, labels) => vals.map((v) => `<option value="${v}"${v === cur ? " selected" : ""}>${(labels && labels[v]) || v}</option>`).join("");
  function renderBook() {
    const book = $("book");
    if (!selected) { book.innerHTML = '<p class="empty-note">Breeding has started. Pick any cell to open that script.</p>'; return; }
    const s = selected.genome, it = selected, pinned = me.pins.includes(it);
    const concepts = G.parse(phrase), comp = G.compose(s, concepts, kit);
    const chips = concepts.map((c, i) => `<span class="chip${comp.levels[i] === "figure" ? " f" : ""}">${c}${comp.levels[i] !== "sign" ? " · " + comp.levels[i] : ""}</span>`).join("") || '<span class="hint">No known words yet. Try sun, sea, bird, night, fly, city…</span>';
    const dict = G.LEXICON.map((c) => `<div class="entry"><svg viewBox="0 0 100 100" aria-label="${c.id}">${G.radical(s, c.id, kit).svg}</svg>${c.id}</div>`).join("");
    const traitRows = Object.entries(S.AXES).map(([k, a]) => { const v = Math.max(0, Math.min(1, (it.traits[k] - a.min) / (a.max - a.min))); return `<div class="trait"><span>${a.label}</span><span class="bar"><i style="width:${pct(v)}%"></i></span><span>${it.traits[k].toFixed(2)}</span></div>`; }).join("");
    book.innerHTML = `
      <div><div class="eyebrow">Script #${s.id}${s.parents.length ? " · bred from " + s.parents.map((p) => "#" + p).join(" and ") : " · a first draw"}</div>
        <h2>${esc(s.engine[0].toUpperCase() + s.engine.slice(1))} hand, ${esc(s.grammar)} grammar</h2></div>
      <div class="compose glyphs skin-${skin}">
        <svg class="glyph" viewBox="0 0 100 100" aria-label="The phrase written as one glyph">${comp.svg}</svg>
        <div><label class="eyebrow" for="phrase">Write a phrase</label>
          <input class="phrase" id="phrase" value="${esc(phrase)}" autocomplete="off">
          <div class="chips">${chips}</div>
          <p class="hint">Gold words are drawn as full figures. The first word sits at the heart of the glyph; its category sets the small determinative mark.</p></div>
      </div>
      <div class="dials">
        <label class="field">Sign → figure <input type="range" id="figure" min="0" max="1" step="0.05" value="${s.figure}"></label>
        <label class="field">Heads <input type="range" id="head" min="0" max="1" step="0.05" value="${s.head}"></label>
        <label class="field">Grammar <select id="grammar">${opt(G.GRAMMARS, s.grammar, { block: "Block (Hangul)", ring: "Ring (Heptapod)", graph: "Graph (linked)" })}</select></label>
        <label class="field">Frame <select id="frame">${opt(G.FRAMES, s.frame)}</select></label>
        <label class="field">Hand <select id="engine">${opt(G.ENGINES, s.engine)}</select></label>
        <label class="field">Stroke <select id="flesh">${opt(G.FLESH, s.flesh)}</select></label>
        <label class="field">Figures from <select id="species"><option value="">any creature</option>${kit.species.map((sp) => `<option value="${sp}"${sp === s.species ? " selected" : ""}>${sp.replace(/^sheet-/, "").replace(/-/g, " ")}</option>`).join("")}</select></label>
        <label class="field">Skin <select id="skin">${opt(["ink", "gilt", "glow", "blueprint"], skin)}</select></label>
      </div>
      <div><div class="eyebrow" style="margin-bottom:6px">Dictionary</div><div class="dict glyphs skin-${skin}">${dict}</div></div>
      <div class="traits"><div class="trait q"><span>Quality (one hand)</span><span class="bar"><i style="width:${pct(it.quality)}%"></i></span><span>${it.quality.toFixed(2)}</span></div>${traitRows}</div>
      <div class="row">
        <button id="pinBtn" aria-pressed="${pinned}">${pinned ? "Unpin" : "Pin"}</button>
        <button id="kidsBtn">Breed from this</button>
        <button id="copyBtn">Copy recipe</button>
      </div>
      <p class="hint">Changing a dial makes a new script from this one and files it in the atlas.</p>`;
    $("phrase").addEventListener("input", (e) => { phrase = e.target.value; try { localStorage.setItem("scriptorium:phrase", phrase); } catch (x) {} clearTimeout(renderBook.t); renderBook.t = setTimeout(() => { renderBook(); const p = $("phrase"); p.focus(); p.setSelectionRange(p.value.length, p.value.length); }, 250); });
    $("skin").addEventListener("change", (e) => { skin = e.target.value; try { localStorage.setItem("scriptorium:skin", skin); } catch (x) {} renderBook(); });
    const edit = (key, val) => { const next = { ...JSON.parse(JSON.stringify(s)), [key]: val, id: Date.now() % 1e7, parents: [s.id] }; add(next, true).then((item) => { if (item) { stats(); select(item); } }); };
    for (const k of ["figure", "head"]) $(k).addEventListener("change", (e) => edit(k, Number(e.target.value)));
    for (const k of ["grammar", "frame", "engine", "flesh"]) $(k).addEventListener("change", (e) => edit(k, e.target.value));
    $("species").addEventListener("change", (e) => edit("species", e.target.value || null));
    $("pinBtn").onclick = () => { pinned ? me.unpin(it) : me.pin(it); buildGrid(); renderBook(); };
    $("kidsBtn").onclick = async () => { $("kidsBtn").disabled = true; for (let k = 0; k < 16; k++) await add(G.mutate(s, R)); stats(); if ($("kidsBtn")) $("kidsBtn").disabled = false; };
    $("copyBtn").onclick = () => { const t = JSON.stringify(s, null, 1); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { $("copyBtn").textContent = "Copied"; }, () => { $("copyBtn").textContent = "Copy failed"; }); };
  }

  buildGrid(); stats();
  $("run").disabled = false; $("reset").disabled = false;
  window.SCRIPTORIUM = { kit, get me() { return me; }, select, setRunning };
  if (params.get("run") !== "0") setRunning(true);
  // open the first good script once there is one, so the book is never blank for long
  const opener = setInterval(() => { if (selected) return clearInterval(opener); const c = me.cells().sort((a, b) => b.item.quality - a.item.quality)[0]; if (c && me.stats().evaluated > 20) { select(c.item); clearInterval(opener); } }, 500);
})();
</script>
</body>
</html>
