<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Template — Timeline</title>
<!--
  TEMPLATE: TIMELINE. Ported from the deck's horizontal multi-lane history chart (p.9) to a
  vertical spine, since six side-by-side swimlane columns don't fit a 1080px-wide canvas. Time
  flows top to bottom along a left-aligned spine; each event is a coloured dot on the spine with a
  stub line out to a card (category tag + label). A dashed "today" tick and a boxed terminal node
  mark the present, same as the deck's highlighted 1993 line + boxed "User experience" node.
  Placeholder content only — swap EVENTS below for your own; everything else re-flows
  automatically — events are distributed evenly across the safe band by index, not given a
  hand-placed y, specifically so this still clears the bottom caption zone no matter how many
  events you add (the previous hand-placed y values ran the final "today" card to top:1574px,
  deep in the zone Reels/TikTok/Shorts use for captions and account chrome — see research-core.css).
  Loop: 9.0s. ?driven=1 + window.essayStep(ms) for deterministic capture.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="research-core.css">
<style>
  .lane{position:absolute;left:64px;top:496px;width:952px;height:1050px}
  .lane svg{position:absolute;left:0;top:0;width:952px;height:1050px;overflow:visible}
  .spine{stroke:var(--rt-line-2);stroke-width:2}
  .tick{stroke:var(--rt-ink-2);stroke-width:1}
  .ticklbl{font-size:13px;fill:var(--rt-ink-2);letter-spacing:.06em}
  .evdot{stroke:var(--rt-ground);stroke-width:3}
  .stub{stroke:var(--rt-line-2);stroke-width:1.5}
  .today-tick{stroke:var(--rt-cat-amber);stroke-width:1.5;stroke-dasharray:3 5}

  .card{position:absolute;left:180px;width:700px}
  .card .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .card .lbl{font-size:21px;margin-top:5px}
  .card.final{border:1.5px solid var(--rt-cat-amber);border-radius:12px;padding:14px 18px;left:168px;width:724px}
  .today-lbl{position:absolute;font-family:var(--rt-mono);font-size:12px;letter-spacing:.2em;color:var(--rt-cat-amber)}
</style>
</head>
<body>
<div class="rt-border"></div>
<div class="rt-header">
  <div class="rt-micro">TEMPLATE &middot; TIMELINE</div>
  <div class="rt-title">How interfaces<br>took shape</div>
</div>
<div class="rt-rule" style="top:440px"></div>

<div class="rt-legend" style="position:absolute;left:64px;top:466px" id="legend"></div>

<div class="lane" id="lane">
  <svg viewBox="0 0 952 1050">
    <line class="spine" id="spine" x1="12" y1="0" x2="12" y2="1050"></line>
  </svg>
</div>

<div class="rt-footer">
  <span>THE POINT OF INTERFACE</span>
  <span>TEMPLATE &middot; 01 / 04</span>
</div>

<script src="essay-core.js"></script>
<script>
(function () {
  const LOOP = 9.0;
  const CATS = {
    computing: { label: 'COMPUTING', color: 'var(--rt-cat-blue)' },
    design:    { label: 'DESIGN',    color: 'var(--rt-cat-amber)' },
    practice:  { label: 'PRACTICE',  color: 'var(--rt-cat-white)' },
    ai:        { label: 'AI',        color: 'var(--rt-cat-red)' },
  };
  const LANE_TOP = 496, SPINE_LEN = 1050;
  const EVENTS = [
    { year: '1980', cat: 'computing', label: 'Direct manipulation' },
    { year: '1988', cat: 'design',    label: 'The Design of Everyday Things' },
    { year: '1993', cat: 'practice',  label: '"User experience" coined' },
    { year: '2007', cat: 'computing', label: 'Multitouch goes mainstream' },
    { year: '2015', cat: 'design',    label: 'Design systems standardise UI' },
    { year: '2024', cat: 'ai', label: 'Generative UI', today: true, final: true },
  ];
  // Evenly distribute by index across the spine, with headroom reserved top/bottom for the dot
  // radius and the final card's extra padding — this is what keeps the template safe-zone-clean
  // regardless of how many events the next episode swaps in.
  EVENTS.forEach((e, i) => { e.y = Math.round(40 + (i / (EVENTS.length - 1)) * (SPINE_LEN - 40 - 110)); });

  const legendEl = document.getElementById('legend');
  Object.values(CATS).forEach(c => {
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = `<span class="dot" style="background:${c.color}"></span><span class="lbl">${c.label}</span>`;
    legendEl.appendChild(el);
  });

  const svg = document.querySelector('.lane svg');
  const laneEl = document.getElementById('lane');
  const ns = 'http://www.w3.org/2000/svg';
  const nodes = EVENTS.map((ev, i) => {
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('class', 'evdot'); dot.setAttribute('cx', 12); dot.setAttribute('cy', ev.y);
    dot.setAttribute('r', ev.final ? 9 : 7); dot.setAttribute('fill', CATS[ev.cat].color);
    svg.appendChild(dot);

    const stub = document.createElementNS(ns, 'line');
    stub.setAttribute('class', 'stub'); stub.setAttribute('x1', 12); stub.setAttribute('y1', ev.y);
    stub.setAttribute('x2', 116); stub.setAttribute('y2', ev.y);
    svg.appendChild(stub);

    let todayTick = null, todayLbl = null;
    if (ev.today) {
      todayTick = document.createElementNS(ns, 'line');
      todayTick.setAttribute('class', 'today-tick'); todayTick.setAttribute('x1', 0); todayTick.setAttribute('y1', ev.y - 48);
      todayTick.setAttribute('x2', 952); todayTick.setAttribute('y2', ev.y - 48);
      svg.appendChild(todayTick);
      todayLbl = document.createElement('div'); todayLbl.className = 'today-lbl'; todayLbl.textContent = 'TODAY';
      // appended to #lane below, which is itself position:absolute — its own top:LANE_TOP already
      // establishes the containing block, so this is relative to the LANE, not the document (the
      // double-offset bug this library's own README warns about; unlike .card, which is appended
      // to <body> and does need the LANE_TOP add).
      todayLbl.style.left = '780px'; todayLbl.style.top = (ev.y - 68) + 'px';
      laneEl.appendChild(todayLbl);
    }

    const card = document.createElement('div');
    card.className = 'card' + (ev.final ? ' final' : '');
    card.style.top = (LANE_TOP + ev.y - (ev.final ? 26 : 12)) + 'px';
    card.innerHTML = `<div class="tag" style="color:${CATS[ev.cat].color}">${ev.year} &middot; ${CATS[ev.cat].label}</div><div class="lbl">${ev.label}</div>`;
    document.body.appendChild(card);

    return { dot, stub, card, todayTick, todayLbl, y: ev.y };
  });

  function step(tAbs) {
    const t = tAbs % LOOP;
    const spine = document.getElementById('spine');
    const spineP = ease.outCubic(prog(t, 0.0, 1.4));
    spine.setAttribute('y2', String(SPINE_LEN * clamp01(spineP)));
    const spineReach = SPINE_LEN * clamp01(spineP);

    nodes.forEach((n, i) => {
      const reached = spineReach >= n.y - 20;
      const p = reached ? ease.outBack(prog(t, 0.3 + (n.y / SPINE_LEN) * 1.2, 0.4)) : 0;
      n.dot.style.opacity = String(clamp01(p));
      n.dot.setAttribute('r', String((n === nodes[nodes.length - 1] ? 9 : 7) * lerp(0.3, 1, clamp01(p))));
      const stubP = ease.outCubic(prog(t, 0.35 + (n.y / SPINE_LEN) * 1.2, 0.3));
      n.stub.style.opacity = String(reached ? clamp01(stubP) : 0);
      const cardP = ease.outCubic(prog(t, 0.45 + (n.y / SPINE_LEN) * 1.2, 0.35));
      n.card.style.opacity = String(reached ? clamp01(cardP) : 0);
      n.card.style.transform = `translateX(${lerp(20, 0, clamp01(cardP))}px)`;
      if (n.todayTick) {
        n.todayTick.style.opacity = String(reached ? clamp01(ease.outCubic(prog(t, 0.6 + (n.y / SPINE_LEN) * 1.2, 0.3))) : 0);
        n.todayLbl.style.opacity = n.todayTick.style.opacity;
      }
    });
  }
  runEssay(step);
})();
</script>
</body>
</html>
