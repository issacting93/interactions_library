<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GenUI Ep.1 — intro-title</title>
<!--
  Intro (0:00-0:12). Three stages: the "THE POINT OF INTERFACE" show title (to key over Zac on
  camera), a quick montage of three interfaces reshaping themselves (feed / search / chat), then
  the series card "GENERATIVE UI · PART 1 OF 3".
  Re-skinned to the "Design Research in the Age of AI" system (see Visual_Essay/design-system/ and
  templates/research-core.css): one monospace face (IBM Plex Mono — Martian Mono and the TAPE 08
  cyan/amber palette are retired), near-black ground, and the deck's own Venn motif (human ring +
  AI disc, over a dot grid) standing in for the old HUD-ring flourish behind the wordmark. This
  show is Part 1 of 3, so --accent now carries --rt-part1 (violet) as the episode's signature
  colour, the same role part1/2/3 play across the source deck's three acts.
  Loop: 9.0s. ?driven=1 + window.essayStep(ms) for deterministic capture.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0A0A0A; --ink:#ECEAE3; --ink2:#78766F; --line2:rgba(236,234,227,.12); --line4:rgba(236,234,227,.18); --accent:#9B90E8; --venn:#E0A857; --teal:#4FD9A8; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--ground);overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--ink)}
  .border{position:absolute;inset:28px;border:1px solid var(--line2);border-radius:4px}

  /* stage 1: show title */
  .showtitle{position:absolute;left:0;top:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dotgrid{position:absolute;left:170px;top:280px;width:740px;height:480px;background-image:radial-gradient(var(--line4) 1px, transparent 1px);background-size:26px 26px}
  .wordmark{font-weight:500;font-size:76px;letter-spacing:.02em;color:var(--ink);text-align:center;line-height:1.3;position:relative;z-index:2}
  .wordmark b{color:var(--accent);font-weight:500}
  .tagline{margin-top:28px;font-size:16px;letter-spacing:.3em;color:var(--ink2);text-transform:uppercase;position:relative;z-index:2}

  /* stage 2: montage */
  .montage{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .mmicro{position:absolute;left:0;top:560px;width:1080px;text-align:center;font-size:14px;letter-spacing:.24em;color:var(--ink2);text-transform:uppercase}
  .mpanel{position:absolute;top:660px;width:300px;height:500px;border:1.5px solid var(--line4);border-radius:14px;padding:20px}
  .mp0{left:60px} .mp1{left:390px} .mp2{left:720px}
  .mcap{position:absolute;top:1180px;width:300px;text-align:center;font-size:13px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
  .mcap0{left:60px} .mcap1{left:390px} .mcap2{left:720px}
  .mbar{position:absolute;left:20px;right:20px;border-radius:7px;background:rgba(236,234,227,.08);border:1px solid var(--line4)}
  .mbubble{position:absolute;border-radius:14px;background:rgba(155,144,232,.14);border:1.5px solid var(--accent)}
  .mdot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink2)}

  /* stage 3: series card */
  .series{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .scard{position:absolute;left:0;top:820px;width:1080px;text-align:center}
  .smicro{font-size:14px;letter-spacing:.3em;color:var(--ink2);text-transform:uppercase}
  .stitle{font-weight:500;font-size:84px;letter-spacing:.01em;margin-top:18px}
  .schip{display:inline-block;margin-top:34px;padding:14px 32px;border:1.5px solid var(--accent);border-radius:30px;font-size:16px;letter-spacing:.2em;color:var(--accent)}
</style>
</head>
<body>
<div class="border"></div>

<div class="showtitle" id="showTitle">
  <div class="dotgrid"></div>
  <svg style="position:absolute;inset:0;width:1080px;height:1920px;overflow:visible">
    <circle class="ring" id="ring1" cx="480" cy="500" r="96" fill="none" stroke="var(--ink)" stroke-width="1.5"></circle>
    <circle class="disc" id="ring2" cx="600" cy="500" r="96" fill="var(--venn)" opacity="0.92"></circle>
    <circle cx="480" cy="500" r="4" fill="var(--ink)"></circle>
    <circle cx="600" cy="500" r="4" fill="var(--ground)"></circle>
  </svg>
  <div class="wordmark">THE POINT<br>OF <b>INTERFACE</b></div>
  <div class="tagline">A DESIGN SERIES</div>
</div>

<div class="montage" id="montage">
  <div class="mmicro">HOW INTERFACES RESHAPE THEMSELVES</div>

  <div class="mpanel mp0" id="panelFeed">
    <div class="mbar" id="f0" style="top:0;height:130px"></div>
    <div class="mbar" id="f1" style="top:146px;height:90px"></div>
    <div class="mbar" id="f2" style="top:252px;height:150px"></div>
    <div class="mbar" id="f3" style="top:418px;height:62px"></div>
  </div>
  <div class="mcap mcap0">FEED</div>

  <div class="mpanel mp1" id="panelSearch">
    <div class="mbar" id="s0" style="top:0;height:52px;background:rgba(79,217,168,.14);border-color:#4FD9A8"></div>
    <div class="mbar" id="s1" style="top:80px;height:60px"></div>
    <div class="mbar" id="s2" style="top:156px;height:60px"></div>
    <div class="mbar" id="s3" style="top:232px;height:60px"></div>
    <div class="mbar" id="s4" style="top:308px;height:96px;background:rgba(155,144,232,.12);border-color:var(--accent)"></div>
  </div>
  <div class="mcap mcap1">SEARCH</div>

  <div class="mpanel mp2" id="panelChat">
    <div class="mdot" id="cd0" style="top:14px;left:20px"></div>
    <div class="mdot" id="cd1" style="top:14px;left:38px"></div>
    <div class="mdot" id="cd2" style="top:14px;left:56px"></div>
    <div class="mbubble" id="cb0" style="top:60px;left:20px;width:200px;height:50px"></div>
    <div class="mbubble" id="cb1" style="top:126px;left:60px;width:220px;height:70px"></div>
  </div>
  <div class="mcap mcap2">CHAT</div>
</div>

<div class="series" id="series">
  <div class="scard">
    <div class="smicro">THE POINT OF INTERFACE PRESENTS</div>
    <div class="stitle">GENERATIVE UI</div>
    <div class="schip">PART 1 OF 3</div>
  </div>
</div>

<script src="essay-core.js"></script>
<script>
(function () {
  const LOOP = 9.0;
  const showTitle = document.getElementById('showTitle');
  const ring1 = document.getElementById('ring1'), ring2 = document.getElementById('ring2');
  const montage = document.getElementById('montage');
  const series = document.getElementById('series');
  const scard = document.querySelector('.scard');

  const feedBars = ['f0', 'f1', 'f2', 'f3'].map(id => document.getElementById(id));
  const searchBars = ['s0', 's1', 's2', 's3', 's4'].map(id => document.getElementById(id));
  const chatDots = ['cd0', 'cd1', 'cd2'].map(id => document.getElementById(id));
  const chatBubbles = ['cb0', 'cb1'].map(id => document.getElementById(id));

  const T1_OUT = 2.0, T2_IN = 1.8, T2_OUT = 5.5, T3_IN = 5.3, HOLD_END = 8.3;

  function step(tAbs) {
    const t = tAbs % LOOP;

    // stage 1
    const p1 = 1 - ease.outCubic(prog(t, T1_OUT, 0.4));
    showTitle.style.opacity = String(t < T1_OUT ? ease.outCubic(prog(t, 0.0, 0.5)) : p1);
    const drift = Math.sin(t * 0.5) * 6;
    ring1.setAttribute('cx', String(470 - drift));
    ring2.setAttribute('cx', String(610 + drift));
    ring1.style.opacity = String(0.85 + 0.15 * Math.sin(t * 1.1));
    ring2.style.opacity = String(0.85 + 0.12 * Math.sin(t * 1.1 + 1.3));

    // stage 2
    const p2 = ease.outCubic(prog(t, T2_IN, 0.4)) * (1 - prog(t, T2_OUT, 0.4));
    montage.style.opacity = String(Math.max(0, p2));
    feedBars.forEach((el, i) => { el.style.opacity = String(0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.6 + i * 1.7))); });
    searchBars.forEach((el, i) => {
      const flash = 0.45 + 0.4 * (0.5 + 0.5 * Math.sin(t * 1.3 + i * 1.9));
      el.style.transform = `scaleX(${lerp(0.92, 1, flash)})`;
      el.style.opacity = String(0.55 + 0.35 * flash);
    });
    const chatPhase = t % 2.4;
    const typing = chatPhase < 0.6;
    chatDots.forEach((d, i) => { d.style.opacity = typing ? String(0.4 + 0.6 * (0.5 + 0.5 * Math.sin(chatPhase * 14 + i * 2))) : '0'; });
    const bubbleP = ease.outBack(prog(chatPhase, 0.6, 0.35)) * (1 - prog(chatPhase, 2.0, 0.3));
    chatBubbles.forEach((b, i) => {
      const bp = clamp01(ease.outBack(prog(chatPhase, 0.6 + i * 0.3, 0.35))) * (1 - prog(chatPhase, 2.0, 0.3));
      b.style.opacity = String(Math.max(0, bp));
      b.style.transform = `scale(${lerp(0.7, 1, clamp01(bp))})`;
    });

    // stage 3
    const p3 = ease.outCubic(prog(t, T3_IN, 0.4)) * (1 - prog(t, HOLD_END, 0.5));
    series.style.opacity = String(Math.max(0, p3));
    scard.style.transform = `translateY(${lerp(30, 0, clamp01(ease.outCubic(prog(t, T3_IN, 0.5))))}px)`;
  }
  runEssay(step);
})();
</script>
</body>
</html>
