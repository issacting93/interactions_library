<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sigil Fish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed deep-water canvas, fish swims head-up in the centre; slim control drawer docks at the bottom. Single dark world by choice. */
:root {
  --void: #030706;
  --panel: rgba(8, 15, 14, 0.86);
  --line: #1f3a33;
  --teal: #61e5bf;
  --teal-dim: #367f6a;
  --text: #cfe9e0;
  --muted: #7fa398;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--text); font-family: var(--mono); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.mark {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; display: grid; gap: 4px; max-width: 30ch;
}
.mark h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--teal); }
.mark p { margin: 0; font-size: 11px; line-height: 1.6; letter-spacing: 0.04em; color: var(--muted); }
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
  display: flex; flex-direction: column; gap: 12px;
}
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
button, .seg label {
  font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text); background: transparent; border: 1px solid var(--line);
  padding: 8px 12px; cursor: pointer; border-radius: 2px;
}
button:hover, .seg label:hover { border-color: var(--teal-dim); }
button:focus-visible, .seg input:focus-visible + label, input[type=range]:focus-visible { outline: 1px solid var(--teal); outline-offset: 2px; }
.seg { display: inline-flex; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { margin-left: -1px; }
.seg input:checked + label { color: var(--void); background: var(--teal); border-color: var(--teal); }
.species { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.species button {
  font: 500 10px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: 1px solid var(--line);
  padding: 5px 9px; cursor: pointer; border-radius: 2px;
}
.species button:hover { border-color: var(--teal-dim); color: var(--text); }
.species button[aria-pressed="true"] { color: var(--void); background: var(--teal); border-color: var(--teal); }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 20px; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl span { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.ctl output { color: var(--teal); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
input[type=range]::-moz-range-track { height: 1px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4.5px; background: var(--teal); transform: rotate(45deg); border: 0; }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; background: var(--teal); transform: rotate(45deg); border: 0; border-radius: 0; }
@media (max-width: 640px) { .mark p { display: none; } }
</style>

<canvas id="c" aria-label="A fish assembled from sigil parts, swimming with a travelling body wave"></canvas>
<canvas id="fx" aria-hidden="true" hidden></canvas>

<div class="mark">
  <h1>Sigil Fish</h1>
  <p id="blurb"></p>
  <div class="species" id="species" role="radiogroup" aria-label="Creature"></div>
</div>

<div class="drawer">
  <div class="bar">
    <div class="seg" role="radiogroup" aria-label="Render mode">
      <input type="radio" name="mode" id="m-vector" value="vector"><label for="m-vector">Vector</label>
      <input type="radio" name="mode" id="m-hybrid" value="hybrid" checked><label for="m-hybrid">Hybrid</label>
      <input type="radio" name="mode" id="m-points" value="points"><label for="m-points">Points</label>
    </div>
    <span class="spacer"></span>
    <button id="pause" type="button">Pause</button>
    <button id="tune" type="button" aria-expanded="true" aria-controls="sliders">Hide controls</button>
  </div>
  <div class="sliders" id="sliders">
    <label class="ctl"><span>Body wave <output id="o-wave"></output></span><input type="range" id="wave" min="0" max="500" step="10" value="220"></label>
    <label class="ctl"><span>Tail flick <output id="o-flick"></output></span><input type="range" id="flick" min="0" max="25" step="0.5" value="9"></label>
    <label class="ctl"><span>Flex <output id="o-flex"></output></span><input type="range" id="flex" min="2" max="45" step="1" value="9" title="How sharply each spine joint may bend from the one before it"></label>
    <label class="ctl"><span>Fin paddle <output id="o-fin"></output></span><input type="range" id="fin" min="0" max="30" step="0.5" value="12"></label>
    <label class="ctl"><span>Wander <output id="o-wander"></output></span><input type="range" id="wander" min="0" max="1" step="0.05" value="0.5"></label>
    <label class="ctl"><span>Speed <output id="o-speed"></output></span><input type="range" id="speed" min="0" max="3" step="0.05" value="1"></label>
    <label class="ctl"><span>Shimmer <output id="o-shimmer"></output></span><input type="range" id="shimmer" min="0" max="1" step="0.05" value="0.55"></label>
    <label class="ctl"><span>Glow <output id="o-glow"></output></span><input type="range" id="glow" min="0" max="40" step="1" value="12"></label>
    <label class="ctl"><span>Zoom <output id="o-zoom"></output></span><input type="range" id="zoom" min="0.4" max="3" step="0.05" value="1" title="Scroll or pinch on the fish to zoom too"></label>
    <label class="ctl"><span>Iris <output id="o-iris"></output></span><input type="range" id="iris" min="0" max="1" step="0.05" value="0" title="Thin-film iridescence over the body; 0 is off"></label>
    <label class="ctl"><span>Iris flow <output id="o-irisflow"></output></span><input type="range" id="irisflow" min="0" max="2" step="0.05" value="0.6" title="How fast the iridescent sheen drifts and ripples"></label>
    <label class="ctl"><span>Iris finish</span>
      <div class="seg" role="radiogroup" aria-label="Iridescence palette">
        <input type="radio" name="irismode" id="im-oil" value="0" checked><label for="im-oil">Oil</label>
        <input type="radio" name="irismode" id="im-holo" value="1"><label for="im-holo">Holo</label>
        <input type="radio" name="irismode" id="im-neon" value="2"><label for="im-neon">Neon</label>
      </div>
    </label>
  </div>
</div>

const CREATURES = {
  koi: { name: 'Koi', blurb: 'Medallion head, whisker barbels, pectoral fins, six vertebrae with rib fins, thirty-five spine studs, forked tail. 63 parts, mirrored.', fish: FISH_KOI },
  butterflyWorm: { name: 'Butterfly Worm', blurb: 'Antennae and a medallion eye, three layered wing-fans, a segmented worm body with twenty-one rib studs, tapering tail. 54 parts, mirrored.', fish: FISH_BUTTERFLY_WORM, flap: true },
  glassManta: { name: 'Glass Manta', blurb: 'Crowned eye medallion, broad glassy wings, a beaded spine, twin pelvic flares, a trailing whip tail. 103 parts, mirrored.', fish: FISH_GLASS_MANTA },
};

// ---- parts: rings placed in fish space (x = 0 is the spine, y runs head to tail). Rebuilt
// whenever the active creature changes. ----
const PARTICLES = 900;
let species, parts, BX0, BY0, BX1, BY1, LEN, allRings, particles, flapStyle = false;
function loadCreature(key) {
  const fish = CREATURES[key].fish;
  species = key;
  parts = fish.parts.map(p => ({
    ...p,
    rings: p.rings.map(a => ({ base: Float32Array.from(a), cur: new Float32Array(a.length), n: a.length / 2 }))
  }));
  [BX0, BY0, BX1, BY1] = fish.bounds;
  LEN = BY1 - BY0;
  allRings = parts.flatMap(p => p.rings);
  flapStyle = !!CREATURES[key].flap;

  // shimmer particles ride the outlines, weighted by outline length
  const totalN = allRings.reduce((a, r) => a + r.n, 0);
  particles = [];
  for (let k = 0; k < PARTICLES; k++) {
    let pick = Math.random() * totalN, ring = allRings[0];
    for (const r of allRings) { if ((pick -= r.n) <= 0) { ring = r; break; } }
    particles.push({ ring, pos: Math.random() * ring.n, vel: (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.6), seed: Math.random() * 1000, size: 0.5 + Math.random() * 1.1 });
  }

  document.getElementById('blurb').textContent = CREATURES[key].blurb;
  document.querySelectorAll('#species button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.key === key)));
  if (typeof resize === 'function') resize();
}
const speciesEl = document.getElementById('species');
for (const key of Object.keys(CREATURES)) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = CREATURES[key].name; b.dataset.key = key;
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => loadCreature(key));
  speciesEl.appendChild(b);
}

// ---- motion ----
const P = { wave: 220, flick: 9, fin: 12, flex: 9, wander: 0.5, speed: 1, shimmer: 0.55, glow: 12, iris: 0, irisflow: 0.6, zoom: 1 };
const DEG = Math.PI / 180;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function rot(px, py, x, y, a) {
  const c = Math.cos(a), s = Math.sin(a), dx = x - px, dy = y - py;
  return [px + dx * c - dy * s, py + dx * s + dy * c];
}

// ---- spine: a chain of joints trailing the head, each one keeping a fixed distance
// from the one in front with a bend limit. A travelling ripple rides on top, and every
// part is skinned onto the resulting curve each frame (fins and whiskers ride the frame
// at their root; body, head and tail follow the spine point by point). ----
const K_SPINE = 20;
const chain = new Float64Array(K_SPINE * 2);
const spine = new Float64Array(K_SPINE * 2);

function chainPoint(i) { i = Math.min(Math.max(i, 0), K_SPINE - 1); return [chain[i * 2], chain[i * 2 + 1]]; }
function chainTangent(i) {
  const a = chainPoint(i - 1), b = chainPoint(i + 1);
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1e-5;
  return [dx / l, dy / l];
}
// position + head-to-tail direction at body fraction s (0 = head, 1 = tail), read off the rippled spine
function spineFrameAt(s) {
  const f = s * (K_SPINE - 1);
  const i0 = Math.min(Math.max(Math.floor(f), 0), K_SPINE - 2);
  const tt = f - i0;
  const ax = spine[i0 * 2], ay = spine[i0 * 2 + 1], bx = spine[(i0 + 1) * 2], by = spine[(i0 + 1) * 2 + 1];
  let tx = bx - ax, ty = by - ay;
  const l = Math.hypot(tx, ty) || 1e-5;
  tx /= l; ty /= l;
  return { x: ax + (bx - ax) * tt, y: ay + (by - ay) * tt, tx, ty, nx: ty, ny: -tx };
}

// each joint links to the one before it at a fixed segment length, bent by a travelling
// curvature wave that never turns any single joint past the flex limit — the same
// fixed-length, bend-limited chain construction Sigil Species builds its spines from,
// written as a bounded standing wave rather than a frame-to-frame chase, since this
// fish's head stays put rather than swimming freely around a tank
function updateSpine(t) {
  const segLen = LEN / (K_SPINE - 1);
  const maxBend = P.flex * DEG * 11 / (K_SPINE - 1);
  chain[0] = 0; chain[1] = BY0;
  let ang = Math.PI / 2;
  for (let i = 1; i < K_SPINE; i++) {
    const s = (i - 0.5) / (K_SPINE - 1);
    ang += maxBend * Math.sin(s * 2 * Math.PI * 0.9 - t);
    chain[i * 2] = chain[(i - 1) * 2] + Math.cos(ang) * segLen;
    chain[i * 2 + 1] = chain[(i - 1) * 2 + 1] + Math.sin(ang) * segLen;
  }
  // a finer ripple rides the chain's own tangent on top, for fin-edge shimmer
  for (let k = 0; k < K_SPINE; k++) {
    const s = k / (K_SPINE - 1);
    const tn = chainTangent(k);
    const env = 0.1 + 0.9 * Math.pow(s, 1.7);
    const off = 0.3 * P.wave * env * Math.sin(s * 2 * Math.PI * 0.9 - t);
    spine[k * 2] = chain[k * 2] + tn[1] * off;
    spine[k * 2 + 1] = chain[k * 2 + 1] - tn[0] * off;
  }
}

function moveRing(part, r, t) {
  const b = r.base, c = r.cur;
  const [ax, ay] = part.anchor, side = part.side || 1;
  const g = part.group;
  if (g === 'pectoral' || g === 'pelvic' || g === 'shoulder' || g === 'whisker') {
    // fins and whiskers: rotate rigidly about their root, then ride the spine frame at that root
    const fr = spineFrameAt((ay - BY0) / LEN);
    const tilt = Math.atan2(fr.tx, fr.ty);
    // a representative world-space rotation for this part, independent of distance-from-root
    // lag/decay — used only to drive the iridescent shimmer's angle term, not the geometry
    // wing-style creatures flap harder, faster and stiffer than a fish fin paddles: bigger
    // swing, quicker beat, and the tip stays closer in phase to the root (a wing sweeps as
    // one rigid blade; a fin trails more loosely along its length)
    const wingBoost = flapStyle ? 2.4 : 1, wingFreq = flapStyle ? 1.7 : 0.5, wingLagK = flapStyle ? 0.00035 : 0.0009;
    if (g === 'whisker') part.__ang = Math.atan2(fr.ty, fr.tx) + (-side * 6 * DEG * Math.sin(t * 0.7) - tilt * 0.6);
    else {
      const amp0 = (g === 'shoulder' ? 0.5 : g === 'pelvic' ? 0.75 : 1) * wingBoost;
      const ph0 = g === 'pelvic' ? 1.3 : g === 'shoulder' ? 0.6 : 0;
      part.__ang = Math.atan2(fr.ty, fr.tx) + (-side * P.fin * amp0 * DEG * Math.sin(t * wingFreq - ph0));
    }
    for (let i = 0; i < b.length; i += 2) {
      let x = b[i], y = b[i + 1];
      const d = Math.hypot(x - ax, y - ay);
      let a;
      if (g === 'whisker') {
        a = (-side * 6 * DEG * Math.sin(t * 0.7 - d * 0.004) - tilt * 0.6) * smooth(0, 300, d);
      } else {
        // fins/wings row: both sides together, tips lag the root
        const lag = d * wingLagK;
        const amp = (g === 'shoulder' ? 0.5 : g === 'pelvic' ? 0.75 : 1) * wingBoost;
        const ph = g === 'pelvic' ? 1.3 : g === 'shoulder' ? 0.6 : 0;
        a = -side * P.fin * amp * DEG * Math.sin(t * wingFreq - ph - lag);
      }
      [x, y] = rot(ax, ay, x, y, a);
      const dlx = x - ax, dly = y - ay;
      c[i] = fr.x + fr.nx * dlx + fr.tx * dly;
      c[i + 1] = fr.y + fr.ny * dlx + fr.ty * dly;
    }
  } else if (g === 'tail') {
    // lobes follow the spine point by point, plus an extra flick that grows to the tips
    const fr0 = spineFrameAt((ay - BY0) / LEN);
    part.__ang = Math.atan2(fr0.ty, fr0.tx);
    for (let i = 0; i < b.length; i += 2) {
      let x = b[i], y = b[i + 1];
      const d = Math.max(0, y - ay);
      x += Math.sin(t - 0.9) * P.flick * 12 * Math.pow(d / 3000, 1.5);
      y -= Math.abs(Math.sin(t - 0.9)) * P.flick * 2 * (d / 3000);
      const fr = spineFrameAt((y - BY0) / LEN);
      c[i] = fr.x + fr.nx * x; c[i + 1] = fr.y + fr.ny * x;
    }
  } else {
    const fr0 = spineFrameAt(((part.y0 + part.y1) / 2 - BY0) / LEN);
    part.__ang = Math.atan2(fr0.ty, fr0.tx);
    for (let i = 0; i < b.length; i += 2) {
      const x = b[i], y = b[i + 1];
      const fr = spineFrameAt((y - BY0) / LEN);
      c[i] = fr.x + fr.nx * x; c[i + 1] = fr.y + fr.ny * x;
    }
  }
}

// ---- rendering ----
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, vw = 0, vh = 0, baseScale = 1, stageH = 0, stageTop = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = canvas.clientWidth; vh = canvas.clientHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  const drawer = document.querySelector('.drawer').getBoundingClientRect().height;
  stageTop = 24; stageH = vh - drawer - 48;
  const bw = (BX1 - BX0) + 1400, bh = LEN + 500;
  baseScale = Math.min((vw - 32) / bw, stageH / bh);
}
loadCreature('koi');
new ResizeObserver(resize).observe(document.body);
resize();

// ---- iridescence: an optional WebGL pass (ported from wing-rig's thin-film shader, trimmed
// to just the iris/pal/shade subsystem — no chroma, glitch, scan or trail) that reads the
// already-rendered 2D frame as a texture, plus a second "data" texture encoding each part's
// world-space rotation (red) and fill-vs-outline (blue), and composites an oil-slick /
// holo-glass / neon sheen on top. Off (P.iris = 0) by default and costs nothing when off;
// only meaningful over filled silhouettes, so it's skipped in Points mode. ----
const fxCanvas = document.getElementById('fx');
const dataCanvas = document.createElement('canvas');
const dctx = dataCanvas.getContext('2d');
let irisMode = 0;
const iris = (function () {
  const gl = fxCanvas.getContext('webgl', { antialias: false, alpha: true }) || fxCanvas.getContext('experimental-webgl');
  if (!gl) return null;
  const VS = 'attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const FS = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uTex, uData; uniform vec2 uRes; uniform float uTime;
uniform float u_iris, u_film, u_flow, u_angle, u_sheen, u_mode, u_fgrain, u_turb, u_glitter, u_hue, u_sweep, u_sweeps;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1., 0.)), f.x), mix(h(i + vec2(0., 1.)), h(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + vec2(1.7, 9.2); a *= .5; } return s; }
vec3 tap(vec2 uv){ return texture2D(uTex, uv).rgb; }
vec4 dat(vec2 uv){ return texture2D(uData, uv); }
vec3 pal(float t){
  t = fract(t);

let mode = 'hybrid';
function frame(t, tw) {
  updateSpine(t);
  for (const p of parts) for (const r of p.rings) moveRing(p, r, t);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#030706';
  ctx.fillRect(0, 0, vw, vh);

  // wander: a slow loop around the stage, heading follows the path
  const W = P.wander;
  const roamX = Math.sin(tw * 0.11) * vw * 0.16 * W;
  const roamY = Math.sin(tw * 0.22) * stageH * 0.05 * W;
  const heading = Math.cos(tw * 0.11) * 0.18 * W - Math.sin(tw * 0.22) * 0.02 * W;
  const cx = vw / 2 + roamX, cy = stageTop + stageH / 2 + roamY;
  const s = baseScale * P.zoom;
  ctx.setTransform(dpr * s * Math.cos(heading), dpr * s * Math.sin(heading), -dpr * s * Math.sin(heading), dpr * s * Math.cos(heading), dpr * cx, dpr * cy);
  ctx.translate(-(BX0 + BX1) / 2, -(BY0 + BY1) / 2);
  const lw = 1.8 / s;

  const useIris = iris && P.iris > 0 && mode !== 'points';
  if (useIris) {
    if (dataCanvas.width !== canvas.width || dataCanvas.height !== canvas.height) { dataCanvas.width = canvas.width; dataCanvas.height = canvas.height; }
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.clearRect(0, 0, dataCanvas.width, dataCanvas.height);
    dctx.setTransform(dpr * s * Math.cos(heading), dpr * s * Math.sin(heading), -dpr * s * Math.sin(heading), dpr * s * Math.cos(heading), dpr * cx, dpr * cy);
    dctx.translate(-(BX0 + BX1) / 2, -(BY0 + BY1) / 2);
  }

  if (mode !== 'points') {
    for (const p of parts) {
      const path = new Path2D();
      for (const r of p.rings) {
        const c = r.cur;
        path.moveTo(c[0], c[1]);
        for (let i = 2; i < c.length; i += 2) path.lineTo(c[i], c[i + 1]);
        path.closePath();

        const r255 = Math.round(Math.min(1, Math.max(0, 0.5 + (p.__ang || 0) / Math.PI)) * 255);

// ---- loop & controls ----
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = reduce, clock = 1.2, wclock = 0, last = performance.now();
const pauseBtn = document.getElementById('pause');
pauseBtn.textContent = paused ? 'Play' : 'Pause';
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; });

const tuneBtn = document.getElementById('tune'), sliders = document.getElementById('sliders');
tuneBtn.addEventListener('click', () => {
  sliders.hidden = !sliders.hidden;
  tuneBtn.setAttribute('aria-expanded', String(!sliders.hidden));
  tuneBtn.textContent = sliders.hidden ? 'Show controls' : 'Hide controls';
  resize();
});

const fmt = { wave: v => v, flick: v => v + '°', fin: v => v + '°', flex: v => v + '°', wander: v => Math.round(v * 100) + '%', speed: v => (+v).toFixed(2) + '×', shimmer: v => Math.round(v * 100) + '%', glow: v => v, iris: v => Math.round(v * 100) + '%', irisflow: v => (+v).toFixed(2) + '×', zoom: v => (+v).toFixed(2) + '×' };
for (const key of Object.keys(P)) {
  const el = document.getElementById(key), o = document.getElementById('o-' + key);
  const set = () => { P[key] = parseFloat(el.value); o.textContent = fmt[key](el.value); };
  el.addEventListener('input', set); set();

document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => { mode = r.value; }));
document.querySelectorAll('input[name="irismode"]').forEach(r => r.addEventListener('change', () => {
  irisMode = +r.value;
  // picking a finish is a request to see it — if the amount is still at 0, turn it on
  const irisEl = document.getElementById('iris');
  if (+irisEl.value <= 0) { irisEl.value = 0.6; irisEl.dispatchEvent(new Event('input')); }

// scroll or pinch over the stage to zoom, in step with the Zoom slider (trackpad pinch

const zoomEl = document.getElementById('zoom');
[canvas, fxCanvas].forEach(el => el.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0015));
  zoomEl.value = Math.min(+zoomEl.max, Math.max(+zoomEl.min, P.zoom * factor));
  zoomEl.dispatchEvent(new Event('input'));

  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  frame(clock, wclock);
  requestAnimationFrame(loop);

requestAnimationFrame(loop);
