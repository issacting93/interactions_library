<!DOCTYPE html>
<!--
  REVEAL · GEAR LOCK → PARALLAX (deterministic rev)
  gear-lock-autoplay.html?driven=1 disables its own requestAnimationFrame self-scheduling and
  self-paced flourishes (see its own DRIVEN/drive() comments) — this page steps it by hand via
  window.gearLockStep(virtualMs), once per output frame, exactly the way window.stage.seek(t) drives
  piece.js pieces elsewhere in this project. That makes the whole composite frame-exact and capturable
  at a clean 60fps, instead of the earlier real-time version's ~10fps screenshot-latency ceiling.

  seek(t) (below) steps the autoplay to t, reads its window.gearLockState (lockedCount/N) to detect
  the RELEASE moment — the instant all 6 are locked, field blooms bright/big — and on the frame that
  first fires, latches triggerAtSec = t. From there #glWrap's scale animates 1 → 0.05 over SHRINK_DUR
  and dissolves over FADE_DUR, while the real parallax <video> plays from its own t = 0 (seeked
  deterministically, same technique as the very first revision of this file — see serve-range.mjs
  for why a Range-aware server is required for that seek to work at all).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  #plx { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  #glWrap { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; will-change: transform, opacity; }
  #glFrame { width: 1080px; height: 1350px; border: 0; display: block; background: #161618; }
</style>
</head>
<body>
<div id="stage">
  <video id="plx" src="../parallax/exports/story-4x5.mp4" muted playsinline preload="auto"></video>
  <div id="glWrap"><iframe id="glFrame" src="gear-lock-autoplay.html?seed=1&driven=1"></iframe></div>
</div>
<script>
const SHRINK_DUR = 1.0, FADE_DUR = 0.3;       // seconds, output time
const GEAR_SCALE_END = 0.05;
const easeInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, k) => a + (b - a) * k;

const plx = document.getElementById('plx');
const glWrap = document.getElementById('glWrap');
const glFrame = document.getElementById('glFrame');

let triggered = false, triggerAtSec = 0;
window.reveal = { ready: false, triggered: false, triggerAtSec: 0 };

window.reveal.seek = function seek(t) {
  const win = glFrame.contentWindow;
  if (win && win.gearLockStep) win.gearLockStep(t * 1000);
  const st = win && win.gearLockState;
  if (st && !triggered && st.lockedCount === st.N) {
    triggered = true; triggerAtSec = t;
    window.reveal.triggered = true; window.reveal.triggerAtSec = t;
  }

  if (triggered) {
    const localT = t - triggerAtSec;
    glWrap.style.transform = `scale(${lerp(1, GEAR_SCALE_END, easeInOutCubic(clamp(localT / SHRINK_DUR, 0, 1))).toFixed(5)})`;
    glWrap.style.opacity = lerp(1, 0, clamp((localT - SHRINK_DUR) / FADE_DUR, 0, 1)).toFixed(4);
  }

  const pt = triggered ? clamp(t - triggerAtSec, 0, (plx.duration || 16) - 1 / 60) : 0;
  return new Promise(resolve => {
    if (!isFinite(plx.duration) || Math.abs(plx.currentTime - pt) < 0.0005) { resolve(); return; }
    const onSeeked = () => { plx.removeEventListener('seeked', onSeeked); resolve(); };
    plx.addEventListener('seeked', onSeeked);
    plx.currentTime = pt;
  });
};

function checkReady() {
  const win = glFrame.contentWindow;
  if (win && win.gearLockStep && win.gearLockState && plx.readyState >= 2) window.reveal.ready = true;
  else requestAnimationFrame(checkReady);
}
requestAnimationFrame(checkReady);
</script>
</body>
</html>
