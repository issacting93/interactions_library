<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERACTIONS — UI Library</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  :root {
    --bg: #090909;
    --dot: #1c1c1c;
    --panel: #0f0f0f;
    --border: #1a1a1a;
    --border-mid: #272727;
    --ink: #555;
    --ink-mid: #888;
    --ink-bright: #ddd;
    --accent: #FD8235;
    --accent-dim: rgba(253,130,53,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    color: var(--ink-mid);
    display: flex;
    font-size: 11px;
    letter-spacing: .06em;
  }

  /* ── sidebar ── */
  #sidebar {
    width: 216px;
    min-width: 216px;
    height: 100%;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--panel);
  }

  .lib-header {
    padding: 16px 14px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .lib-dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 6px var(--accent);
  }
  .lib-title {
    color: var(--ink-bright);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .16em;
  }
  .lib-count {
    margin-left: auto;
    color: var(--ink);
    font-size: 10px;
  }

  .search-wrap {
    padding: 10px 10px 9px;
    border-bottom: 1px solid var(--border);
  }
  #search {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border-mid);
    color: var(--ink-bright);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .05em;
    padding: 6px 8px;
    outline: none;
    caret-color: var(--accent);
    transition: border-color .15s;
  }
  #search::placeholder { color: var(--ink); }
  #search:focus { border-color: var(--border-mid); outline: 1px solid var(--accent); }

  .cats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
  }
  .cat-btn {
    background: none;
    border: 1px solid var(--border-mid);
    color: var(--ink);
    font-family: inherit;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 7px;
    cursor: pointer;
    transition: all .12s;
  }
  .cat-btn:hover { border-color: var(--ink); color: var(--ink-mid); }
  .cat-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  #comp-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #comp-list::-webkit-scrollbar { width: 2px; }
  #comp-list::-webkit-scrollbar-thumb { background: var(--border-mid); }

  .comp-item {
    padding: 8px 12px 8px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .12s, border-color .12s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .comp-item:hover { background: rgba(255,255,255,.025); }
  .comp-item.active {
    border-left-color: var(--accent);
    background: var(--accent-dim);
  }
  .comp-item .c-name {
    color: var(--ink-mid);
    font-size: 11px;
    transition: color .12s;
  }
  .comp-item.active .c-name,
  .comp-item:hover .c-name { color: var(--ink-bright); }
  .comp-item .c-cat {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .comp-item.gone { display: none; }

  /* ── main ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
  }

  #toolbar {
    height: 42px;
    min-height: 42px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
    justify-content: space-between;
    background: var(--panel);
  }

  #comp-info {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    overflow: hidden;
  }
  #comp-name {
    color: var(--ink-bright);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .14em;
    white-space: nowrap;
  }
  #comp-tags {
    display: flex;
    gap: 4px;
    overflow: hidden;
  }
  .tag-pill {
    background: var(--border);
    color: var(--ink);
    font-size: 9px;
    padding: 2px 6px;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #actions {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-shrink: 0;
  }
  .act-btn {
    background: none;
    border: 1px solid var(--border-mid);
    color: var(--ink);
    font-family: inherit;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    transition: all .12s;
    white-space: nowrap;
    height: 26px;
  }
  .act-btn:hover { border-color: var(--ink-mid); color: var(--ink-mid); }
  .act-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  #btn-full { width: 26px; padding: 0; font-size: 13px; }

  /* ── preview ── */
  #preview-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  #preview {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #000;
  }
  #preview-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--ink);
    pointer-events: none;
  }
  .ph-ring {
    width: 36px; height: 36px;
    border: 1px solid var(--border-mid);
    border-radius: 50%;
    position: relative;
  }
  .ph-ring::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid var(--border-mid);
    border-radius: 50%;
  }
  .ph-label {
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  /* fullscreen overlay */
  #preview-wrap.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 100;
  }
  #fs-exit {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 101;
    background: rgba(9,9,9,.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border-mid);
    color: var(--ink-mid);
    font-family: inherit;
    font-size: 9px;
    letter-spacing: .12em;
    padding: 5px 12px;
    cursor: pointer;
    display: none;
    text-transform: uppercase;
    transition: all .12s;
  }
  #fs-exit:hover { border-color: var(--ink-mid); color: var(--ink-bright); }

  /* ── source panel ── */
  #source-panel {
    height: 0;
    min-height: 0;
    overflow: hidden;
    border-top: 1px solid transparent;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }

  #source-bar {
    height: 32px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #source-filename { color: var(--ink); font-size: 9px; letter-spacing: .1em; }
  #btn-copy {
    background: none;
    border: 1px solid var(--border-mid);
    color: var(--ink);
    font-family: inherit;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 8px;
    cursor: pointer;
    transition: all .12s;
  }
  #btn-copy:hover { border-color: var(--ink-mid); color: var(--ink-mid); }
  #btn-copy.copied { border-color: var(--accent); color: var(--accent); }

  #source-scroll {
    flex: 1;
    overflow: auto;
  }
  #source-scroll::-webkit-scrollbar { width: 3px; height: 3px; }
  #source-scroll::-webkit-scrollbar-thumb { background: var(--border-mid); }

  #source-code {
    padding: 12px 14px;
    font-family: inherit;
    font-size: 10px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre;
    tab-size: 2;
  }
  #source-msg {
    padding: 16px 14px;
    font-size: 10px;
    color: var(--ink);
    line-height: 1.8;
    display: none;
  }
  #source-msg code {
    color: var(--accent);
    background: var(--accent-dim);
    padding: 1px 5px;
  }

  /* ── mode toggle ── */
  .mode-toggle {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .mode-btn {
    background: none;
    border: 1px solid var(--border-mid);
    color: var(--ink);
    font-family: inherit;
    font-size: 8px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 2px 6px;
    cursor: pointer;
    transition: all .12s;
  }
  .mode-btn:hover { border-color: var(--ink); color: var(--ink-mid); }
  .mode-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ── tool badge in toolbar ── */
  .tool-badge {
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(253,130,53,0.3);
    padding: 2px 6px;
    flex-shrink: 0;
  }
</style>
</head>

const CATEGORIES = ['all', 'physics', 'motion', 'interaction', 'layout', 'generative', 'rigged'];

// ── state ──
let mode       = 'library'; // 'library' | 'tools'
let activeId   = null;
let activeCat  = 'all';
let sourceOpen = false;
let currentFile = null;
let currentSrc  = null;

// ── elements ──
const catEl       = document.getElementById('cats');
const listEl      = document.getElementById('comp-list');
const preview     = document.getElementById('preview');
const placeholder = document.getElementById('preview-placeholder');
const nameEl      = document.getElementById('comp-name');
const tagsEl      = document.getElementById('comp-tags');
const countEl     = document.getElementById('lib-count');
const searchEl    = document.getElementById('search');
const sourcePanel  = document.getElementById('source-panel');
const sourceScroll = document.getElementById('source-scroll');
const sourceCode   = document.getElementById('source-code');
const sourceMsg    = document.getElementById('source-msg');
const sourceFile   = document.getElementById('source-filename');
const btnSource   = document.getElementById('btn-source');
const btnOpen     = document.getElementById('btn-open');
const btnFull     = document.getElementById('btn-full');
const btnCopy     = document.getElementById('btn-copy');
const fsExit      = document.getElementById('fs-exit');
const previewWrap = document.getElementById('preview-wrap');

// ── categories ──
CATEGORIES.forEach(cat => {
  const b = document.createElement('button');
  b.className = 'cat-btn' + (cat === activeCat ? ' active' : '');
  b.textContent = cat === 'all' ? 'ALL' : cat;
  b.addEventListener('click', () => {
    activeCat = cat;
    document.querySelectorAll('.cat-btn').forEach(x =>
      x.classList.toggle('active', x.textContent.toLowerCase() === cat));
    filterList();
  });
  catEl.appendChild(b);
});

// ── list ──
function renderList() {
  listEl.innerHTML = '';
  const data = mode === 'library' ? COMPONENTS : TOOLS;
  data.forEach(c => {
    const el = document.createElement('div');
    el.className = 'comp-item';
    el.dataset.id = c.id;
    el.style.opacity = '0';
    el.style.transform = 'translateX(-5px)';
    const sublabel = mode === 'library' ? c.category : 'tool';
    el.innerHTML = `<span class="c-name">${c.name}</span><span class="c-cat">${sublabel}</span>`;
    el.addEventListener('click', () => select(c));
    listEl.appendChild(el);
  });
  filterList();
  const visible = [...listEl.querySelectorAll('.comp-item:not(.gone)')];
  animate(visible, { opacity: 1, translateX: 0, ease: 'outExpo', duration: 300, delay: stagger(28) });
}

function filterList() {
  const data = mode === 'library' ? COMPONENTS : TOOLS;
  const q = searchEl.value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.comp-item').forEach(el => {
    const c = data.find(x => x.id === el.dataset.id);
    if (!c) return;
    const matchCat = mode === 'tools' || activeCat === 'all' || c.category === activeCat;
    const matchQ   = !q || c.name.toLowerCase().includes(q) || c.tags.some(t => t.includes(q)) || (c.category && c.category.includes(q));
    const show = matchCat && matchQ;
    const wasGone = el.classList.contains('gone');
    el.classList.toggle('gone', !show);
    if (show && wasGone) {
      el.style.opacity = '0';
      el.style.transform = 'translateX(-5px)';
      animate(el, { opacity: 1, translateX: 0, ease: 'outExpo', duration: 240 });
    }
    if (show) visible++;
  });
  countEl.textContent = visible;
}

searchEl.addEventListener('input', filterList);

// ── select ──
function select(comp) {
  activeId    = comp.id;
  currentFile = comp.file;
  currentSrc  = null;

  document.querySelectorAll('.comp-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === comp.id));

  nameEl.textContent = comp.name.toUpperCase();
  if (mode === 'tools') {
    tagsEl.innerHTML = `<span class="tool-badge">TOOL</span>` +
      comp.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
  } else {
    tagsEl.innerHTML = comp.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
  }

  placeholder.style.display = '';
  placeholder.style.opacity = '1';
  preview.onload = () => {
    if (preview.src && !preview.src.endsWith('about:blank')) {
      animate(placeholder, { opacity: 0, ease: 'outQuad', duration: 380,
        onComplete: () => { placeholder.style.display = 'none'; } });
    }
  };
  preview.src = comp.file;

  btnOpen.onclick = () => window.open(comp.file, '_blank');

  sourceCode.textContent = '';
  sourceMsg.style.display = 'none';
  sourceFile.textContent = comp.file;
  if (sourceOpen) loadSource(comp.file);
}

// ── source ──
async function loadSource(file) {
  sourceCode.textContent = 'Loading…';
  sourceMsg.style.display = 'none';
  currentSrc = null;
  try {
    const res = await fetch(file, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    currentSrc = text;
    sourceCode.textContent = text;
  } catch {
    sourceCode.textContent = '';
    sourceMsg.style.display = 'block';
  }
}

btnSource.addEventListener('click', () => {
  sourceOpen = !sourceOpen;
  btnSource.classList.toggle('active', sourceOpen);
  if (sourceOpen) {
    sourceScroll.style.opacity = '0';
    const tl = createTimeline();
    tl.add(sourcePanel, { height: '260px', ease: 'outExpo', duration: 320 })
      .call(() => { sourcePanel.style.borderTopColor = '#1a1a1a'; }, 160)
      .add(sourceScroll, { opacity: 1, duration: 200 }, 240);
    if (currentFile) loadSource(currentFile);
  } else {
    const tl = createTimeline();
    tl.add(sourceScroll, { opacity: 0, duration: 140 })
      .call(() => { sourcePanel.style.borderTopColor = 'transparent'; }, 100)
      .add(sourcePanel, { height: '0px', ease: 'inQuad', duration: 240 }, 120);
  }
});

btnCopy.addEventListener('click', () => {
  if (!currentSrc) return;
  navigator.clipboard.writeText(currentSrc).then(() => {
    btnCopy.textContent = 'COPIED';
    btnCopy.classList.add('copied');
    setTimeout(() => { btnCopy.textContent = 'COPY'; btnCopy.classList.remove('copied'); }, 1600);
  });
});

// ── fullscreen ──
btnFull.addEventListener('click', () => {
  previewWrap.classList.add('fullscreen');
  fsExit.style.display = 'block';
  btnFull.classList.add('active');
});
function exitFs() {
  previewWrap.classList.remove('fullscreen');
  fsExit.style.display = 'none';
  btnFull.classList.remove('active');
}
fsExit.addEventListener('click', exitFs);
document.addEventListener('keydown', e => { if (e.key === 'Escape') exitFs(); });

// ── mode switch ──
function setMode(m) {
  mode = m;
  document.getElementById('btn-mode-lib').classList.toggle('active', m === 'library');
  document.getElementById('btn-mode-tools').classList.toggle('active', m === 'tools');
  document.getElementById('cats').style.display = m === 'library' ? '' : 'none';
  searchEl.placeholder = m === 'library' ? 'search components...' : 'search tools...';
  activeId    = null;
  currentFile = null;
  currentSrc  = null;
  nameEl.textContent = 'UI LIBRARY';
  tagsEl.innerHTML   = '';
  preview.src = 'about:blank';
  placeholder.style.display = '';
  if (sourceOpen) {
    sourceOpen = false;
    sourcePanel.style.height = '0px';
    sourcePanel.style.borderTopColor = 'transparent';
    sourceScroll.style.opacity = '';
    btnSource.classList.remove('active');
  }
  searchEl.value = '';
  renderList();
}

document.getElementById('btn-mode-lib').addEventListener('click',   () => setMode('library'));
document.getElementById('btn-mode-tools').addEventListener('click', () => setMode('tools'));

// ── init ──
renderList();

})();
</script>
